[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "dcpy-data"
version = "0.0.1"
description = "DCP Data Engineering - dataset comparison utilities"
requires-python = ">=3.11"
dependencies = [
    "dcpy-utils",
    "numpy",
    "pandas",
    "pydantic",
]

# geopandas/shapely are used throughout compare.py's spatial-aware comparison logic (not
# a narrow function), so kept optional rather than lazily imported - importing
# dcpy.data.compare without this extra fails cleanly at that point.
[project.optional-dependencies]
geo = ["geopandas", "shapely"]

[tool.uv.sources]
dcpy-utils = { workspace = true }

[dependency-groups]
dev = [
    "pytest",
    "pandas-stubs",
]

[tool.setuptools.packages.find]
include = ["dcpy*"]
namespaces = true
