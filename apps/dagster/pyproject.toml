[project]
name = "dcpy-app-dagster"
version = "0.0.1"
description = "DCP Data Engineering - Dagster orchestration app"
requires-python = ">=3.11"
dependencies = [
    # ingest assets run dcpy.lifecycle.ingest.transform, which needs the GDAL/geo stack
    "dcpy-lifecycle[geo]",
    "dcpy-product-metadata",
    "dcpy-infra[dagster]",  # runner_tests
    "dagster",
    # Postgres run/event/schedule storage (apps/local/dagster/dagster.yaml)
    "dagster-postgres",
    "dagster-webserver",
    "PyYAML",
]

[tool.uv.sources]
dcpy-lifecycle = { workspace = true }
dcpy-product-metadata = { workspace = true }
dcpy-infra = { workspace = true }

[tool.uv]
package = false
