[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "dcpy-lifecycle"
version = "0.0.1"
description = "DCP Data Engineering - lifecycle stages (ingest, builds, package, distribute, validate) that orchestrate a data product from source to distribution"
requires-python = ">=3.11"
dependencies = [
    "dcpy-utils",
    "dcpy-connectors",
    "dcpy-product-metadata",
    # dcpy.lifecycle.builds shells out to the `dbt` CLI (see builds/build.py) rather than
    # importing it, but the executable still needs to be installed here.
    "dbt-postgres",
    "dbt-duckdb",
    "Jinja2",
    "pandas",
    "pandera",
    "pydantic",
    "python-dateutil",
    "pytz",
    "ruamel.yaml",
    "tabulate",
    "typer",
    "typing_extensions",
    "PyYAML",
]

# GDAL/geosupport-backed functionality (ingest.transform/validate, package.esri/validate,
# builds.export's geometry columns, the geocoding scripts) - not needed to load or run
# dcpy.lifecycle's core orchestration (builds, distribute, the CLI skeleton), only to
# actually execute those specific stages. Kept optional so consumers that only need the
# orchestration layer (e.g. apps/dagster) aren't forced to install GDAL/geosupport at all.
# apps/qa and apps/notebook-server, which do need this, depend on "dcpy-lifecycle[geo]".
[project.optional-dependencies]
geo = [
    "dcpy-geospatial",
    "dcpy-geosupport",
    "dcpy-data",
    "dcpy-library",
    "geoalchemy2",
    "geopandas",
    "pyproj",
    "shapely",
    "usaddress",
]

[tool.uv.sources]
dcpy-utils = { workspace = true }
dcpy-connectors = { workspace = true }
dcpy-product-metadata = { workspace = true }
dcpy-geospatial = { workspace = true }
dcpy-geosupport = { workspace = true }
dcpy-data = { workspace = true }
dcpy-library = { workspace = true }

[project.scripts]
dcpy = "dcpy.__main__:cli"

[dependency-groups]
dev = [
    "pytest",
    "moto",
    "faker",
    "pandas-stubs",
    "types-python-dateutil",
    "types-pytz",
    "types-PyYAML>=6.0.1",
]

[tool.setuptools.packages.find]
include = ["dcpy*"]
namespaces = true
