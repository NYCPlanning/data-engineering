version: 2

models:
- name: qa__diffs_all
  description: >
    Union of all per-product diff summaries (thinlion, lion_dat, gdb_lion, rpl, saf),
    giving a single project-wide view of every discrepant record between the
    dev build and production. Intended as the source for burndown charts and
    cross-product diff tracking. Materialized as a table on demand (tags:
    on_demand, diffs). diff_run_date is stamped at materialization time via
    CURRENT_DATE.
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      combination_of_columns:
      - comparison_id
      - output_file_id
  columns:
  - name: comparison_id
    description: >
      Primary key from the upstream diff model. Corresponds to atomicid for
      thinlion records, _lion_key for lion_dat, _rpl_key for rpl, and
      _saf_key for saf. Unique within each output_file_id but not across the
      full table.
  - name: status
    description: >
      Row-level diff status. One of: modified (record exists in both but
      values differ), only_in_legacy (record exists only in production),
      only_in_build (record exists only in the dev build).
  - name: changes
    description: >
      JSONB object where each key is a changed column name and each value
      contains the old (production) and new (dev build) values. NULL for rows
      with status other than modified.
  - name: output_file_id
    description: >
      Identifies which CSCL output file the record belongs to (e.g.
      thinlion_all, lion_dat_manhattan, rpl, saf_abcegnpx_roadbed). Used
      together with comparison_id as the composite primary key.
  - name: diff_group
    description: >
      Coarse categorization of the diff, assigned by each upstream model.
      For lion_dat, rpl, and saf, single-field changes are categorized by the
      changed column name; a known difference gets a label starting with its
      seeds/known_differences.csv ID (e.g. 'CSCL-LION-04: boe_lgc_pointer
      two-digit codes' in lion_dat; assert_known_difference_citations checks
      every such ID). For thinlion, only the CSCL-THINLION-02/03 labels are
      assigned; field names are never used. Empty string when no categorization
      applies.
  - name: subgroup
    description: >
      Reserved for finer-grained categorization within a diff_group. Currently
      always an empty string across all upstream models.
  - name: comparison_column
    description: >
      Name of the primary key column in the source tables (e.g. _saf_key,
      atomicid). Emitted as a string literal by the generate_diff_summary macro
      and consistent across all rows for a given output_file_id. Use together
      with comparison_id, build_table_name, and production_table_name to look
      up the full source record for any diff row.
  - name: build_table_name
    description: >
      Name of the dev build table that was compared, as passed to the
      generate_diff_summary macro. Use with comparison_column and comparison_id
      to fetch the dev-side record for a given diff.
  - name: production_table_name
    description: >
      Name of the production table that was compared, as passed to the
      generate_diff_summary macro. Use with comparison_column and comparison_id
      to fetch the prod-side record for a given diff.
  - name: accounted_for
    description: >
      Boolean flag set by each upstream model indicating whether this diff is
      a known or expected difference (e.g. a documented legacy bug or a
      deliberate behavior change). Records with accounted_for = true can be
      excluded from burndown counts.
  - name: diff_run_date
    description: >
      Date this table was last materialized, stamped once via CURRENT_DATE at
      build time. All rows in a given materialization share the same value.

- name: qa__diffs_gdb_lion
  description: >
    Row-level diff of the LION geodatabase `lion` layer (gdb_lion) against
    production's fgdb_lion, in the shared qa__diffs_* schema. Rows are keyed
    SegmentID|Join_ID|LLo_Hyphen|RLo_Hyphen (trimmed); rows with no full-key
    match on the other side are re-paired on SegmentID|Join_ID|#rank so prod's
    inconsistent house-number zeroing (CSCL-LION-15) shows as modified rows
    rather than only_in pairs. diff_group names the cause of each modified row;
    accounted_for is true when every changed field has a verified, accepted
    cause (CSCL-LION-03, 04, 05, 16). House numbers, zips, SegCount and Street
    are categorized but left unaccounted.

- name: qa__diffs_all_summary
  description: >
    One row per output_file_id, aggregating qa__diffs_all's row-level diffs,
    plus two rows (ldf_dat, ldf_header) folded in from the LDF's separate
    count-based QA models (qa__ldf_diffs, qa__ldf_header_diffs), since the
    LDF isn't keyed/row-diffed the way everything else in qa__diffs_all is.
    Exported to CSV during the build and joined against the lion_outputs seed
    and the line-level file comparison to produce the CSCL diff report (see
    poc_validation/build_diffs_report.py).
  columns:
  - name: output_file_id
    description: Matches lion_outputs.file_id.
  - name: accounted_for_discrepant_rows
    description: >
      Count of qa__diffs_all rows for this output_file_id where accounted_for
      is true (known/legacy bugs or deliberate behavior changes). For ldf_dat,
      the surplus records qa__ldf_diffs accounts for; for ldf_header, 1 when the
      header differs and qa__ldf_header_diffs accounts for it.
  - name: unaccounted_discrepant_rows
    description: >
      Count of qa__diffs_all rows for this output_file_id where accounted_for
      is false. For ldf_dat, the surplus records qa__ldf_diffs doesn't account
      for; for ldf_header, 1 when the header differs and isn't accounted for (one
      line, counted once).
  - name: unaccounted_discrepant_fields
    description: >
      Count of individual changed fields (not rows) across unaccounted,
      modified records for this output_file_id. only_in_build /
      only_in_legacy rows have no changes jsonb and so don't contribute here.
      Null for the two LDF rows - that comparison has no per-field concept.
