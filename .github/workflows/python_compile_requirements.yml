name: Upgrade uv.lock
on:
  schedule:
  - cron: 0 0 1 * *
  workflow_dispatch:


jobs:
  upgrade_lock:
    name: Upgrade uv.lock and commit changes
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      run: curl -LsSf https://astral.sh/uv/install.sh | sh

    - name: Load Secrets
      uses: 1password/load-secrets-action@v1
      with:
        export-env: true
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        GHP_TOKEN: "op://Data Engineering/GITHUB_TOKENS/de_repo_management"

    # Upgrades every package in the workspace lock to its latest allowed version. Every
    # Docker image and CI job resolves from this one committed uv.lock (see
    # admin/ops/docker_build_and_publish.sh), so this is the single place a scheduled
    # dependency-freshness/vuln-fix bump happens for the whole repo.
    - name: Upgrade uv.lock
      run: uv lock --upgrade

    - name: Create PR
      uses: peter-evans/create-pull-request@v5
      with:
        commit-message: automated upgrade of uv.lock
        add-paths: uv.lock
        title: Upgrade uv.lock
        author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
        assignees: ${{ github.event_name == 'schedule' && 'fvankrieken, damonmcc, alexrichey' || '' }}
        branch: compile_python_reqs
        token: ${{ env.GHP_TOKEN }}

  create_issue_on_failure:
    needs: upgrade_lock
    runs-on: ubuntu-22.04
    if: ${{ failure() && (github.event_name == 'schedule') }}
    steps:
    - uses: actions/checkout@v4
      with:
        sparse-checkout: .github
    - name: Load Secrets
      uses: 1password/load-secrets-action@v1
      with:
        export-env: true
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        GHP_TOKEN: "op://Data Engineering/GITHUB_TOKENS/de_repo_management"

    - name: Create issue on failure
      uses: JasonEtco/create-an-issue@v2
      env:
        ACTION: ${{ github.workflow }}
        BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      with:
        filename: .github/ISSUE_TEMPLATE/scheduled_action_failure.md
        update_existing: true
