      layer_name: CDTAEquiv2020
  - name: dcp_cscl_gdb
    import_as: dcp_cscl_nta2020
    custom:
      filename: ETL Working GDB.gdb.zip
      layer_name: NTA2020
  - name: dcp_cscl_gdb
    import_as: dcp_cscl_ntaequiv2020
    custom:
      filename: ETL Working GDB.gdb.zip
      layer_name: NTAEquiv2020
  - name: dcp_cscl_gdb
    import_as: dcp_cscl_healtharea
    custom:
      filename: ETL Working GDB.gdb.zip
      layer_name: HealthArea
  - name: dcp_cscl_gdb
    import_as: dcp_cscl_firecompany
    custom:
      filename: ETL Working GDB.gdb.zip
      layer_name: FireCompany
  - name: dcp_cscl_gdb
    import_as: dcp_cscl_roadbed_pointer_list
