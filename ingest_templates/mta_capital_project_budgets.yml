id: mta_capital_project_budgets

attributes:
  name: "MTA Capital Project Budgets: Beginning 2020"
  description: >-
    Current and baseline budgets and spending of projects in the MTA's capital programs, by update date, project ID,
    and ACEP code. The only MTA dataset that ties a project ID to its ACEP codes.
  url: https://data.ny.gov/d/f6fd-xfps

ingestion:
  source:
    type: socrata
    org: nys
    uid: f6fd-xfps
    format: csv
  file_format:
    type: csv
    dtype: str
  processing_steps:
  - name: clean_column_names
    args: { "replace": { " ": "_" }, "lower": True }
