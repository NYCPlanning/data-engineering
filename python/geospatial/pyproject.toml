[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "dcpy-geospatial"
version = "0.0.1"
description = "DCP Data Engineering - GDAL-backed geospatial utilities (shapefiles, geoparquet, format conversion)"
requires-python = ">=3.11"
dependencies = [
    "dcpy-utils",
    "dcpy-product-metadata",
    # The Python bindings for the system libgdal (osgeo), which gdb/fgdb.py and
    # transform.py import. Must match the libgdal built into nycplanning/base
    # (gdal_version in admin/run_environment/docker/base/setup.sh).
    "GDAL==3.13.1",
    "geopandas",
    "ijson",
    "leafmap",
    "lxml",
    "numpy",
    "pandas",
    "pyarrow",
    "pydantic",
    "pydantic-xml",
    "pyogrio",
    "pyproj",
    "shapely",
    "typer",
    "rich",
]

[tool.uv.sources]
dcpy-utils = { workspace = true }
dcpy-product-metadata = { workspace = true }

[dependency-groups]
dev = [
    "pytest",
    "pandas-stubs",
    "pyarrow-stubs",
]

[tool.setuptools.packages.find]
include = ["dcpy*"]
namespaces = true
