exports:
  zip_name: output
  # parquet-first: export writes raw_exports/ (parquet layers + unformatted fixed-width
  # rows); `builds export package` formats and assembles the deliverables
  package_from_parquet: true
  crs: EPSG:2263
  # every FGDB layer on one xy grid: the source ETL Working GDB's (prod mixes grids per
  # layer). Source vertices round-trip exactly; computed ones (e.g. linearized arc points)
  # snap to the 1e-4 ft grid, as FGDB coordinates are integers.
  gdb_layer_options:
    XORIGIN: "-450359962737.04999"
    YORIGIN: "-450359962737.04999"
    XYSCALE: "10000"
    XYTOLERANCE: "0.00020000000000000001"
  datasets:
  # GeoSupport LION
  - name: manhattan_lion_dat
    group: flat_files
    filename: ManhattanLION.dat
    format: dat
    custom:
      formatting: lion_dat
      # parquet-first packaging (exports.package_from_parquet): format the
      # unformatted rows outside the database
      layout: seeds/text_formatting/text_formatting__lion_dat.csv
      layout_source: lion_dat_fields
      where: "boroughcode = '1'"
  - name: bronx_lion_dat
    group: flat_files
    filename: BronxLION.dat
    format: dat
    custom:
      formatting: lion_dat
      # parquet-first packaging (exports.package_from_parquet): format the
      # unformatted rows outside the database
      layout: seeds/text_formatting/text_formatting__lion_dat.csv
      layout_source: lion_dat_fields
      where: "boroughcode = '2'"
  - name: brooklyn_lion_dat
    group: flat_files
    filename: BrooklynLION.dat
    format: dat
    custom:
      formatting: lion_dat
      # parquet-first packaging (exports.package_from_parquet): format the
      # unformatted rows outside the database
      layout: seeds/text_formatting/text_formatting__lion_dat.csv
      layout_source: lion_dat_fields
      where: "boroughcode = '3'"
  - name: queens_lion_dat
    group: flat_files
    filename: QueensLION.dat
    format: dat
    custom:
      formatting: lion_dat
      # parquet-first packaging (exports.package_from_parquet): format the
      # unformatted rows outside the database
      layout: seeds/text_formatting/text_formatting__lion_dat.csv
      layout_source: lion_dat_fields
      where: "boroughcode = '4'"
  - name: staten_island_lion_dat
    group: flat_files
    filename: StatenIslandLION.dat
    format: dat
    custom:
      formatting: lion_dat
      # parquet-first packaging (exports.package_from_parquet): format the
      # unformatted rows outside the database
      layout: seeds/text_formatting/text_formatting__lion_dat.csv
      layout_source: lion_dat_fields
      where: "boroughcode = '5'"

  # LDF - formatting is applied inside the models, since the record file mixes layouts.
  # compare_file is off because positions 91-100 carry a cumulative record number that
  # diverges from prod's (data_issues.md CSCL-LDF-03), so a whole-line file diff reports
  # every record after the first divergence. qa__ldf_summary compares positions 1-90.
  - name: ldf_base
    group: flat_files
    filename: LDFBASE.dat
    format: dat
    custom: { compare_file: false }
  - name: ldf_header
    group: flat_files
    filename: LDFHEADER.dat
    format: dat
    custom: { compare_file: false }

