name: CSCL - 🏗️ Build
# Builds CSCL on DuckDB from recipe.yml. Plan, load, build (the recipe's stage_config commands), export (parquet-first)
# and package (flat files, FGDBs, docs), QA against prod, then upload to edm-publishing.
on:
  workflow_call:
    inputs:
      image_tag:
        type: string
        required: false
      build_name:
        type: string
        required: true
      recipe_file:
        type: string
        required: true
      plan_command:
        type: string
        default: recipe
      dev_bucket:
        type: string
        required: false

jobs:
  build:
    name: Build CSCL (DuckDB)
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
        working-directory: products/cscl
    container:
      # build-base doesn't have the dbt-duckdb adapter installed; dev does
      image: nycplanning/dev:${{ inputs.image_tag || 'latest' }}
    env:
      BUILD_NAME: ${{ inputs.build_name }}
      RECIPES_BUCKET: ${{ inputs.dev_bucket || 'edm-recipes' }}
      PUBLISHING_BUCKET: ${{ inputs.dev_bucket || 'edm-publishing' }}
      DEV_FLAG: ${{ inputs.dev_bucket && 'true' || 'false' }}
      # GEOS allocates outside DuckDB's memory limit, so stay well under the runner's RAM
      DUCKDB_MEMORY_LIMIT: 3GB
      DUCKDB_THREADS: 2
      LOCK_FILE: recipe.lock.yml
      # lifecycle stage dirs: builds/build, package, builds/qa (+ the load cache)
      DCPY_LIFECYCLE_DATA_DIR: ${{ github.workspace }}/.lifecycle
    steps:
    - uses: actions/checkout@v7

    - name: Install dcpy workspace
      run: uv sync --all-packages
    - name: Load Secrets
      uses: 1password/load-secrets-action@v5
      with:
        export-env: true
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        AWS_S3_ENDPOINT: "op://Data Engineering/DO_keys/AWS_S3_ENDPOINT"
        AWS_SECRET_ACCESS_KEY: "op://Data Engineering/DO_keys/AWS_SECRET_ACCESS_KEY"
        AWS_ACCESS_KEY_ID: "op://Data Engineering/DO_keys/AWS_ACCESS_KEY_ID"

    - name: Setup build environment
      working-directory: ./
      run: |
        ./bash/docker_container_setup.sh
        ./bash/build_env_setup.sh

    - name: Runner resources
      run: |
        nproc
        free -h
        df -h .

    - name: Plan build
      run: uv run python3 -m dcpy lifecycle builds plan recipe --recipe-path ./recipe.yml --output-path $LOCK_FILE

    - name: Check prod snapshot
      # QA compares against the legacy release of the same version (the
      # dcp_cscl_production_outputs input): fail early, saying how to build it, if it's missing
      run: |
        VERSION=$(uv run python3 -c "import yaml; print(yaml.safe_load(open('$LOCK_FILE'))['version'])")
        uv run python3 poc_validation/build_prod_snapshot.py check-snapshot -v "$VERSION"

    - name: Dataloading
      run: |
        start=$(date +%s)
        uv run python3 -m dcpy lifecycle builds load load --recipe-path $LOCK_FILE
        echo "load: $(( $(date +%s) - start ))s" >> timings.txt

    - name: Build
      # the recipe's stage_config.builds.build.commands: dbt deps, seed, run, test
      run: |
        start=$(date +%s)
        uv run python3 -m dcpy lifecycle builds build run --recipe-path $LOCK_FILE
        echo "build (seed + run + test): $(( $(date +%s) - start ))s" >> timings.txt

    - name: Export
      # parquet-first: dat/csv files, plus one GeoParquet per FGDB layer
      run: |
        start=$(date +%s)
        uv run python3 -m dcpy lifecycle builds export export --recipe-path $LOCK_FILE
        echo "export: $(( $(date +%s) - start ))s" >> timings.txt

    - name: Package
      # fold the parquet layers into the FGDBs, then zip the outputs
      run: |
        start=$(date +%s)
        uv run python3 -m dcpy lifecycle builds export package --recipe-path $LOCK_FILE
        echo "package: $(( $(date +%s) - start ))s" >> timings.txt

    - name: QA
      # the recipe's stage_config.builds.qa commands: QA models, flat file and gdb
      # comparisons against prod, the diffs report
      run: |
        start=$(date +%s)
        uv run python3 -m dcpy lifecycle builds qa run --recipe-path $LOCK_FILE
        echo "qa: $(( $(date +%s) - start ))s" >> timings.txt

    - name: Upload
      # same layout as before the DuckDB cut-over: the package (dataset_files/, attachments/,
      # the zip) plus QA's validation_output/ (read by the QA app), to
      # edm-publishing db-cscl/build/<build name>/. qa/prod/ (private prod files) stays put.
      run: |
        ROOT=$(dirname "$(uv run python3 -m dcpy lifecycle builds build path --recipe-path $LOCK_FILE)")
        STAGE="$RUNNER_TEMP/upload"
        rm -rf "$STAGE" && mkdir -p "$STAGE"
        cp -R "$ROOT/package/." "$STAGE/"
        cp -R "$ROOT/qa/validation_output" "$STAGE/validation_output"
        uv run python3 -m dcpy.connectors.edm.publishing upload -o "$STAGE" --product db-cscl --acl public-read --max_files 1000

    - name: Summary
      if: always()
      run: |
        {
          echo "### CSCL DuckDB build"
          echo '```'
          cat timings.txt 2>/dev/null
          # one root per build: <root>/{build,package,qa}
          ROOT=$(ls -d "$DCPY_LIFECYCLE_DATA_DIR"/builds/build/cscl/*/ 2>/dev/null | head -1)
          [ -n "$ROOT" ] && (cd "$ROOT" && du -sh build package qa 2>/dev/null; find package/dataset_files -type f | sort | head -60)
          [ -n "$ROOT" ] && cat "$ROOT/qa/validation_output/validation_summary.csv" 2>/dev/null
          true
          free -h
          echo '```'
          [ -n "$ROOT" ] && cat "$ROOT/qa/source_freshness.md" 2>/dev/null
          true
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload dbt logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cscl-duckdb-logs-and-qa
        path: |
          products/cscl/logs/
          products/cscl/target/run_results.json
          ${{ env.DCPY_LIFECYCLE_DATA_DIR }}/builds/build/cscl/*/qa/validation_output/
        if-no-files-found: ignore
