[project]
name = "dcpy-app-qa"
version = "0.0.1"
description = "DCP Data Engineering - QA/QC streamlit app"
requires-python = ">=3.11"
dependencies = [
    # apps/qa/src/shared/components/build_outputs.py uses dcpy.geospatial directly
    # (mapping, transform) and displays shapefile build artifacts.
    "dcpy-lifecycle[geo]",
    "folium",
    "geoalchemy2",
    "leafmap",
    "mapclassify",
    "matplotlib",
    "numerize",
    "plotly",
    "setuptools",
    "streamlit",
    "streamlit-aggrid",
    "streamlit-folium",
    "tabulate",
]

[tool.uv.sources]
dcpy-lifecycle = { workspace = true }

[tool.uv]
package = false
