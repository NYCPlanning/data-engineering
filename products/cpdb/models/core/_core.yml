version: 2

models:
  - name: dim_ten_year_plan_category
    description: |
      One row per ten-year plan category, identified by project type and `typc` code, for
      every category in an archived FISA release of the Capital Commitment Plan. The code
      is the category's identity: names change between releases (see
      `scd_ten_year_plan_category_name`), and the Ten-Year Capital Strategy reports by name
      and combines BR and HB into one program. A code matches a TYCS category with any name
      it has had in FISA, or by hand through `tycs_category_matches`; TYCS columns are null
      for the codes no TYCS release since 2019 reports.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [ project_type, typc ]
    columns:
      - name: project_type
        description: Capital program the category belongs to, the prefix of its budget lines.
        tests: [ not_null ]
      - name: project_type_name
        description: Name of the project type, like Highway Bridges for HB.
      - name: agency
        description: Acronym of the agency the project type belongs to.
      - name: typc
        description: Ten-year plan category code. Only unique within a project type.
        tests: [ not_null ]
      - name: name
        description: Category name in the latest FISA release that has the code.
        tests: [ not_null ]
      - name: first_release
        description: First archived FISA release (`fisa_capitalcommitments` version) with the code.
      - name: last_release
        description: Last archived FISA release with the code.
      - name: first_release_order
        description: Position of `first_release` among archived FISA releases, oldest first.
      - name: last_release_order
        description: Position of `last_release` among archived FISA releases, oldest first.
      - name: successor_typc
        description: |
          Code in the same project type that took over this retired code's projects, from the
          `ten_year_plan_category_successors` seed. Null for codes that weren't retired into
          another.
      - name: tycs_project_type
        description: Project type or combined program the Ten-Year Capital Strategy reports this category under.
      - name: tycs_project_type_desc
        description: The TYCS's description of that program, like "Department of Transportation - Bridges" for BR and HB.
      - name: tycs_category
        description: Category name in the Ten-Year Capital Strategy, which can lag a rename in the CCP.
      - name: tycs_match
        description: How the TYCS category was matched, `name` or `manual`.
        tests:
          - accepted_values:
              values: [ name, manual ]
      - name: tycs_last_pub_date
        description: Latest TYCS release (`pub_date`) that published the matched category.
      - name: lifecycle
        description: TYCS lifecycle category (state of good repair, program expansion, or programmatic replacement), from the 2025-05-01 strategy. Null for categories not in it.
      - name: lifecycle_confidence
        description: How `lifecycle` was matched; see `tycs_category_lifecycles`.
      - name: asset_type
        description: |
          What the category's spending builds or keeps up, from
          `ten_year_plan_category_asset_types`. Null for `unresolved` categories and for
          categories with no planned dollars in FISA 20260929, which aren't classified.
      - name: place_link
        description: How the asset reaches a place (`site`, `network`, `fleet`, or `system`).
      - name: asset_type_confidence
        description: How sure `asset_type` is; see `ten_year_plan_category_asset_types`.

  - name: scd_ten_year_plan_category_name
    description: |
      One row per version of a ten-year plan category's name: a new row starts when a
      release renames the code. Releases the code is missing from don't start a new
      version. This is an SCD rather than a release snapshot because names rarely change
      (4 of 234 codes across 19 releases). The bounds are the releases that published a
      name, not the dates it changed.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [ project_type, typc, first_release_order ]
    columns:
      - name: project_type
        tests: [ not_null ]
      - name: typc
        tests: [ not_null ]
      - name: name
        tests: [ not_null ]
      - name: first_release
        description: First archived FISA release with this name.
        tests: [ not_null ]
      - name: last_release
        description: Last archived FISA release with this name.
        tests: [ not_null ]
      - name: first_release_order
        description: Position of `first_release` among archived FISA releases, oldest first.
      - name: last_release_order
        description: Position of `last_release` among archived FISA releases, oldest first.

  - name: ref_commitment_code
    description: |
      One row per commitment code in the latest FISA release of the Capital Commitment Plan,
      with its name. A planned commitment's code says what kind of spending it is (design,
      construction, equipment, contingency), not what the project is for.
    columns:
      - name: commitment_code
        description: Four-character code, FISA's `object`.
        tests: [ unique, not_null ]
      - name: name
        description: FISA's name for the code (`object_name`), like CONSTRUCTION or CONTINGENCY.
        tests: [ not_null ]

  - name: fact_planned_commitment
    description: |
      One row per planned commitment in the Capital Commitment Plan loaded for the build: a
      project's planned spending on one budget line, commitment code, and ten-year plan
      category in one month. Lifecycle is set here rather than on the project because a
      project's commitments can be in different categories and lifecycles.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [ maprojid, budget_line, commitment_code, planned_commit_date, typc ]
    columns:
      - name: ccp_version
        description: FISA cycle of the plan, like `fisa_2027`.
      - name: maprojid
        description: Managing agency code and project ID, the project's key.
        tests: [ not_null ]
      - name: budget_line
        description: Project type and budget line ID, like `HB-1012`.
        tests: [ not_null ]
      - name: project_type
        description: Project type, the prefix of `budget_line`.
        tests: [ not_null ]
      - name: typc
        description: Ten-year plan category code. With `project_type`, the key of `dim_ten_year_plan_category`.
        tests:
          # warn: the dim only has codes from releases in the fisa_typc_names seed, which
          # lags a newly archived release until the seed is regenerated
          - relationships:
              to: ref('dim_ten_year_plan_category')
              field: typc
              config:
                severity: warn
      - name: commitment_code
        description: What kind of spending the commitment is; see `ref_commitment_code`.
        tests:
          - not_null
          - relationships:
              to: ref('ref_commitment_code')
              field: commitment_code
      - name: planned_commit_date
        description: Month the commitment is planned for, as `MM/YY`.
      - name: plannedcommit_total
        description: Planned commitment from all funding sources.
      - name: lifecycle
        description: |
          Lifecycle of the commitment's ten-year plan category, from
          `dim_ten_year_plan_category`. Null when the category has no lifecycle.

  - name: dim_capital_project
    description: |
      One row per capital project in the Capital Commitment Plan loaded for the build, with
      the lifecycle and commitment code that get the most of its planned dollars. Use
      `fact_planned_commitment` for a project's full split.
    columns:
      - name: maprojid
        description: Managing agency code and project ID.
        tests: [ unique, not_null ]
      - name: description
        description: The longest of the project's commitment descriptions.
      - name: plannedcommit_total
        description: Planned commitments from all funding sources, summed over the project.
      - name: lifecycle
        description: |
          Lifecycle with the most planned dollars among the project's commitments, ignoring
          commitments without one. Ties go to the lifecycle that sorts first. Null when no
          commitment has a lifecycle.
      - name: lifecycle_share
        description: |
          Share of the project's planned dollars in `lifecycle`. Can fall outside 0 to 1 when
          some planned commitments are negative.
      - name: has_multiple_lifecycles
        description: Whether the project's commitments have more than one lifecycle.
      - name: commitment_description
        description: |
          Name of the commitment code with the most planned dollars among the project's
          commitments, like CONSTRUCTION. Ties go to the name that sorts first.
      - name: commitment_description_share
        description: |
          Share of the project's planned dollars under `commitment_description`. Can fall
          outside 0 to 1 when some planned commitments are negative.
      - name: has_multiple_commitment_descriptions
        description: Whether the project's commitments have more than one commitment description.
      - name: mappability
        description: |
          `mapped` when CPDB has a geometry for the project. `place-specific but unmapped`
          when the project has a place but no geometry, like a building or a street that
          CPDB couldn't locate. `not place-specific` when it doesn't have a place, like a
          vehicle fleet or an IT system. Set by the first source in `scope_source` order
          that has a value. Null when no source does.
        tests:
          - accepted_values:
              values: [ mapped, place-specific but unmapped, not place-specific ]
      - name: geographic_scope
        description: |
          How much of the city the project covers: `site`, `multiple sites`, `network`
          (segments like streets or sewers), `community district`, `borough`, or
          `citywide`. From a geometry, `site` is one point or polygon and `multiple sites`
          is more than one. Null when the source
          doesn't say, like a `site` category project with no geometry, which could be one
          site or many.
        tests:
          - accepted_values:
              values: [ site, multiple sites, network, community district, borough, citywide ]
      - name: scope_source
        description: |
          What set `mappability` and `geographic_scope`, in order of precedence: `geometry`
          (CPDB's), `agency verified` (the agency's answer in `dcp_cpdb_agencyverified`,
          through `agency_verified_mappability`), `dashboard` (the Capital Projects
          Dashboard's `community_board` in its latest reporting period, used only when it
          names one community district or borough), or `category` (the `place_link` of the
          ten-year plan category with most of the project's planned dollars). From a
          category, `fleet` and `system` projects are `not place-specific` and `citywide`.
          That's our reading, not the agency's.
        tests:
          - accepted_values:
              values: [ geometry, agency verified, dashboard, category ]
