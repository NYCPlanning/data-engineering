version: 2

# 2020 community district tabulation area lookup, from the CSCL CDTAEquiv2020 table. The
# fixed-width layout is in seeds/text_formatting/text_formatting__cdta2020_dat.csv.

models:
- name: cdta2020_by_field
  description: >-
    One row per 2020 community district tabulation area (code, name, type), each value
    formatted to its fixed width. Copied from CSCL's 2020 CDTA equivalency table.
  config:
    tags: [export_doc]
    meta:
      each_row_is_a: A 2020 community district tabulation area
  columns: &cdta2020_cols
  - name: cdta_code
    description: 2020 CDTA code, e.g. QN07.
  - name: cdta_name
    description: CDTA name.
  - name: cdta_type
    description: CDTA type, telling community districts from joint interest areas (large parks and airports outside any community district).
    meta:
      value_labels:
        "0": Community district
        "1": Joint interest area

- name: cdta2020_fields
  description: One column per field of the CDTA 2020 layout; supplies the packaged text file's column layout.
  columns: *cdta2020_cols

- name: cdta2020_dat
  description: The fixed-width CDTA2020.txt file, one line per 2020 community district tabulation area.
  columns:
  - name: dat_column
    description: One fixed-width record (CDTA code, name, type).

- name: cdta2020_by_field_csv
  description: One row per 2020 community district tabulation area, formatted for the CSV export.
  columns: *cdta2020_cols

- name: cdta2020_csv
  description: The CDTA2020.csv export, one row per 2020 community district tabulation area.
  columns:
  - name: CDTA_CODE
    description: 2020 CDTA code, e.g. QN07.
  - name: CDTA_NAME
    description: CDTA name.
  - name: CDTA_TYPE
    description: CDTA type code.
