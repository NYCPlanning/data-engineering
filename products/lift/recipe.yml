name: LIFT
product: lift
version: 26v1

inputs:
  dataset_defaults:
    destination: duckdb
    file_type: parquet
  missing_versions_strategy: find_latest
  datasets:
    # Private CSV file from edm-private bucket
    - name: dcas_lift
      source: edm.private
      file_type: csv
      import_as: lift_csv
      custom:
        filename: dcas_lift.csv

    # Latest PLUTO
    - name: dcp_mappluto_wi
    - name: dcp_zoningmapamendments

    # 2020 NTAs
    - name: dcp_ct2020
    - name: dcp_nta2020

    # DRI subindices and indicators from edm-private
    - name: dcp_dri_subindices_indicators
      source: edm.private
      file_type: csv
      import_as: dri_subindices_indicators
      custom:
        filename: dcp_dri_subindices_indicators.csv

    # HPD Limited Affordability Areas from edm-private
    - name: hpd_limited_affordability_areas
      source: edm.private
      file_type: shapefile
      import_as: hpd_limited_affordability_areas
      custom:
        filename: hpd_limited_affordability_areas.shp

    # NYC Rezoning Tracker - capital/programmatic commitments from neighborhood rezonings
    - name: hpd_rezoning_tracker

    # City Hall's "Public Sites for Housing" tracker - redevelopment strategy/priority/
    # cost fields for LIFT sites, from edm-private
    - name: cityhall_public_sites_for_housing
      source: edm.private
      file_type: csv
      import_as: public_sites_for_housing
      custom:
        filename: cityhall_public_sites_for_housing.csv

    # Capital Projects Database - specify single file from directory
    - name: db-cpdb
      source: edm.publishing.published
      version: latest
      file_type: shapefile
      import_as: cpdb_projects_poly
      custom:
        filename: cpdb_projects_poly.shp.zip
    - name: db-cpdb
      source: edm.publishing.published
      version: latest
      file_type: shapefile
      import_as: cpdb_projects_points
      custom:
        filename: cpdb_projects_pts.shp.zip

exports:
  output_folder: output
  zip_name: output
  datasets:
  - name: lift_supplemented
    filename: lift_supplemented.csv
    format: csv
  - name: rezoning_commitments
    filename: rezoning_commitments.csv
    format: csv

stage_config:
  builds.build:
    commands:
    # dbt needs DUCKDB_PATH pointed at the file load_recipe_data just created. Each
    # command below runs as its own subprocess (no state carries over between them), but
    # BUILD_ENV_OUTPUT_DIR and VERSION are both guaranteed set in the environment before
    # every command (recipe.env["VERSION"] is set at plan time; BUILD_ENV_OUTPUT_DIR is set
    # from the build directory) - same convention as the loader's own duckdb filename.
    - name: dbt_deps
      command_type: shell
      run: dbt deps
    - name: dbt_build
      command_type: shell
      run: >-
        export DUCKDB_PATH="$BUILD_ENV_OUTPUT_DIR/lift_${VERSION}.duckdb" &&
        dbt debug &&
        dbt test --select "source:*" &&
        dbt seed &&
        dbt build --select staging &&
        dbt build --select intermediate &&
        dbt build --select product
