# CSCL-DISTRICTS-09. MN01 and QN99 (mostly Queens APs, a few Brooklyn) have a FIPS code;
# BK02's first NeighborhoodPUMACodes row has a blank one (its second doesn't), SI01's a
# null one, and BX99 has no row; BK05's first row has one and a later row is blank. sql
# fixtures: CI runs unit tests without building the upstream models
unit_tests:
- name: test__int__nta2010_county_fips__prod
  description: "Default (fill_nta_county_fips_from_borough false): CountyFIPS is blank where the NTA's FIPS code is blank or missing, as prod's."
  model: int__nta2010_county_fips
  overrides:
    vars:
      fill_nta_county_fips_from_borough: false
  given: &nta_county_fips_given
  - input: ref('int__topology__ap_entities')
    format: sql
    rows: |
      SELECT * FROM (VALUES
        ('MN01', '1', 100.0),
        ('QN99', '4', 100.0),
        ('QN99', '3', 10.0),
        ('BK02', '3', 100.0),
        ('SI01', '5', 100.0),
        ('BX99', '2', 100.0),
        ('BK05', '3', 100.0),
        (NULL, '1', 100.0)
      ) AS t (nta2010, borocode, area_sqft)
  - input: source('recipe_sources', 'dcp_cscl_neighborhoodpumacodes')
    format: sql
    rows: |
      SELECT * FROM (VALUES
        (1, 'MN01', '61'),
        (2, 'MN01', '61'),
        (3, 'QN99', '81'),
        (5, 'BK02', '47'),
        (4, 'BK02', ' '),
        (6, 'SI01', NULL),
        (7, 'BK05', '47'),
        (8, 'BK05', '')
      ) AS t (ogc_fid, neighborhood_code, fips_code)
  - input: ref('stg__borough')
    format: sql
    rows: |
      SELECT * FROM (VALUES
        ('1', '061'), ('2', '005'), ('3', '047'), ('4', '081'), ('5', '085')
      ) AS t (borocode, fips)
  expect:
    rows:
    - {nta2010: MN01, borocode: '1', npc_fips_code: '61', county_fips_prod: '061', county_fips_borough: '061', county_fips: '061'}
    - {nta2010: QN99, borocode: '4', npc_fips_code: '81', county_fips_prod: '081', county_fips_borough: '081', county_fips: '081'}
    - {nta2010: BK02, borocode: '3', npc_fips_code: null, county_fips_prod: null, county_fips_borough: '047', county_fips: null}
    - {nta2010: SI01, borocode: '5', npc_fips_code: null, county_fips_prod: null, county_fips_borough: '085', county_fips: null}
    - {nta2010: BX99, borocode: '2', npc_fips_code: null, county_fips_prod: null, county_fips_borough: '005', county_fips: null}
    - {nta2010: BK05, borocode: '3', npc_fips_code: '47', county_fips_prod: '047', county_fips_borough: '047', county_fips: '047'}
- name: test__int__nta2010_county_fips__borough
  description: "fill_nta_county_fips_from_borough true: every NTA gets its borough's FIPS code."
  model: int__nta2010_county_fips
  overrides:
    vars:
      fill_nta_county_fips_from_borough: true
  given: *nta_county_fips_given
  expect:
    rows:
    - {nta2010: MN01, borocode: '1', npc_fips_code: '61', county_fips_prod: '061', county_fips_borough: '061', county_fips: '061'}
    - {nta2010: QN99, borocode: '4', npc_fips_code: '81', county_fips_prod: '081', county_fips_borough: '081', county_fips: '081'}
    - {nta2010: BK02, borocode: '3', npc_fips_code: null, county_fips_prod: null, county_fips_borough: '047', county_fips: '047'}
    - {nta2010: SI01, borocode: '5', npc_fips_code: null, county_fips_prod: null, county_fips_borough: '085', county_fips: '085'}
    - {nta2010: BX99, borocode: '2', npc_fips_code: null, county_fips_prod: null, county_fips_borough: '005', county_fips: '005'}
    - {nta2010: BK05, borocode: '3', npc_fips_code: '47', county_fips_prod: '047', county_fips_borough: '047', county_fips: '047'}

# CSCL-DISTRICTS-10. 3990100 and 5990100 carry the source BOROCT 4990100 and QN99, as the
# Brooklyn and Staten Island pieces of tract 990100 do on 26c; 4990100 is the Queens
# piece; 1000100 is an ordinary tract. QN99 has two NeighborhoodPUMACodes rows: prod's
# lookup takes the first (by ogc_fid). sql fixtures: CI runs unit tests without building
# the upstream models
- name: test__int__ct2010_keys__prod
  description: "Default (key_tracts_by_borough false): BoroCT2010 and NTACode are the source tract's, NTAName looked up by that code, as prod's."
  model: int__ct2010_keys
  overrides:
    vars:
      key_tracts_by_borough: false
  given: &ct2010_keys_given
  - input: ref('stg__censustract2010')
    format: sql
    rows: |
      SELECT * FROM (VALUES
        ('3', '990100', '3990100', '4990100', 'QN99'),
        ('4', '990100', '4990100', '4990100', 'QN99'),
        ('5', '990100', '5990100', '4990100', 'QN99'),
        ('1', '000100', '1000100', '1000100', 'MN25')
      ) AS t (borocode, ct, boroct, source_boroct, neighborhood_code)
  - input: source('recipe_sources', 'dcp_cscl_neighborhoodpumacodes')
    format: sql
    rows: |
      SELECT * FROM (VALUES
        (1, 'QN99', 'park-cemetery-etc-Queens'),
        (2, 'QN99', 'park-cemetery-etc-Queens (later row)'),
        (3, 'BK99', 'park-cemetery-etc-Brooklyn'),
        (4, 'SI99', 'park-cemetery-etc-Staten Island'),
        (5, 'MN25', 'Battery Park City-Lower Manhattan')
      ) AS t (ogc_fid, neighborhood_code, neighborhood_name)
  - input: ref('stg__neighborhoodpumacodes')
    format: sql
    rows: |
      SELECT * FROM (VALUES
        ('3', 990100, 'BK99', 'park-cemetery-etc-Brooklyn'),
        ('4', 990100, 'QN99', 'park-cemetery-etc-Queens'),
        ('5', 990100, 'SI99', 'park-cemetery-etc-Staten Island'),
        ('1', 100, 'MN25', 'Battery Park City-Lower Manhattan')
      ) AS t (borough, censustract, neighborhood_code, neighborhood_name)
  expect:
    rows:
    - {boroct: '3990100', boroct2010: '4990100', nta_code: QN99, nta_name: park-cemetery-etc-Queens, nta_code_borough: BK99}
    - {boroct: '4990100', boroct2010: '4990100', nta_code: QN99, nta_name: park-cemetery-etc-Queens, nta_code_borough: QN99}
    - {boroct: '5990100', boroct2010: '4990100', nta_code: QN99, nta_name: park-cemetery-etc-Queens, nta_code_borough: SI99}
    - {boroct: '1000100', boroct2010: '1000100', nta_code: MN25, nta_name: Battery Park City-Lower Manhattan, nta_code_borough: MN25}
- name: test__int__ct2010_keys__borough
  description: "key_tracts_by_borough true: every tract is keyed by its borough and tract, its NTA looked up by borough and tract."
  model: int__ct2010_keys
  overrides:
    vars:
      key_tracts_by_borough: true
  given: *ct2010_keys_given
  expect:
    rows:
    - {boroct: '3990100', boroct2010: '3990100', nta_code: BK99, nta_name: park-cemetery-etc-Brooklyn, nta_code_prod: QN99}
    - {boroct: '4990100', boroct2010: '4990100', nta_code: QN99, nta_name: park-cemetery-etc-Queens, nta_code_prod: QN99}
    - {boroct: '5990100', boroct2010: '5990100', nta_code: SI99, nta_name: park-cemetery-etc-Staten Island, nta_code_prod: QN99}
    - {boroct: '1000100', boroct2010: '1000100', nta_code: MN25, nta_name: Battery Park City-Lower Manhattan, nta_code_prod: MN25}

# CSCL-DISTRICTS-04. BID 56 has a shell inside another shell (its raw area counts the
# inner one twice), HEZ X is a bowtie, CD 484 is valid, and BID 1 is valid. Only the
# invalid ones are listed
- name: test__int__district_invalid_source_polygons
  description: "Lists only the source polygons that are invalid, with the raw and the made-valid area."
  model: int__district_invalid_source_polygons
  given:
  - input: source('recipe_sources', 'dcp_cscl_businessimprovementdistrict')
    format: sql
    rows: |
      SELECT bidid, ST_GeomFromText(wkt) AS geom FROM (VALUES
        (56, 'MULTIPOLYGON(((0 0, 10 0, 10 10, 0 10, 0 0)), ((2 2, 4 2, 4 4, 2 4, 2 2)))'),
        (1, 'POLYGON((0 0, 1 0, 1 1, 0 1, 0 0))')
      ) AS t (bidid, wkt)
  - input: source('recipe_sources', 'dcp_cscl_hurricaneevacuationzone')
    format: sql
    rows: |
      SELECT hurricane_evacuation_zone, ST_GeomFromText(wkt) AS geom FROM (VALUES
        ('X', 'POLYGON((0 0, 10 10, 10 0, 0 10, 0 0))')
      ) AS t (hurricane_evacuation_zone, wkt)
  - input: source('recipe_sources', 'dcp_cscl_communitydistrict')
    format: sql
    rows: |
      SELECT commdist, ST_GeomFromText(wkt) AS geom FROM (VALUES
        ('484', 'POLYGON((0 0, 5 0, 5 5, 0 5, 0 0))')
      ) AS t (commdist, wkt)
  expect:
    rows:
    - {source_layer: nybid, key_value: '56', source_area_sqft: 104.0, valid_area_sqft: 96.0}
    - {source_layer: nyhez, key_value: X, source_area_sqft: 0.0, valid_area_sqft: 50.0}
