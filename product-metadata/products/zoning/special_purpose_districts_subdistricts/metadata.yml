id: special_purpose_districts_subdistricts

attributes:
  attribution_link: {{ bytes_url__zoning_features }}
  description: |-
    Areas within Special Purpose Districts where unique rules apply.

    This feature class contains only the internal subdistricts of any special purpose districts that are so subdivided. The main special purpose district name is indicated by the SPNAME attribute, the SUBDIST attribute contains the subdistrict name. Any further subdistrict divisions are named in the SUBAREA_NM or SUBAREA_OTR attribute. Subdistrict data has not been fully digitized and may be incomplete. See the Zoning Resolution for a complete description of the special purpose district. Where appropriate, the Zoning Resolution includes a district map showing subdistricts and subareas within the special purpose district.

    All previously released versions of this data are available on the <a href="{{ bytes_url__zoning_features }}">DCP Website: BYTES of the BIG APPLE</a>. Current version: {{ current_version_zoning }}
  display_name: Special Purpose Subdistricts (NYSP_SD)
  each_row_is_a: Special Purpose subdistrict
  publishing_frequency: Monthly
  tags:
  - Zoning
  - New York City
  - NYC
  - Department of City Planning
  - DCP
  - Special Purpose Districts
  - nysp_sd
  - Sub-district
  - Sub-area

assembly:
- id: dcm_multilayer
  filename: nyc_zoning_features_shp.zip
  type: multilayer_shapefile
  contents:
  - id: shapefile
    custom:
      layer_name: zoning_special_subdistricts

custom: {}

destinations:
- id: socrata
  type: open_data
  tags: [socrata_unpublished]
  files:
  - id: data_dictionary
    custom:
      destination_use: attachment
  - id: shapefile
    custom:
      destination_use: dataset_file
  # - id: oti_data_dictionary
  #   custom:
  #     destination_use: attachment
  custom:
    four_four: 9ng7-qsbs
- id: bytes
  type: bytes
  files:
  - id: dcm_multilayer
    custom:
      url: https://s-media.nyc.gov/agencies/dcp/assets/files/zip/data-tools/bytes/nyc_zoning_features_shp.zip
  - id: metadata_xlsx
    custom:
      url: https://s-media.nyc.gov/agencies/dcp/assets/files/excel/data-tools/bytes/zoning_special_subdistricts_data_dictionary.xlsx

files:
- file:
    id: shapefile
    filename: zoning_special_subdistricts.shp.zip
    type: shapefile
- file:
    id: oti_data_dictionary
    filename: zoning_special_subdistricts_data_dictionary.xlsx
    is_metadata: true
    type: oti_data_dictionary

columns:
- id: the_geom
  name: the_geom
  data_type: geometry
  description: Feature geometry.
- id: sdname
  name: SDNAME
  data_type: text
  description: Special Purpose district name.
- id: sdlbl
  name: SDLBL
  data_type: text
  description: Special Purpose district label, it appears on the Zoning Map of New York City.
- id: subdist
  name: SUBDIST
  data_type: text
  description: Special Purpose district subdistrict name.
- id: sub_area_n
  name: SUB_AREA_N
  data_type: text
  description: Sub-area name of a Special Purpose district sub-district.
- id: subdist_lb
  name: SUBDIST_LB
  data_type: text
  description: Special Purpose district subdistrict label
- id: subarea_lb
  name: SUBAREA_LB
  data_type: text
  description: Sub-area label of a Special Purpose district sub-district.
- id: subarea_ot
  name: SUBAREA_OT
  data_type: text
  description: Other sub-area name of a Special Purpose district sub-district, if needed.
- id: shape_leng
  name: Shape_Leng
  data_type: decimal
  description: Length of feature in internal units.
- id: shape_area
  name: SHAPE_Area
  data_type: decimal
  description: Area of feature in internal units squared.
