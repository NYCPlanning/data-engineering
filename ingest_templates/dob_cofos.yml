id: dob_cofos

attributes:
  name: DOB Certificates of Occupancy
  description: >-
    Certificates of occupancy DOB sends by email. Each delivery is appended to the
    previous version, so every version carries the full history, including the BIS-era
    certificates dob_now_cofos doesn't have.

ingestion:
  source:
    type: s3
    bucket: edm-private
    key: dob_cofos/{{ version }}/dob_cofos.csv
  file_format:
    type: csv
    dtype: str
  processing_steps:
  - name: rename_columns
    args:
      map:
        Job number: jobnum
        Occupancyissueddate: effectivedate
        BIN: bin
        Borough: boroname
        Housenumber: housenumber
        Streetname: streetname
        Block: block
        Lot: lot
        Noofdwellingunits: numofdwellingunits
        Buildingoccupancygroupclassification: occupancyclass
        CofilingtypeLabel: certificatetype
  # library's script set CofO Status, buildingtypedesc, and docstatus to null on every new row
  - name: drop_columns
    args:
      columns: ["CofO Status"]
  - name: update_column
    args: { column_name: buildingtypedesc, val: null }
  - name: update_column
    args: { column_name: docstatus, val: null }
  - name: pd_series_func
    args:
      column_name: jobnum
      function_name: str.replace
      pat: "-.*$"
      repl: ""
      regex: True
  - name: pd_series_func
    args:
      column_name: certificatetype
      function_name: map
      arg:
        Initial: T- TCO
        Renewal With Change: T- TCO
        Renewal Without Change: T- TCO
        Final: C- CO
  - name: update_column
    args: { column_name: v, val: "{{ version }}" }
  - name: append_prev
  - name: deduplicate
