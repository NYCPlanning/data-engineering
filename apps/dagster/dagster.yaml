# Dagster instance config: keep runs, event logs, and schedules in Postgres instead of SQLite
# files under DAGSTER_HOME. Only used when DAGSTER_PG_URL is set - the entrypoint (or compose
# override) copies/mounts this into DAGSTER_HOME then; without it Dagster falls back to SQLite.
#
# DAGSTER_PG_URL: postgresql://<user>:<password>@<host>:5432/<db>[?sslmode=require]
storage:
  postgres:
    postgres_url:
      env: DAGSTER_PG_URL

# Runs execute on the single runner box (apps/docker/entrypoints/dagster-runner.sh); cap how many
# run at once so they don't fight over its CPU, memory and disk. Extra runs wait in the queue.
concurrency:
  runs:
    max_concurrent_runs: 2
