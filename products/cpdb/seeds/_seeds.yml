seeds:
  - name: dcp_projecttypes_agencies
    description: |
      The agency associated with each project type.
    columns:
      - name: projecttype
        tests: [ unique, not_null ]
      - name: agencyacronym
        tests: [ not_null ]
      - name: agency
        tests: [ not_null ]

  - name: dcp_json
    description: |
      Project geometry by maprojid.
    columns:
      - name: maprojid
        tests: [ unique, not_null ]
      - name: geom
        tests: [ not_null ]

  - name: cpdb_badgeoms
    description: |
      List of maprojid values to remove.
    columns:
      - name: maprojid
        tests: [ not_null ]

  - name: dcp_id_bin_map
    description: |
      Mapping between maprojid and BIN.
    columns:
      - name: maprojid
        tests: [ unique, not_null ]
      - name: bin
        tests: [ not_null ]

  - name: dcp_cpdb_agencyverified
    description: |
      Agency-verified CPDB records with address and project details.
    columns:
      - name: address
      - name: agency
      - name: bbl
      - name: bin
      - name: borough
      - name: bridgeid
      - name: category
      - name: description
      - name: mappable
      - name: maprojid
      - name: origin
      - name: parkid
      - name: parkname
      - name: zipcode

  - name: type_category_patterns
    description: |
      Project type category patterns for mapping project descriptions to project types.
    columns:
      - name: typecategory
        tests: [ not_null ]
      - name: pattern
        tests: [ not_null ]

  - name: dcp_manual_geoms_2020
    description: |
      Manually-collected 2020 project geometries (formerly data/edcgeoms_2021-01-08.csv, loaded
      inline by bash/02_build.sh). Named with a dcp_ prefix, not the legacy table's bare
      `manual_geoms_2020`, to avoid colliding with the legacy table of that exact name --
      bash/02_build.sh drops and recreates it (with different, truncated column names) every
      build, in the same shared schema. `geometry` is raw WKT text, not a PostGIS geometry type
      -- casting to geometry(4326) and the legacy 'AD Sprint' -> 'EP 2020' geomsource relabeling
      both happen in the intermediate model that consumes this seed, not here.
    columns:
      - name: cartodb_id
        tests: [ unique, not_null ]
      - name: maprojid
        tests: [ not_null ]
      - name: geometry
        tests: [ not_null ]


  - name: tycs_lifecycle_crosswalk
    description: |
      Ten-Year Capital Strategy (TYCS) lifecycle category for each project type and ten-year
      plan category (`typc`), for joining to planned commitments. OMB doesn't publish this
      mapping. It's inferred from the FY 2026-2035 strategy: each lifecycle line on its "Life
      Cycle Category" page was matched to the set of TYCS Open Data categories (b37a-3faw,
      pub_date 20250501) whose totals sum to it. `lifecycle_confidence` is `exact` when the
      categories were picked by name and their totals match the line, `plausible` when several
      sets of categories match the line's total and one was picked by judgment, and `unresolved`
      when no pick was made. TYCS categories are matched to `typc`
      codes by project type and name, except six renamed Parks and Sanitation categories
      matched by hand. The TYCS treats project types BR (waterway bridges) and HB (highway
      bridges) as one program, `BR and HB`, so each bridge category has a row for both.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [ project_type, typc ]
    columns:
      - name: project_type
        tests: [ not_null ]
      - name: tycs_project_type
        tests: [ not_null ]
      - name: typc
        tests: [ not_null ]
      - name: tycs_category
        tests: [ not_null ]
      - name: lifecycle
        tests:
          - accepted_values:
              values: [ State of Good Repair, Program Expansion, Programmatic Replacement ]
      - name: lifecycle_confidence
        tests:
          - accepted_values:
              values: [ exact, plausible, unresolved ]
