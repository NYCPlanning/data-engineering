id: minor_census_economic_areas

attributes:
  display_name: Minor Census Economic Areas
  description: |-
    Minor Census Economic Areas (MCEAs) for New York City, generated by dissolving 2000 census tracts on their MCEA attribute and clipping the result to the shoreline. Water areas are not included.
  each_row_is_a: Connected part of a Minor Census Economic Area
  attribution: Department of City Planning (DCP)
  disclaimer: The Department of City Planning make no representation as to the accuracy of the information or its suitability for any purposes. The Department and the City disclaim any liability for errors that may be contained herein.
  projection: "EPSG:2263"
  tags:
  - minor census economic areas
  - mcea
  - census
  - boundaries
  - lion
  - dcp
  - department of city planning (dcp)
  - new york city

assembly: []

custom: {}

destinations: []

files:
- file:
    id: districts_gdb
    filename: Districts.gdb.zip
    type: geodatabase
    layers:
    - layer: nymcea

