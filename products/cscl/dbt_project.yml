name: "cscl"

profile: "dcp-de-postgres"

model-paths: [ "models" ]
asset-paths: [ "assets" ]

tests:
  +store_failures: true
  +schema: "_tests"

models:
  cscl:
    staging:
      +materialized: view
      +group: staging
      +docs:
        node_color: "#2a9d8f"  # Verdigris - for recipe/source inputs
    intermediate:
      +materialized: view
      +docs:
        node_color: "#e76f51"  # Burnt Peach - logging/metadata
    product:
      +materialized: table
      +docs:
        node_color: "#264653"  # Charcoal Blue - production outputs
    qa_int:
      +materialized: table
      +tags: ['qa', 'qa_prod']
      +docs:
        node_color: "#f4a261"  # Orange - QA production wrappers
    etl_dev_qa:
      +materialized: table
      +tags: ['qa']
      +docs:
        node_color: "#124559"
    log_files:
      +materialized: table
      +docs:
        node_color: "#3e5c76"

# LDF header fields. Nothing in the source data identifies a LION release or the date it
# was deployed - GR's extract tool takes all four as operator input, and so do we. They're
# recorded in recipe.yml and passed in with
# `dbt build --vars "$(python3 scripts/ldf_vars.py)"`; the nulls below make a build that
# omits them fail in int__ldf_header rather than emit a wrong header.
vars:
  ldf_old_release: null
  ldf_old_release_date: null # ISO YYYY-MM-DD
  ldf_new_release: null
  ldf_new_release_date: null # ISO YYYY-MM-DD

on-run-start:
- '{{ create_pg_functions() }}'

flags:
  fail-fast: true
