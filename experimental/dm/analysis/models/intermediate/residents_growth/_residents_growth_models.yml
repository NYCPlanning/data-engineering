models:
  - name: int_cd_acs_metrics
    columns:
      - name: borocd
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('int_cd_spine')
                field: borocd
      - name: citywide_median_household_income_acs
        data_tests: [not_null]

  - name: int_census_tract_acs_metrics
    columns:
      - name: boroct2020
        data_tests: [unique, not_null]

  - name: int_census_tract_density_metrics
    columns:
      - name: boroct2020
        data_tests: [unique, not_null]

  - name: int_cd_density_metrics
    columns:
      - name: borocd
        data_tests: [unique, not_null]

  - name: int_nta_kpdb_projection_metrics
    columns:
      - name: nta2020
        data_tests: [unique, not_null]

  - name: int_nta_housing_metrics
    columns:
      - name: nta2020
        data_tests: [unique, not_null]

  - name: int_nta_date_housing_metrics
    data_tests:
      - unique:
          arguments:
            column_name: "nta2020 || '-' || as_of_date"

  - name: int_nta_census_metrics
    columns:
      - name: nta2020
        data_tests: [unique, not_null]

  - name: int_nta_acs_metrics
    columns:
      - name: nta2020
        data_tests: [unique, not_null]

  - name: int_nta_density_metrics
    columns:
      - name: nta2020
        data_tests: [unique, not_null]

  - name: int_cd_census_metrics
    columns:
      - name: borocd
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('int_cd_spine')
                field: borocd
      - name: population_2010_census
        data_tests: [not_null]
      - name: population_2020_census
        data_tests: [not_null]

  - name: int_cd_population_change_components
    columns:
      - name: borocd
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('int_cd_spine')
                field: borocd

  - name: int_cd_housing_metrics
    columns:
      - name: borocd
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('int_cd_spine')
                field: borocd

  - name: int_cd_ahft_features
    columns:
      - name: borocd
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('int_cd_spine')
                field: borocd
      - name: ahft_rank
        data_tests: [unique, not_null]

  - name: int_cd_growth_metrics
    columns:
      - name: borocd
        data_tests: [unique, not_null]

  - name: int_cd_unit_completion_metrics
    columns:
      - name: borocd
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('int_cd_spine')
                field: borocd

  - name: int_cd_fhgs_features
    columns:
      - name: borocd
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('int_cd_spine')
                field: borocd
      - name: annual_growth_rate_2016_2025_pct
        description: Null would mean a district in Appendix B that's missing from Figure 3.2.
        data_tests: [not_null]

  - name: int_cd_kpdb_projection_metrics
    columns:
      - name: borocd
        data_tests: [unique, not_null]
