version: 2

seeds:
  - name: config
    description: >
      Generic key/value config for values no source data carries - GR's export tools take
      these as operator input, so we do too, rather than hardcoding them into SQL or
      passing them as dbt --vars. One row per value; add new keys here instead of a new
      column or a new seed. Read with a scalar subquery against this seed (see
      int__ldf_header.sql/thined_dat.sql for the pattern) rather than dbt vars, so a build
      needs no extra --vars flag and a missing/wrong value is a normal row-level fact to
      fix, not a build invocation to remember.
    columns:
      - name: key
        description: "Unique config key, e.g. ldf_previous_version."
        tests:
        - not_null
        - unique
      - name: value
        description: >
          The value, always stored as text - callers cast as needed (e.g. ::date). Where a
          value's real meaning/update rule is unconfirmed (see the per-row description),
          it's copied verbatim from a known-good release rather than derived, and may need
          confirming or updating for a future release.
        tests:
        - not_null
      - name: description
        description: "What this key means, where it's used, and any known caveats."
  - name: known_differences
    description: >
      Every known difference between this pipeline's outputs and the previous production
      release, one row per stable ID. This is the source of truth: the export doc's "Known
      differences from the previous release" sections list its rows, and the qa__diffs_*
      models cite its IDs in their diff_group labels (tested by
      assert_known_difference_citations). A difference that no longer shows up in the
      qa__diffs_* models is removed; its bead keeps the history. An ID is never reused or
      renumbered. Retired IDs: CSCL-LION-06, -07, -08, -11, -12, -13, -18, -20;
      CSCL-RPL-01; CSCL-DISTRICTS-02, -03, -05; CSCL-LDF-02, -04; CSCL-SAF-01;
      CSCL-THINED-01, -02; CSCL-THINLION-01, -03; CSCL-THINFIRE-01. The analysis and
      evidence behind each row live in the bead named in reference.
    config:
      column_types:
        id: varchar
        alias: varchar
        output: varchar
        scope: varchar
        description: varchar
        cause: varchar
        decision: varchar
        gr_status: varchar
        gss_status: varchar
        gis_status: varchar
        reviewed_on: date
        review_ref: varchar
        first_seen: varchar
        last_verified: varchar
        status: varchar
        reference: varchar
    columns:
      - name: id
        description: >
          Stable ID, CSCL-<OUTPUT>-NN (e.g. CSCL-LION-04, CSCL-SAF-02). Cited verbatim at
          the start of a qa__diffs_* diff_group label ('CSCL-LION-16: topology left/right
          AP').
        tests:
          - not_null
          - unique
      - name: alias
        description: >
          Older names for the same issue, semicolon-separated: the "Bug NNN" numbers from
          the bug write-ups that preceded the IDs ("Bug 007 #2" for one item of a
          multi-item write-up). Blank when there were none.
      - name: output
        description: >
          The output(s) that differ, semicolon-separated, from: LION, LION gdb, RPL, SAF,
          District gdb, LDF, Normalizing tables, ThinED, ThinLION, ThinFire. Matches a
          model group's custom.known_differences in doc_config.yml.
        tests:
          - not_null
      - name: scope
        description: "Which rows or fields differ, briefly."
        tests:
          - not_null
      - name: description
        description: >
          What differs and why, in one or two plain sentences. Rendered in the export doc,
          so no model names.
        tests:
          - not_null
      - name: cause
        description: >
          prod_bug (prod is wrong, ours is right), source_vintage (the two sides were built
          from different source extracts), source_defect (bad source data both sides
          see), ours_intentional (we deliberately differ from prod), ours_bug_fixed (was
          ours, now fixed), ours_bug (ours, not yet fixed), gr_pending (waiting on GR to
          say which side is right), unknown.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [prod_bug, source_vintage, source_defect, ours_intentional, ours_bug_fixed, ours_bug, gr_pending, unknown]
      - name: decision
        description: "What we do about it (keep ours, match prod, deferred, ...). Blank when undecided."
      - name: gr_status
        description: >
          Where GR (Geographic Research) stands on this difference: not_reviewed,
          presented (shown to them, no answer yet), agreed, disputed, or n_a (the
          signoff_matrix doesn't require GR for any output this difference touches). An
          external sign-off, separate from `status`, which is our own call. Reset to
          not_reviewed for every row on 2026-10-28, when review with GR and GSS started
          fresh; earlier values are in git history.
        tests: &reviewer_status_tests
          - not_null
          - accepted_values:
              arguments:
                values: [not_reviewed, presented, agreed, disputed, n_a]
      - name: gss_status
        description: >
          Where GSS (GeoSupport Services) stands, with gr_status's values. n_a unless the
          difference touches a flat file.
        tests: *reviewer_status_tests
      - name: gis_status
        description: >
          Where DCP's GIS team stands, with gr_status's values. n_a unless the difference
          touches the District gdb.
        tests: *reviewer_status_tests
      - name: reviewed_on
        description: >
          Date of the last change to any reviewer status. Required once any status is
          past not_reviewed (assert_signoff_recorded).
      - name: review_ref
        description: >
          Where that change happened: the meeting date and who was there, a link to the
          email or issue, or a short note. Required with reviewed_on.
      - name: first_seen
        description: >
          Product version the difference was first recorded against. Blank where it
          predates this table and the version wasn't kept.
      - name: last_verified
        description: "Product version the row was last checked against."
        tests:
          - not_null
      - name: status
        description: >
          Our own decision, before any outside review: open (unexplained, or explained
          but undecided), accepted (understood and deliberately not changing), watch
          (resolved, can recur: check each release). Accepted doesn't mean approved: a
          row is approved only once every reviewer the signoff_matrix requires has
          agreed (gr_status, gss_status, gis_status).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [open, accepted, watch]
      - name: reference
        description: "Data-engineering tracker bead(s) holding the analysis and evidence, comma-separated."
  - name: log_messages
    description: >
      Every message prod's ETL logs, one row per distinct message, plus the checks only we
      log (CSCL-LOG-OURS-NN). Built from the audit of every logger call in prod's compiled
      ETL source (tracker bead inv-2cy.60). Each log.csv row carries one of these ids in
      log_message_id and starts its message with it ('[CSCL-LOG-LION-05] ...'); the
      assert_log_message_citations test keeps the log__* models and this seed in step, and
      qa__log_message_counts counts log rows per id. An id is never reused or renumbered.
    config:
      column_types:
        id: varchar
        prod_source: varchar
        level: varchar
        effect: varchar
        prod_message: varchar
        trigger: varchar
        status: varchar
        status_reason: varchar
        model: varchar
        chaos_mutations: varchar
    columns:
      - name: id
        description: >
          Stable id, CSCL-LOG-<OUTPUT>-NN after the audit's own ids (CSCL-LOG-SAF-25), or
          CSCL-LOG-OURS-NN for a check prod doesn't log. The CSCL-LOG- prefix keeps these
          apart from known_differences ids.
        tests:
          - not_null
          - unique
      - name: prod_source
        description: >
          Where prod logs it, file:line in prod's ETL source (call sites in parentheses).
          Blank on OURS rows.
      - name: level
        description: >
          Prod's log level. Prod's log threshold is WARN, so INFO and DEBUG rows never reach
          its log. Blank on OURS rows.
        tests:
          - accepted_values:
              arguments:
                values: [ERROR, WARN, INFO, DEBUG]
      - name: effect
        description: >
          What happens to the record: dropped (left out of the output), warned (written,
          possibly with a changed value; trigger says which), summary (an every-run count or
          progress line) or run_level (the run or a whole file fails). For an OURS row, the
          effect in our build.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [dropped, warned, summary, run_level]
      - name: prod_message
        description: >
          Prod's message template, verbatim from the source, with its format arguments
          named in braces ({oid}, {fc}). Blank on OURS rows.
      - name: trigger
        description: "When it fires, in plain words, and prod's effect on the record."
        tests:
          - not_null
      - name: status
        description: >
          implemented (a log__* model emits it), planned (a live check we don't log yet),
          wont_log (exception, run-level, config-only or debug noise), dead_in_prod (prod
          can't reach it) or below_threshold (prod logs it below WARN, so it never shows).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [implemented, planned, wont_log, dead_in_prod, below_threshold]
      - name: status_reason
        description: >
          Why the row has its status, and how ours differs from prod's on implemented rows.
      - name: model
        description: The log__* model that emits it. Implemented rows only.
      - name: chaos_mutations
        description: >
          The poc_validation/chaos_monkey.py mutations that should make this message fire,
          space-separated; blank when none does. Kept equal to the script's registry by
          tests/test_chaos_monkey.py.
  - name: signoff_matrix
    description: >
      Which outside reviewers have to sign off on each deliverable (lion_outputs'
      output_group), as agreed at the 2026-10-27 stakeholder meeting. GR (Geographic
      Research) is upstream, the source of the CSCL data; GSS (GeoSupport Services) is
      downstream, Geosupport consumes the flat files; GIS (DCP's GIS team) checks the Esri
      deliverables. Drives which reviewer statuses are required (not n_a) in
      known_differences and lion_outputs.
    columns:
      - name: output_group
        description: Matches lion_outputs.output_group. One row per group.
        tests:
          - not_null
          - unique
      - name: deliverable
        description: What the group ships, in words.
        tests:
          - not_null
      - name: known_difference_outputs
        description: >
          The known_differences `output` values that belong to this group,
          semicolon-separated. A difference whose outputs span groups (LION; LION gdb)
          needs the reviewers of each.
        tests:
          - not_null
      - name: requires_gr
        description: GR has to sign off.
        tests:
          - not_null
      - name: requires_gss
        description: GSS has to sign off.
        tests:
          - not_null
      - name: requires_gis
        description: DCP's GIS team has to sign off.
        tests:
          - not_null
  - name: lion_outputs
    description: "LION output file mappings by group, subgroup, and type"
    config:
      column_types:
        gr_signoff: varchar
        gss_signoff: varchar
        gis_signoff: varchar
        signoff_date: date
        signoff_ref: varchar
        order_rule: varchar
        prod_order: varchar
        spec_order: varchar
        order_differs_from_spec: varchar
    columns:
      - name: output_group
        description: >
          Which of the three physical deliverables this row belongs to:
          flat_files, lion_gdb, or district_gdb - matching the top-level split
          in GitHub issue #1816's CSCL ETL epic (LION gdb and District gdb are
          separate zips; everything else ships as flat/text files - see that
          issue's sub-issue tree for the derivation, and treat it as a lead,
          not fact). Coarser than file_group/subgroup, which distinguish
          categories *within* a deliverable (e.g. SAF vs SND, both flat_files).
          signoff_matrix says which reviewers each group needs.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('signoff_matrix')
                field: output_group
      - name: file_group
        description: "Primary grouping category"
      - name: subgroup
        description: "Secondary grouping category"
      - name: type
        description: "Type of output (e.g., file)"
      - name: filename
        description: "Name of the output file"
      - name: file_id
        description: "Unique identifier for the file"
      - name: has_db_qa
        description: >
          Whether a field-level dbt QA model exists for this file in
          models/etl_dev_qa (qa__diffs_<file_id>.sql or similar feeding
          qa__diffs_all_summary). False just means no model has been built yet
          for that file type - not a deliberate exclusion. Previously named
          skip_qa with the opposite polarity; renamed since the column was
          never actually read anywhere to skip/gate a build step - it's purely
          descriptive of QA coverage.
      - name: diffable
        description: >
          Whether this file has any prod counterpart worth comparing against at
          all. False for build logs and other artifacts (e.g. the previous LDF
          edition, kept only as an input) with nothing on the other side to diff
          against - see poc_validation/build_diffs_report.py.
      - name: key_columns
        description: >
          gdb layers only (type = 'layer'): the pipe-separated column name(s)
          that uniquely identify a row in that layer, used by
          poc_validation/compare_gdb.py for its row-level diff. Declared here
          deliberately rather than auto-detected at comparison time, so the
          comparison is agnostic to whatever happens to be unique in a given
          run's data - a column that's coincidentally unique today (e.g.
          SHAPE_Length) isn't a real identity and would silently produce a
          different key on a different run. Verified unique against a real
          build's data when declared; a few layers have a small, known,
          accepted number of exceptions (e.g. nysd's school district 10
          written once per borough it spans, nyzip's multi-part zip codes)
          rather than a column to add - see each gdb_<layer>.sql model for the
          specific reason. Exact duplicate rows are collapsed and counted
          separately by the comparison, so they don't need a key column to
          tell them apart. A NULL in some key columns is an ordinary value
          (it pairs with NULL); only an all-NULL key is unidentifiable. Empty
          for non-gdb rows.
      - name: description
        description: >
          District gdb layers only: what the layer represents and its CSCL
          source feature class, e.g. "Assembly Districts clipped to
          shoreline". Sourced from GitHub issue #1840's output table - a
          project-management issue, not verified project documentation, so
          treat as a lead rather than fact. Two gaps in that source were
          filled by inference rather than the issue itself: nycdta2020's
          description was blank there, and nypuma2020 wasn't listed at all
          (only nypuma2010) - both filled in by pattern from sibling rows.
          Empty for non-district-gdb rows.
      - name: status
        description: >
          Known investigation status of this output's dev/prod discrepancy.
          Free text, not an enum; add values as they come up. Known values as
          of this writing: blank (no known issue - most rows have never been
          individually investigated, this is not "verified clean"), "done"
          (verified matching prod, or as close as this pipeline is expected to
          get), "open" (investigated and understood, a real diff, no fix
          landed yet - see notes/status_summary for the mechanism), "blocked"
          (a real, understood diff with no path to fix on our side), "on hold"
          (a real, understood diff whose investigation was deliberately paused
          by explicit decision, not abandoned - distinct from "blocked",
          which has no known path forward at all), "GR Review" (flat files
          only - a diff has been raised with NYC Planning's GR team and is
          awaiting their input before we can proceed), "in progress" (actively
          being worked - see notes for what's queued/next), "Needs
          Investigation" (checked against a real build and either found
          nothing conclusive or found something genuinely confusing - a
          deliberate flag to come back to, not a placeholder for "never
          looked"), "n/a" (not comparable to prod at all - a build log or
          input-only artifact, see the diffable column), "skip" (a prod output
          we deliberately don't reproduce - recorded so it reads as a decision,
          not an oversight; see notes for why).
      - name: status_summary
        description: >
          One short, plain-English sentence on where this output stands right
          now, e.g. "Resolving water intersections" or "Inaccurate 26C ETL
          outputs" - written for someone skimming the build step summary who
          has no other context. This is what the step summary shows instead
          of `notes` (see build_diffs_report.py) - keep it to a sentence, not
          a paragraph, and put the actual explanation in `notes`/a linked doc
          instead of trying to fit it here. Blank when status is blank.
      - name: notes
        description: >
          Brief explanation backing up `status` - what's actually going on
          and why, so a reader doesn't have to re-derive it. Blank when
          status is blank. For anything substantial, cite its known-difference
          ID here rather than duplicating the write-up.
      - name: gr_signoff
        description: >
          GR's sign-off on this output file as a whole: pending, approved, rejected, or
          n_a (signoff_matrix doesn't require GR for this output_group). Separate from
          the per-difference reviewer statuses in known_differences: a file is ready for
          sign-off once its unexplained rows are gone and its known differences are
          agreed, but the file sign-off itself is recorded here.
        tests: &signoff_tests
          - not_null
          - accepted_values:
              arguments:
                values: [pending, approved, rejected, n_a]
      - name: gss_signoff
        description: GSS's sign-off, with gr_signoff's values.
        tests: *signoff_tests
      - name: gis_signoff
        description: DCP's GIS team's sign-off, with gr_signoff's values.
        tests: *signoff_tests
      - name: signoff_date
        description: >
          Date of the last change to any of this file's sign-offs. Required once any is
          approved or rejected (assert_signoff_recorded).
      - name: signoff_ref
        description: >
          Where the sign-off happened: meeting date and attendees, or a link. Required
          with signoff_date.
      - name: order_rule
        description: >
          The record order the file must have. `prod`: the previous production
          release's order, record for record (every flat file Geosupport reads: GSS's
          loader picks values by record position). `spec`: the ETL spec's order,
          where prod's is the legacy database's physical order and can't be
          reproduced. `own`: our own deterministic sort, where prod's order can't be
          reproduced and the spec gives none. `none`: no order to match (build
          logs and other files with no prod counterpart). `n_a`: not a flat file. The
          QA stage's file order check (poc_validation/file_order.py) reports every
          compared file's order against prod's, and diffs_report.csv flags a `prod`
          file that's out of it. assert_flatfile_order_documented checks the four
          order columns together.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [prod, spec, own, none, n_a]
      - name: prod_order
        description: >
          The order of the previous production release's file, as derived from the
          26c files (the investigation is inv-cze.1.3 in the team's tracker). Short,
          for the export doc's Record order section, which is generated from this and
          the next two columns. Blank unless order_rule is prod, spec or own.
      - name: spec_order
        description: >
          What the legacy ETL spec (docs/ETL_V8_02012024.md) says the order is, with
          the line it says it on ("L5752"), or "Not in the spec". Blank unless
          order_rule is prod, spec or own.
      - name: order_differs_from_spec
        description: >
          Whether prod_order departs from spec_order: true, false, spec_silent (the
          spec gives no order, so prod's is the only one), or n_a (order_rule isn't
          prod, spec or own).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["true", "false", spec_silent, n_a]
