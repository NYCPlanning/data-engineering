name: 🏷️ Label issues by product

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write
  contents: read

jobs:
  label:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            admin/ops

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install pyyaml

      - name: Apply product labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python admin/ops/product_labels.py label --issue ${{ github.event.issue.number }} --apply
