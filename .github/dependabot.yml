version: 2
updates:
  # Routine Python bumps come from the weekly "Upgrade uv.lock" workflow
  # (.github/workflows/python_compile_requirements.yml), which runs `uv lock --upgrade` and so
  # respects the constraints in each pyproject.toml. Dependabot's version updates rewrite those
  # constraints instead (e.g. bumping a deliberate `sqlalchemy<2.1` pin), so they're disabled
  # here: a limit of 0 turns off version updates but keeps security updates.
  # Security PRs can still touch a pyproject.toml; .github/workflows/dependabot_lock.yml re-runs
  # `uv lock` on them, since Dependabot's uv-workspace lock handling is unreliable.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
