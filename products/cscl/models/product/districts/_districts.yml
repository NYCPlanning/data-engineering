- name: gdb_nypp
  description: >-
    Police precincts: CSCL's NYPD precinct polygons clipped to land, since NYPD's lines don't
    follow atomic polygon edges. The zero-width spikes and the parts and holes under 100 sq ft
    that clipping leaves along the shoreline are removed (CSCL-DISTRICTS-01, CSCL-DISTRICTS-07).
  config:
    tags: [export_doc]
    meta:
      each_row_is_a: A police precinct
      is_geospatial: true
  columns:
  - name: Precinct
    description: Police precinct number.
    data_tests: [ not_null ]
  - name: geom
    description: Polygon geometry (MultiPolygon, EPSG:2263)
    data_tests: [ not_null ]
  - name: SHAPE_Length
    description: Boundary length in feet.
  - name: SHAPE_Area
    description: Area in square feet.

