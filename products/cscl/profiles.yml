dcp-de-postgres:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('BUILD_ENGINE_HOST') }}"
      user: "{{ env_var('BUILD_ENGINE_USER') }}"
      password: "{{ env_var('BUILD_ENGINE_PASSWORD') }}"
      port: "{{ env_var('BUILD_ENGINE_PORT') | as_number }}"
      dbname: "{{ env_var('BUILD_ENGINE_DB') }}"
      schema: "{{ env_var('BUILD_ENGINE_SCHEMA') }}"
      threads: 4
    # the DuckDB build (cut-over in progress): dbt --target duckdb
    duckdb: &duckdb
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', '') }}"
      schema: "{{ env_var('BUILD_ENGINE_SCHEMA') }}"
      # GEOS (spatial) allocates outside DuckDB's memory limit, so keep the limit well
      # under RAM; override with DUCKDB_MEMORY_LIMIT / DUCKDB_THREADS on bigger machines
      threads: "{{ env_var('DUCKDB_THREADS', '2') | as_number }}"
      settings:
        memory_limit: "{{ env_var('DUCKDB_MEMORY_LIMIT', '3GB') }}"
      extensions:
      - spatial
    # the same, plus Postgres attached as "db-cscl" so the QA layers can read
    # production_outputs: dbt --target duckdb_qa
    duckdb_qa:
      <<: *duckdb
      extensions:
      - spatial
      - postgres
      attach:
      - path: "{{ env_var('BUILD_ENGINE_SERVER', '') }}/db-cscl"
        type: postgres
        alias: '"db-cscl"'
        read_only: true
