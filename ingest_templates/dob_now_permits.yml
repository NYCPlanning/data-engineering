id: dob_now_permits

attributes:
  name: DOB NOW Permit Filings
  description: >-
    Custom export of DOB NOW permit filings that DOB delivers by FTP, with the fields DevDB
    needs to find each job's earliest permit. Versioned by the date DOB sent it, so archive
    with an explicit version.

ingestion:
  source:
    type: s3
    bucket: edm-private
    key: dob_now/dob_now_permits/DOB_Now_Permit_Filing_Data_for_DCP_{{ version }}.csv
  file_format:
    type: csv
    dtype: str
    sep: "\t"
    encoding: cp1252
  processing_steps:
  - name: clean_column_names
    args: { "replace": { " ": "_" }, "lower": True }
