name: 🧪 Tests - Helper

on:
  workflow_call:
    inputs:
      path_filter:
        type: string
        required: false
      image_tag:
        type: string
        required: false
        default: "latest"

jobs:
  ruff:
    name: Lint/check formatting of python files
    # Doesn't need any dcpy code or the GDAL-laden nycplanning/dev image - just ruff itself,
    # from the root pyproject.toml's `dev` dependency-group - so this runs on a bare runner
    # with a narrow `uv sync --only-group dev` instead of pulling a multi-GB container.
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
        python-version: "3.13"
    - run: uv sync --only-group dev
    - name: Lint python files
      run: uv run --no-sync ruff check .
    - name: Check format of python files
      run: uv run --no-sync ruff format . --check

  sqlfluff:
    name: Check formatting of sql files
    # Same reasoning as ruff above: sqlfluff + sqlfluff-templater-dbt + the dbt CLI (for the
    # green_fast_track dbt-templater step below) all come from the `dev` group - no dcpy code
    # or GDAL needed, so this runs on a bare runner instead of the nycplanning/dev image.
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
        python-version: "3.13"
    - run: uv sync --only-group dev

    - name: Setup build environment (envars only)
      run: |
        ./bash/build_env_setup.sh

    - name: Check sql files in products
      run: |
        # TODO: Gradually expand this to cover more products
        uv run --no-sync sqlfluff lint products/cbbr/sql
        uv run --no-sync sqlfluff lint products/cpdb/sql/
        uv run --no-sync sqlfluff lint products/cpdb/sql_templates/ --templater=jinja
        uv run --no-sync sqlfluff lint products/colp/sql
        uv run --no-sync sqlfluff lint products/developments/sql/*.sql
        uv run --no-sync sqlfluff lint products/developments/sql/qaqc
        uv run --no-sync sqlfluff lint products/developments/sql/unit_change_summary --templater=jinja
        uv run --no-sync sqlfluff lint products/facilities/facdb/sql/
        uv run --no-sync sqlfluff lint products/knownprojects/sql --templater=jinja
        uv run --no-sync sqlfluff lint products/pluto/pluto_build/sql/

    - name: Check green_fast_track dbt models (DuckDB dialect)
      # A full dbt project (ref()/source()/packages), so this needs --templater=dbt to
      # compile - which in turn needs a resolvable DUCKDB_PATH, same as a real build.
      # Dialect itself comes from products/green_fast_track/.sqlfluff (duckdb, not the
      # repo-wide postgres default) - no live data needed, just a valid file path.
      working-directory: products/green_fast_track
      env:
        BUILD_ENGINE_SCHEMA: sqlfluff_lint
      run: |
        export DUCKDB_PATH="$RUNNER_TEMP/gft_sqlfluff_lint.duckdb"
        uv run --no-sync dbt deps
        uv run --no-sync sqlfluff lint models --templater=dbt

  set_dbt_matrix:
    name: Setup dbt tests
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.set-dbt-matrix.outputs.matrix }}
      matrix_raw: ${{ steps.set-dbt-matrix.outputs.matrix_raw }}
    steps:
    # path_filter is JSON from paths-filter, or empty on pushes, where everything runs.
    - name: Confirm changes and set matrix for dbt
      id: set-dbt-matrix
      env:
        CHANGED: ${{ inputs.path_filter }}
      run: |
        # Not every products/*/dbt_project.yml is here; the rest aren't migrated far enough to test.
        # green_fast_track is duckdb-only now, so it can't run in this postgres-backed job.
        projects=$(jq -cn \
          --argjson all '["template","cdbg","ceqr","cpdb","cscl","pluto","zoningtaxlots"]' \
          --argjson changed "${CHANGED:-null}" \
          '$all | map(select($changed == null or IN($changed[])))')
        echo "dbt projects to test: $projects"
        echo "matrix_raw=$projects" >> $GITHUB_OUTPUT
        echo "matrix={\"project\":$projects}" >> $GITHUB_OUTPUT

  dbt:
    name: dbt tests
    needs: set_dbt_matrix
    if: needs.set_dbt_matrix.outputs.matrix_raw != '[]'
    runs-on: ubuntu-22.04
    container:
      image: nycplanning/dev:${{ inputs.image_tag }}
    defaults:
      run:
        shell: bash
        working-directory: products/${{ matrix.project }}
    env:
      BUILD_ENGINE_HOST: postgis
      BUILD_ENGINE_USER: postgres
      BUILD_ENGINE_PASSWORD: postgres
      BUILD_ENGINE_PORT: "5432"
      BUILD_ENGINE_DB: postgres
      BUILD_ENGINE_SCHEMA: ${{ matrix.project }}
      # sqlfluff env vars
      VERSION: "2024-05-01"
      VERSION_PREV: "2024-04-01"
    services:
      postgis:
        image: postgis/postgis:13-3.3-alpine
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5 --shm-size=2gb
        ports:
        - 5432:5432
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.set_dbt_matrix.outputs.matrix) }}
    steps:
    - uses: actions/checkout@v4
    - name: setup
      run: |
        git config --global --add safe.directory /__w/data-engineering/data-engineering
        dbt deps
        dbt build --select config.materialized:seed --indirect-selection=cautious --full-refresh
    - name: sqlfluff models
      run: sqlfluff lint models --templater=dbt
    - name: sqlfluff tests
      run: |
        if [ -d tests ]; then
          sqlfluff lint tests --templater=dbt
        fi
    - name: unit tests
      run: |
        dbt test --resource-type unit_test

  mypy:
    name: Check python types
    # mypy's own [[tool.mypy.overrides]] in pyproject.toml already sets
    # ignore_missing_imports=true for geopandas/osgeo/shapely/pyogrio/etc (no type stubs
    # available for them anyway), and [tool.mypy] mypy_path lists every python/*/ package
    # root directly, so mypy resolves our own dcpy.* modules from source without needing
    # them installed as packages. The only thing actually required is every *other*
    # third-party dependency (pandas, boto3, pydantic, the various *-stubs packages, etc)
    # - excluding just the raw `gdal` binding (needed only by dcpy-library, and only
    # buildable against a matching system libgdal) lets this run on a bare runner instead
    # of the GDAL-laden nycplanning/dev image. Verified locally: identical "Success: no
    # issues found" results with gdal excluded from the install.
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: Cache mypy incremental state
      uses: actions/cache@v6
      with:
        path: .mypy_cache
        # Keyed on uv.lock so a dependency/stub bump starts fresh instead of reusing
        # stale per-module fingerprints; github.sha makes every run save its own updated
        # copy. The restore-keys fallback lets a PR pick up the most recent matching
        # cache as a starting point - GitHub Actions caches built on the default branch
        # (main) are visible to every branch as a fallback - so mypy only re-checks
        # what actually changed instead of every file every time.
        key: mypy-${{ hashFiles('uv.lock') }}-${{ github.sha }}
        restore-keys: |
          mypy-${{ hashFiles('uv.lock') }}-
          mypy-
    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
        python-version: "3.13"
    - name: Install dependencies (everything except the gdal binding)
      run: |
        uv export --all-packages --extra products --no-hashes --no-editable \
          --no-emit-workspace --no-emit-package gdal -o /tmp/mypy_requirements.txt
        # Not --system: astral-sh/setup-uv's own managed interpreter refuses --system
        # installs ("externally managed"). Put .venv/bin on PATH instead, same pattern
        # bash/docker_container_setup.sh uses, so the plain `mypy` below resolves here.
        uv venv
        uv pip install -r /tmp/mypy_requirements.txt
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

    # Runs every mypy target (dcpy/test_integration, products/*, admin/ops, and each
    # python/*/ workspace package - the last group needs --namespace-packages
    # --explicit-package-bases, the others must NOT get those flags globally; see the
    # comments in the script for why) and reports every failure, not just the first.
    - name: Check python files
      run: ./bash/run_mypy.sh

  template-db:
    if: (inputs.path_filter == '') || contains(inputs.path_filter, 'template')
    uses: ./.github/workflows/template_test.yml
    with:
      image_tag: ${{ inputs.image_tag }}
      build_name: ${{ github.head_ref || github.ref_name }}
    secrets: inherit

  set_pytest_matrix:
    name: Setup Pytests
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.set-pytest-matrix.outputs.matrix }}
      matrix_raw: ${{ steps.set-pytest-matrix.outputs.matrix_raw }}
    steps:
    - uses: actions/checkout@v4

    - name: Confirm changes and set matrix for pytest
      id: set-pytest-matrix
      run: |
        echo "path filters with changed files: ${{ inputs.path_filter }}"
        if [[ -z "${{ inputs.path_filter }}" ]]; then
          echo "Path filters weren't checked, running all tests"
          matrix=$(cat .github/workflows/data/pytest.yml | yq -ro json | jq -rc)
        elif [[ "[]" = "${{ inputs.path_filter }}" ]]; then
          echo "No relevant files changed, not running any tests"
          matrix="[]"
        else
          filter=$(echo '${{ inputs.path_filter }}' | sed 's/[][]//g' | sed -r 's/([\w-]+)(,|$)/"\1"\2/g')
          matrix=$(cat .github/workflows/data/pytest.yml | yq -ro json | jq -cr "map(. | select(.name|IN(${filter})))")
        fi
        echo "matrix_raw=$matrix" >> $GITHUB_OUTPUT
        echo "matrix={\"include\":$(echo $matrix)}" >> $GITHUB_OUTPUT

  pytest_dcpy:
    name: Pytest - dcpy
    runs-on: ubuntu-22.04
    if: (inputs.path_filter == '') || contains(inputs.path_filter, 'dcpy')
    env:
      GHP_TOKEN: ${{ github.GITHUB_TOKEN }}
      RECIPES_BUCKET: edm-recipes
      BUILD_ENGINE_DB: ${{ matrix.db }}
      IMAGE_TAG: ${{ inputs.image_tag }}

    steps:
    - uses: actions/checkout@v4
    - name: Load Secrets
      uses: 1password/load-secrets-action@v1
      with:
        export-env: true
      env:
        AZURE_STORAGE_CONNECTION_STRING: "op://Data Engineering/azure_integration_test/AZURE_STORAGE_CONNECTION_STRING"
        OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        CODECOV_TOKEN: "op://Data Engineering/Codecov/CODECOV_TOKEN"
        AWS_S3_ENDPOINT: "op://Data Engineering/DO_keys/AWS_S3_ENDPOINT"
        AWS_SECRET_ACCESS_KEY: "op://Data Engineering/DO_keys/AWS_SECRET_ACCESS_KEY"
        AWS_ACCESS_KEY_ID: "op://Data Engineering/DO_keys/AWS_ACCESS_KEY_ID"
        BUILD_ENGINE_SERVER: "op://Data Engineering/EDM_DATA/server_url"
        BUILD_ENGINE_PASSWORD: "op://Data Engineering/EDM_DATA/password"
        RECIPE_ENGINE: "op://Data Engineering/EDM_DATA/defaultdb_url"

    - name: Start images
      run: |
        env > .env
        docker compose -f .devcontainer/docker-compose.yml up -d --wait de postgis sftp-server

    - name: Run Container Setup
      run: docker exec --user root de ./bash/docker_container_setup.sh

    # dcpy split into a uv workspace (python/*/test, see docker_container_setup.sh). Each
    # package here gets its own isolated sync (uv sync --package dcpy-X) before its tests
    # run - `uv sync --all-packages` (used elsewhere in this job for dcpy/test_integration,
    # which genuinely spans packages) would let a package's tests pass by accidentally
    # importing a sibling package that was never declared as a real dependency. Re-syncing
    # the same venv scoped to just one package actually prunes it (verified), so this
    # catches that class of bug for real.
    #
    # Coverage is scoped to just that package's own source (--cov=python/X, own
    # COVERAGE_FILE, own coverage-X.xml) rather than the whole dcpy.* namespace - measuring
    # broadly would blend "covered by this package's own tests" with "incidentally
    # executed by a downstream consumer's tests", which defeats the point of asking "how
    # well does dcpy-utils's own test suite cover dcpy-utils". Each package uploads to
    # Codecov under its own flag below, so per-package and overall numbers are both
    # meaningful. (Also: --cov=dcpy - the bare namespace package - silently measures zero
    # files and writes no xml at all now that dcpy/__init__.py is gone; coverage.py can't
    # resolve an implicit PEP 420 namespace package passed by import name. Scoping by
    # directory path sidesteps that entirely.)
    #
    # connectors and product-metadata have a real, currently-undeclared runtime dependency
    # on dcpy-lifecycle (dcpy/connectors/ingest_datastore.py,
    # dcpy/connectors/edm/open_data_nyc.py, dcpy/connectors/edm/publishing.py, and
    # dcpy/product_metadata/writers/oti_xlsx/xlsx_writer.py all import from
    # dcpy.lifecycle) - sync lifecycle alongside them too until that's cleaned up, or
    # their tests won't even collect. dcpy-utils/test_postgres.py has a similar undeclared
    # geopandas dependency
    # in dcpy.utils.postgres itself, but that one's excluded rather than worked around:
    # utils sits under nearly every other package, so declaring geopandas there would drag
    # GDAL back into every consumer, undermining the whole point of the split. Needs an
    # actual decision (lazy-import it? move the geospatial bits out of utils?), not a sync
    # flag - tracked separately.
    #
    # Every dcpy-* package's test dir is literally named "test" (with its own
    # __init__.py), so passing them all to one pytest invocation makes it try to
    # register two different conftest.py files under the same plugin name
    # ("test.conftest") and crash - has to be one invocation per package instead.
    - name: dcpy main pytests
      run: |
        for pkg in connectors data geospatial lifecycle product-metadata utils; do
          sync_extra=()
          test_extra=()
          if [[ "$pkg" == "connectors" || "$pkg" == "product-metadata" ]]; then
            sync_extra=(--package dcpy-lifecycle)
          fi
          if [[ "$pkg" == "utils" ]]; then
            test_extra=(--ignore=python/utils/test/test_postgres.py)
          fi
          docker exec --user root de \
            uv sync --package "dcpy-$pkg" "${sync_extra[@]}"
          docker exec --user root de bash -c \
            "COVERAGE_FILE=.coverage.$pkg uv run --no-sync python3 -m pytest python/$pkg/test ${test_extra[*]} -v --cov=python/$pkg --cov-report=xml:coverage-$pkg.xml --cov-config=pyproject.toml"
        done

    # separate because of issues w/ gdal and pyarrow
    # errors occur when writing/reading parquet files after importing gdal
    - name: dcpy library pytests
      run: |
        docker exec --user root de \
          uv sync --package dcpy-library
        docker exec --user root de bash -c \
          "COVERAGE_FILE=.coverage.library uv run --no-sync python3 -m pytest python/library/test -v --cov=python/library --cov-report=xml:coverage-library.xml --cov-config=pyproject.toml"

    # dcpy/test_integration spans multiple packages by design (it isn't owned by any one
    # dcpy-* package, see pyproject.toml's [project] comment) so it needs the full
    # workspace, not an isolated sync like the packages above.
    - name: dcpy integration pytests
      run: |
        docker exec --user root de \
          uv sync --all-packages
        docker exec --user root de bash -c \
          "COVERAGE_FILE=.coverage.integration uv run --no-sync python3 -m pytest dcpy/test_integration --ignore dcpy/test_integration/library -v --cov=python --cov-report=xml:coverage-integration.xml --cov-config=pyproject.toml"
      env:
        RECIPES_BUCKET: "test-recipes"

    # separate for the same gdal/pyarrow reason as the unit library suite above
    - name: dcpy integration library pytests
      run: |
        docker exec --user root de bash -c \
          "COVERAGE_FILE=.coverage.integration-library uv run --no-sync python3 -m pytest dcpy/test_integration/library -v --cov=python --cov-report=xml:coverage-integration-library.xml --cov-config=pyproject.toml"
      env:
        RECIPES_BUCKET: "test-recipes"

    # One flagged upload per package, rather than a single combined report, so Codecov
    # shows both per-package coverage (e.g. "how much of dcpy-utils do dcpy-utils's own
    # tests cover") and an overall total (which it aggregates across flags automatically).
    # (Steps can't use `strategy.matrix` - that's job-level only - hence nine explicit
    # copies instead of a loop.)
    - name: Upload connectors coverage to Codecov
      uses: codecov/codecov-action@v4
      env:
        CODECOV_TOKEN: ${{ env.CODECOV_TOKEN }}
      with:
        files: coverage-connectors.xml
        flags: dcpy-connectors
        verbose: true

    - name: Upload data coverage to Codecov
      uses: codecov/codecov-action@v4
      env:
        CODECOV_TOKEN: ${{ env.CODECOV_TOKEN }}
      with:
        files: coverage-data.xml
        flags: dcpy-data
        verbose: true

    - name: Upload geospatial coverage to Codecov
      uses: codecov/codecov-action@v4
      env:
        CODECOV_TOKEN: ${{ env.CODECOV_TOKEN }}
      with:
        files: coverage-geospatial.xml
        flags: dcpy-geospatial
        verbose: true

    - name: Upload lifecycle coverage to Codecov
      uses: codecov/codecov-action@v4
      env:
        CODECOV_TOKEN: ${{ env.CODECOV_TOKEN }}
      with:
        files: coverage-lifecycle.xml
        flags: dcpy-lifecycle
        verbose: true

    - name: Upload product-metadata coverage to Codecov
      uses: codecov/codecov-action@v4
      env:
        CODECOV_TOKEN: ${{ env.CODECOV_TOKEN }}
      with:
        files: coverage-product-metadata.xml
        flags: dcpy-product-metadata
        verbose: true

    - name: Upload utils coverage to Codecov
      uses: codecov/codecov-action@v4
      env:
        CODECOV_TOKEN: ${{ env.CODECOV_TOKEN }}
      with:
        files: coverage-utils.xml
        flags: dcpy-utils
        verbose: true

    - name: Upload library coverage to Codecov
      uses: codecov/codecov-action@v4
      env:
        CODECOV_TOKEN: ${{ env.CODECOV_TOKEN }}
      with:
        files: coverage-library.xml
        flags: dcpy-library
        verbose: true

    - name: Upload integration coverage to Codecov
      uses: codecov/codecov-action@v4
      env:
        CODECOV_TOKEN: ${{ env.CODECOV_TOKEN }}
      with:
        files: coverage-integration.xml
        flags: dcpy-integration
        verbose: true

    - name: Upload integration-library coverage to Codecov
      uses: codecov/codecov-action@v4
      env:
        CODECOV_TOKEN: ${{ env.CODECOV_TOKEN }}
      with:
        files: coverage-integration-library.xml
        flags: dcpy-integration-library
        verbose: true

  pytest_other:
    name: Pytest - ${{ matrix.name }}
    needs: set_pytest_matrix
    runs-on: ubuntu-22.04
    if: needs.set_pytest_matrix.outputs.matrix_raw != '[]'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.set_pytest_matrix.outputs.matrix) }}
    container: nycplanning/dev:${{ inputs.image_tag }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.working-directory || '.' }}
    env:
      GHP_TOKEN: ${{ github.GITHUB_TOKEN }}
      RECIPES_BUCKET: edm-recipes
      BUILD_ENGINE_DB: ${{ matrix.db }}
    steps:
    - uses: actions/checkout@v4
    - name: Load Secrets
      uses: 1password/load-secrets-action@v1
      with:
        export-env: true
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        AWS_S3_ENDPOINT: "op://Data Engineering/DO_keys/AWS_S3_ENDPOINT"
        AWS_SECRET_ACCESS_KEY: "op://Data Engineering/DO_keys/AWS_SECRET_ACCESS_KEY"
        AWS_ACCESS_KEY_ID: "op://Data Engineering/DO_keys/AWS_ACCESS_KEY_ID"
        BUILD_ENGINE_SERVER: "op://Data Engineering/EDM_DATA/server_url"
        BUILD_ENGINE_PASSWORD: "op://Data Engineering/EDM_DATA/password"
        RECIPE_ENGINE: "op://Data Engineering/EDM_DATA/defaultdb_url"
    - name: Run Container Setup
      working-directory: ./
      run: ./bash/docker_container_setup.sh

    - name: Pytest
      env:
        calls: ${{ toJSON(matrix.calls) }}
      run: |
        echo "$calls" | jq -cr ".[]" | while read call; do
          IFS=$'\n' arr=( $(xargs -n1 <<<"$call") )
          python3 -m pytest ${arr[@]}
        done

  validate_product_metadata:
    if: contains(inputs.path_filter, 'dcpy')
    name: Validate Product Metadata
    # This used to be invoked via `dcpy lifecycle scripts product_metadata validate_repo`,
    # which needed dcpy-lifecycle's full GDAL/geopandas closure installed just to build the
    # CLI tree (dcpy.lifecycle._cli eagerly imports every stage, including the one that
    # imports geopandas), even though the actual validation logic never touches any of that.
    # The command now lives in dcpy-product-metadata itself (explicitly "no GDAL"), as its
    # own console script - so this runs on a bare runner with nothing but that one package.
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
        python-version: "3.13"
    - run: uv sync --package dcpy-product-metadata
    - name: Validate All Metadata Files
      # Typer collapses a single-command app to a bare invocation (no "validate_repo" name).
      run: uv run --no-sync product-metadata product-metadata

  validate_ingest_definitions:
    name: Validate Ingest Definition
    # Same reasoning as validate_product_metadata above: `dcpy lifecycle ingest ...` still
    # eagerly imports the whole lifecycle stage tree via dcpy.lifecycle._cli, so this needs
    # dcpy-lifecycle's full closure - build-geosupport already has it baked in.
    runs-on: ubuntu-22.04
    container:
      image: nycplanning/build-geosupport:${{ inputs.image_tag }}
    steps:
    - uses: actions/checkout@v4
    - name: Install dcpy-lifecycle
      run: ./bash/docker_container_setup.sh --package dcpy-lifecycle
    - name: Validate All Templates
      run: uv run --no-sync python -m dcpy lifecycle ingest validate_definitions ingest_templates
