[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

# The base install is the server; dagster_broker.client and dagster_broker.worker are stdlib.
[project]
name = "dcpy-app-dagster-broker"
version = "0.0.1"
description = "DCP Data Engineering - dagster-broker queue API (Valkey lease queue for workers)"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "pydantic",
    "redis>=5",  # redis-py; speaks RESP to Valkey
    "uvicorn",
]

[project.optional-dependencies]
# the worker (promotion) and pipes_worker (inside the step)
worker = ["boto3", "dagster-pipes"]
# pipes_dagster, the Dagster-side Pipes client
dagster = ["dagster", "dagster-pipes"]

[dependency-groups]
dev = [
    "httpx",  # fastapi.testclient
    "pytest",
]

[tool.setuptools.packages.find]
include = ["dagster_broker*"]

[tool.setuptools.package-data]
dagster_broker = ["lua/*.lua"]
