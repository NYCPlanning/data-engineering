version: 2

models:
- name: lift_supplemented
  description: >
    Supplemented version of lift_csv with the displacement_risk_formula,
    cpspenttotal, and cpprojects placeholder columns populated, plus new columns:
    boroct2020/nta2020/ntaname (census tract & NTA a bbl resolves to), and
    cp_project_ids/cp_project_descriptions (comma/pipe-delimited lists of
    intersecting CPDB project ids and descriptions; both kept as JSON arrays
    in int__lift_cpdb).
  columns:
  - name: bbl
    tests:
    - not_null
    - unique
