models:
  - name: int_cd_spine
    description: Community districts from dcp_cdboundaries, with their CDTA and names from dcp_cdta2020.
    columns:
      - name: borocd
        data_tests: [unique, not_null]
      - name: cdta2020
        description: Null would mean a district with no CDTA, which would drop it from the ACS metrics.
        data_tests: [unique, not_null]
      - name: cdta_name
        data_tests: [unique, not_null]

  - name: int_cd_census_metrics
    columns:
      - name: borocd
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('int_cd_spine')
                field: borocd
      - name: population_2010_census
        data_tests: [not_null]
      - name: population_2020_census
        data_tests: [not_null]

  - name: int_cd_population_change_components
    columns:
      - name: borocd
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('int_cd_spine')
                field: borocd

  - name: int_cd_housing_metrics
    columns:
      - name: borocd
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('int_cd_spine')
                field: borocd

  - name: int_cd_ahft_features
    columns:
      - name: borocd
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('int_cd_spine')
                field: borocd
      - name: ahft_rank
        data_tests: [unique, not_null]

  - name: int_cd_growth_metrics
    columns:
      - name: borocd
        data_tests: [unique, not_null]

  - name: int_cd_unit_completion_metrics
    columns:
      - name: borocd
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('int_cd_spine')
                field: borocd

  - name: int_cd_fhgs_features
    columns:
      - name: borocd
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('int_cd_spine')
                field: borocd
      - name: annual_growth_rate_2016_2025_pct
        description: Null would mean a district in Appendix B that's missing from Figure 3.2.
        data_tests: [not_null]

  - name: int_cd_kpdb_projection_metrics
    columns:
      - name: borocd
        data_tests: [unique, not_null]
