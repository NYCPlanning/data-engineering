models:
  - name: int_cd_spine
    description: Community districts from dcp_cdboundaries, with their CDTA and names from dcp_cdta2020.
    columns:
      - name: borocd
        data_tests: [unique, not_null]
      - name: cdta2020
        description: Null would mean a district with no CDTA, which would drop it from the ACS metrics.
        data_tests: [unique, not_null]
      - name: cdta_name
        data_tests: [unique, not_null]

  - name: int_nta_type_features
    columns:
      - name: nta2020
        data_tests: [unique, not_null]
