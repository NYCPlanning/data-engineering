name: CSCL - 🏗️ Build
# DuckDB cut-over POC (branch ar-cscl-duckdb-build): builds CSCL on DuckDB from
# recipe_duckdb.yml, whatever recipe build.yml passes, to check that the build runs on a
# GHA runner. Plan, load, build (the recipe's stage_config commands), export (parquet-first)
# and package the FGDBs. No upload or prod validation.
on:
  workflow_call:
    inputs:
      image_tag:
        type: string
        required: false
      build_name:
        type: string
        required: true
      recipe_file:
        type: string
        required: true
      plan_command:
        type: string
        default: recipe
      dev_bucket:
        type: string
        required: false

jobs:
  build:
    name: Build CSCL (DuckDB)
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
        working-directory: products/cscl
    container:
      # build-base doesn't have the dbt-duckdb adapter installed; dev does
      image: nycplanning/dev:${{ inputs.image_tag || 'latest' }}
    env:
      BUILD_NAME: ${{ inputs.build_name }}
      RECIPES_BUCKET: ${{ inputs.dev_bucket || 'edm-recipes' }}
      PUBLISHING_BUCKET: ${{ inputs.dev_bucket || 'edm-publishing' }}
      DEV_FLAG: ${{ inputs.dev_bucket && 'true' || 'false' }}
      # GEOS allocates outside DuckDB's memory limit, so stay well under the runner's RAM
      DUCKDB_MEMORY_LIMIT: 3GB
      DUCKDB_THREADS: 2
      LOCK_FILE: recipe_duckdb.lock.yml
    steps:
    - uses: actions/checkout@v7

    - name: Install dcpy workspace
      run: uv sync --all-packages
    - name: Load Secrets
      uses: 1password/load-secrets-action@v5
      with:
        export-env: true
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        AWS_S3_ENDPOINT: "op://Data Engineering/DO_keys/AWS_S3_ENDPOINT"
        AWS_SECRET_ACCESS_KEY: "op://Data Engineering/DO_keys/AWS_SECRET_ACCESS_KEY"
        AWS_ACCESS_KEY_ID: "op://Data Engineering/DO_keys/AWS_ACCESS_KEY_ID"

    - name: Setup build environment
      working-directory: ./
      run: |
        ./bash/docker_container_setup.sh
        ./bash/build_env_setup.sh

    - name: Runner resources
      run: |
        nproc
        free -h
        df -h .

    - name: Plan build
      run: uv run python3 -m dcpy lifecycle builds plan recipe --recipe-path ./recipe_duckdb.yml --output-path $LOCK_FILE

    - name: Dataloading
      run: |
        start=$(date +%s)
        uv run python3 -m dcpy lifecycle builds load load --recipe-path $LOCK_FILE
        echo "load: $(( $(date +%s) - start ))s" >> timings.txt

    - name: Build
      # the recipe's stage_config.builds.build.commands: dbt deps, seed, run, test
      run: |
        start=$(date +%s)
        uv run python3 -m dcpy lifecycle builds build run --recipe-path $LOCK_FILE
        echo "build (seed + run + test): $(( $(date +%s) - start ))s" >> timings.txt

    - name: Export
      # parquet-first: dat/csv files, plus one GeoParquet per FGDB layer
      run: |
        start=$(date +%s)
        uv run python3 -m dcpy lifecycle builds export export --recipe-path $LOCK_FILE
        echo "export: $(( $(date +%s) - start ))s" >> timings.txt

    - name: Package
      # fold the parquet layers into the FGDBs, then zip the outputs
      run: |
        start=$(date +%s)
        uv run python3 -m dcpy lifecycle builds export package --recipe-path $LOCK_FILE
        echo "package: $(( $(date +%s) - start ))s" >> timings.txt

    - name: Summary
      if: always()
      run: |
        {
          echo "### CSCL DuckDB build"
          echo '```'
          cat timings.txt 2>/dev/null
          BUILD_DIR=$(uv run python3 -m dcpy lifecycle builds build path --recipe-path $LOCK_FILE)
          (cd "$BUILD_DIR" && find dataset_files -type f | sort | head -60 && du -sh dataset_files raw_exports)
          free -h
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload dbt logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cscl-duckdb-dbt-logs
        path: |
          products/cscl/logs/
          products/cscl/target/run_results.json
        if-no-files-found: ignore
