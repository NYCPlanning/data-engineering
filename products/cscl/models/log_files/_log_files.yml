version: 2

models:
- name: log
  description: >-
    The build log, exported as log.csv: one row per record a LION, LION gdb, SAF, Face,
    SND, Enders, Exception, RPL or Special SEDAT check flagged (error, warning, or info
    for prod's INFO-level SAF-11), one row per ThinLION lookup that found nothing, one
    row per borough and name table counting the rows left out of its Face file (the
    records are in log_face_code_missing.csv), one row per name for records whose name
    is in the other name table than the one prod looks in (the records are in
    log_name_table_warnings.csv), plus one summary row per exported flat file with its
    record count.
    Each row comes from one log__* model, named in _dbt_source_relation, and carries the
    id of its message in the log_messages seed (see seeds.yml). The models emit the id
    and the message body; this model takes effect from the seed and prefixes the message
    with the id.
  columns:
  - name: _dbt_source_relation
    description: The log__* model the row came from.
  - name: log_level
    description: "`error`, `warning`, or `info` (file summary rows, CSCL-LOG-SAF-11)."
  - name: log_message_id
    description: >-
      The row's message in the log_messages seed: prod's message (CSCL-LOG-LION-05) or
      one only we log (CSCL-LOG-OURS-NN).
    tests:
    - not_null
    - relationships:
        arguments:
          to: ref('log_messages')
          field: id
  - name: effect
    description: >-
      What happens to the record, from log_messages: `dropped`, `warned`, `summary` or
      `run_level`.
    tests:
    - not_null
    - accepted_values:
        arguments:
          values: [dropped, warned, summary, run_level]
  - name: error_category
    description: >-
      The check that produced the row, e.g. `borough mismatch`, or `output file
      summary` for a file summary row.
  - name: globalid
    description: >-
      GlobalID of the flagged source feature. Blank on file summary and ThinLION lookup
      rows.
  - name: source_feature_layer
    description: >-
      Source layer of the flagged feature (centerline, altsegmentdata, commonplace,
      ...); atomicpolygons on ThinLION lookup rows. Blank on file summary rows.
  - name: record_id_type
    description: >-
      What record_id holds: `segmentid`, `placeid` for SAF CommonPlace rows,
      `addresspointid` for SAF S points, `streetnameid` / `featurenameid` for StreetName
      / FeatureName rows, `roadbed_segmentid` for RPL rows, `lionkey` for LION gdb SAF
      replicants. Blank on file summary and ThinLION lookup rows.
  - name: record_id
    description: The flagged record's id, per record_id_type. Blank on file summary rows.
  - name: message
    description: >-
      "[<log_message_id>] " then prod's wording for that message, filled with our values.
      Prod prints OIDs, which we don't carry, so where prod says OID we print the
      GlobalID (PlaceID on SAF CommonPlace rows). OURS rows have wording of their own.
  - name: output_filename
    description: Exported file name. File summary rows only.
  - name: record_count
    description: >-
      Number of records written to output_filename on file summary rows; the number of
      atomic polygons the lookup left blank on ThinLION lookup rows; the number of
      StreetName rows left out of output_filename on CSCL-LOG-FC-01 rows; the number of
      records with that name on name-table warning rows (log__name_table_warnings).

- name: log__export_file_summary
  description: >-
    One row per exported flat file (log.csv excluded) with its record count, like
    prod's "Total <file> output records: N" report lines. Files prod writes such a line
    for carry that line's id (CSCL-LOG-SAF-01 for Intersection.txt); the rest share
    CSCL-LOG-OURS-05.

- name: log__lion_centerline_boro_mismatch
  description: >-
    LION rows whose borough differs from their source feature's own borough (the
    centerline's boroughcode, or the proto segment's borough). A blank source borough is
    derived downstream, as in prod, and isn't flagged. Such a record lands in another
    borough's LION file than its feature: the check prod's CSCL-LOG-LION-20 means, which
    prod never reaches.

- name: log__saf_invalid_b7sc
  description: >-
    G/N/X CommonPlaces with a B7SC shorter than 8 characters (blank included), which SAF
    leaves out. Prod's "[DATA ERROR] The B7SC value of '' is not valid" check
    (CSCL-LOG-SAF-22).

- name: log__saf_name_missing
  description: >-
    SAF records with no principal name in the FeatureName or StreetName table, prod's
    "[NAME MISSING]" check: G/N/X CommonPlaces by B7SC, which SAF leaves out
    (CSCL-LOG-SAF-23), and A/B/E/P AltSegmentData rows by B5SC + LGC1 (CSCL-LOG-SAF-20),
    which prod and int__saf_abcep leave out.

- name: log__saf_segment_not_found
  description: >-
    SAF records SAF leaves out because their SEGMENTID matches no segment: A/B/C/E/P
    AltSegmentData rows with no Centerline (CSCL-LOG-SAF-21), G/N/X CommonPlaces with no
    Centerline, Shoreline, Rail or Subway feature (CSCL-LOG-SAF-25), S and V address
    points (CSCL-LOG-SAF-12, -16) and D/F and O AltSegmentData rows (CSCL-LOG-SAF-15,
    -18) with no Centerline.

- name: log__thinlion_lookup_not_found
  description: >-
    ThinLION's CensusTract2020, CensusTract2010 and HealthArea lookups that find nothing,
    one row per distinct lookup with the number of atomic polygons it leaves blank in
    record_count. Prod logs the same message ("Could not find a <feature class> feature
    using query '<query>'.", CSCL-LOG-THIN-01..03) once per atomic polygon.

- name: log__lion_segments_missing_nypd
  description: >-
    LION segments with no NYPD beat on either side. Logged as CSCL-LOG-OURS-03: prod has
    a message for this (CSCL-LOG-LION-06) but never calls the check.

- name: log__lion_centerline_curve
  description: >-
    Curved (CURVE L or R) centerlines whose center of curvature can't be used: one so far
    off it won't fit the field ("[INVALID ANGLE & RADIUS FOUND]", CSCL-LOG-LION-07), or
    none at all because the start, middle and end points are collinear ("[NO CENTER POINT
    FOUND]", CSCL-LOG-LION-08). Both fall back to the segment midpoint, as in prod.

- name: log__lion_level_codes
  description: >-
    Centerline, rail and subway FROM_/TO_LEVEL_CODE values that make no LION level code,
    one row per feature and field: blank ("[EMPTY LEVEL CODE]", CSCL-LOG-LION-10) or a
    number other than 1-26 or 99 ("[NO MATCHING LEVEL CODE]", CSCL-LOG-LION-12). The
    level code is left blank.

- name: log__face_code_missing
  description: >-
    Principal StreetName (CSCL-LOG-FC-01) and FeatureName (CSCL-LOG-FC-03) rows with a
    blank FACECODE, which the Face files leave out: one row per borough and table with
    the count in record_count, since there are thousands; the records are in
    log_face_code_missing.csv. A row whose B7SC is a segment's preferred LGC is logged on
    its own as CSCL-LOG-FC-02 (StreetName) or CSCL-LOG-FC-04 (FeatureName).

- name: log_face_code_missing
  description: >-
    Attachment to log.csv, exported as log_face_code_missing.csv: every principal
    StreetName (CSCL-LOG-FC-01) or FeatureName (CSCL-LOG-FC-03) row with a blank
    FACECODE, one row each in prod's wording, with log.csv's columns plus the borough,
    B10SC, B7SC and lookup key.

- name: log__single_arc_curve_flag
  description: >-
    CSCL-LOG-OURS-07, every build: one row with the number of LION records that aren't
    centerlines and are one circular arc end to end, so prod's curve flag (blank) and the
    fixed one (I) differ, i.e. what the var fix_single_arc_curve_flag changes
    (CSCL-LION-03), and whether it is on in this build.

- name: log__nonstreet_proto_zip
  description: >-
    CSCL-LOG-OURS-09, every build: one row with the number of LION proto-segment records of
    a shoreline or non-street feature, off the borough boundary, that have a zip prod leaves
    blank, i.e. what the var fix_nonstreet_proto_zip changes (CSCL-LION-02), and whether it
    is on in this build.

- name: log__f_segment_house_numbers
  description: >-
    CSCL-LOG-OURS-10, every build: one row with the number of LION gdb records of a
    SegmentTyp F segment (its own records and its SAF replicants) that have house numbers,
    which the legacy tool's rule zeroes and prod's LION gdb keeps, i.e. what the var
    zero_f_segment_house_numbers changes (CSCL-LION-24), and whether it is on in this build.

- name: log__ldf_journal_delete_scope
  description: >-
    CSCL-LOG-OURS-11, every build: one row with the number of LDF G and P records whose
    generic or physical ID is deleted in the journal but not on their node pair, which
    prod drops and the fix keeps, i.e. what the var fix_ldf_journal_delete_scope changes
    (CSCL-LDF-01), and whether it is on in this build.

- name: log__reversed_proto_pairs
  description: >-
    CSCL-LOG-OURS-12, every build: one row with the number of LION records of a
    centerline's proto-segments that follow an odd number of reversed proto-segments of the
    same centerline, so prod writes their nodes, XY and left/right fields the other way
    round, i.e. what the var fix_reversed_proto_pairs changes (CSCL-LION-01), and whether
    it is on in this build.

- name: log__ramp_proto_special_address
  description: >-
    CSCL-LOG-OURS-13, every build: one row with the number of LION records of a ramp
    (ALT_SEGDATA_TYPE R) proto-segment that prod gives a special address flag, i.e. what
    the var fix_ramp_proto_special_address changes (CSCL-LION-19), and whether it is on in
    this build.

- name: log__featurename_face_code_protos
  description: >-
    CSCL-LOG-OURS-14, every build: one row with the number of centerline proto-segments
    whose face code is only in FeatureName, which prod drops, i.e. what the var
    fix_featurename_face_code_protos changes (CSCL-LION-22), and whether it is on in this
    build.

- name: log__nta_county_fips
  description: >-
    CSCL-LOG-OURS-16, every build: one row with the number of nynta2010 NTAs whose
    NeighborhoodPUMACodes FIPS code is blank or missing, or isn't their borough's, so
    prod's CountyFIPS and the borough's differ, i.e. what the var
    fill_nta_county_fips_from_borough changes (CSCL-DISTRICTS-09), the NTA codes, and
    whether it is on in this build.

- name: log__district_invalid_polygons
  description: >-
    CSCL-LOG-OURS-20, every build: one row with the number of nybid, nyhez and nycdwi
    features whose source polygon is invalid, which prod publishes as stored, i.e. what the
    var make_valid_district_polygons changes (CSCL-DISTRICTS-04), the features, and whether
    it is on in this build.

- name: log__tract_source_keys
  description: >-
    CSCL-LOG-OURS-21, every build: one row with the number of 2010 census tracts whose
    source BOROCT or NEIGHBORHOOD_CODE isn't their borough and tract's, which prod's
    nyct2010 and nyct2010wi copy, i.e. what the var key_tracts_by_borough changes
    (CSCL-DISTRICTS-10), the tracts, and whether it is on in this build.

- name: log__generic_house_numbers
  description: >-
    CSCL-LOG-OURS-15, every build: one row with the number of LION gdb records of a
    generic segment (SegmentTyp G; its own records and its SAF replicants) that have house
    numbers, which the spec and the legacy tool's rule zero and prod's LION gdb keeps, i.e.
    what the var zero_generic_house_numbers changes (CSCL-LION-15), and whether it is on in
    this build.

- name: log__feature_type_house_numbers
  description: >-
    CSCL-LOG-OURS-25, every build: one row with the number of LION gdb records of a segment
    of FeatureTyp other than 0, 6 or W (its own records and its SAF replicants, of any
    SegmentTyp) that have house numbers, which the legacy tool's rule zeroes and prod's LION
    gdb keeps, i.e. what the var zero_feature_type_house_numbers changes (CSCL-LION-29), and
    whether it is on in this build. A G or F segment of such a FeatureTyp is counted here,
    not under CSCL-LOG-OURS-15 or CSCL-LOG-OURS-10.

- name: log__reversed_proto_census_fields
  description: >-
    CSCL-LOG-OURS-17, every build: one row with the number of LION gdb records of a
    centerline's proto-segments (their own records and their SAF replicants) whose census
    tract, block or community district fields prod's gdb writes from the other side, i.e.
    what the var fix_reversed_proto_census_fields changes (CSCL-LION-26), and whether it is
    on in this build.

- name: log__hyphen_r_high_house_number
  description: >-
    CSCL-LOG-OURS-18, every build: one row with the number of LION gdb S and V replicants
    of HYPHEN_TYPE R address points that prod's gdb writes without a high house number,
    i.e. what the var fix_hyphen_r_high_house_number changes (CSCL-LION-25), and whether it
    is on in this build.

- name: log__blank_type_altsegmentdata
  description: >-
    CSCL-LOG-OURS-19, every build: one row with the number of AltSegmentData rows that have
    a SAF type and a blank ALT_SEGDATA_TYPE, and their segments, which prod writes as SAF
    records and spec Table 13 leaves out, i.e. what the var fix_blank_type_altsegmentdata
    changes (CSCL-SAF-03), and whether it is on in this build.

- name: log__gdb_seqnum_sessions
  description: >-
    CSCL-LOG-OURS-22, every build: one row giving the extract sessions the LION gdb and the
    LION .dat files number non-street features' sequence numbers in (vars
    lion_gdb_seqnum_extract_sessions and lion_seqnum_extract_sessions, CSCL-LION-05), with
    the number of LION gdb records (its own records and its SAF replicants) whose SeqNum
    differs from the .dat files' numbering.

- name: log__coincident_seg_count
  description: >-
    CSCL-LOG-OURS-23, every build: one row with the number of LION .dat records of a
    centerline whose coincident segment count (L57) differs between prod's rule and ours
    (CSCL-LION-14), how many of them prod's rule writes 0, i.e. what the var
    fix_coincident_seg_count changes, and whether it is on in this build.

- name: log__lion_join_id_padding
  description: >-
    CSCL-LOG-OURS-24, every build: one row with the number of LION gdb lion layer rows with a
    non-SAF Join_ID, whose two trailing spaces (ETL spec 2.7.3) prod's lion layer strips,
    i.e. what the var pad_lion_join_id changes (CSCL-LION-10), and whether it is on in this
    build. The altnames layer keeps the padding either way.

- name: log__rpl_roadbed_order
  description: >-
    CSCL-LOG-OURS-26, every build: one row with the number of RPL.txt generics whose
    roadbeds come out in a different order by prod's rule (each roadbed on the side its
    midpoint lies on, sorted by distance) than by the spec's (by ROADBED_POSITION_CODE),
    i.e. what the var fix_rpl_roadbed_order changes (CSCL-RPL-02), and whether it is on in
    this build.

- name: log__boe_lgc_pointer
  description: >-
    CSCL-LOG-OURS-06, every build: one row with the number of LION records whose BOE LGC
    pointer differs between prod's rule (1 when the BOE-preferred LGC is above 9) and the
    fixed one (that LGC's position), i.e. what the var fix_boe_lgc_pointer changes
    (CSCL-LION-04), and whether it is on in this build. The records are in
    log_boe_lgc_pointer.csv.

- name: log_boe_lgc_pointer
  description: >-
    Attachment to log.csv, exported as log_boe_lgc_pointer.csv: one row per LION record
    (LION .dat or LION gdb centerline) the BOE LGC pointer fix changes (CSCL-LOG-OURS-06),
    with its BOE-preferred LGC, prod's pointer, the fixed pointer and the one this build
    writes.

- name: log__lion_lr_topology
  description: >-
    CSCL-LOG-OURS-08, every build: one row with the number of LION records (and segments)
    whose left or right AtomicPolygon differs between the AP topology and prod's 2 ft
    offset probe, i.e. what the var fix_lion_lr_from_topology changes (CSCL-LION-16), and
    whether it is on in this build. The records are in log_lion_lr_topology.csv.

- name: log_lion_lr_topology
  description: >-
    Attachment to log.csv, exported as log_lion_lr_topology.csv: one row per LION record
    (LION .dat or LION gdb) whose segment's side AtomicPolygons differ between the AP
    topology and prod's 2 ft probe (CSCL-LOG-OURS-08), with both pairs, the topology's
    method and the pair this build writes.

- name: log_records
  description: >-
    Every logged record: log.csv's rows, with the per-borough CSCL-LOG-FC-01 and -03
    counts swapped for the records in log_face_code_missing, and the per-name name-table
    warning counts for the records in log_name_table_warnings (and the CSCL-LOG-OURS-06
    count for those in log_boe_lgc_pointer, the CSCL-LOG-OURS-08 count for those in
    log_lion_lr_topology). What the chaos QA models
    (qa__chaos_injections, qa__chaos_summary) check.

- name: log__street_name_blank_lookup_key
  description: >-
    StreetName and FeatureName rows with a blank LOOKUP_KEY, which SND (CSCL-LOG-SND-01,
    -02), Enders (CSCL-LOG-END-01, -02) or the Exception file (CSCL-LOG-EXC-02, -04) leave
    out, and Exception rows whose name is shorter than 2 characters (CSCL-LOG-EXC-01,
    -03). Each follows prod's own row filter and blank test for that file.

- name: log__rpl_missing_roadbed
  description: >-
    RoadbedPointerList rows whose generic (CSCL-LOG-RPL-06) or else roadbed
    (CSCL-LOG-RPL-05) segment matches no centerline, which prod and int__rpl leave out of
    RPL.

- name: log__saf_s_checks
  description: >-
    SAF S address points prod leaves out after finding their centerline, logged for the
    first check they fail in prod's order: no face code for B7SC_ACTUAL or the segment's
    street (CSCL-LOG-SAF-06); in another borough than the segment's street, but no proto
    (-07), a first proto that isn't type B (-08), in another borough (-09) or with another
    B7SC (-10); an SND feature type E address with no section letter (-11, INFO in prod).
    The checks are in int__saf_s_checks; int__saf_s drops these points too.

- name: log__saf_d_daps_b5sc
  description: >-
    SAF D/F AltSegmentData rows whose DAPS B5SC isn't one of prod's hard-coded street
    codes (CSCL-LOG-SAF-14), which prod and int__saf_d leave out of SAF.

- name: log__saf_commonplace_proto
  description: >-
    G/N/X CommonPlaces on a centerline with coincident segments and a proto: the first
    proto is type B but neither it nor the centerline is in the place's borough
    (CSCL-LOG-SAF-26), or it is of a type other than B or R (CSCL-LOG-SAF-27). The checks
    are in int__saf_commonplace_proto; prod and int__saf_gnx leave these places out of
    SAF.

- name: log__special_sedat_name_missing
  description: >-
    Special SEDAT rows whose B7SC has no principal name in the StreetName or FeatureName
    table (CSCL-LOG-SSEDAT-01), which prod and special_sedat_fields leave out.

- name: log__gdb_lion_name_missing
  description: >-
    LION gdb rows prod (ESRI LION) leaves out for a missing name: SAF replicants with a
    blank SAFStreetCode (CSCL-LOG-BYTES-01) or SAFStreetName (CSCL-LOG-BYTES-02), and
    features with a blank Street (CSCL-LOG-BYTES-03). gdb_lion and gdb_altnames leave
    them out too.
    Also SAF replicants whose B7SC has no principal name in either table
    (CSCL-LOG-BYTES-10, -11), which is why their SAFStreetName is blank.

- name: log__rpl_nodes_and_level_codes
  description: >-
    RPL records prod writes with a field blank: no Node at an end of the roadbed or generic
    segment (CSCL-LOG-RPL-01..04; int__rpl leaves the node id blank too), or a coincident
    roadbed level code other than 1-26 or 99 (CSCL-LOG-RPL-08; int__rpl doesn't blank it).

- name: log__saf_sos_indicator
  description: >-
    SAF D/F (CSCL-LOG-SAF-13) and O (CSCL-LOG-SAF-17) AltSegmentData rows whose
    SOSINDICATOR is neither left nor right. Prod writes them with blank house numbers;
    int__saf_d and int__saf_o keep a range.

- name: log__sedat_name_missing
  description: >-
    SEDAT rows prod writes with a blank B7SC and street name: no SEGMENTID
    (CSCL-LOG-SEDAT-01), no preferred Segment_LGC row (CSCL-LOG-SEDAT-02), or a B7SC with
    no principal StreetName row (CSCL-LOG-SEDAT-03).

- name: log__district_lookup_missing
  description: >-
    District GDB features whose code has no row in a lookup table, so a name field is
    blank: CDTAEquiv2020 (CSCL-LOG-GDB-03, -07), NeighborhoodPUMACodes (CSCL-LOG-GDB-04,
    and a blank FIPS_CODE, CSCL-LOG-GDB-05), NTAEquiv2020 (CSCL-LOG-GDB-06). Read off our
    district layers.

- name: log__lion_record_length
  description: >-
    LION .dat records with a field value longer than its slot (CSCL-LOG-LION-21). Prod
    writes the longer record; lion_dat_by_field cuts the value to fit, and the message
    names the fields cut.

- name: log__gdb_lion_value_changed
  description: >-
    LION gdb values cut to fit, as prod does: AltNames SNames over 30 characters
    (CSCL-LOG-BYTES-06; one count row per borough, the rows are in
    log_altnames_sname_cut.csv) and SegCount over 9 (CSCL-LOG-BYTES-12).

- name: log_altnames_sname_cut
  description: >-
    Attachment to log.csv, exported as log_altnames_sname_cut.csv: one row per LION gdb
    AltNames row whose SName is over 30 characters and cut to 30 (CSCL-LOG-BYTES-06), in
    prod's wording, with log.csv's columns plus the borough, Street and the uncut SName.

- name: log__name_table_warnings
  description: >-
    One row per id and name, with the count in record_count, for records whose name prod
    finds only in the other name table (CSCL-LOG-LION-13..16, BYTES-05, -08, -09, SAF-19,
    -24). The records are in log_name_table_warnings.csv.

- name: log_name_table_warnings
  description: >-
    Attachment to log.csv, exported as log_name_table_warnings.csv: one row per record
    whose name prod finds only in the other name table, in prod's wording, with log.csv's
    columns plus the B7SC and the name found.

unit_tests:
# CSCL-LOG-OURS-15. G1 is generic with house numbers and a written SAF replicant with house
# numbers (plus one unwritten and one without house numbers); G3 a continuous-parity (L)
# generic with a two-range SAF replicant (parity_side R), two records each; G2 a generic
# without house numbers, G4 one with a blank Street (not written), G5 a generic of
# FeatureTyp 5 (zeroed either way); F1 and U1 aren't generic. 6 records, 3 of them SAF
# replicants. sql fixtures: CI runs unit tests without building the upstream models
- name: test__log__generic_house_numbers__off
  description: "Default (zero_generic_house_numbers false): counts the generic records with house numbers, OFF."
  model: log__generic_house_numbers
  overrides:
    vars:
      zero_generic_house_numbers: false
  given: &generic_hn_log_given
  - input: ref('int__lion')
    format: sql
    rows: |
      SELECT * FROM (VALUES
        ('K1', 'G1', 'MAIN STREET', NULL, '1', '99', '2', '98'),
        ('K2', 'G2', 'MAIN STREET', NULL, '0', '0', '0', '0'),
        ('K3', 'G3', 'MAIN STREET', 'L', '1', '99', '2', '98'),
        ('K4', 'G4', '  ', NULL, '1', '99', '2', '98'),
        ('K5', 'G5', 'MAIN STREET', NULL, '1', '99', '2', '98'),
        ('K6', 'F1', 'MAIN STREET', NULL, '1', '99', '2', '98'),
        ('K7', 'U1', 'MAIN STREET', NULL, '1', '99', '2', '98')
      ) AS t (lionkey, globalid, street, continuous_parity_flag, l_low_hn, l_high_hn, r_low_hn, r_high_hn)
  - input: ref('int__lion_house_number_zeroing')
    format: sql
    rows: |
      SELECT * FROM (VALUES
        ('G1', 'G', FALSE), ('G2', 'G', FALSE), ('G3', 'G', FALSE), ('G4', 'G', FALSE),
        ('G5', 'G', TRUE), ('F1', 'F', FALSE), ('U1', 'U', FALSE)
      ) AS t (globalid, segment_type, zero_for_feature_type)
  - input: ref('int__saf_replicant_fields')
    format: sql
    rows: |
      SELECT * FROM (VALUES
        ('K1', TRUE, '1', '9', NULL, NULL, NULL),
        ('K1', FALSE, '11', '19', NULL, NULL, NULL),
        ('K1', TRUE, NULL, NULL, NULL, NULL, NULL),
        ('K3', TRUE, '1', '9', '2', '8', 'R'),
        ('K6', TRUE, '1', '9', NULL, NULL, NULL),
        ('K7', TRUE, '1', '9', NULL, NULL, NULL)
