id: dcp_communityboarddispositions
acl: private

attributes:
  name: ZAP Community Board Dispositions
  description: >-
    The dcp_communityboarddispositions table from DCP's ZAP CRM, as the raw CRM table (the `_crm` export).
    The weekly zap_export workflow pulls it from the CRM, archives it, and writes the same file to edm-private.
    This source lets ingest_single re-archive a past week from edm-private.

ingestion:
  source:
    type: s3
    bucket: edm-private
    key: db-zap/{{ version }}/dcp_communityboarddispositions/dcp_communityboarddispositions_crm.csv
  file_format:
    type: csv
    dtype: str
