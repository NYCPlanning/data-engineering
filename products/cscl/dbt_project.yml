name: "cscl"

profile: "cscl"

model-paths: [ "models" ]
asset-paths: [ "assets" ]

tests:
  +store_failures: true
  +schema: "_tests"

models:
  cscl:
    staging:
      +materialized: view
      +group: staging
      +docs:
        node_color: "#2a9d8f"  # Verdigris - for recipe/source inputs
    intermediate:
      +materialized: view
      +docs:
        node_color: "#e76f51"  # Burnt Peach - logging/metadata
    product:
      +materialized: table
      +docs:
        node_color: "#264653"  # Charcoal Blue - production outputs
    qa_int:
      +materialized: table
      +tags: ['qa', 'qa_prod']
      +docs:
        node_color: "#f4a261"  # Orange - QA production wrappers
    etl_dev_qa:
      +materialized: table
      +tags: ['qa']
      +docs:
        node_color: "#124559"
    log_files:
      +materialized: table
      +docs:
        node_color: "#3e5c76"

dispatch:
- macro_namespace: audit_helper
  search_order: ['cscl', 'audit_helper']

on-run-start:
- "{{ create_duckdb_functions() }}"

vars:
  # Legacy bug fixes behind flags (README "Legacy bug fixes behind flags"). Each is off by
  # default, so the build reproduces prod, until the downstream reviewers (GR, GSS) agree
  # to roll the fix out. The log reports every build what turning it on would change.
  #
  # BOE LGC pointer (LION L10, LION gdb BOE_LGC), CSCL-LION-04: prod writes 1 whenever the
  # segment's BOE-preferred LGC value is above 9, instead of that LGC's position among the
  # segment's LGCs (CenterlineExtractFile.cs:1321, GetBOEPreferredLGCCode). true writes the
  # position (ETL spec 2.2.1). Logged every build as CSCL-LOG-OURS-06 (568 Queens records
  # on 26c). Proto segments aren't affected: prod reads their BOE_PREFERRED_LGC_FLAG as is.
  fix_boe_lgc_pointer: false
  # Curve flag on a single-arc non-centerline segment (LION L49, LION gdb CurveFlag),
  # CSCL-LION-03: prod writes I only when the source shape has more than two points
  # (ShorelineExtractFile.cs:422, GetHasShapePoints; ETL spec 2.3.3 "shape points"), so a
  # shoreline, subway, rail or non-street segment that is one circular arc end to end stays
  # blank. true writes I for it too (it is curved). Logged every build as CSCL-LOG-OURS-07
  # (on 26c: 253 LION .dat records, 410 counting LION gdb-only records).
  fix_single_arc_curve_flag: false
  # Zip on a proto-segment of a non-centerline parent (LION L24/L33, LION gdb LZip/RZip),
  # CSCL-LION-02: a proto off the borough boundary takes its parent's stored zip
  # (CenterlineExtractFile.cs:3188 and 3851-3855), which a shoreline or non-street feature
  # parent never stores (it looks its zip up when written, NonStreetFeatureExtractFile.cs:
  # 118-128), so prod leaves both blank. true gives it the zip on each side, as the spec's
  # proto-segment rule (copy the parent's) does. Logged every build as CSCL-LOG-OURS-09 (10
  # Randall's Island records on 26c).
  fix_nonstreet_proto_zip: false
  # House numbers on SegmentTyp F segments (LION gdb LLo/LHi/RLo/RHi_Hyphen and
  # FromLeft/ToLeft/FromRight/ToRight, on their SAF replicants too), CSCL-LION-24. Not a
  # prod bug fix: false (the default) is prod's LION gdb output. The legacy tool's rule
  # zeroes SegmentTyp IN ('G', 'F') OR FeatureTyp NOT IN ('0', '6', 'W')
  # (BytesLION_CSCL_workflow_tool_PUB.py:353), but prod's 26c LION gdb keeps the house
  # numbers of the one F record that has any (the SAF A replicant of 0346291, ELIOT AVENUE).
  # The spec zeroes generic segments (SEGMENT_TYPE G) and never names F (ETL spec 2.7.3).
  # true zeroes F too, as the legacy rule does. Logged every build as CSCL-LOG-OURS-10
  # (1 LION gdb record on 26c).
  zero_f_segment_house_numbers: false
  # Deleted-ID check on LDF G and P records (LDF.dat, and the record count in LDF.header),
  # CSCL-LDF-01: prod drops any record, other than a delete, whose new or journalled old
  # ID is deleted anywhere in this release's journal, on any segment, at any time, among
  # deletes of its own record type and of the types written before it (S, then G, then P;
  # IsSegmentdeleted in CSCLEditor.dll's LDFExtractHelper, decompiled line 1420, fed by
  # CreateTransitoryDataTable, line 1318). A generic or physical ID spans many segments,
  # so this drops G and P reassignments LION shows took effect. true drops a G or P record only when its ID is deleted on the same
  # node pair, among deletes of its own type. S records are checked prod's way either way.
  # Logged every build as CSCL-LOG-OURS-11 (12 records on 26c, which also renumber 1,267
  # later records, CSCL-LDF-03).
  fix_ldf_journal_delete_scope: false
  # Orientation of a centerline's proto-segments after a reversed one (LION nodes, XY,
  # sectional maps and every left/right field; LION gdb the same), CSCL-LION-01: prod
  # writes a centerline's proto-segments one after another from one feature object, and
  # each reversed proto off the borough boundary reverses that object's shape in place
  # once its values are set (CenterlineExtractFile.cs:3801-3842, SwapFeatureGeometry
  # :4953; LIONExtractorClass.cs:159-176). The next proto starts from the reversed shape,
  # so after an odd number of reversed protos its values come out the other way round:
  # the second of two reversed protos on one segment isn't reversed. true reverses each
  # proto by its own FROM_TO_INDICATOR, as the spec says. Logged every build as
  # CSCL-LOG-OURS-12 (5 LION .dat records on 26c, and their LION gdb rows; their census
  # fields match prod's either way, see fix_reversed_proto_census_fields).
  fix_reversed_proto_pairs: false
  # Special address flag on a ramp proto-segment (LION L48),
  # CSCL-LION-19: prod gives a ramp proto (ALT_SEGDATA_TYPE R) the SAF records it
  # attributes to its centerline's proto-segments: AltSegmentData SAF rows with the
  # proto's LIONKEY and address points whose B7SC_ACTUAL starts with the proto's B5SC
  # (CenterlineExtractFile.cs:2716-2737 and 2748-2762, GetSpecialAddressFlag), so a ramp
  # on its centerline's street code carries the centerline's flag. true leaves it blank,
  # as the legacy rule (a ramp never carries one) says. Logged every build as
  # CSCL-LOG-OURS-13 (1 Queens record on 26c, segment 174704). LION gdb isn't affected:
  # its base rows' SpecAddr is always blank.
  fix_ramp_proto_special_address: false
  # Centerline proto-segments whose B5SC + LGC1 has a face code only in FeatureName,
  # CSCL-LION-22: prod means to take the FeatureName face code and log a warning
  # (CSCL-LOG-LION-15), but compares the table name as stored with a lowercased one
  # (CenterlineExtractFile.cs:3487 vs :3501), looks in StreetName again, finds nothing and
  # drops the proto from the LION .dat and the LION gdb (LIONExtractorClass.cs:443-458,
  # CSCL-LOG-LION-19). true writes it with the FeatureName face code and logs LION-15.
  # Logged every build as CSCL-LOG-OURS-14 (none on 26c).
  fix_featurename_face_code_protos: false
  # nynta2010 CountyFIPS, CSCL-DISTRICTS-09. Not a prod bug fix: false (the default) is
  # prod's output. Prod looks CountyFIPS up in the NTA's NeighborhoodPUMACodes row and, where
  # its FIPS_CODE is blank (or there is no row), leaves CountyFIPS blank and logs it
  # (GDBExtractorClass.cs:1051-1059, 1597-1621; CSCL-LOG-GDB-05). true fills CountyFIPS
  # from the NTA's borough instead, which maps to exactly one county. Logged every build
  # as CSCL-LOG-OURS-16 (0 NTAs on 26c).
  fill_nta_county_fips_from_borough: false
  # House numbers on generic segments, SegmentTyp G (LION gdb LLo/LHi/RLo/RHi_Hyphen and
  # FromLeft/ToLeft/FromRight/ToRight, on their SAF replicants too), CSCL-LION-15. Not a
  # prod bug fix: false (the default) is prod's LION gdb output. Prod's ETL zeroes a
  # generic segment's house numbers and then overwrites the zeros with the source's
  # (ExtractorClass.cs:2993-3072; the return at 3070 was commented out in 2012 so generics
  # keep their addresses), and on 26c every G record matches the source's values: 5,743
  # have house numbers, 7,849 have none in the source either. The spec (ETL spec 2.7.3)
  # and the legacy tool's rule (BytesLION_CSCL_workflow_tool_PUB.py:353) zero them; true
  # does too. Logged every build as CSCL-LOG-OURS-15 (5,743 LION gdb records on 26c).
  zero_generic_house_numbers: false
  # House numbers on segments of a FeatureTyp other than 0, 6 or W (LION gdb
  # LLo/LHi/RLo/RHi_Hyphen and FromLeft/ToLeft/FromRight/ToRight, on their SAF replicants
  # too), CSCL-LION-29. Not a prod bug fix: false (the default) is prod's LION gdb output,
  # which copies the source's house numbers on every row. The legacy tool's rule zeroes
  # SegmentTyp IN ('G', 'F') OR FeatureTyp NOT IN ('0', '6', 'W') (ImportLION2_ToGDB,
  # BytesLION_CSCL_workflow_tool_PUB.py:326-361), but its main flow never calls it (the
  # call at :621 is commented out), and prod's ETL zeroes and then overwrites with the
  # source's values (ExtractorClass.cs SetBytesNormalizedHouseNumbers, from :2988). The
  # spec (ETL spec 2.7.3) applies the FeatureTyp test to proto-segments. true zeroes them,
  # as the legacy rule does; with zero_generic_house_numbers and
  # zero_f_segment_house_numbers true too, the build applies the legacy tool's whole rule.
  # Logged every build as CSCL-LOG-OURS-25 (184 LION gdb records on 26c: FeatureTyp 5 32,
  # 9 97, A 1, C 54).
  zero_feature_type_house_numbers: false
  # District features whose source polygon is invalid (rings that cross, or a shell inside
  # another shell), CSCL-DISTRICTS-04: nybid BIDs 44 and 56, nyhez zones 1, 2, 4, 5, 6 and
  # X, nycdwi districts 484 and 502 on 26c. Not a prod bug fix: false (the default) is
  # prod's output. Prod copies these layers' source feature classes feature by feature,
  # unclipped (DistrictBoundaryGDBExtractorConfiguration.xml: nybid <-
  # BusinessImprovementDistrict, nyhez <- HurricaneEvacuationZone, nycdwi <-
  # CommunityDistrict; GDBExtractorClass.cs:952-957 sets the shape to the source's
  # ShapeCopy), so it publishes the invalid polygons as stored, and false does too, for
  # those features only. SHAPE_Area and SHAPE_Length come from the valid polygon either
  # way, which is what prod's are (Esri's area counts a shell inside a shell as a hole).
  # true publishes the valid polygon (st_makevalid for nybid, the AtomicPolygon topology
  # for nyhez and nycdwi). Nothing downstream reads the published geometry. Logged every
  # build as CSCL-LOG-OURS-20 (10 features on 26c).
  make_valid_district_polygons: false
  # nyct2010 and nyct2010wi BoroCT2010, NTACode and NTAName, CSCL-DISTRICTS-10. Not a prod
  # bug fix: false (the default) is prod's output. Prod copies BoroCT2010 from the source
  # tract's BOROCT and NTACode from its NEIGHBORHOOD_CODE, and looks NTAName up by that
  # code (DistrictBoundaryGDBExtractorConfiguration.xml nyct2010/nyct2010wi: BoroCT2010 <-
  # BoroCT, NTACode <- Neighborhood_Code, NTAName <- $pjareaname; GDBExtractorClass.cs:
  # 960-1000, 1051-1059, 1597-1621). On 26c the source has BOROCT 4990100 and
  # NEIGHBORHOOD_CODE QN99 on the Brooklyn and Staten Island pieces of water tract 990100
  # too, so prod writes 4990100 on all three pieces in nyct2010wi and on the Staten Island
  # land piece in nyct2010. true keys each tract by its borough and tract (3990100,
  # 4990100, 5990100), as the AtomicPolygons, the census block layers, LION and ThinLION
  # do, and takes the NTA from NeighborhoodPUMACodes by borough and tract. Only these two
  # layers read it. Logged every build as CSCL-LOG-OURS-21 (2 source tracts on 26c).
  key_tracts_by_borough: false
  # Census tract and block (1990-2020) and community district fields on a centerline's
  # reversed proto-segments (LION gdb LCT/RCT, LCB/RCB and their suffixes, L_CD/R_CD),
  # CSCL-LION-26: prod's LION record swaps a reversed proto's left/right values
  # (CenterlineExtractFile.cs:3801-3842), but its gdb writer reads the census and community
  # district fields straight from the AtomicPolygons it found on the shape before that swap
  # (ExtractorClass.cs:2390-2412 and 3934-4338, SetBytesCensusTract, reading
  # LeftAtomicPolygon/RightAtomicPolygon from GetAtomicPolygons, CenterlineExtractFile.cs:
  # 2901 and 4406-4452), so they belong to the other side's AtomicPolygon and contradict
  # prod's own LION .dat. On the second reversed proto of a CSCL-LION-01 segment the shape
  # was already reversed by the first, so prod's census fields come out the right way round
  # there. true writes them with the record's own sides, as the .dat. Logged every build as
  # CSCL-LOG-OURS-17 (29 LION gdb records on 26c, 24 with fix_reversed_proto_pairs on).
  fix_reversed_proto_census_fields: false
  # High house number on the LION gdb S and V replicants of a HYPHEN_TYPE R address point
  # (LHi_Hyphen/RHi_Hyphen, ToLeft/ToRight), CSCL-LION-25: prod's gdb writer takes an R
  # range's high end from a dash in HOUSE_NUMBER (ExtractorClass.cs:5128-5132,
  # SetSAFStreetNameAndCode: parts = houseNumber.Split('-'), high = parts[1] only if there
  # are two parts, else its initial "0" at :5116), the encoding the spec describes, but
  # CSCL stores the high end in HOUSE_NUMBER_RANGE, so prod writes the low house number and
  # no high one. true writes HOUSE_NUMBER_RANGE as the high house number. Logged every
  # build as CSCL-LOG-OURS-18 (9 LION gdb records on 26c).
  fix_hyphen_r_high_house_number: false
  # AltSegmentData rows with a blank ALT_SEGDATA_TYPE that have a SAF type (SAF ABCEGNPX,
  # LION gdb SAF replicants and SegCount, and everything else that reads the SAF rows),
  # CSCL-SAF-03: spec Table 13 makes only ALT_SEGDATA_TYPE S rows SAF records, but prod
  # selects them by SAFTYPE alone: its SAF A/B/C/E/P extract by SAFTYPE IN ('A', 'B', 'C',
  # 'E', 'P') (SAFExtractClass.cs:1448, ConstantClass.cs:43), its LION gdb SAF replicants,
  # SegCount and special address flag by SEGMENTID (CSCLDataHelpersClass.cs:1215-1300,
  # GetSAFTData, used at ExtractorClass.cs:2789 and CenterlineExtractFile.cs:2700). true
  # leaves them out, as the spec says. Logged every build as CSCL-LOG-OURS-19 (1 row on 26c, segment 9017010: one record in each SAF ABCEGNPX
  # file, one LION gdb row, and SegCount on the segment's 7 other rows).
  fix_blank_type_altsegmentdata: false
  # Trailing padding on the LION gdb lion layer's non-SAF Join_ID, CSCL-LION-10. Not a prod
  # bug fix: false (the default) is prod's lion layer. The spec (ETL spec 2.7.3) and prod's
  # ETL make a non-SAF Join_ID 15 characters, ending in two spaces (ExtractorClass.cs:3781,
  # GetBytesJoinID), but prod's distribution tool strips it on the lion layer
  # (BytesLION_CSCL_workflow_tool_PUB.py:127-141, RemoveTrailingSpaces, called at :615);
  # its altnames strip (ImportLION2_ToGDB, :326-336) is commented out (:621), so altnames
  # keeps the padding, ours and prod's, either way. true keeps it on the lion layer too, as
  # the spec says. Logged every build as CSCL-LOG-OURS-24 (221,078 lion layer rows on 26c).
  pad_lion_join_id: false
  # LION sequence numbers for non-street features (int__nonstreetfeature_seqnum). Legacy
  # numbers them with a per-(borough, face code) counter that carries across the borough
  # extract runs of one extract session (ETLExtractorForm resets it on each OK click).
  # A run reads every feature within this distance of its borough polygon
  # (BoroughBufferDistance, legacy default 2 ft), so boundary features count in both runs.
  lion_extract_borough_buffer_ft: 2
  # The extract sessions, each a list of borough codes in run order. This is the legacy
  # OPERATOR'S HISTORY for one release, not a rule of the ETL: the numbers depend on which
  # boroughs GR extracted together and in what order. A single click extracting every
  # borough runs Bronx, Brooklyn, Manhattan, Queens, Staten Island ([['2', '3', '1', '4', '5']];
  # ETLExtractorForm.DoLIONExtract). 26c matches only with Bronx/Brooklyn/Manhattan in one
  # session and Queens and Staten Island in a fresh one: 17,975 of 17,975 non-street-feature
  # sequence numbers with that split, 16,007 (89%) as one session. Re-check it each release.
  lion_seqnum_extract_sessions: [['2', '3', '1'], ['4', '5']]
  # The same, for the LION gdb's SeqNum (CSCL-LION-05). Prod's LION gdb and LION .dat
  # files disagree on these numbers: its gdb matches all five boroughs extracted in one
  # session (17,975 of 17,975 on 26c), its .dat files the split above, so prod's two outputs
  # differ on 1,968 LION gdb records (every one on a face numbered in the Queens extract).
  # The default reproduces prod's gdb; set it equal to lion_seqnum_extract_sessions to
  # number the gdb like the .dat files. List the same boroughs in both. Logged every build
  # as CSCL-LOG-OURS-22 (1,968 LION gdb records on 26c).
  lion_gdb_seqnum_extract_sessions: [['2', '3', '1', '4', '5']]
  # qa__context_geoms: buffer applied to the SUBTRACTED side before computing
  # build_minus_legacy/legacy_minus_build, to separate real spurs/gaps from needle-sliver
  # noise - NOT a proxy for perimeter/length. Confirmed on PUMA 3808:
  # its tract-dissolve needle noise hugs the true boundary within 0.004 ft even at 2,838 ft
  # long (perimeter is not a usable signal - some noise needles are LONGER than the real
  # defect below), while its one genuine self-touching-vertex spur reaches 104.5 ft from
  # the true boundary despite a smaller, 501 ft perimeter. A 1 ft buffer fully absorbs the
  # former (needle max gap is two orders of magnitude under 1 ft) while only trimming the
  # base of the latter, leaving its real extent visible.
  context_geom_noise_buffer_ft: 1.0
  # Esri's shape equality (IRelationalOperator.Equals), which legacy uses to find coincident
  # segments, for gdb_lion SegCount (two segments of the same class with the same two nodes)
  # and a centerline's L57 (an underground subway or rail segment with its shape,
  # CSCL-LION-14): two shapes are equal if each lies within this distance (ft) of the
  # other. Legacy compares within the source's XY tolerance (0.0002 ft) on a 0.0001 ft grid,
  # on true curves where ours are densified within 0.00025 ft; 0.0003 is the smallest value
  # that matches prod, not a number stated in the legacy code. On 26c it separates all 3,126
  # centerlines with one underground subway/rail candidate the way prod's L57 does (equal at
  # 0.000215 ft and closer, not equal from 0.00039 ft). Raise it if real coincident pairs are
  # missed.
  segcount_coincident_tolerance_ft: 0.0003
  # LION L57, coincident segment count, on centerlines (CSCL-LION-14). Prod subtracts each
  # ROW_TYPE 1 subway or rail feature at the centerline's midpoint that Esri's Equals finds
  # equal to it (CenterlineExtractFile.cs:2528-2610, GetCoincidentCLSegmentCount), with no
  # floor: 4 centerlines come out 0 on 26c, where the spec's L57 is an integer above 0.
  # false (the default) reproduces that, matching shapes with segcount_coincident_tolerance_ft.
  # true is ours before: a subway or rail segment within 1 ft of the centerline's midpoint,
  # subtracted only when the source count is above 1, so the count stays at least 1. Logged
  # every build as CSCL-LOG-OURS-23 (8 LION .dat records on 26c: 4 centerlines prod writes 0
  # where ours wrote 1, and 4 where an arc-chain subway lies within 1 ft but not within the
  # tolerance, which prod doesn't subtract).
  fix_coincident_seg_count: false
  # Roadbed order within a generic in RPL.txt, CSCL-RPL-02: prod puts each roadbed in a
  # right or a left list by the side of the generic its midpoint lies on, whatever its
  # ROADBED_POSITION_CODE, sorts each list outermost first by the length of the
  # perpendicular from the generic's midpoint to it, moves an R in the right list and an L
  # in the left list to the head of their list, and writes the right list, then the left
  # (RPLExtractClass.cs:172-190 and 390-436, RPLRecordOrderUpdate;
  # CSCLArcObjectslHelperMethods.cs:84-163, GetDistanceBetweenLines). true writes the
  # spec's order (ETL spec L8146-8193): R, the inner roadbeds on its side outermost first,
  # L, the inner roadbeds on the other side. Logged every build as CSCL-LOG-OURS-26
  # (67 of 13,658 generics, 154 rows, on 26c).
  fix_rpl_roadbed_order: false
  # Segment locational status 'X' (LION L41, LION gdb LocStatus), CSCL-LION-11: where a
  # segment's left and right AtomicPolygons differ and are in the same borough, prod writes
  # 'X' when their CENSUSTRACT_2010 differs (CenterlineExtractFile.cs:1447-1452,
  # GetSegmentLocationalStatus; issue #2193), where the spec (ETL spec L1942-1945) says
  # CENSUSTRACT2020. true compares the 2020 tracts. Logged every build as
  # CSCL-LOG-OURS-27 (8,215 segment records on 26c; with it on, 8,026 LION .dat records
  # and 8,705 LION gdb rows change).
  fix_seg_loc_status_2020_tract: false
  # AtomicPolygon topology (models/intermediate/atomicpolygon_topology) and the district
  # boundaries built from it (macros/district_boundary.sql).
  #
  # Node merge tolerance (ft): two independently digitized copies of the same corner
  # differ by small multiples of the source's 2^-14 ft quantization (observed up to
  # 0.000307 ft). 2 x quantum covers every observed case; ST_DWithin measures true
  # distance, so this also covers a diagonal offset of one quantum per axis.
  ap_topology_node_merge_tolerance_ft: 0.0003662109375
  # Scope: an AtomicPolygon is in scope if its 2010 tract's PUMA is in
  # ap_topology_scope_pumas OR its borocode is in ap_topology_scope_boros. Citywide by
  # default (full rebuild ~3 min); narrow it when iterating on vertices/nodes/edges.
  # Must be a union of whole districts for any district type compared against prod.
  ap_topology_scope_pumas: []
  ap_topology_scope_boros: ['1', '2', '3', '4', '5']
  # Orphan edge splitting (int__topology__edges): an alternate path may replace a
  # one-owner edge only if its length matches the direct distance within this
  # tolerance - by the triangle inequality, i.e. only if every intermediate vertex is
  # collinear. Observed real cases are 0.00001-0.00006 ft off the chord; real lot-line
  # kinks are far larger.
  ap_topology_edge_split_tolerance_ft: 0.001
  # Max edges in an alternate path. The length budget prunes the search on its own; this
  # only guarantees termination. Real cases seen need up to 3.
  ap_topology_edge_split_max_hops: 6
  # QA: build qa__diffs_gdb_lion (and its keyed inputs) - a full-row diff of the LION gdb
  # lion layer against prod. Slow (~8 min, ~120 columns); off by default.
  qa_gdb_lion_diffs: false
  # LION left/right AtomicPolygons (models/intermediate/adjacent_polygons), CSCL-LION-16.
  # A flag like the legacy bug fixes above (README "Legacy bug fixes behind flags"): off,
  # the default, until GR and GSS agree to roll it out.
  # Off: left/right come from the 2 ft offset probe (int__segment_offsets), as in prod.
  # On: from int__segment_topology_sides - the owners of the AP topology edge a segment
  # runs along at its midpoint, falling back to the probe where it runs along none. The
  # probe overshoots into the AP behind wherever the adjacent AP is under 2 ft deep at
  # the midpoint (~100 segments citywide); edge ownership can't. Both pairs are always
  # output in int__segment_atomicpolygons; this only picks which fills left_*/right_*
  # and every field derived from them (census, districts, zip, locational status, ...).
  # Logged every build as CSCL-LOG-OURS-08 (the segments where the two disagree).
  fix_lion_lr_from_topology: false
  # Segment-to-edge matching (int__segment_topology_edge_matches). Length tolerance
  # (ft) between a segment step and its edge or edge path: correct matches differ by at
  # most 0.13 ft (offset centerlines: a bump of h over a step L adds ~2h^2/L); unmatched
  # steps with an edge between the same nodes differ by 0.4 ft (2) or > 10 ft (109).
  lion_lr_edge_match_length_tolerance_ft: 0.25
  # Max Hausdorff distance (ft) between a step and its matched edge(s) - how far off the
  # AP boundary a centerline can run and still count as on it. Matches run up to 1.46 ft
  # off, and all 13 over 0.5 ft agree with both the probe and prod. 2 ft is the probe's
  # own reach, so "near the boundary" means the same thing on both paths.
  lion_lr_edge_match_max_offset_ft: 2.0
  # Max edges in a path for one step; the longest match seen needs 7.
  lion_lr_edge_match_max_hops: 10
  # Fallback probe offset (ft). Unmatched segments that sit between two APs mostly end
  # off a node, just beside the boundary; a smaller probe stays on the segment's side and
  # reports the same AP both sides. Of the ~10.8k unmatched segments, the answer that
  # crosses the boundary (as prod does) is missed by 40 at 0.01 ft, 8 at 0.25, 4 at 1,
  # and 0 at 2 - where 1 known overshoot (segmentid 359111) remains.
  lion_lr_fallback_probe_offset_ft: 2.0
  # QA (models/etl_dev_qa/district_boundaries): floors for qa__boundary__*_outliers, and
  # the vertex-count product above which GEOS Hausdorff (O(n*m), uninterruptible) is
  # skipped - 5e7 is a few seconds; whole fire divisions are ~1e10.
  boundary_qa_outlier_min_hausdorff_ft: 5
  boundary_qa_outlier_min_symdiff_pct: 0.01
  boundary_qa_hausdorff_max_vertex_product: 50000000
  # QA (models/etl_dev_qa/district_review): symmetric-difference pieces narrower than
  # this on average (2 * area / perimeter) are grid noise - about 16 cells of the
  # source's 2^-14 ft grid, 3x the 0.0003 ft worst-case corner disagreement above. See
  # qa__district_review_pieces.
  district_review_noise_width_ft: 0.001
  # QA (qa__geometry_fgdb_district_layers): prod's hairline slivers (CSCL-DISTRICTS-01),
  # about 0.0001 ft wide, are anything narrower than this; see
  # prod_fgdb_linear_without_hairlines.
  district_hairline_width_ft: 0.01
  # QA (qa__rpl_order): RPL.txt's row order - recipe.yml's rpl export `order_by`, over
  # rpl_fields. Kept equal to it by tests/test_export_order.py.
  rpl_file_order_by: generic_segmentid, group_order_id

flags:
  fail-fast: true
