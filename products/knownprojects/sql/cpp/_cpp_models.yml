version: 2

# Every year below comes from the cpp_latest_complete_year var so the column
# names track the dcp_housing pin. dbt loads this file as YAML before rendering
# Jinja, so the years have to be inline expressions, not {% set %} variables.

models:
  - name: census_housing_units_2020
    description: "2020 Census housing units, the baseline for CPP growth figures"
    columns:
      - name: geography_type
        tests:
          - not_null
          - accepted_values:
              values: ['NTA2020', 'CD']
      - name: geography_id
        tests: [not_null]
      - name: units_2020
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          name: census_housing_units_2020_compound_key
          combination_of_columns:
            - geography_type
            - geography_id
      - dbt_utils.equal_rowcount:
          name: cpp_housing_growth_nta_covers_every_nta
          compare_model: ref('cpp_housing_growth_nta')
          config:
            where: "geography_type = 'NTA2020'"
      - dbt_utils.equal_rowcount:
          name: cpp_housing_growth_cd_covers_every_cd
          compare_model: ref('cpp_housing_growth_cd')
          config:
            where: "geography_type = 'CD'"

  - name: cpp_housing_growth_nta
    description: >
      Housing growth by NTA for the Capital Projects Portal. Year-labeled
      counts are as of the end of that year. Only units_2020_census is fixed;
      the rest of the years come from the cpp_latest_complete_year var and move
      with the dcp_housing pin.
    tests: &cpp_identities
      - dbt_utils.expression_is_true:
          name: cpp_housing_growth_nta_latest_units_identity
          expression: >-
            units_{{ var('cpp_latest_complete_year') }}
            = units_2020
            + completed_units_2021_{{ var('cpp_latest_complete_year') }}
      - dbt_utils.expression_is_true:
          name: cpp_housing_growth_nta_projected_units_identity
          expression: >-
            projected_units_{{ var('cpp_latest_complete_year') | int + 10 }}
            = units_{{ var('cpp_latest_complete_year') }}
            + projected_completed_units_{{ var('cpp_latest_complete_year') | int + 1 }}_{{ var('cpp_latest_complete_year') | int + 10 }}
    columns: &cpp_columns
      - name: geography_id
        tests:
          - not_null
          - unique
      - name: units_2020_census
        description: "2020 Census count, as of April 1 2020"
        tests: [not_null]
      - name: units_2020
        description: "As of the end of 2020, so the census count plus the rest of that year"
        tests: [not_null]
      - name: "completed_units_{{ var('cpp_latest_complete_year') | int - 9 }}_{{ var('cpp_latest_complete_year') }}"
        description: "Net of demolitions, not gross completions"
        tests: [not_null]
      - name: "completed_units_2021_{{ var('cpp_latest_complete_year') }}"
        description: "Net change from units_2020 to units_{{ var('cpp_latest_complete_year') }}"
        tests: [not_null]
      - name: "units_{{ var('cpp_latest_complete_year') }}"
        tests: [not_null]
      - name: "projected_completed_units_{{ var('cpp_latest_complete_year') | int + 1 }}_{{ var('cpp_latest_complete_year') | int + 10 }}"
        description: >
          KPDB units phased into its within_5_years and from_5_to_10_years
          buckets. The years in this name are a labeling convention, not a
          property of the data. KPDB picks the bucket from record status, not
          from a date: DOB records (41% of these units on the 26Q2 build) go
          on job status alone, so a job permitted in 2008 and still open
          counts here, and open ZAP applications (34%) all land in
          from_5_to_10_years unless the record is closed. The rest carry
          shares supplied by the source file. Only EDC Projected Projects
          (0.8%) reads a year, and it compares against current_date, so a
          pinned rebuild in a later year moves it. Read this as "units KPDB
          expects within ten years of the build".
        tests: [not_null]
      - name: "projected_units_{{ var('cpp_latest_complete_year') | int + 10 }}"
        description: >
          units_{{ var('cpp_latest_complete_year') }} plus the column above, so
          it inherits that column's caveat.
        tests: [not_null]

  - name: cpp_housing_growth_cd
    description: "Housing growth by community district, same columns as cpp_housing_growth_nta"
    tests:
      - dbt_utils.expression_is_true:
          name: cpp_housing_growth_cd_latest_units_identity
          expression: >-
            units_{{ var('cpp_latest_complete_year') }}
            = units_2020
            + completed_units_2021_{{ var('cpp_latest_complete_year') }}
      - dbt_utils.expression_is_true:
          name: cpp_housing_growth_cd_projected_units_identity
          expression: >-
            projected_units_{{ var('cpp_latest_complete_year') | int + 10 }}
            = units_{{ var('cpp_latest_complete_year') }}
            + projected_completed_units_{{ var('cpp_latest_complete_year') | int + 1 }}_{{ var('cpp_latest_complete_year') | int + 10 }}
    columns: *cpp_columns
