id: dcp_trafficanalysiszones

attributes:
  name: DCP Traffic Analysis Zones
  description: >-
    Traffic analysis zones. Rarely changes. The original upload wasn't kept, so the inbox copy
    of version 20210609 is library's shapefile export of it.

ingestion:
  source:
    type: s3
    bucket: edm-recipes
    key: inbox/dcp/dcp_trafficanalysiszones/{{ version }}/dcp_trafficanalysiszones.shp.zip
  file_format:
    type: shapefile
    unzipped_filename: dcp_trafficanalysiszones.shp
    crs: EPSG:4326
  processing_steps:
  - name: multi
  - name: rename_columns
    args:
      map: { "geom": "wkb_geometry" }

columns:
- id: geoid10
  data_type: text
- id: wkb_geometry
  data_type: geometry
