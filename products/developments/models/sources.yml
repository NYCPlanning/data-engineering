sources:
  - name: recipe_sources
    schema: "{{ env_var('BUILD_ENGINE_SCHEMA') }}"
    tables:
      - name: dcp_cdboundaries
      - name: dcp_cb2020
      - name: dcp_ct2020
      - name: dcp_cdta2020
      - name: dcp_nta2020
      - name: dcp_school_districts
      - name: dcp_boroboundaries_wi
      - name: dcp_councildistricts
      - name: dcp_firecompanies
      - name: dcp_policeprecincts
      - name: doitt_zipcodeboundaries
      - name: dof_shoreline
      - name: dcp_mappluto_wi
      - name: doe_eszones
      - name: doe_mszones
      - name: doe_school_subdistricts
      - name: hpd_hny_units_by_building
      - name: hny_geocode_results
      - name: hpd_historical_units_by_building
      - name: hpd_historical_geocode_results
      - name: dob_now_applications
      - name: dob_now_permits
      - name: dob_cofos
      - name: dob_now_cofos
      - name: doitt_buildingfootprints
      - name: doitt_buildingfootprints_historical
      - name: dcp_censusdata
      - name: dcp_censusdata_blocks
      - name: dob_bis_permits
      - name: dob_bis_applications
      - name: dob_jobapplications_parkingspaces

  - name: build_sources
    description: >-
      Intermediate tables written by the SQL steps in sql/, not dbt models. Declared
      here only so data tests can reference them; nothing in this project builds them.
    schema: "{{ env_var('BUILD_ENGINE_SCHEMA') }}"
    tables:
      - name: hny_geo
        description: >-
          One row per HNY building (hny_id = project_id/building_id), geocoded. Built by
          sql/_hny_match.sql from hpd_units_by_building + hpd_geocode_results.
      - name: hny_matches
        description: >-
          Surviving HNY-to-DOB job matches after the match-priority filter and
          hny_corrections have been applied. Built by sql/_hny_match.sql.
      - name: hny_corrections
        description: >-
          Manual add/remove overrides to the automated matching, loaded by sql/_create.sql
          from data/corrections/hny_corrections.csv.
