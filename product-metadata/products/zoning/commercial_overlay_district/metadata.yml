id: commercial_overlay_district

attributes:
  attribution_link: {{ bytes_url__zoning_features }}
  description: |-
    Commercial overlay districts for New York City. A commercial overlay is a C1 or C2 district mapped within residential zoning districts to serve local retail needs.

    Polygon features representing the within-tax-block limits for commercial overlay districts, as shown on the DCP zoning maps. Commercial overlay district designations are indicated in the OVERLAY attribute.

    All previously released versions of this data are available on the <a href="{{ bytes_url__zoning_features }}">DCP Website: BYTES of the BIG APPLE</a>. Current version: {{ current_version_zoning }}
  display_name: Commercial Overlay (NYCO)
  each_row_is_a: Commercial Overlay district
  publishing_frequency: Monthly
  tags:
  - Zoning
  - New York City
  - NYC
  - Department of City Planning
  - DCP
  - Commercial Overlay Districts
  - nyco

assembly:
- id: dcm_multilayer
  filename: nyc_zoning_features_shp.zip
  type: multilayer_shapefile
  contents:
  - id: shapefile
    custom:
      layer_name: zoning_commercial_overlays

custom: {}

destinations:
  - id: socrata
    type: open_data
    tags: [socrata_unpublished]
    files:
      - id: metadata_xlsx
        custom:
          destination_use: attachment
      - id: shapefile
        custom:
          destination_use: dataset_file
      # - id: oti_data_dictionary
      #   custom:
      #     destination_use: attachment
    custom:
      four_four: aaxv-7bvq
  - id: bytes
    type: bytes
    files:
      - id: dcm_multilayer
        custom:
          url: https://s-media.nyc.gov/agencies/dcp/assets/files/zip/data-tools/bytes/nyc_zoning_features_shp.zip
      - id: metadata_xlsx
        custom:
          url: https://s-media.nyc.gov/agencies/dcp/assets/files/excel/data-tools/bytes/zoning_commercial_overlays_data_dictionary.xlsx

files:
  - file:
      id: shapefile
      filename: zoning_commercial_overlays.shp.zip
      type: shapefile
  - file:
      id: oti_data_dictionary
      filename: zoning_commercial_overlays_data_dictionary.xlsx
      is_metadata: true
      type: oti_data_dictionary

columns:
  - id: the_geom
    name: the_geom
    data_type: geometry
    description: Feature geometry.
  - id: overlay
    name: OVERLAY
    data_type: text
    description: Commercial Overlay district designation.
  - id: shape_leng
    name: Shape_Leng
    data_type: decimal
    description: Length of feature in internal units.
  - id: shape_area
    name: Shape_Area
    data_type: decimal
    description: Area of feature in internal units squared.
