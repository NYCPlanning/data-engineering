id: hpd_hny_units_by_building
# ! Temporary: sourcing HPD's pre-publication internal extract from `inbox` instead of
# ! Open Data, so 26Q2 can build before HPD publishes. Revert to the socrata source
# ! (and acl: public-read) once the dataset is live on Open Data.
acl: private

attributes:
  name: Housing New York Units by Building
  description: |
    The Department of Housing Preservation and Development (HPD) reports on buildings, units, 
    and projects that began after January 1, 2014 and are counted towards the Housing New York plan. 
    The Housing New York Units by Project file presents this data by project, and includes project-level data, 
    such as senior units, but does not include building-level data. 
    The unit counts are provided for each project, rather than by building. 
    For additional documentation, including a data dictionary, review the attachments in the 
    “About this Dataset” section of the Primer landing page.
  url: https://data.cityofnewyork.us/d/hg8x-zxpr

ingestion:
  source:
    type: s3
    bucket: edm-recipes
    key: inbox/hpd_hny_units_by_building/{{ version }}/hpd_hny_units_by_building_internal.csv
  file_format:
    type: csv
    dtype: str
    # HPD's extract is Windows-1252, not UTF-8 (en-dashes in project names).
    encoding: cp1252
  processing_steps:
    - name: clean_column_names
      args: { "replace": { " ": "_" }, "strip": True, "lower": True }
    - name: rename_columns
      args:
        map:
          house_number: number
          street_name: street
          nta: nta_-_neighborhood_tabulation_area
    # HPD's raw column names and column order both differ from Open Data's, and have
    # shifted between internal extracts. Pin both here: `_hny_union.sql` unions this
    # table with the historical one positionally, so arity and order matter. Also drops
    # HPD's geocoding `message` column on extracts that carry it.
    - name: filter_columns
      args:
        mode: keep
        columns:
          - project_id
          - project_name
          - project_start_date
          - project_completion_date
          - building_id
          - number
          - street
          - borough
          - postcode
          - bbl
          - bin
          - community_board
          - council_district
          - census_tract
          - "nta_-_neighborhood_tabulation_area"
          - latitude
          - longitude
          - "latitude_(internal)"
          - "longitude_(internal)"
          - building_completion_date
          - reporting_construction_type
          - extended_affordability_only
          - prevailing_wage_status
          - extremely_low_income_units
          - very_low_income_units
          - low_income_units
          - moderate_income_units
          - middle_income_units
          - other_income_units
          - studio_units
          - "1-br_units"
          - "2-br_units"
          - "3-br_units"
          - "4-br_units"
          - "5-br_units"
          - "6-br+_units"
          - "unknown-br_units"
          - counted_rental_units
          - counted_homeownership_units
          - all_counted_units
          - total_units
    # ! Value-level cleanup (padding, thousands separators, '-' for null) is done in
    # ! products/developments/sql/_hny_union.sql rather than here. It's a no-op against
    # ! the Open Data version, so it can stay in place when reverting.
