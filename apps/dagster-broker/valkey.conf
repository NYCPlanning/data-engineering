# Valkey for dagster-broker: an in-memory, localhost-only sidecar (tracker inv-k0d.3).
# The queue is ephemeral by design: durable truth lives in Dagster and blob storage, and
# clients re-enqueue (producer) or abandon (worker) on 404 after a restart.

# Only the dagster-broker container (same pod / container app) may connect. No auth, no ingress.
bind 127.0.0.1 -::1
port 6379
protected-mode yes

# No persistence: nothing on disk, nothing to restore.
save ""
appendonly no

# REQUIRED. Without maxmemory the host OOM-kills Valkey; with any evicting policy Valkey
# would silently drop queued items under pressure. noeviction makes a full store refuse
# writes instead (dagster-broker answers 507), and dagster-broker's /readyz fails unless both are set.
# Size this below the sidecar container's memory limit.
maxmemory 256mb
maxmemory-policy noeviction
