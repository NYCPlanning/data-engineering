name: CSCL DuckDB
product: cscl
version: 26c
duckdb_filename: cscl.duckdb
# Same inputs as recipe.yml, loaded into DuckDB (cscl.duckdb, via duckdb_filename) instead of Postgres. Curved
# layers go through dcpy.geospatial.curves (linear table + <table>_arcs); every other GDB
# layer uses ST_Read. Datasets listed here replace the base's entry for the same
# (name, import_as), so they restate everything but the defaults.

base_recipe: recipe.yml

# exports: the base recipe's list of datasets, packaged parquet-first. Each gdb entry is
# exported as one GeoParquet per layer; `builds export package` folds them into the FGDBs.
exports:
  # outputs go in the lifecycle build dir ({DCPY_LIFECYCLE_DATA_DIR}/builds/build/cscl/<version>),
  # not recipe.yml's ./output
  output_folder: null
  package_from_parquet: true
  crs: EPSG:2263

stage_config:
  builds.build:
    commands:
      - name: dbt_deps
        run: dbt deps
      - name: dbt_seed
        run: dbt seed --target duckdb
      - name: dbt_run
        run: dbt run --target duckdb --selector duckdb_build
      - name: dbt_test
        run: dbt test --target duckdb --selector duckdb_build
  # run by `builds qa run`; results go in $QA_DIR (see poc_validation/paths.py). The QA
  # models need Postgres for production_outputs (--target duckdb_qa attaches it).
  builds.qa:
    commands:
      - name: qa_models
        run: dbt run --target duckdb_qa --select path:models/qa_int path:models/etl_dev_qa
      - name: pull_prod_files
        run: mkdir -p "$QA_DIR/prod" && python poc_validation/prod_data_loader.py pull
      - name: compare_flat_files
        run: bash poc_validation/validate_outputs.sh
      - name: summarize_diffs
        run: python poc_validation/summarize_diffs.py
      - name: compare_gdbs
        run: python poc_validation/compare_gdb.py
      - name: diffs_report
        run: python poc_validation/build_diffs_report.py
  # run by `builds export package`, after it folds the parquet layers into the FGDBs
  builds.package:
    commands:
      - name: generate_docs
        # needs target/manifest.json, which the build's dbt commands write
        run: python scripts/generate_docs.py --output "$PACKAGE_DIR/attachments/cscl_exports.md"

inputs:
  dataset_defaults:
    destination: duckdb
    file_type: gdb
    source: edm.recipes.raw_datasets
    load_engine: gdal
  missing_versions_strategy: find_latest
  datasets:
  - name: dcp_cscl_gdb
    import_as: dcp_cscl_centerline
    load_engine: curves
    custom:
      filename: ETL Working GDB.gdb.zip
      layer_name: Centerline
  - name: dcp_cscl_gdb
    import_as: dcp_cscl_shoreline
    load_engine: curves
    custom:
      filename: ETL Working GDB.gdb.zip
      layer_name: Shoreline
  - name: dcp_cscl_gdb
    import_as: dcp_cscl_rail
    load_engine: curves
    custom:
      filename: ETL Working GDB.gdb.zip
      layer_name: Rail
  - name: dcp_cscl_gdb
    import_as: dcp_cscl_subway
    load_engine: curves
    custom:
      filename: ETL Working GDB.gdb.zip
      layer_name: Subway
  - name: dcp_cscl_gdb
    import_as: dcp_cscl_nonstreetfeatures
    load_engine: curves
    custom:
      filename: ETL Working GDB.gdb.zip
      layer_name: NonStreetFeature
  - name: dcp_cscl_gdb
    import_as: dcp_cscl_atomicpolygons
    load_engine: curves
    custom:
      filename: ETL Working GDB.gdb.zip
      layer_name: AtomicPolygon
  - name: dcp_cscl_gdb
    import_as: dcp_cscl_businessimprovementdistrict
    load_engine: curves
    custom:
      filename: ETL Working GDB.gdb.zip
      layer_name: BusinessImprovementDistrict
  - name: dcp_cscl_gdb
    import_as: dcp_cscl_historicdistrict
    load_engine: curves
    custom:
      filename: ETL Working GDB.gdb.zip
      layer_name: HistoricDistrict
  - name: dcp_cscl_gdb
    import_as: dcp_cscl_urbanrenewalarea
    load_engine: curves
    custom:
      filename: ETL Working GDB.gdb.zip
      layer_name: UrbanRenewalArea
  - name: dcp_cscl_gdb
    import_as: dcp_cscl_zipcode
    load_engine: curves
    custom:
      filename: ETL Working GDB.gdb.zip
      layer_name: ZipCode
  - name: dcp_cscl_gdb
    import_as: dcp_cscl_nypdprecinct
    load_engine: curves
    custom:
      filename: ETL Working GDB.gdb.zip
      layer_name: NYPDPrecinct
  # all text, as the Postgres load (pandas, dtype=str) has it
  - name: dcp_cscl_temp_mock_previous_release
    source: edm.private
    version: 26B
    file_type: csv
    load_engine: pandas
    import_as: previous_citywide_lion
    custom:
      filename: citywide_lion_dat.csv
      all_varchar: true
  # all text, as the Postgres load (pandas, dtype=str) has it
  - name: dcp_cscl_temp_mock_previous_release
    source: edm.private
    version: 26B
    file_type: csv
    load_engine: pandas
    import_as: previous_ldf_header
    custom:
      filename: previous_ldf_header.csv
      all_varchar: true
