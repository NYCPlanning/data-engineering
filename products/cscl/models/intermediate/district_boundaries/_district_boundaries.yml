version: 2

# Shared pattern. Each district type is the same three models, parameterized by the
# int__topology__ap_entities column that holds its district id (macros/district_boundary.sql):
#   int__boundary__<d>_edges  view: every int__topology__edges row classified interior or
#                             exterior to the districts that own it
#   int__boundary__<d>_raw    table: polygons built from the exterior edges
#   int__boundary__<d>        table: raw with noise rings removed; entity_id is the key
# <d>wi variants include water: water APs count as part of the district.
# Every step outputs entity_id as its key. Models built from the topology are named for the
# district; int__boundary__pp and int__boundary__mcea_rows are the exceptions.

models:
- name: int__boundary__ct2010_edges
  description: "2010 census tract edges: every topology edge classified interior or exterior to its district."
- name: int__boundary__ct2010_raw
  description: "2010 census tract boundaries as polygonized from exterior edges, before noise-ring removal."
- name: int__boundary__ct2010
  description: "2010 census tract boundaries, one row per district."
  columns:
  - name: entity_id
    description: "District id, in the published layer's key format."
    tests: [ unique, not_null ]
  - name: geom
    description: "District boundary (multi)polygon."
    tests: [ not_null ]
- name: int__boundary__cb2010_edges
  description: "2010 census block edges: every topology edge classified interior or exterior to its district."
- name: int__boundary__cb2010_raw
  description: "2010 census block boundaries as polygonized from exterior edges, before noise-ring removal."
- name: int__boundary__cb2010
  description: "2010 census block boundaries, one row per district."
  columns:
  - name: entity_id
    description: "District id, in the published layer's key format."
    tests: [ unique, not_null ]
  - name: geom
    description: "District boundary (multi)polygon."
    tests: [ not_null ]
