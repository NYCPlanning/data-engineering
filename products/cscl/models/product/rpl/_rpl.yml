version: 2

models:
- name: rpl_by_field
  description: >-
    One row per roadbed segment associated with a generic (non-roadbed) segment, in
    Geosupport's Roadbed Pointer List order.
  config:
    contract:
      enforced: true
    tags: [export_doc]
    meta:
      each_row_is_a: A roadbed segment
      is_geospatial: true
      implementation_notes: >-
        Ordering is computed spatially: the right outermost roadbed is placed first,
        then right-side inner roadbeds from outermost to innermost, then the left
        outermost roadbed, then left-side inner roadbeds outermost to innermost. Side
        and relative position are determined by comparing each roadbed's perpendicular
        offset from the generic segment's midpoint against the right outermost
        roadbed's offset, using the sign of a cross product to tell which side a given
        roadbed falls on. generic_segmenttype assumes generic_segmentid is already a
        valid generic segment and doesn't re-validate it. The four NODEID fields are
        blank when a segment endpoint has no node in the underlying segment data; this
        is flagged separately as a build-time error. roadbed_position_code is always
        exactly one `R` and exactly one `L` per generic segment; `I` can occur any
        number of times, including zero.
  columns:
  - name: rpl_id
    data_type: string
    description: generic_segmentid + "_" + this record's position in the output order
      for that generic segment (1-based) - not a CSCL field, just the sort/join key
      this model builds.
  - name: generic_segmentid
    data_type: string
  - name: generic_segmenttype
    data_type: string
    description: >-
      SEGMENT_TYPE ('B' or 'G') of the generic segment's own LION record, looked up
      rather than copied directly from CSCL's RoadbedPointerList table.
  - name: roadbed_segmentid
    data_type: string
  - name: filler_rpl3
    data_type: string
  - name: roadbed_position_code
    data_type: string
    description: >-
      'R' for the single right outermost roadbed, 'L' for the single left outermost
      roadbed, 'I' for an inner roadbed (any number, including none). Copied from
      CSCL's RoadbedPointerList.ROADBED_POSITION_CODE.
    meta:
      value_labels:
        L: left outermost roadbed
        R: right outermost roadbed
        I: inner roadbed segment
  - name: filler_rpl4
    data_type: string
  - name: node_correspondence_indicator
    data_type: string
    description: >-
      Hardcoded to 'B' - every production record has this value today. CSCL's
      RoadbedPointerList table has its own NODE_CORRESPONDENCE_IND field, but it isn't
      read.
  - name: filler_rpl5
    data_type: string
  - name: from_node_level_code_of_coincident_roadbed_segment
    data_type: string
  - name: filler_rpl6
    data_type: string
  - name: to_node_level_code_of_coincident_roadbed_segment
    data_type: string
  - name: filler_rpl7
    data_type: string
  - name: from_nodeid_of_roadbed_segment
    data_type: string
    description: NODEID of the roadbed segment's from-endpoint.
  - name: filler_rpl8
    data_type: string
  - name: from_nodeid_of_generic_segment
    data_type: string
    description: NODEID of the generic segment's from-endpoint.
  - name: filler_rpl9
    data_type: string
  - name: to_nodeid_of_roadbed_segment
    data_type: string
    description: NODEID of the roadbed segment's to-endpoint.
  - name: filler_rpl10
    data_type: string
  - name: to_nodeid_of_generic_segment
    data_type: string
    description: NODEID of the generic segment's to-endpoint.
  - name: _rpl_key
    data_type: string
  data_tests:
  - test_name: dbt_utils.unique_combination_of_columns
    arguments:
      combination_of_columns:
      - generic_segmentid
      - roadbed_segmentid

- name: rpl
  config:
    contract:
      enforced: true
  columns:
  - name: dat_column
    data_type: string
    tests:
      - dbt_expectations.expect_column_value_lengths_to_equal:
          arguments: { value: 59 }
