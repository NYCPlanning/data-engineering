models:
- name: int__segment_atomicpolygons
  description: >
    segment segments joined to left and right atomic polygons. left_atomicid/right_atomicid
    and every left_*/right_* attribute come from the probe pair, or the topo pair when
    fix_lion_lr_from_topology is on; both pairs are always output.
  columns:
  - name: segmentid
    description: "Segment id."
    tests: [ not_null ]
  - name: segment_borocode
    description: "Borough code of the segment."
  # not_null disabled: 2 rows fail (inv-c73)
  # tests:
  # - not_null
  - name: left_atomicid
    description: "AtomicPolygon on the left of the segment."
  - name: left_borocode
    description: "Borough code of the left AtomicPolygon."
  - name: left_2000_census_tract
    description: "2000 census tract on the left side (6 characters)."
    tests:
    - dbt_expectations.expect_column_value_lengths_to_equal:
        arguments:
          value: 6
  - name: left_2000_census_tract_basic
    description: "Basic (4-digit) part of the 2000 census tract on the left side."
  - name: left_2000_census_tract_suffix
    description: "Suffix (2-digit) part of the 2000 census tract on the left side."
  - name: left_2010_census_tract
    description: "2010 census tract on the left side (6 characters)."
    tests:
    - dbt_expectations.expect_column_value_lengths_to_equal:
        arguments:
          value: 6
  - name: left_2010_census_tract_basic
    description: "Basic (4-digit) part of the 2010 census tract on the left side."
  - name: left_2010_census_tract_suffix
    description: "Suffix (2-digit) part of the 2010 census tract on the left side."
  - name: left_2020_census_tract
    description: "2020 census tract on the left side (6 characters)."
    tests:
    - dbt_expectations.expect_column_value_lengths_to_equal:
        arguments:
          value: 6
  - name: left_2020_census_tract_basic
    description: "Basic (4-digit) part of the 2020 census tract on the left side."
  - name: left_2020_census_tract_suffix
    description: "Suffix (2-digit) part of the 2020 census tract on the left side."
  - name: left_assembly_district
    description: "Assembly district on the left side."
  - name: left_election_district
    description: "Election district on the left side."
  - name: left_school_district
    description: "School district on the left side."
  - name: right_atomicid
    description: "AtomicPolygon on the right of the segment."
  - name: right_borocode
    description: "Borough code of the right AtomicPolygon."
  - name: right_2000_census_tract
    description: "2000 census tract on the right side (6 characters)."
    tests:
    - dbt_expectations.expect_column_value_lengths_to_equal:
        arguments:
          value: 6
  - name: right_2000_census_tract_basic
    description: "Basic (4-digit) part of the 2000 census tract on the right side."
  - name: right_2000_census_tract_suffix
    description: "Suffix (2-digit) part of the 2000 census tract on the right side."
  - name: right_2010_census_tract
    description: "2010 census tract on the right side (6 characters)."
    tests:
    - dbt_expectations.expect_column_value_lengths_to_equal:
        arguments:
          value: 6
  - name: right_2010_census_tract_basic
    description: "Basic (4-digit) part of the 2010 census tract on the right side."
  - name: right_2010_census_tract_suffix
    description: "Suffix (2-digit) part of the 2010 census tract on the right side."
  - name: right_2020_census_tract
    description: "2020 census tract on the right side (6 characters)."
    tests:
    - dbt_expectations.expect_column_value_lengths_to_equal:
        arguments:
          value: 6
  - name: right_2020_census_tract_basic
    description: "Basic (4-digit) part of the 2020 census tract on the right side."
  - name: right_2020_census_tract_suffix
    description: "Suffix (2-digit) part of the 2020 census tract on the right side."
  - name: right_assembly_district
    description: "Assembly district on the right side."
  - name: right_election_district
    description: "Election district on the right side."
  - name: right_school_district
    description: "School district on the right side."
  - name: probe_left_atomicid
    description: Left AP from the 2 ft offset probe (int__segment_offsets).
  - name: probe_right_atomicid
    description: Right AP from the 2 ft offset probe.
  - name: topo_left_atomicid
    description: Left AP from int__segment_topology_sides.
  - name: topo_right_atomicid
    description: Right AP from int__segment_topology_sides.
  - name: topo_method
    description: int__segment_topology_sides.method for the topo pair.
  data_tests: [] #
# disabled until source-data duplicates are resolved (inv-c73):
#- dbt_expectations.expect_table_row_count_to_equal_other_table:
#    compare_model: ref("int__segments")

- name: int__segment_offsets
  description: "One row per segment with a probe point 2 ft off each side of its midpoint, used to look up the polygon on each side."
  columns:
  - name: segmentid
    description: "Segment id."
  - name: boroughcode
    description: "Borough code."
  - name: left_line
  - name: right_line
  - name: left_offset_point
    description: "Point 2 ft to the left of the segment's midpoint."
  - name: right_offset_point
    description: "Point 2 ft to the right of the segment's midpoint."

- name: int__segment_topology_vertices
  description: Segment vertices that sit on an AP topology node, with their position along the segment.
  columns:
  - name: globalid
    description: "GlobalID of the segment."
    tests: [ not_null ]
  - name: idx
    description: Vertex index in the segment's linearized geometry (1-based).
  - name: along_ft
    description: Distance along the segment to this vertex.
  - name: node_id
    description: "Topology node the vertex sits on."
    tests: [ not_null ]
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - globalid
        - idx

- name: int__segment_topology_edge_matches
  description: >
    The AP topology edges each segment runs along: one row per step between consecutive
    snapped vertices, and one row per edge for a step matched to a path.
  columns:
  - name: globalid
    description: "GlobalID of the segment."
    tests: [ not_null ]
  - name: match_type
    description: "How the step was matched: edge, path, same_node or none."
    tests:
    - not_null
    - accepted_values:
        arguments: { values: [ "edge", "path", "same_node", "none" ] }
  - name: from_node
    description: Edge node the segment enters by (NULL unless matched).
  - name: to_node
    description: Edge node the segment leaves by.
  - name: covers_midpoint
    description: This edge holds the segment's midpoint (exactly one per matched segment).
  - name: len_diff_ft
    description: Length difference between the step and its edge or path.
  - name: offset_ft
    description: Hausdorff distance between the step and its edge or path (0 for a straight step on a straight edge).

- name: int__segment_topology_sides
  description: Left/right AtomicPolygon of every segment from the AP topology, with the probe as fallback.
  columns:
  - name: globalid
    description: "GlobalID of the segment."
    tests: [ unique, not_null ]
  - name: method
    description: "How the sides were found: edges, probe_fallback, out_of_scope or bad_geom."
    tests:
    - not_null
    - accepted_values:
        arguments: { values: [ "edges", "probe_fallback", "out_of_scope", "bad_geom" ] }
  - name: topo_left_atomicid
    description: "Left AtomicPolygon from the topology edges the segment runs along."
  - name: topo_right_atomicid
    description: "Right AtomicPolygon from the topology edges the segment runs along."
  - name: topo_left_source
    description: "'edge', 'probe' (lion_lr_fallback_probe_offset_ft) or 'probe_2ft' (out_of_scope / bad_geom)."
    tests:
    - not_null
    - accepted_values:
        arguments: { values: [ "edge", "probe", "probe_2ft" ] }
  - name: topo_right_source
    tests:
    - not_null
    - accepted_values:
        arguments: { values: [ "edge", "probe", "probe_2ft" ] }
  - name: starts_on_node
    description: The segment's first vertex sits on a topology node.
  - name: ends_on_node
    description: The segment's last vertex sits on a topology node.
  - name: n_unmatched_steps
  - name: n_edges
    description: Matched edges along the whole segment.
  - name: n_path_edges
    description: Of those, edges in multi-edge paths.
  - name: max_len_diff_ft
  - name: max_offset_ft
  - name: n_left_aps
    description: Distinct APs on the left along all matched edges (more than 1 where the segment crosses an AP corner).
  - name: n_right_aps

- name: int__segment_zipcodes
  description: "Left and right ZIP code of each segment, from the ZIP polygon containing each offset point (lowest ogc_fid where polygons overlap)."
  columns:
  - name: globalid
    description: "GlobalID of the segment."
  - name: l_zip
    description: "ZIP code on the left side."
  - name: r_zip
    description: "ZIP code on the right side."
- name: int__segment_nypdbeat
  description: "NYPD sector and service area on each side of each segment, from the beat polygon containing each offset point."
  columns:
  - name: left_nypd_sector
    description: "NYPD sector on the left side."
  - name: right_nypd_sector
    description: "NYPD sector on the right side."
  - name: left_nypd_service_area
    description: "NYPD service area on the left side. Set for housing police (HP) beats only."
  - name: right_nypd_service_area
    description: "NYPD service area on the right side. Set for housing police (HP) beats only."

unit_tests:
# CSCL-LION-16. Three APs side by side: A (x 0-10), B (x 10-10.5, a sliver) and C (x 10.5-20).
# Segment 1 runs along A|B: the 2 ft probe overshoots B into C on the right, the topology
# says B. Segment 2 matches no edge: the topology falls back to the probe, so both agree. The
# var fix_lion_lr_from_topology picks which pair fills left_/right_atomicid and the
# attributes; both pairs are output either way.
# sql fixtures: CI runs unit tests without building the upstream models, so dbt can't read
# their column types
- name: test__int__segment_atomicpolygons__probe_by_default
  description: "Default (fix_lion_lr_from_topology false): side APs from prod's 2 ft probe."
  model: int__segment_atomicpolygons
  overrides:
    vars:
      fix_lion_lr_from_topology: false
  given: &side_ap_given
  - input: ref('int__segment_offsets')
    format: sql
    rows: |
      SELECT * FROM (VALUES
        ('{g1}', 'k1', 1, '1', ST_Point(8, 5), ST_Point(12, 5)),
        ('{g2}', 'k2', 2, '1', ST_Point(8, 7), ST_Point(12, 7))
      ) AS t (globalid, lionkey, segmentid, boroughcode, left_offset_point, right_offset_point)
  - input: ref('int__segment_topology_sides')
    format: sql
    rows: |
      SELECT * FROM (VALUES
        ('{g1}', '1000001', '1000002', 'edges'),
        ('{g2}', '1000001', '1000003', 'probe_fallback')
      ) AS t (globalid, topo_left_atomicid, topo_right_atomicid, method)
  - input: ref('stg__atomicpolygons')
    format: sql
    rows: |
      SELECT
        atomicid, '1' AS borocode, cd AS commdist,
        NULL::INT AS censustract_1990_basic, NULL::INT AS censustract_1990_suffix,
        NULL::INT AS censustract_2000_basic, NULL::INT AS censustract_2000_suffix,
        NULL AS censustract_2000,
        NULL::INT AS censustract_2010_basic, NULL::INT AS censustract_2010_suffix,
        NULL AS censustract_2010,
        NULL::INT AS censustract_2020_basic, NULL::INT AS censustract_2020_suffix,
        NULL AS censustract_2020,
        NULL::INT AS censusblock_2000_basic, NULL AS censusblock_2000_suffix,
        NULL::INT AS censusblock_2010_basic, NULL::INT AS censusblock_2010_suffix,
        NULL::INT AS censusblock_2020_basic, NULL::INT AS censusblock_2020_suffix,
        NULL AS assemdist, NULL AS electdist, NULL AS schooldist,
        ST_GeomFromText(wkt) AS geom
      FROM (VALUES
        ('1000001', '101', 'POLYGON((0 0, 10 0, 10 10, 0 10, 0 0))'),
        ('1000002', '102', 'POLYGON((10 0, 10.5 0, 10.5 10, 10 10, 10 0))'),
        ('1000003', '103', 'POLYGON((10.5 0, 20 0, 20 10, 10.5 10, 10.5 0))')
      ) AS t (atomicid, cd, wkt)
  expect:
    rows:
    - {segmentid: 1, left_atomicid: '1000001', right_atomicid: '1000003', right_community_district: '103', probe_left_atomicid: '1000001', probe_right_atomicid: '1000003', topo_left_atomicid: '1000001', topo_right_atomicid: '1000002'}
    - {segmentid: 2, left_atomicid: '1000001', right_atomicid: '1000003', right_community_district: '103', probe_left_atomicid: '1000001', probe_right_atomicid: '1000003', topo_left_atomicid: '1000001', topo_right_atomicid: '1000003'}
- name: test__int__segment_atomicpolygons__topology_behind_flag
  description: "fix_lion_lr_from_topology true: side APs from the AP topology, the probe where it has none."
  model: int__segment_atomicpolygons
  overrides:
    vars:
      fix_lion_lr_from_topology: true
  given: *side_ap_given
  expect:
    rows:
    - {segmentid: 1, left_atomicid: '1000001', right_atomicid: '1000002', right_community_district: '102', probe_left_atomicid: '1000001', probe_right_atomicid: '1000003', topo_left_atomicid: '1000001', topo_right_atomicid: '1000002'}
    - {segmentid: 2, left_atomicid: '1000001', right_atomicid: '1000003', right_community_district: '103', probe_left_atomicid: '1000001', probe_right_atomicid: '1000003', topo_left_atomicid: '1000001', topo_right_atomicid: '1000003'}
