    custom:
      destination_use: attachment
  - id: shapefile
    custom:
      destination_use: dataset_file
  custom:
    four_four: frkw-si7h
- id: bytes
  type: bytes
  files:
  - id: dcm_multilayer
    custom:
      url: https://s-media.nyc.gov/agencies/dcp/assets/files/zip/data-tools/bytes/nyc_zoning_features_shp.zip
  - id: oti_data_dictionary
    custom:
      url: https://s-media.nyc.gov/agencies/dcp/assets/files/pdf/data-tools/bytes/zoning_districts_data_dictionary.xlsx

files:
