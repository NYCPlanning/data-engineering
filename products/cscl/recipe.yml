name: CSCL
product: cscl
version: 26c
duckdb_filename: cscl.duckdb

# The LDF documents the change between two LION releases, and its header also needs
# thined.txt's own undocumented header tags - all of it values nothing in source data
# records, so GR's tools take them as operator input and so do we. They live in
# seeds/config.csv (see that seed's description in seeds.yml), not here - a plain seed row
# needs no --vars flag and no script to translate it into one, unlike the old
# scripts/ldf_vars.py mechanism this replaced.

inputs:
  dataset_defaults:
    destination: duckdb
    file_type: gdb
    source: edm.recipes.raw_datasets
    load_engine: gdal
  missing_versions_strategy: find_latest # TODO - they should all match
  datasets:
  # segment source layers - backbone
  - name: dcp_cscl_gdb
    import_as: dcp_cscl_centerline
    # curved geometry: linear table + <table>_arcs via dcpy.geospatial.curves
    load_engine: curves
    custom:
      filename: ETL Working GDB.gdb.zip
      layer_name: Centerline
  - name: dcp_cscl_gdb
    import_as: dcp_cscl_shoreline
    # curved geometry: linear table + <table>_arcs via dcpy.geospatial.curves
    load_engine: curves
    custom:
      filename: ETL Working GDB.gdb.zip
      layer_name: Shoreline
  - name: dcp_cscl_gdb
    import_as: dcp_cscl_rail
    # curved geometry: linear table + <table>_arcs via dcpy.geospatial.curves
    load_engine: curves
    custom:
      filename: ETL Working GDB.gdb.zip
      layer_name: Rail
  - name: dcp_cscl_gdb
    import_as: dcp_cscl_subway
    # curved geometry: linear table + <table>_arcs via dcpy.geospatial.curves
    load_engine: curves
    custom:
      filename: ETL Working GDB.gdb.zip
      layer_name: Subway
  - name: dcp_cscl_gdb
    import_as: dcp_cscl_nonstreetfeatures
    # curved geometry: linear table + <table>_arcs via dcpy.geospatial.curves
    load_engine: curves
    custom:
      filename: ETL Working GDB.gdb.zip
      layer_name: NonStreetFeature

  # other more "primary" layers
  - name: dcp_cscl_gdb
    import_as: dcp_cscl_atomicpolygons
    # curved geometry: linear table + <table>_arcs via dcpy.geospatial.curves
    load_engine: curves
    custom:
      filename: ETL Working GDB.gdb.zip
      layer_name: AtomicPolygon
  - name: dcp_cscl_gdb
    import_as: dcp_cscl_nodes
    custom:
      filename: ETL Working GDB.gdb.zip
      layer_name: Node
  # node -> intersecting-segment lookup and virtual-intersection flags, used together to
  # derive gdb_node's VIntersect (see the legacy Create_Node_Shape script). No 26c archive
  # yet (last archived 26a) - missing_versions_strategy: find_latest picks that up instead.
  - name: dcp_cscl_gdb
    import_as: dcp_cscl_streetshaveintersections
    custom:
      filename: ETL Working GDB.gdb.zip
      layer_name: STREETSHAVEINTERSECTIONS
  - name: dcp_cscl_gdb
