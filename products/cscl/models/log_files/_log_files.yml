version: 2

models:
- name: log
  description: >-
    The build log, exported as log.csv: one row per record a LION or SAF check flagged
    (error or warning), one row per ThinLION lookup that found nothing, plus one summary
    row per exported flat file with its record count. Each row comes from one log__*
    model, named in _dbt_source_relation, and carries the id of its message in the
    log_messages seed (see seeds.yml). The models emit the id and the message body;
    this model takes effect from the seed and prefixes the message with the id.
  columns:
  - name: _dbt_source_relation
    description: The log__* model the row came from.
  - name: log_level
    description: "`error`, `warning`, or `info` (file summary rows)."
  - name: log_message_id
    description: >-
      The row's message in the log_messages seed: prod's message (CSCL-LOG-LION-05) or
      one only we log (CSCL-LOG-OURS-NN).
    tests:
    - not_null
    - relationships:
        arguments:
          to: ref('log_messages')
          field: id
  - name: effect
    description: >-
      What happens to the record, from log_messages: `dropped`, `warned`, `summary` or
      `run_level`.
    tests:
    - not_null
    - accepted_values:
        arguments:
          values: [dropped, warned, summary, run_level]
  - name: error_category
    description: >-
      The check that produced the row, e.g. `borough mismatch`, or `output file
      summary` for a file summary row.
  - name: globalid
    description: >-
      GlobalID of the flagged source feature. Blank on file summary and ThinLION lookup
      rows.
  - name: source_feature_layer
    description: >-
      Source layer of the flagged feature (centerline, altsegmentdata, commonplace,
      ...); atomicpolygons on ThinLION lookup rows. Blank on file summary rows.
  - name: record_id_type
    description: >-
      What record_id holds: `segmentid`, or `placeid` for SAF CommonPlace rows. Blank on
      file summary and ThinLION lookup rows.
  - name: record_id
    description: The flagged record's id, per record_id_type. Blank on file summary rows.
  - name: message
    description: >-
      "[<log_message_id>] " then prod's wording for that message, filled with our values.
      Prod prints OIDs, which we don't carry, so where prod says OID we print the
      GlobalID (PlaceID on SAF CommonPlace rows). OURS rows have wording of their own.
  - name: output_filename
    description: Exported file name. File summary rows only.
  - name: record_count
    description: >-
      Number of records written to output_filename on file summary rows; the number of
      atomic polygons the lookup left blank on ThinLION lookup rows.

- name: log__export_file_summary
  description: >-
    One row per exported flat file (log.csv excluded) with its record count, like
    prod's "Total <file> output records: N" report lines. Files prod writes such a line
    for carry that line's id (CSCL-LOG-SAF-01 for Intersection.txt); the rest share
    CSCL-LOG-OURS-05.

- name: log__lion_centerline_boro_mismatch
  description: >-
    LION rows whose borough differs from their source feature's own borough (the
    centerline's boroughcode, or the proto segment's borough). A blank source borough is
    derived downstream, as in prod, and isn't flagged. Logged as CSCL-LOG-OURS-04: prod's
    similar "does not match the borough currently being extracted" message
    (CSCL-LOG-LION-20) is unreachable.

- name: log__saf_invalid_b7sc
  description: >-
    G/N/X CommonPlaces with a B7SC shorter than 8 characters (blank included), which SAF
    leaves out. Prod's "[DATA ERROR] The B7SC value of '' is not valid" check
    (CSCL-LOG-SAF-22).

- name: log__saf_name_missing
  description: >-
    G/N/X CommonPlaces SAF leaves out because their B7SC has no principal name in the
    FeatureName or StreetName table. Prod's "[NAME MISSING]" check (CSCL-LOG-SAF-23).

- name: log__saf_segment_not_found
  description: >-
    SAF records SAF leaves out because their SEGMENTID matches no segment: A/B/C/E/P
    AltSegmentData rows with no Centerline (CSCL-LOG-SAF-21), G/N/X CommonPlaces with no
    Centerline, Shoreline, Rail or Subway feature (CSCL-LOG-SAF-25).

- name: log__thinlion_lookup_not_found
  description: >-
    ThinLION's CensusTract2020, CensusTract2010 and HealthArea lookups that find nothing,
    one row per distinct lookup with the number of atomic polygons it leaves blank in
    record_count. Prod logs the same message ("Could not find a <feature class> feature
    using query '<query>'.", CSCL-LOG-THIN-01..03) once per atomic polygon.

- name: log__lion_segments_missing_nypd
  description: >-
    LION segments with no NYPD beat on either side. Logged as CSCL-LOG-OURS-03: prod has
    a message for this (CSCL-LOG-LION-06) but never calls the check.
