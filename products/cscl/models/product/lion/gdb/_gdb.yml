version: 2

# Layers of the published LION geodatabase (nyclion_*.zip; ETL spec §2.7).
# Column names are the geodatabase's own field names.

models:
  - name: gdb_lion
    description: >-
      LION segments as lines: one feature per LION record, with the same segments, attributes
      and districts as the LION files, plus segments the LION files leave out (rail and subway
      segments of right-of-way type 1 or 8, centerlines of roadway type 8). A segment can have several features with the same geometry: a
      continuous-parity segment has one for its odd and one for its even house numbers, and a
      segment with special address file (SAF) data has one more for each SAF record, carrying
      that record's name, type, house numbers and Join_ID. A segment whose street name is
      blank is not written.
    config:
      tags: [export_doc]
      meta:
        each_row_is_a: A LION segment record, continuous-parity copy or SAF record on a segment
        is_geospatial: true
    columns:
      - name: SegmentID
        description: 7-digit segment ID, zero-filled. Repeats across the features of one segment.
        data_tests:
          - not_null
      - name: Street
        description: The segment's principal street or feature name.
      - name: SAFStreetName
        description: The SAF record's street or place name on a SAF feature, padded to 32 characters; blank otherwise.
      - name: SAFStreetCode
        description: The SAF record's street code on a SAF feature; null otherwise.
      - name: SpecAddr
        description: The SAF record type (A, B, C, D, E, G, N, O, P, S, V or X) on a SAF feature; null otherwise.
      - name: StreetCode
        description: Borough code followed by the segment's 5-digit street code.
      - name: RB_Layer
        description: >-
          Which map layer the segment belongs to: N for segments excluded from the Geosupport
          street network (IncExFlag E), R for roadbeds (segment types C, R, S, T), G for generic
          segments (types G, F), B otherwise.
      - name: TrafSrc
        description: "Who verified the traffic direction: FLD, DCP or DOT."
      - name: SegCount
        description: >-
          Number of records on this segment: its own features (SAF and continuous-parity
          features included), plus one for each SAF record of the segment that isn't written
          as a feature, plus one for each other segment of the same feature class (centerline
          with centerline, rail with rail) on the same two nodes with the same geometry.
          Capped at 9.
      - name: LBoro
        description: Borough code on the left; null when the left side is in another borough (BoroBndry L).
      - name: RBoro
        description: Borough code on the right; null when the right side is in another borough (BoroBndry R).
      - name: LZip
        description: >-
          Zip code on the left. On a SAF feature, the SAF record's zip code where it has one;
          for SAF types D and F, only on the side with the SAF record's house numbers.
      - name: RZip
        description: >-
          Zip code on the right. On a SAF feature, the SAF record's zip code where it has one;
          for SAF types D and F, only on the side with the SAF record's house numbers.
      - name: MH_RI_Flag
        description: >-
          M for a Manhattan segment beside 2000 census tract 309 (Marble Hill), R for a Bronx
          segment beside 2000 census tract 1 (Rikers Island); null otherwise.
      - name: SplitSchl
        description: Always null (a one-character filler in the LION files).
      - name: ArcCenterX
        description: X coordinate of the center of curvature for a curved segment; 0 otherwise.
      - name: ArcCenterY
        description: Y coordinate of the center of curvature for a curved segment; 0 otherwise.
      - name: Radius
        description: Radius of curvature for a curved segment; 0 otherwise.
      - name: LLo_Hyphen
        description: >-
          Lowest house number on the left, as written (hyphenated for Queens-style numbers).
          On a continuous-parity segment, one feature carries the odd range and the other the
          even range, both on the side where the addresses are, with the other side empty. On
          a SAF feature, the SAF record's house numbers. Empty on generic segments (SegmentTyp
          G) and on features other than ordinary streets, private streets and addressable
          paths. SegmentTyp F keeps its house numbers, as in prod, unless the
          zero_f_segment_house_numbers setting is on (CSCL-LION-24).
      - name: LHi_Hyphen
        description: Highest house number on the left, as written. Same rules as LLo_Hyphen.
      - name: RLo_Hyphen
        description: Lowest house number on the right, as written. Same rules as LLo_Hyphen.
      - name: RHi_Hyphen
        description: Highest house number on the right, as written. Same rules as LLo_Hyphen.
      - name: FromLeft
        description: >-
          LLo_Hyphen as an integer: the hyphen is dropped and the digits after it are
          zero-filled to three (so 37-05 is 37005). 0 when empty.
      - name: ToLeft
        description: LHi_Hyphen as an integer, formed the same way as FromLeft.
      - name: FromRight
        description: RLo_Hyphen as an integer, formed the same way as FromLeft.
      - name: ToRight
        description: RHi_Hyphen as an integer, formed the same way as FromLeft.
      - name: Join_ID
        description: >-
          Links the feature to its alternate names in the altnames table. 15 characters. On a
          segment feature: borough, face code and LGC1 to LGC4 (two digits each, 00 if none),
          then two spaces. On a SAF feature: borough, the SAF record's street code, LGC1 to
          LGC4, then the SAF type.
      - name: LegacyID
        description: The segment's legacy segment ID, 7 digits zero-filled; 0000000 if it has none.
      - name: SHAPE_Length
        description: Segment length in feet.
      - name: geom
        description: Segment line geometry (MultiLineString, EPSG:2263), with arcs where CSCL has them.
        data_tests:
          - not_null

  - name: gdb_node
    description: >-
      LION nodes as points: every CSCL node, except a virtual-intersection node that no
      segment meets.
    config:
      tags: [export_doc]
      meta:
        each_row_is_a: A LION node
    columns:
      - name: NODEID
        description: Node ID, matching NodeIDFrom and NodeIDTo on the lion layer.
        data_tests:
          - not_null
      - name: GLOBALID
        description: Globally unique identifier of the node in CSCL.
      - name: VIntersect
        description: VirtualIntersection if the node is a virtual intersection that at least one segment meets; null otherwise.
      - name: geom
        description: Node point geometry (Point, EPSG:2263)
        data_tests:
          - not_null

  - name: gdb_node_stname
    description: >-
      Street names at each node, as a table without geometry: for each node, the principal
      name of each segment that meets it, once per distinct name. A street name is built from
      CSCL's parsed name parts, which are already abbreviated (W 174 ST); a feature name, where
      the street code has one, replaces it. A segment with neither, such as a subway, rail,
      shoreline or non-street boundary, takes its own label.
    config:
      tags: [export_doc]
      meta:
        each_row_is_a: A street name at a node
    columns:
      - name: NODEID
        description: Node ID, matching NODEID on the node layer.
        data_tests:
          - not_null
      - name: STNAME
        description: Principal street or feature name of a segment that meets the node.
        data_tests:
          - not_null

  - name: gdb_altnames
    description: >-
      Alternate street and feature names, as a table without geometry, keyed by the lion
      layer's Join_ID: for each Join_ID, every name of the street codes it covers, from CSCL's
      StreetName (names flagged for DCP use) and FeatureName tables, once per distinct name. A
      SAF feature's names are those of its host segment's street codes (with the SAF record's
      own street code for types B, C, D, E, O and P), not the names of the SAF record itself
      (CSCL-LION-09).
    config:
      tags: [export_doc]
      meta:
        each_row_is_a: An alternate name for a Join_ID
    columns:
      - name: PDir
        description: Pre-directional part of a street name (for example W); null for feature names.
      - name: PType
        description: Pre-type part of a street name; null for feature names.
      - name: SName
        description: Basic street name, or the whole name for a feature name. At most 30 characters.
      - name: SType
        description: Street type part of a street name (for example ST); null for feature names.
      - name: SDir
        description: Post-directional part of a street name; null for feature names.
      - name: Street
        description: The whole name as one string.
      - name: Join_ID
        description: Links the name to the lion layer's features with the same Join_ID.
        data_tests:
          - not_null

# sql fixtures: CI runs unit tests without building the upstream models, so dbt can't read
# their column types. Columns gdb_lion doesn't test are NULL.
# Segment 1 is a centerline whose source seqnum isn't 5 wide and whose STREETWIDTH_MAX is 0,
# with one SAF record; 2 is a rail segment with no seqnum or width; 3 is an ordinary centerline.
unit_tests:
  - name: test__gdb_lion__seqnum_zero_filled
    description: "SeqNum is 5 wide, zero-filled, and 00000 when the source has none (as prod), on base and SAF rows."
    model: gdb_lion
    given: &gdb_lion_given
      - input: ref('int__lion')
        format: sql
        rows: |
          SELECT
            t.*,
            '1' || '0100' || coalesce(t.segment_seqnum, '') AS lionkey,
            TRUE AS include_in_bytes_lion,
            'TEST STREET' AS street,
            '1' AS boroughcode,
            '0100' AS face_code,
            '10001' AS five_digit_street_code,
            '01' AS lgc1, NULL::TEXT AS lgc2, NULL::TEXT AS lgc3, NULL::TEXT AS lgc4, NULL::TEXT AS lgc5,
            NULL::TEXT AS lgc6, NULL::TEXT AS lgc7, NULL::TEXT AS lgc8, NULL::TEXT AS lgc9,
            '1' AS boe_lgc_pointer,
            ST_GEOMFROMTEXT('LINESTRING (0 0, 10 0)') AS geom,
            NULL::TEXT AS active_flag, NULL::TEXT AS bike_lane_2, NULL::TEXT AS bike_traffic_direction,
            NULL::TEXT AS borough_boundary_indicator, NULL::TEXT AS carto_display_level,
            NULL::DOUBLE AS center_of_curvature_radius, NULL::DOUBLE AS center_of_curvature_x,
            NULL::DOUBLE AS center_of_curvature_y, ' ' AS continuous_parity_flag, NULL::TEXT AS curve_flag,
            NULL::TEXT AS fcc, NULL::INT AS fdnyid, NULL::TEXT AS feature_type_code, NULL::TEXT AS from_level_code,
            1 AS from_nodeid, NULL::TEXT AS from_quarter_sectionalmap, 0 AS from_x, 0 AS from_y,
            NULL::INT AS genericid, NULL::TEXT AS incex_flag, NULL::INT AS l_blockfaceid,
            NULL::TEXT AS l_high_hn, NULL::TEXT AS l_low_hn, NULL::TEXT AS l_zip,
            NULL::INT AS left_1990_census_tract_basic, NULL::TEXT AS left_1990_census_tract_suffix,
            NULL::INT AS left_2000_census_block_basic, NULL::TEXT AS left_2000_census_block_suffix,
            NULL::INT AS left_2000_census_tract_basic, NULL::TEXT AS left_2000_census_tract_suffix,
            NULL::INT AS left_2010_census_block_basic, NULL::TEXT AS left_2010_census_block_suffix,
            NULL::INT AS left_2010_census_tract_basic, NULL::TEXT AS left_2010_census_tract_suffix,
            NULL::INT AS left_2020_census_block_basic, NULL::TEXT AS left_2020_census_block_suffix,
            NULL::INT AS left_2020_census_tract_basic, NULL::TEXT AS left_2020_census_tract_suffix,
            NULL::TEXT AS left_assembly_district, NULL::TEXT AS left_borocode,
            NULL::TEXT AS left_community_district, NULL::TEXT AS left_dynamic_block,
            NULL::TEXT AS left_election_district, NULL::TEXT AS left_nypd_service_area,
            NULL::TEXT AS left_school_district, NULL::INT AS legacy_segmentid, NULL::TEXT AS lsubsect,
            NULL::TEXT AS nonped, NULL::INT AS number_park_lanes, NULL::INT AS number_total_lanes,
            NULL::INT AS number_travel_lanes, NULL::INT AS nypdid, NULL::INT AS physicalid,
            NULL::INT AS posted_speed, NULL::INT AS r_blockfaceid, NULL::TEXT AS r_high_hn,
            NULL::TEXT AS r_low_hn, NULL::TEXT AS r_zip,
            NULL::INT AS right_1990_census_tract_basic, NULL::TEXT AS right_1990_census_tract_suffix,
            NULL::INT AS right_2000_census_block_basic, NULL::TEXT AS right_2000_census_block_suffix,
            NULL::INT AS right_2000_census_tract_basic, NULL::TEXT AS right_2000_census_tract_suffix,
            NULL::INT AS right_2010_census_block_basic, NULL::TEXT AS right_2010_census_block_suffix,
            NULL::INT AS right_2010_census_tract_basic, NULL::TEXT AS right_2010_census_tract_suffix,
            NULL::INT AS right_2020_census_block_basic, NULL::TEXT AS right_2020_census_block_suffix,
            NULL::INT AS right_2020_census_tract_basic, NULL::TEXT AS right_2020_census_tract_suffix,
            NULL::TEXT AS right_assembly_district, NULL::TEXT AS right_borocode,
            NULL::TEXT AS right_community_district, NULL::TEXT AS right_dynamic_block,
            NULL::TEXT AS right_election_district, NULL::TEXT AS right_nypd_service_area,
            NULL::TEXT AS right_of_way_type, NULL::TEXT AS right_school_district, NULL::TEXT AS rsubsect,
            NULL::TEXT AS rw_type, NULL::TEXT AS sandist_ind, NULL::TEXT AS segment_locational_status,
            NULL::TEXT AS snow_priority, NULL::TEXT AS split_election_district_flag, NULL::TEXT AS status,
            NULL::TEXT AS streetwidth_irr, NULL::INT AS streetwidth_min_with_zeros,
            NULL::TEXT AS to_level_code, 2 AS to_nodeid, NULL::TEXT AS to_quarter_sectionalmap,
            10 AS to_x, 0 AS to_y, NULL::TEXT AS trafdir_ver_flag, NULL::TEXT AS traffic_direction,
            NULL::TEXT AS truck_route_type, NULL::TEXT AS twisted_parity_flag
          FROM (VALUES
            (1, 'g1', 'C', '840', NULL::INT, 0),
            (2, 'g2', 'T', NULL, NULL::INT, NULL::INT),
            (3, 'g3', 'U', '00123', 60, 60)
          ) AS t (segmentid, globalid, segment_type, segment_seqnum, streetwidth_max, streetwidth_max_with_zeros)
      - input: ref('int__saf_replicant_fields')
        format: sql
        rows: |
          SELECT
            '10100840' AS lionkey, TRUE AS is_written, 'SAF STREET' AS saf_street_name, 'B' AS specaddr,
            '110002' AS saf_street_code, NULL::TEXT AS l_zip, NULL::TEXT AS r_zip, NULL::TEXT AS parity_side,
            NULL::TEXT AS l_low_hn, NULL::TEXT AS l_high_hn, NULL::TEXT AS r_low_hn, NULL::TEXT AS r_high_hn,
            '11000201000000B' AS join_id
      - input: ref('int__lion_house_number_zeroing')
        format: sql
        rows: |
          SELECT * FROM (VALUES ('g1', FALSE), ('g2', TRUE), ('g3', FALSE)) AS t (globalid, zero_house_numbers)
      - input: ref('int__lion_segcount')
        format: sql
        rows: |
          SELECT * FROM (VALUES (1, 2), (2, 1), (3, 1)) AS t (segmentid, n_records)
    # dict expect: only the tested columns (dbt reads their types from the model's output)
    expect:
      rows:
        - {SegmentID: '0000001', SpecAddr: null, SeqNum: '00840'}
        - {SegmentID: '0000001', SpecAddr: 'B', SeqNum: '00840'}
        - {SegmentID: '0000002', SpecAddr: null, SeqNum: '00000'}
        - {SegmentID: '0000003', SpecAddr: null, SeqNum: '00123'}
