models:
- name: int__segment_specialaddress
  description: "Special address flag per segment and borough, from the SAF records on the segment (altsegmentdata first, then address points and CommonPlace). Differs from prod on segment 241972 (CSCL-LION-17) and on one ramp protosegment (CSCL-LION-19)."
  columns:
  - name: segmentid
    description: "Segment id."
  - name: boroughcode
    description: "Borough code."
  - name: special_address_flag
    description: "Highest-priority SAF type on the segment (seed_saf_priority); SAF type F is reported as D."

- name: int__segment_locational_status
  description: |
    Centerline segments with Locational Status & Borough Boundary Indicator columns.
  columns:
  - name: segmentid
    description: "Segment id."
    tests:
    - not_null
  # unique disabled: one record fails (inv-c73)
  # - unique
  - name: borough_boundary_indicator
    description: "R or L: the side of the segment that lies outside the borough or city, where it runs along a boundary."
    tests:
    - test_name: accepted_values
      arguments:
        values: [ 'R', 'L' ]
  - name: is_ap_boro_boundary_error
    tests:
    - test_name: accepted_values
      arguments:
        values: [ false ]
      config:
        severity: warn
  - name: segment_locational_status
    description: "LION segment locational status code. Uses 2010 census tracts, as prod does (issue #2193)."
    tests:
    - test_name: accepted_values
      arguments:
        values: [ '9', 'H', 'I', '1', '2', '3', '4', '5', 'X' ]
  data_tests:
  - test_name: dbt_expectations.expect_table_row_count_to_equal_other_table
    arguments:
      compare_model: ref("int__segment_atomicpolygons")

- name: int__centerline_curve
  description: "Curved centerline segments (curve flag L, R or I) with the center and radius of curvature, rounded the way prod rounds them."
  columns:
  - name: curve_flag
    description: "Curve flag from the centerline."
  - name: no_center_found
    description: "True for an L or R curve whose start, middle and end points are collinear: no circle fits, so the center is the segment midpoint (as in prod, CSCL-LOG-LION-08)."
  - name: center_out_of_range
    description: "True for an L or R curve whose fitted center, rounded, doesn't fit prod's 7-character fields: the center is the segment midpoint (as in prod, CSCL-LOG-LION-07)."
  - name: fitted_center_x
    description: "X of the circle through the start, middle and end points, before any midpoint fallback."
  - name: fitted_center_y
    description: "Y of that circle's center."
  - name: fitted_radius
    description: "That circle's radius."
  - name: center_of_curvature_x
    description: "X of the center of curvature."
  - name: center_of_curvature_y
    description: "Y of the center of curvature."
  - name: center_of_curvature_radius
    description: "Radius: distance from the rounded center to the segment's start point."
- name: int__noncenterline_curve_flag
  description: >-
    Curve flag (LION L49) of each segment that isn't a centerline (shoreline, subway, rail,
    non-street feature and their proto-segments): I if the shape has more than two points.
    Prod counts the source shape, where a circular arc is two points, so a segment that is
    one arc end to end is blank (CSCL-LION-03); the fix counts the densified line.
  columns:
  - name: globalid
    description: "GlobalID of the segment (of the proto-segment for a proto)."
  - name: source_table
    description: "The segment's source table."
  - name: source_point_count
    description: "Points of the source shape (of the parent, for a proto-segment), as Esri counts them: an arc's ends, not the vertices it is densified to."
  - name: densified_point_count
    description: "Points of the densified line."
  - name: curve_flag_prod
    description: "Prod's curve flag: I if source_point_count is above 2 (ShorelineExtractFile.cs:422, GetHasShapePoints)."
  - name: curve_flag_fixed
    description: "The fixed curve flag: I if densified_point_count is above 2, so a single arc is I too."
  - name: curve_flag
    description: "The curve flag LION and the LION gdb get: curve_flag_fixed when the var fix_single_arc_curve_flag is true, else curve_flag_prod (the default)."

- name: int__split_election_district
  description: "One row per segment and LION key that appears in the split election district (SEDAT) table, flagged L, R or B by the sides it covers."
  columns:
  - name: split_election_district_flag
    description: "L, R or B (both): the sides of the segment that have SEDAT records."

- name: int__lion_segcount
  description: >-
    One row per LION gdb segment with its record count (n_records): its own records, SAF
    replicants and records not written, plus coincident segments of the same feature
    class. gdb_lion writes it as SegCount, capped at 9 (CSCL-LOG-BYTES-12 logs the cap).

unit_tests:
# CSCL-LION-03. Shoreline S1 is one arc end to end, densified to 5 points: 2 source points,
# so prod writes blank and the fix I. S2 is two arcs (3 source points) and S3 a 2-point
# line: both rules agree. P1 is S1's proto-segment and counts S1's shape. Rail R1 has the
# same ogc_fid as S1 but no arcs (a 3-point line). Centerline C1 isn't flagged here.
# sql fixtures: CI runs unit tests without building the upstream models, so dbt can't read
# their column types
- name: test__int__noncenterline_curve_flag__prod_rule
  description: "Default (fix_single_arc_curve_flag false): a single arc is blank, as prod."
  model: int__noncenterline_curve_flag
  overrides:
    vars:
      fix_single_arc_curve_flag: false
  given: &curve_given
  - input: ref('int__segments')
    format: sql
    rows: |
      SELECT globalid, feature_type, source_table, source_class_rank, source_objectid,
        ST_GEOMFROMTEXT(wkt) AS geom, ST_GEOMFROMTEXT(wkt) AS raw_geom
      FROM (VALUES
        ('S1', 'shoreline', 'shoreline', 4, 10, 'LINESTRING (0 0, 1 1, 2 1.4, 3 1, 4 0)'),
        ('S2', 'shoreline', 'shoreline', 4, 11, 'LINESTRING (0 0, 1 1, 2 1.4, 3 1, 4 0, 5 -1, 6 -1.4, 7 -1, 8 0)'),
        ('S3', 'shoreline', 'shoreline', 4, 12, 'LINESTRING (0 0, 4 0)'),
        ('P1', 'nonstreetfeatures', 'altsegmentdata', 4, 10, 'LINESTRING (0 0, 1 1, 2 1.4, 3 1, 4 0)'),
        ('R1', 'rail_and_subway', 'rail', 3, 10, 'LINESTRING (0 0, 1 1, 4 0)'),
        ('C1', 'centerline', 'centerline', 1, 10, 'LINESTRING (0 0, 1 1, 2 1.4, 3 1, 4 0)')
      ) AS t (globalid, feature_type, source_table, source_class_rank, source_objectid, wkt)
  - input: source('recipe_sources', 'dcp_cscl_shoreline_arcs')
    format: sql
    rows: |
      SELECT * FROM (VALUES (10, 0, 4), (11, 0, 4), (11, 4, 8)) AS t (ogc_fid, v0, v1)
  - input: source('recipe_sources', 'dcp_cscl_centerline_arcs')
    format: sql
    rows: |
      SELECT * FROM (VALUES (10, 0, 4)) AS t (ogc_fid, v0, v1)
  - input: source('recipe_sources', 'dcp_cscl_nonstreetfeatures_arcs')
    format: sql
    rows: |
      SELECT * FROM (VALUES (0, 0, 0)) AS t (ogc_fid, v0, v1) WHERE FALSE
  - input: source('recipe_sources', 'dcp_cscl_rail_arcs')
    format: sql
    rows: |
      SELECT * FROM (VALUES (0, 0, 0)) AS t (ogc_fid, v0, v1) WHERE FALSE
  - input: source('recipe_sources', 'dcp_cscl_subway_arcs')
    format: sql
    rows: |
      SELECT * FROM (VALUES (0, 0, 0)) AS t (ogc_fid, v0, v1) WHERE FALSE
  expect:
    rows:
    - {globalid: S1, source_point_count: 2, curve_flag_prod: null, curve_flag_fixed: I, curve_flag: null}
    - {globalid: S2, source_point_count: 3, curve_flag_prod: I, curve_flag_fixed: I, curve_flag: I}
    - {globalid: S3, source_point_count: 2, curve_flag_prod: null, curve_flag_fixed: null, curve_flag: null}
    - {globalid: P1, source_point_count: 2, curve_flag_prod: null, curve_flag_fixed: I, curve_flag: null}
    - {globalid: R1, source_point_count: 3, curve_flag_prod: I, curve_flag_fixed: I, curve_flag: I}
- name: test__int__noncenterline_curve_flag__fixed
  description: "fix_single_arc_curve_flag true: a single arc is I."
  model: int__noncenterline_curve_flag
  overrides:
    vars:
      fix_single_arc_curve_flag: true
  given: *curve_given
  expect:
    rows:
    - {globalid: S1, source_point_count: 2, curve_flag_prod: null, curve_flag_fixed: I, curve_flag: I}
    - {globalid: S2, source_point_count: 3, curve_flag_prod: I, curve_flag_fixed: I, curve_flag: I}
    - {globalid: S3, source_point_count: 2, curve_flag_prod: null, curve_flag_fixed: null, curve_flag: null}
    - {globalid: P1, source_point_count: 2, curve_flag_prod: null, curve_flag_fixed: I, curve_flag: I}
    - {globalid: R1, source_point_count: 3, curve_flag_prod: I, curve_flag_fixed: I, curve_flag: I}
