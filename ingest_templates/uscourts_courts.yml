id: uscourts_courts

attributes:
  name: US Courts NY Southern District and Eastern District Courts
  description: >-
    Federal court offices in NYC, read by facdb.
    uscourts.gov blocks scrapers, so this is built by hand from the court finder and uploaded to the edm-recipes inbox.
    Start from the latest archive's csv and keep its columns, which match what facdb's uscourts_courts.sql reads.
  url: https://www.uscourts.gov/federal-court-finder/find

ingestion:
  source:
    type: s3
    bucket: edm-recipes
    key: inbox/uscourts/{{ version }}/uscourts_courts.csv
  file_format:
    type: csv
    dtype: str
  processing_steps:
  # facdb's sql reads `wkt` unquoted
  - name: clean_column_names
    args: { "lower": True }
