id: edc_capitalprojects

attributes:
  name: EDC Capital Projects
  description: >-
    NYC Economic Development Corporation capital projects. Received from EDC by email as a
    zipped shapefile and manually uploaded to the inbox. The source CRS has changed between
    deliveries, so check the .prj and that the output lands in NYC before archiving.

ingestion:
  target_crs: EPSG:4326
  source:
    type: s3
    bucket: edm-recipes
    key: inbox/edc_capitalprojects/CCP_EDC_{{ version }}.zip
  file_format:
    type: shapefile
    unzipped_filename: CCP_EDC_{{ version }}.shp
    crs: EPSG:3857
  processing_steps:
  - name: clean_column_names
    args: { "lower": True }
  - name: multi
  - name: rename_columns
    args:
      map: { "geom": "wkb_geometry" }

columns:
- id: pjid
  data_type: text
- id: wkb_geometry
  data_type: geometry
