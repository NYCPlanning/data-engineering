- name: int__ct2010_keys
  description: >-
    One row per 2010 census tract (borough and tract): the BoroCT2010, NTACode and NTAName
    nyct2010 and nyct2010wi write. Prod copies the source tract's BOROCT and
    NEIGHBORHOOD_CODE and looks NTAName up by that code; ours keys the tract by its borough
    and tract and takes the NTA from NeighborhoodPUMACodes by borough and tract
    (CSCL-DISTRICTS-10). Which one the layers get is the var key_tracts_by_borough (default
    false, prod's).
  columns:
  - name: boroct
    description: "Borough code followed by tract, as the AtomicPolygons key the tract (stg__censustract2010.boroct)."
    tests: [ unique, not_null ]
  - name: source_boroct
    description: "The source tract's BOROCT, unchanged."
  - name: nta_code_prod
    description: "The source tract's NEIGHBORHOOD_CODE, which prod writes as NTACode."
  - name: nta_name_prod
    description: "NEIGHBORHOOD_NAME of the first NeighborhoodPUMACodes row (by ogc_fid) with nta_code_prod, as prod looks it up."
  - name: nta_code_borough
    description: "NEIGHBORHOOD_CODE of the tract's NeighborhoodPUMACodes row by borough and tract."
  - name: nta_name_borough
    description: "NEIGHBORHOOD_NAME of that row."
  - name: boroct2010
    description: "What nyct2010(wi) write as BoroCT2010: boroct when the var key_tracts_by_borough is true, else source_boroct (the default)."
  - name: nta_code
    description: "What they write as NTACode: nta_code_borough when key_tracts_by_borough is true, else nta_code_prod."
  - name: nta_name
    description: "What they write as NTAName: nta_name_borough when key_tracts_by_borough is true, else nta_name_prod."
- name: int__district_invalid_source_polygons
  description: >-
    One row per feature of nybid, nyhez or nycdwi (the layers prod copies unclipped from a
    source feature class) whose source polygon is invalid: rings that cross, or a shell
    inside another shell (CSCL-DISTRICTS-04). The layers publish source_geom, as prod,
    unless the var make_valid_district_polygons is true; their SHAPE_Area and SHAPE_Length
    come from the valid polygon either way.
  columns:
  - name: source_layer
    description: "The published layer: nybid, nyhez or nycdwi."
    tests: [ not_null ]
  - name: key_value
    description: "The feature's key in that layer: BIDID, HURRICANE_EVACUATION_ZONE or BoroCD."
    tests: [ not_null ]
  - name: source_geom
    description: "The source polygon as stored (linear), invalid."
  - name: source_area_sqft
    description: "Area of source_geom as GEOS computes it on the invalid rings (a shell inside a shell counts twice)."
  - name: valid_area_sqft
    description: "Area of source_geom made valid (st_makevalid), which is what prod's SHAPE_Area is."
- name: int__nta2010_county_fips
  description: >-
    One row per 2010 NTA: the borough holding most of its AtomicPolygon area and the
    CountyFIPS nynta2010 gets. Prod looks CountyFIPS up in the NTA's first
    NeighborhoodPUMACodes row and leaves it blank where that row's FIPS code is blank, or
    there is no row; ours takes the borough's (CSCL-DISTRICTS-09). Which one nynta2010 gets
    is the var fill_nta_county_fips_from_borough (default false, prod's).
  columns:
  - name: nta2010
    description: "2010 NTA code."
    tests: [ unique, not_null ]
  - name: borocode
    description: "Borough holding most of the NTA's AtomicPolygon area."
  - name: npc_fips_code
    description: "FIPS_CODE of the NTA's first NeighborhoodPUMACodes row (by ogc_fid), null when blank or when there is no row."
  - name: county_fips_prod
    description: "npc_fips_code padded to three, as prod writes it: null (blank) when npc_fips_code is."
  - name: county_fips_borough
    description: "The borough's FIPS code (stg__borough.fips)."
  - name: county_fips
    description: "What nynta2010 uses: county_fips_borough when the var fill_nta_county_fips_from_borough is true, else county_fips_prod (the default)."
