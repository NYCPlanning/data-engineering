id: dcp_sfpsd

attributes:
  name: Static Facilities
  description: >-
    Facilities from state, regional, and other non-city agencies, read by facdb.
    These records don't change. The 2021 Bytes download is gone, so the inbox csv is library's archive of it, already filtered to the sfpsd tables.

ingestion:
  source:
    type: s3
    bucket: edm-recipes
    key: inbox/dcp/dcp_sfpsd/{{ version }}/dcp_sfpsd.csv
  file_format:
    type: csv
    dtype: str
