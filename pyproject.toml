[tool.sqlfluff.core]
verbose = 1
dialect = "postgres"
templater = "placeholder"

# Comma separated list of rules to exclude, or None
exclude_rules = [
    "ambiguous.column_count",
    "references.qualification",
    "structure.unused_cte",
    "structure.column_order",
    "structure.else_null",
    "structure.subquery",
    "references.keywords",
    "references.consistent",
    "references.special_chars",
    "layout.cte_newline",
    # Build SQL runs against ephemeral build tables in a single-user build DB,
    # where CONCURRENTLY index DDL is inappropriate (it can't run in a transaction).
    "postgres.excessive_locks",
]

# The standard max_line_length is 80 in line with the convention of
# other tools and several style guides. Many projects however prefer
# something a little longer.
# Set to zero or negative to disable checks.
max_line_length = 120

# CPU processes to use while linting.
# The default is "single threaded" to allow easy debugging, but this
# is often undesirable at scale.
# If positive, just implies number of processes.
# If negative or zero, implies number_of_cpus - specified_number.
# e.g. -1 means use all processors but one. 0 means all cpus.
processes = -1

large_file_skip_byte_limit = 40000

# Maximum parse depth (grammar + bracket nesting). Prevents DoS from deeply nested SQL. Set to 0 or empty to disable. Default 255 (Oracle WHERE subquery limit).
max_parse_depth = 415 # this limit is driven by products/cscl/models/districts/gdb_nysd.sql

[tool.sqlfluff.templater.placeholder]
param_style = "colon_optional_quotes"
TABLE = "dummy_table_name"
VERSION = "2023-01-01"
VERSION_PREV = "2022-01-01"
CONDO = "true"
MAPPED = "true"
CONDITION = "WHERE a.geom IS NOT NULL"
GEOM = "geom_2263"
ccp_v = "fisa_2000"
build_schema = "public"
CAPTURE_DATE = "2024-01-01"
CAPTURE_DATE_PREV = "2023-07-01"
internal_columns = '"Job_Number","Job_Type"'
external_columns = '"Job_Number","Job_Type"'

[tool.sqlfluff.templater.jinja.macros]
# Lint-only stub. sqlfluff loads macros into a bare jinja environment without
# dbt builtins, so the real macro body cannot be rendered here; the models it
# generates are covered by their dbt tests instead.
longform_by_boundary = "{% macro longform_by_boundary(boundary_table, boundary_cols, suffix) %}SELECT 1 AS placeholder{% endmacro %}"
match_geometry = "{% macro match_geometry(source_model) %}SELECT 1 AS placeholder{% endmacro %}"
cpp_housing_growth = "{% macro cpp_housing_growth(geography_type, kpdb_model, kpdb_geo_column, housing_column) %}SELECT 1 AS placeholder{% endmacro %}"

[tool.sqlfluff.templater.jinja.context]
source_column = "bct2020"
output_column = "bct2020"
additional_column_mappings = '[("geoid", "centract2020")]'
group_by = '["boro", "bct2020", "centract2020"]'
join_table = "dcp_ct2020"
geom_join_column = "boroct2020"
years = "['2010', '2011']"
decade = "2020"
geom = "CD"
CAPTURE_DATE = "2024-01-01"
geography_type = "anything"
geography_name = "anything"
geography_id = "anything"
table_name = "anything"

[tool.sqlfluff.rules.layout.long_lines]
ignore_comment_lines = true
ignore_comment_clauses = true

[tool.sqlfluff.rules.capitalisation.keywords]
capitalisation_policy = "upper"

[tool.sqlfluff.templater.dbt]
dialect = "postgres"

[tool.pydocstyle]
ignore = ["D100", "D101", "D102", "D107", "D104", "D213", "D407", "D413"]

[tool.ruff.lint]
select = [
    # Default rulesets
    "E4",   # Subset of pycodestyle
    "E7",
    "E9",
    "F",    # Pyflakes
    # Additional rulesets
    "I",    # Sort imports properly
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "E402"]
"conftest.py" = ["E402"]
"setup_dev_bucket.py" = ["E402"]
"apps/qa/src/pages/source_data/*.py" = ["I001"]

[tool.ruff.lint.isort]
# dcpy split into a uv workspace (packages under python/*/) rather than one directory
# at the repo root, so ruff can no longer auto-detect it as first-party for files
# outside those packages (admin/, apps/, products/, etc). Declare it explicitly.
# Same story for apps/qa's and apps/dagster's own local packages - ruff can't
# auto-detect them as first-party either, so they get lumped in with third-party
# imports unless listed here too.
known-first-party = [
    "dcpy",
    "shared",         # apps/qa
    "app_globals",    # apps/qa
    "pages",          # apps/qa
    "dagster_utils",  # apps/dagster
    "ingest",         # apps/dagster
    "builds",         # apps/dagster
]

[tool.mypy]
# dcpy is a uv workspace now (each package under python/*/ has its own dcpy/ dir, merged
# at runtime into one namespace package by the editable installs' import hooks). mypy
# doesn't execute those hooks, so it needs every package root listed here to resolve
# dcpy.* imports from files outside that package (e.g. dcpy/test_integration, products/*,
# admin/ops).
mypy_path = [
    "python/utils",
    "python/connectors",
    "python/data",
    "python/geospatial",
    "python/geosupport",
    "python/library",
    "python/lifecycle",
    "python/product-metadata",
]

[[tool.mypy.overrides]]
module = "geopandas.*,geosupport.*,cerberus.*,osgeo.*,diagrams.*,usaddress.*,plotly.*,folium.*,streamlit_folium.*,st_aggrid.*,numerize.*,moto.*,matplotlib.*,contextily,leafmap.*,shapely,shapely.*,socrata.*,faker.*,ruamel.*,pyogrio.*,ijson.*,socks" # no stubs available
ignore_missing_imports = true

# `uv sync --all-packages` (the usual local dev setup) installs every dcpy-* package
# into one shared venv, so `pytest python/utils/test` etc. can pass by silently
# importing a sibling package that was never declared as a real dependency - each
# package's test/test_package_boundary.py only fails the way it's supposed to when
# that package is synced in isolation. Run `bash/run_isolated_tests.sh` (mirrors the
# CI job in .github/workflows/test_helper.yml) to sync + test each package that way
# and actually reproduce those failures.
[tool.pytest.ini_options]
xfail_strict = true
addopts = "--strict-markers"
markers = ["end_to_end"]

[tool.coverage.run]
# Measure branch coverage (https://coverage.readthedocs.io/en/latest/branch.html)
branch = true
omit = ["python/*/test/*", "dcpy/test_integration/*"]

[tool.coverage.report]
include_namespace_packages = true
show_missing = true
# Regexes for lines to exclude from consideration
exclude_lines = [
    # Have to re-enable the standard pragma
    "pragma: no cover",
    # Don't complain if non-runnable code isn't run:
    "if __name__ == .__main__.:",
    "@app.command",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.uv.workspace]
members = ["python/*", "apps/qa", "apps/dagster", "apps/notebook-server"]

# The root pyproject.toml is mostly a virtual workspace container: each dcpy-* package
# under python/ has its own test/ dir, own pyproject.toml, and own [dependency-groups]
# dev with exactly the pytest/moto/faker/stubs its tests need. `uv sync` from here
# installs the whole workspace against one shared uv.lock.
#
# The one exception is dcpy/test_integration, which stayed at its original repo-root
# location (dev-only, not distributed, spans multiple packages) rather than being split
# apart. It's plain pytest-discovered-by-path (nothing imports it as `dcpy.test_integration`),
# so it doesn't need to be part of the installable dcpy namespace - the [project] table
# below exists only so this root pyproject.toml can carry its own [dependency-groups] dev.
[project]
name = "dcpy-test-suite"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = []

# Dependencies of one-off product/notebook scripts under products/ and notebooks/ - not
# dcpy code, and products/ isn't a uv workspace member, so these have no other home.
# Exported for the `dev` image via `uv export --package dcpy-test-suite --extra products`.
[project.optional-dependencies]
products = [
    "cached-property",
    "contextily",
    "msal>=1.23.0",
    "openlayers",
    "simplejson",
    "tqdm>=4.59.0",
    "us",
]

[tool.uv]
package = false

[dependency-groups]
# CI/lint/test tooling - kept in one group so a narrow `uv sync --only-group dev` (no
# --all-packages, no products extra) is enough for jobs that only need these tools, not
# dcpy code. dbt-postgres/dbt-duckdb are also a real dependency of dcpy-lifecycle (it shells
# out to `dbt` at runtime) - listed here too so the sqlfluff dbt-templater lint step gets a
# `dbt` CLI without pulling in dcpy-lifecycle's GDAL/geopandas closure. Same lock either way,
# so no drift risk from declaring it twice.
dev = [
    "pytest",
    "pytest-xdist",
    "types-setuptools",
    "types-tqdm",
    "sqlfluff",
    "sqlfluff-templater-dbt",
    "mypy",
    "ruff",
    "pre-commit",
    "pytest-cov",
    "dbt-postgres",
    "dbt-duckdb",
]
