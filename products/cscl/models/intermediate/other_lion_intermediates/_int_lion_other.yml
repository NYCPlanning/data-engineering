models:
- name: int__segment_specialaddress
  description: "Special address flag per segment and borough, from the SAF records on the segment (altsegmentdata first, then address points and CommonPlace). Differs from prod on segment 241972 (CSCL-LION-17). int__lion takes a ramp protosegment's flag from int__ramp_proto_special_address instead (CSCL-LION-19)."
  columns:
  - name: segmentid
    description: "Segment id."
  - name: boroughcode
    description: "Borough code."
  - name: special_address_flag
    description: "Highest-priority SAF type on the segment (seed_saf_priority); SAF type F is reported as D."

- name: int__segment_locational_status
  description: |
    Centerline segments with Locational Status & Borough Boundary Indicator columns. The
    locational status comes two ways, prod's (2010 census tracts) and the spec's (2020
    census tracts); var fix_seg_loc_status_2020_tract picks one (CSCL-LION-11).
  columns:
  - name: segmentid
    description: "Segment id."
    tests:
    - not_null
  # unique disabled: one record fails (inv-c73)
  # - unique
  - name: borough_boundary_indicator
    description: "R or L: the side of the segment that lies outside the borough or city, where it runs along a boundary."
    tests:
    - test_name: accepted_values
      arguments:
        values: [ 'R', 'L' ]
  - name: is_ap_boro_boundary_error
    tests:
    - test_name: accepted_values
      arguments:
        values: [ false ]
      config:
        severity: warn
  - name: prod_segment_locational_status
    description: "Prod's segment locational status: X where the left and right AtomicPolygons, in the same borough, have different 2010 census tracts (CenterlineExtractFile.cs:1447-1452, issue #2193)."
  - name: spec_segment_locational_status
    description: "The spec's segment locational status: as prod_segment_locational_status, but X where their 2020 census tracts differ (CSCL-LION-11)."
  - name: segment_locational_status
    description: "LION segment locational status code (L41): prod_segment_locational_status, or spec_segment_locational_status with the var fix_seg_loc_status_2020_tract on."
    tests:
    - test_name: accepted_values
      arguments:
        values: [ '9', 'H', 'I', '1', '2', '3', '4', '5', 'X' ]
  data_tests:
  - test_name: dbt_expectations.expect_table_row_count_to_equal_other_table
    arguments:
      compare_model: ref("int__segment_atomicpolygons")

- name: int__centerline_curve
  description: "Curved centerline segments (curve flag L, R or I) with the center and radius of curvature, rounded the way prod rounds them."
  columns:
  - name: curve_flag
    description: "Curve flag from the centerline."
  - name: no_center_found
    description: "True for an L or R curve whose start, middle and end points are collinear: no circle fits, so the center is the segment midpoint (as in prod, CSCL-LOG-LION-08)."
  - name: center_out_of_range
    description: "True for an L or R curve whose fitted center, rounded, doesn't fit prod's 7-character fields: the center is the segment midpoint (as in prod, CSCL-LOG-LION-07)."
  - name: fitted_center_x
    description: "X of the circle through the start, middle and end points, before any midpoint fallback."
  - name: fitted_center_y
    description: "Y of that circle's center."
  - name: fitted_radius
    description: "That circle's radius."
  - name: center_of_curvature_x
    description: "X of the center of curvature."
  - name: center_of_curvature_y
    description: "Y of the center of curvature."
  - name: center_of_curvature_radius
    description: "Radius: distance from the rounded center to the segment's start point."
- name: int__noncenterline_curve_flag
  description: >-
    Curve flag (LION L49) of each segment that isn't a centerline (shoreline, subway, rail,
    non-street feature and their proto-segments): I if the shape has more than two points.
    Prod counts the source shape, where a circular arc is two points, so a segment that is
    one arc end to end is blank (CSCL-LION-03); the fix counts the densified line.
  columns:
  - name: globalid
    description: "GlobalID of the segment (of the proto-segment for a proto)."
  - name: source_table
    description: "The segment's source table."
  - name: source_point_count
    description: "Points of the source shape (of the parent, for a proto-segment), as Esri counts them: an arc's ends, not the vertices it is densified to."
  - name: densified_point_count
    description: "Points of the densified line."
  - name: curve_flag_prod
    description: "Prod's curve flag: I if source_point_count is above 2 (ShorelineExtractFile.cs:422, GetHasShapePoints)."
  - name: curve_flag_fixed
    description: "The fixed curve flag: I if densified_point_count is above 2, so a single arc is I too."
  - name: curve_flag
    description: "The curve flag LION and the LION gdb get: curve_flag_fixed when the var fix_single_arc_curve_flag is true, else curve_flag_prod (the default)."

- name: int__lion_house_number_zeroing
  description: >-
    One row per LION gdb segment (int__lion, include_in_bytes_lion): whether the LION gdb
    zeroes its house numbers (all eight fields, on its own records and its SAF replicants).
    Prod's LION gdb copies the source's house numbers on every row (the legacy tool's
    zeroing, SegmentTyp G or F or FeatureTyp not 0, 6 or W, is never called), so by default
    nothing is zeroed. Each part of the legacy rule is behind its own var: G with
    zero_generic_house_numbers (CSCL-LION-15), F with zero_f_segment_house_numbers
    (CSCL-LION-24), FeatureTyp not 0, 6 or W with zero_feature_type_house_numbers
    (CSCL-LION-29).
  columns:
  - name: globalid
    description: "GlobalID of the segment (of the proto-segment for a proto)."
    tests:
    - unique
    - not_null
  - name: segment_type
    description: "The segment's SEGMENT_TYPE (int__lion.segment_type)."
  - name: feature_type_code
    description: "The LION gdb FeatureTyp: the feature type code, 0 when blank."
  - name: has_house_numbers
    description: "True if any of the segment's own four house numbers is nonblank and not 0."
  - name: zero_for_feature_type
    description: "FeatureTyp not 0, 6 or W: the FeatureTyp part of the legacy tool's rule, zeroed only with the var zero_feature_type_house_numbers true (CSCL-LION-29)."
  - name: zero_house_numbers_legacy
    description: "SegmentTyp G or F, or FeatureTyp not 0, 6 or W: the legacy tool's rule (ImportLION2_ToGDB, BytesLION_CSCL_workflow_tool_PUB.py:326-361, which the tool's main flow never calls)."
  - name: zero_house_numbers
    description: "What gdb_lion uses: zero_for_feature_type with the var zero_feature_type_house_numbers true, or SegmentTyp G with zero_generic_house_numbers true, or SegmentTyp F with zero_f_segment_house_numbers true. With all three false (the default) nothing is zeroed, as prod's LION gdb; with all three true it is zero_house_numbers_legacy."

- name: int__ramp_proto_special_address
  description: >-
    Special address flag (LION L48) of each ramp proto-segment (ALT_SEGDATA_TYPE R). Prod
    gives it the first of S, N, G (else the first record) among the SAF records it
    attributes to the centerline's proto-segments: AltSegmentData SAF rows with a ramp's
    LIONKEY, address points whose B7SC_ACTUAL starts with a ramp's B5SC, and a borough
    boundary proto's records of its own borough (CSCL-LION-19); the legacy rule leaves a ramp
    blank.
  columns:
  - name: globalid
    description: "GlobalID of the ramp proto-segment."
  - name: segmentid
    description: "Segment id."
  - name: special_address_flag_prod
    description: "Prod's flag (CenterlineExtractFile.cs:2665, GetSpecialAddressFlag)."
  - name: special_address_flag_fixed
    description: "The legacy rule's flag: always blank."
  - name: special_address_flag
    description: "The flag LION gets: special_address_flag_fixed when the var fix_ramp_proto_special_address is true, else special_address_flag_prod (the default)."

- name: int__split_election_district
  description: "One row per segment and LION key that appears in the split election district (SEDAT) table, flagged L, R or B by the sides it covers."
  columns:
  - name: split_election_district_flag
    description: "L, R or B (both): the sides of the segment that have SEDAT records."

- name: int__lion_segcount
  description: >-
    One row per LION gdb segment with its record count (n_records): its own records, SAF
    replicants and records not written, plus coincident segments of the same feature
    class. gdb_lion writes it as SegCount, capped at 9 (CSCL-LOG-BYTES-12 logs the cap).

unit_tests:
- name: test__int__segment_locational_status__tract__prod
  description: >-
    Default (fix_seg_loc_status_2020_tract false): prod's 2010 tracts. Each segment has two
    AtomicPolygons in the same borough. Segment 1's 2010 tracts differ and its 2020 tracts
    don't; segment 2's the other way round; segment 3's both differ; segment 4's neither.
  model: int__segment_locational_status
  overrides:
    vars:
      fix_seg_loc_status_2020_tract: false
  given: &seg_loc_status_tract_given
  - input: ref('int__segment_atomicpolygons')
    format: sql
    rows: |
      SELECT * FROM (VALUES
        ('g1', 'k1', 1, 1, 'a1', 1, '000100', '000100', 'b1', 1, '000200', '000100'),
        ('g2', 'k2', 2, 1, 'a2', 1, '000100', '000100', 'b2', 1, '000100', '000201'),
        ('g3', 'k3', 3, 1, 'a3', 1, '000100', '000100', 'b3', 1, '000200', '000200'),
        ('g4', 'k4', 4, 1, 'a4', 1, '000100', '000100', 'b4', 1, '000100', '000100')
      ) AS t (
        globalid, lionkey, segmentid, segment_borocode,
        left_atomicid, left_borocode, left_2010_census_tract, left_2020_census_tract,
        right_atomicid, right_borocode, right_2010_census_tract, right_2020_census_tract
      )
  - input: ref('int__segments_to_nodes')
    format: sql
    rows: |
      SELECT * FROM (VALUES ('g1', 1)) AS t (globalid, nodeid)
  expect:
    rows:
    - {segmentid: 1, prod_segment_locational_status: X, spec_segment_locational_status: null, segment_locational_status: X}
    - {segmentid: 2, prod_segment_locational_status: null, spec_segment_locational_status: X, segment_locational_status: null}
    - {segmentid: 3, prod_segment_locational_status: X, spec_segment_locational_status: X, segment_locational_status: X}
    - {segmentid: 4, prod_segment_locational_status: null, spec_segment_locational_status: null, segment_locational_status: null}
- name: test__int__segment_locational_status__tract__spec
  description: >-
    fix_seg_loc_status_2020_tract true: the same segments, by the spec's 2020 tracts.
  model: int__segment_locational_status
  overrides:
    vars:
      fix_seg_loc_status_2020_tract: true
  given: *seg_loc_status_tract_given
  expect:
    rows:
    - {segmentid: 1, prod_segment_locational_status: X, spec_segment_locational_status: null, segment_locational_status: null}
    - {segmentid: 2, prod_segment_locational_status: null, spec_segment_locational_status: X, segment_locational_status: X}
    - {segmentid: 3, prod_segment_locational_status: X, spec_segment_locational_status: X, segment_locational_status: X}
    - {segmentid: 4, prod_segment_locational_status: null, spec_segment_locational_status: null, segment_locational_status: null}
# CSCL-LION-03. Shoreline S1 is one arc end to end, densified to 5 points: 2 source points,
# so prod writes blank and the fix I. S2 is two arcs (3 source points) and S3 a 2-point
# line: both rules agree. P1 is S1's proto-segment and counts S1's shape. Rail R1 has the
# same ogc_fid as S1 but no arcs (a 3-point line). Centerline C1 isn't flagged here.
# sql fixtures: CI runs unit tests without building the upstream models, so dbt can't read
# their column types
- name: test__int__noncenterline_curve_flag__prod_rule
  description: "Default (fix_single_arc_curve_flag false): a single arc is blank, as prod."
  model: int__noncenterline_curve_flag
  overrides:
    vars:
      fix_single_arc_curve_flag: false
  given: &curve_given
  - input: ref('int__segments')
    format: sql
    rows: |
      SELECT globalid, feature_type, source_table, source_class_rank, source_objectid,
        ST_GEOMFROMTEXT(wkt) AS geom, ST_GEOMFROMTEXT(wkt) AS raw_geom
      FROM (VALUES
        ('S1', 'shoreline', 'shoreline', 4, 10, 'LINESTRING (0 0, 1 1, 2 1.4, 3 1, 4 0)'),
        ('S2', 'shoreline', 'shoreline', 4, 11, 'LINESTRING (0 0, 1 1, 2 1.4, 3 1, 4 0, 5 -1, 6 -1.4, 7 -1, 8 0)'),
        ('S3', 'shoreline', 'shoreline', 4, 12, 'LINESTRING (0 0, 4 0)'),
        ('P1', 'nonstreetfeatures', 'altsegmentdata', 4, 10, 'LINESTRING (0 0, 1 1, 2 1.4, 3 1, 4 0)'),
        ('R1', 'rail_and_subway', 'rail', 3, 10, 'LINESTRING (0 0, 1 1, 4 0)'),
        ('C1', 'centerline', 'centerline', 1, 10, 'LINESTRING (0 0, 1 1, 2 1.4, 3 1, 4 0)')
      ) AS t (globalid, feature_type, source_table, source_class_rank, source_objectid, wkt)
  - input: source('recipe_sources', 'dcp_cscl_shoreline_arcs')
    format: sql
    rows: |
      SELECT * FROM (VALUES (10, 0, 4), (11, 0, 4), (11, 4, 8)) AS t (ogc_fid, v0, v1)
  - input: source('recipe_sources', 'dcp_cscl_centerline_arcs')
    format: sql
    rows: |
      SELECT * FROM (VALUES (10, 0, 4)) AS t (ogc_fid, v0, v1)
  - input: source('recipe_sources', 'dcp_cscl_nonstreetfeatures_arcs')
    format: sql
    rows: |
      SELECT * FROM (VALUES (0, 0, 0)) AS t (ogc_fid, v0, v1) WHERE FALSE
  - input: source('recipe_sources', 'dcp_cscl_rail_arcs')
    format: sql
    rows: |
      SELECT * FROM (VALUES (0, 0, 0)) AS t (ogc_fid, v0, v1) WHERE FALSE
  - input: source('recipe_sources', 'dcp_cscl_subway_arcs')
    format: sql
    rows: |
      SELECT * FROM (VALUES (0, 0, 0)) AS t (ogc_fid, v0, v1) WHERE FALSE
  expect:
    rows:
    - {globalid: S1, source_point_count: 2, curve_flag_prod: null, curve_flag_fixed: I, curve_flag: null}
    - {globalid: S2, source_point_count: 3, curve_flag_prod: I, curve_flag_fixed: I, curve_flag: I}
    - {globalid: S3, source_point_count: 2, curve_flag_prod: null, curve_flag_fixed: null, curve_flag: null}
    - {globalid: P1, source_point_count: 2, curve_flag_prod: null, curve_flag_fixed: I, curve_flag: null}
    - {globalid: R1, source_point_count: 3, curve_flag_prod: I, curve_flag_fixed: I, curve_flag: I}
- name: test__int__noncenterline_curve_flag__fixed
  description: "fix_single_arc_curve_flag true: a single arc is I."
  model: int__noncenterline_curve_flag
  overrides:
    vars:
      fix_single_arc_curve_flag: true
  given: *curve_given
  expect:
    rows:
    - {globalid: S1, source_point_count: 2, curve_flag_prod: null, curve_flag_fixed: I, curve_flag: I}
    - {globalid: S2, source_point_count: 3, curve_flag_prod: I, curve_flag_fixed: I, curve_flag: I}
    - {globalid: S3, source_point_count: 2, curve_flag_prod: null, curve_flag_fixed: null, curve_flag: null}
    - {globalid: P1, source_point_count: 2, curve_flag_prod: null, curve_flag_fixed: I, curve_flag: I}
    - {globalid: R1, source_point_count: 3, curve_flag_prod: I, curve_flag_fixed: I, curve_flag: I}
# CSCL-LION-15, CSCL-LION-24 and CSCL-LION-29. G1 is generic with house numbers, G2 generic
# without, G5 a generic of FeatureTyp 5; F1 is type F with house numbers, F2 type F without,
# F9 type F of FeatureTyp 9; U1 an ordinary segment (FeatureTyp 0), S1 a shoreline
# (FeatureTyp 2), W1 an addressable path, N5 a centerline of FeatureTyp 5, all with house
# numbers; N0 a FeatureTyp 5 centerline without. X1 isn't in the LION gdb. sql fixtures: CI
# runs unit tests without building the upstream models
- name: test__int__lion_house_number_zeroing__default
  description: "Default (zero_generic_house_numbers, zero_f_segment_house_numbers and zero_feature_type_house_numbers false): nothing is zeroed, as prod's LION gdb, which copies the source's house numbers."
  model: int__lion_house_number_zeroing
  overrides:
    vars:
      zero_generic_house_numbers: false
      zero_f_segment_house_numbers: false
      zero_feature_type_house_numbers: false
  given: &hn_zeroing_given
  - input: ref('int__lion')
    format: sql
    rows: |
      SELECT * FROM (VALUES
        ('G1', 'G', NULL, '1', '99', '2', '98', TRUE),
        ('G2', 'G', NULL, '0', '0', '0', '0', TRUE),
        ('G5', 'G', '5', '1', '99', '2', '98', TRUE),
        ('F1', 'F', NULL, '93-001', '93-099', '93-000', '93-098', TRUE),
        ('F2', 'F', NULL, '0', '0', '0', '0', TRUE),
        ('F9', 'F', '9', '1', '99', '2', '98', TRUE),
        ('U1', 'U', NULL, '1', '99', '2', '98', TRUE),
        ('S1', 'U', '2', '1', '99', '2', '98', TRUE),
        ('W1', 'U', 'W', '1', '99', '2', '98', TRUE),
        ('N5', 'U', '5', '1', '99', '2', '98', TRUE),
        ('N0', 'U', '5', '0', NULL, '0', NULL, TRUE),
        ('X1', 'G', NULL, '1', '99', '2', '98', FALSE)
      ) AS t (globalid, segment_type, feature_type_code, l_low_hn, l_high_hn, r_low_hn, r_high_hn, include_in_bytes_lion)
  expect:
    rows:
    - {globalid: G1, feature_type_code: '0', has_house_numbers: true, zero_for_feature_type: false, zero_house_numbers_legacy: true, zero_house_numbers: false}
    - {globalid: G2, feature_type_code: '0', has_house_numbers: false, zero_for_feature_type: false, zero_house_numbers_legacy: true, zero_house_numbers: false}
    - {globalid: G5, feature_type_code: '5', has_house_numbers: true, zero_for_feature_type: true, zero_house_numbers_legacy: true, zero_house_numbers: false}
    - {globalid: F1, feature_type_code: '0', has_house_numbers: true, zero_for_feature_type: false, zero_house_numbers_legacy: true, zero_house_numbers: false}
    - {globalid: F2, feature_type_code: '0', has_house_numbers: false, zero_for_feature_type: false, zero_house_numbers_legacy: true, zero_house_numbers: false}
    - {globalid: F9, feature_type_code: '9', has_house_numbers: true, zero_for_feature_type: true, zero_house_numbers_legacy: true, zero_house_numbers: false}
    - {globalid: U1, feature_type_code: '0', has_house_numbers: true, zero_for_feature_type: false, zero_house_numbers_legacy: false, zero_house_numbers: false}
    - {globalid: S1, feature_type_code: '2', has_house_numbers: true, zero_for_feature_type: true, zero_house_numbers_legacy: true, zero_house_numbers: false}
    - {globalid: W1, feature_type_code: 'W', has_house_numbers: true, zero_for_feature_type: false, zero_house_numbers_legacy: false, zero_house_numbers: false}
    - {globalid: N5, feature_type_code: '5', has_house_numbers: true, zero_for_feature_type: true, zero_house_numbers_legacy: true, zero_house_numbers: false}
    - {globalid: N0, feature_type_code: '5', has_house_numbers: false, zero_for_feature_type: true, zero_house_numbers_legacy: true, zero_house_numbers: false}
- name: test__int__lion_house_number_zeroing__generic
  description: "zero_generic_house_numbers true: a G segment is zeroed, as the spec (2.7.3) and the legacy tool's rule; F and the FeatureTyp rows still keep their house numbers."
  model: int__lion_house_number_zeroing
  overrides:
    vars:
      zero_generic_house_numbers: true
      zero_f_segment_house_numbers: false
      zero_feature_type_house_numbers: false
  given: *hn_zeroing_given
  expect:
    rows:
    - {globalid: G1, zero_house_numbers: true}
    - {globalid: G2, zero_house_numbers: true}
    - {globalid: G5, zero_house_numbers: true}
    - {globalid: F1, zero_house_numbers: false}
    - {globalid: F2, zero_house_numbers: false}
    - {globalid: F9, zero_house_numbers: false}
    - {globalid: U1, zero_house_numbers: false}
    - {globalid: S1, zero_house_numbers: false}
    - {globalid: W1, zero_house_numbers: false}
    - {globalid: N5, zero_house_numbers: false}
    - {globalid: N0, zero_house_numbers: false}
- name: test__int__lion_house_number_zeroing__f
  description: "zero_f_segment_house_numbers true: an F segment is zeroed; G and the FeatureTyp rows still keep their house numbers."
  model: int__lion_house_number_zeroing
  overrides:
    vars:
      zero_generic_house_numbers: false
      zero_f_segment_house_numbers: true
      zero_feature_type_house_numbers: false
  given: *hn_zeroing_given
  expect:
    rows:
    - {globalid: G1, zero_house_numbers: false}
    - {globalid: G2, zero_house_numbers: false}
    - {globalid: G5, zero_house_numbers: false}
    - {globalid: F1, zero_house_numbers: true}
    - {globalid: F2, zero_house_numbers: true}
    - {globalid: F9, zero_house_numbers: true}
    - {globalid: U1, zero_house_numbers: false}
    - {globalid: S1, zero_house_numbers: false}
    - {globalid: W1, zero_house_numbers: false}
    - {globalid: N5, zero_house_numbers: false}
    - {globalid: N0, zero_house_numbers: false}
- name: test__int__lion_house_number_zeroing__feature_type
  description: "zero_feature_type_house_numbers true: a segment of FeatureTyp other than 0, 6 or W is zeroed, whatever its SegmentTyp; G and F of FeatureTyp 0 still keep their house numbers."
  model: int__lion_house_number_zeroing
  overrides:
    vars:
      zero_generic_house_numbers: false
      zero_f_segment_house_numbers: false
      zero_feature_type_house_numbers: true
  given: *hn_zeroing_given
  expect:
    rows:
    - {globalid: G1, zero_house_numbers: false}
    - {globalid: G2, zero_house_numbers: false}
    - {globalid: G5, zero_house_numbers: true}
    - {globalid: F1, zero_house_numbers: false}
    - {globalid: F2, zero_house_numbers: false}
    - {globalid: F9, zero_house_numbers: true}
    - {globalid: U1, zero_house_numbers: false}
    - {globalid: S1, zero_house_numbers: true}
    - {globalid: W1, zero_house_numbers: false}
    - {globalid: N5, zero_house_numbers: true}
    - {globalid: N0, zero_house_numbers: true}
- name: test__int__lion_house_number_zeroing__legacy
  description: "All three vars true: the legacy tool's rule, G, F and FeatureTyp other than 0, 6 or W zeroed (zero_house_numbers = zero_house_numbers_legacy)."
  model: int__lion_house_number_zeroing
  overrides:
    vars:
      zero_generic_house_numbers: true
      zero_f_segment_house_numbers: true
      zero_feature_type_house_numbers: true
  given: *hn_zeroing_given
  expect:
    rows:
    - {globalid: G1, zero_house_numbers_legacy: true, zero_house_numbers: true}
    - {globalid: G2, zero_house_numbers_legacy: true, zero_house_numbers: true}
    - {globalid: G5, zero_house_numbers_legacy: true, zero_house_numbers: true}
    - {globalid: F1, zero_house_numbers_legacy: true, zero_house_numbers: true}
    - {globalid: F2, zero_house_numbers_legacy: true, zero_house_numbers: true}
    - {globalid: F9, zero_house_numbers_legacy: true, zero_house_numbers: true}
    - {globalid: U1, zero_house_numbers_legacy: false, zero_house_numbers: false}
    - {globalid: S1, zero_house_numbers_legacy: true, zero_house_numbers: true}
    - {globalid: W1, zero_house_numbers_legacy: false, zero_house_numbers: false}
    - {globalid: N5, zero_house_numbers_legacy: true, zero_house_numbers: true}
    - {globalid: N0, zero_house_numbers_legacy: true, zero_house_numbers: true}
# CSCL-LION-19. Ramp R1 on segment 1 shares its street code (450290) with two B address
# points and an S one on another street code: prod gives it B. Ramp R2 on segment 2 has an
# AltSegmentData SAF row with its LIONKEY (type F, read as D) and one with the
# centerline's: D. Ramp R3's only address point is on another street code: blank. R4 and
# R5 on segment 4 both get R4's address point N (prod collects over all the protos). C1
# isn't a ramp.
# sql fixtures: CI runs unit tests without building the upstream models, so dbt can't read
# their column types
- name: test__int__ramp_proto_special_address__prod_rule
  description: "Default (fix_ramp_proto_special_address false): a ramp gets prod's flag."
  model: int__ramp_proto_special_address
  overrides:
    vars:
      fix_ramp_proto_special_address: false
  given: &ramp_given
  - input: ref('stg__altsegmentdata_proto')
    format: sql
    rows: |
      SELECT * FROM (VALUES
        ('R1', 1, 10, 'R', '4939600450', '450290', '4'),
        ('R2', 2, 11, 'R', '4939600460', '450300', '4'),
        ('R3', 3, 12, 'R', '4939600470', '450310', '4'),
        ('R4', 4, 13, 'R', '4939600480', '450320', '4'),
        ('R5', 4, 14, 'R', '4939600490', '450330', '4'),
        ('C1', 5, 15, 'C', '4939600500', '450340', '4')
      ) AS t (globalid, segmentid, ogc_fid, alt_segdata_type, lionkey, b5sc, borough)
  - input: source('recipe_sources', 'dcp_cscl_centerline')
    format: sql
    rows: |
      SELECT * FROM (VALUES (1, '4'), (2, '4'), (3, '4'), (4, '4'), (5, '4')) AS t (segmentid, boroughcode)
  - input: ref('stg__altsegmentdata_saf')
    format: sql
    rows: |
      SELECT * FROM (VALUES
        (2, 20, 'F', '4', '4939600460'),
        (2, 21, 'B', '4', '4560207075'),
        (5, 22, 'B', '4', '4939600500')
      ) AS t (segmentid, ogc_fid, saftype, borough, lionkey)
  - input: source('recipe_sources', 'dcp_cscl_addresspoints')
    format: sql
    rows: |
      SELECT * FROM (VALUES
        (1, 30, 'B', '4', '45029011'),
        (1, 31, 'B', '4', '45029011'),
        (1, 32, 'S', '4', '45099911'),
        (3, 33, 'S', '4', '45099911'),
        (4, 34, 'N', '4', '45032011')
      ) AS t (segmentid, ogc_fid, special_condition, boroughcode, b7sc_actual)
  expect:
    rows:
    - {globalid: R1, special_address_flag_prod: B, special_address_flag: B}
    - {globalid: R2, special_address_flag_prod: D, special_address_flag: D}
    - {globalid: R3, special_address_flag_prod: null, special_address_flag: null}
    - {globalid: R4, special_address_flag_prod: N, special_address_flag: N}
    - {globalid: R5, special_address_flag_prod: N, special_address_flag: N}
- name: test__int__ramp_proto_special_address__fixed
  description: "fix_ramp_proto_special_address true: a ramp is blank."
  model: int__ramp_proto_special_address
  overrides:
    vars:
      fix_ramp_proto_special_address: true
  given: *ramp_given
  expect:
    rows:
    - {globalid: R1, special_address_flag_prod: B, special_address_flag: null}
    - {globalid: R2, special_address_flag_prod: D, special_address_flag: null}
    - {globalid: R3, special_address_flag_prod: null, special_address_flag: null}
    - {globalid: R4, special_address_flag_prod: N, special_address_flag: null}
    - {globalid: R5, special_address_flag_prod: N, special_address_flag: null}
