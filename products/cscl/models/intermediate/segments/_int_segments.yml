version: 2

models:
- name: int__primary_segments
  description: "One row per segment from the centerline, shoreline, rail/subway and non-street feature layers, with street code, face code and sequence number. Excludes protosegments."
  columns:
  - name: segmentid
    description: "Segment id."
    tests: [ not_null, unique ]

- name: int__protosegments
  description: "One row per altsegmentdata protosegment, in the same shape as int__primary_segments, joined to its primary segment's geometry."
  columns:
  - name: segmentid
  - name: reversed
    description: "The proto's own FROM_TO_INDICATOR is R. Its level codes, traffic direction and curve flag follow this, in prod too."
  - name: flips_before
    description: "Reversed proto-segments off the borough boundary before this one on the same segment, in AltSegmentData order: each reverses the parent's shape in prod (CSCL-LION-01)."
  - name: geometry_reversed_fixed
    description: "The proto's geometry runs against its parent's: reversed."
  - name: geometry_reversed_prod
    description: "Prod's orientation: reversed, flipped the other way on a centerline's proto after an odd number of flips_before (CSCL-LION-01)."
  - name: geometry_reversed
    description: "The orientation geom, raw_geom, start_point and end_point (and so the nodes, XY and left/right fields) follow: geometry_reversed_fixed when the var fix_reversed_proto_pairs is true, else geometry_reversed_prod (the default)."
  - name: face_code_fixed
    description: "Face code of the proto's B5SC + LGC1, from StreetName or FeatureName."
  - name: face_code_prod
    description: "Prod's face code: face_code_fixed, but none for a centerline proto whose face code is only in FeatureName, which prod drops (CSCL-LION-22)."
  - name: is_featurename_face_code
    description: "A centerline proto whose face code is only in FeatureName (CSCL-LION-22)."
  - name: face_code
    description: "face_code_fixed when the var fix_featurename_face_code_protos is true, else face_code_prod (the default). A proto without one isn't written (CSCL-LOG-LION-19)."
  - name: gdb_census_sides_swapped_prod
    description: "Prod's LION gdb writes the proto's census tract and block (1990-2020) and community district fields the other way round from its LION record (CSCL-LION-26): a centerline's proto off the borough boundary whose orientation (geometry_reversed) differs from the shape prod held when writing it (flipped by flips_before). Prod's gdb reads them from the AtomicPolygons it found on that shape, before the proto's own reversal swaps its LION record's sides."
  - name: gdb_census_sides_swapped_fixed
    description: "Always false: the LION gdb's census and community district fields follow the record's own left and right sides, as its LION record and AtomicPolygons do."
  - name: gdb_census_sides_swapped
    description: "What gdb_lion uses: gdb_census_sides_swapped_fixed when the var fix_reversed_proto_census_fields is true, else gdb_census_sides_swapped_prod (the default)."
  tests:
  - name: int__protosegments__key_ideal
    test_name: dbt_utils.unique_combination_of_columns
    # an orphan NSF-type proto-segment (no feature with its segment id) is never read, so
    # legacy never numbers it; it isn't written to LION either
    config:
      where: "segment_seqnum IS NOT NULL"
    arguments:
      combination_of_columns:
      - boroughcode
      - face_code
      - segment_seqnum

- name: int__segments
  description: "Primary segments and protosegments together, keyed by lionkey (borough, face code, segment sequence number). The segment backbone of int__lion."
  columns:
  - name: lionkey
    description: "Borough code, face code and segment sequence number."
  - name: segmentid
    description: "Segment id. Repeats across a segment's protosegments."
    tests: [ not_null ]
  - name: feature_type
    description: "LION feature type. Subway and rail share rail_and_subway."
    tests: [ not_null ]
  - name: globalid
    description: "GlobalID of the source feature."
    tests: [ unique ]

- name: int__lion_extract_borough_runs
  description: >-
    Which legacy per-borough LION extract runs read each source feature: one row per feature
    and borough whose polygon, buffered by lion_extract_borough_buffer_ft (legacy
    BoroughBufferDistance, 2 ft), it intersects. A feature on a borough boundary is read by
    both runs. Limited to the features the non-street-feature sequence counter needs: every
    NonStreetFeature, and every feature with a proto-segment of FEATURE_TYPE 3/4/7/8.
  columns:
  - name: class_rank
    description: "Order legacy extracts the feature classes in: 1 Centerline, 2 NonStreetFeature, 3 Rail, 4 Shoreline, 5 Subway."
  - name: source_table
  - name: segmentid
  - name: ogc_fid
    description: "Source OBJECTID; the order a run reads features of one class in."
  - name: globalid
  - name: run_borocode
    description: "Borough of the extract run that reads the feature."
    tests: [ not_null ]
  data_tests:
  - name: lion_extract_borough_runs_unique
    test_name: dbt_utils.unique_combination_of_columns
    arguments:
      combination_of_columns: [ globalid, run_borocode ]

- name: int__nonstreetfeature_seqnum
  description: >-
    Segment sequence numbers (L3) for NonStreetFeature records and for proto-segments of
    FEATURE_TYPE 3/4/7/8, numbered like legacy: a counter per (borough, face code) over
    legacy's processing order (extract session and borough run, feature class, OBJECTID,
    proto-segments after their feature), counting every call legacy makes, including the ones
    whose number isn't written. See the model's header for the calls.
  columns:
  - name: source_table
  - name: globalid
    tests: [ unique, not_null ]
  - name: segmentid
  - name: ogc_fid
  - name: boroughcode
  - name: face_code
  - name: segment_seqnum
    description: "The number in the LION .dat files' extract sessions (var lion_seqnum_extract_sessions)."
  - name: gdb_segment_seqnum
    description: "The number in the LION gdb's extract sessions (var lion_gdb_seqnum_extract_sessions), which prod's LION gdb numbers differently from its .dat files (CSCL-LION-05)."
  data_tests:
  - name: nsf_seqnum_unique_lionkey
    test_name: dbt_utils.unique_combination_of_columns
    arguments:
      combination_of_columns: [ boroughcode, face_code, segment_seqnum ]
  - name: nsf_gdb_seqnum_unique_lionkey
    test_name: dbt_utils.unique_combination_of_columns
    arguments:
      combination_of_columns: [ boroughcode, face_code, gdb_segment_seqnum ]

unit_tests:
# Face 9901 straddles boroughs 1 and 4. NonStreetFeature A (borough 1) is on the boundary, so
# both runs read it. Its proto-segment pA1 (FEATURE_TYPE 3, borough 4) takes a number at
# initialization in both runs, on borough 1 (the parent's, a stale field), and its written
# number in run 4. pA2 (no FEATURE_TYPE, borough 1) takes a number in run 1 and keeps its own.
# Shoreline S's proto-segment pS1 (borough 4) takes a number in both runs, on borough 4.
- name: test__int__nonstreetfeature_seqnum__counter_one_session
  description: "Run 1 then run 4 in one session: numbers the unwritten calls consume leave gaps (B is 4, pS1 is 4). The LION gdb in the same session numbers them the same."
  model: int__nonstreetfeature_seqnum
  overrides:
    vars:
      lion_seqnum_extract_sessions: [['1', '4']]
      lion_gdb_seqnum_extract_sessions: [['1', '4']]
  # sql fixtures: CI runs unit tests without building the upstream models, so dbt can't read
  # their column types
  given: &seqnum_given
  - input: ref('int__lion_extract_borough_runs')
    format: sql
    rows: |
      SELECT * FROM (VALUES
        (2, 'nonstreetfeatures', 10, 1, 'A', '1'),
        (2, 'nonstreetfeatures', 10, 1, 'A', '4'),
        (2, 'nonstreetfeatures', 11, 2, 'B', '1'),
        (2, 'nonstreetfeatures', 12, 3, 'C', '4'),
        (4, 'shoreline', 20, 1, 'S', '1'),
        (4, 'shoreline', 20, 1, 'S', '4')
      ) AS t (class_rank, source_table, segmentid, ogc_fid, globalid, run_borocode)
  - input: ref('int__streetcode_and_facecode')
    format: sql
    rows: |
      SELECT * FROM (VALUES
        (10, '1', '9901'),
        (11, '1', '9901'),
        (12, '4', '9901')
      ) AS t (segmentid, boroughcode, face_code)
  - input: ref('stg__facecode_and_featurename_principal')
    format: sql
    rows: |
      SELECT * FROM (VALUES
        ('19990101', '9901'),
        ('49990101', '9901')
      ) AS t (b7sc, face_code)
  - input: ref('stg__altsegmentdata_proto')
    format: sql
    rows: |
      SELECT * FROM (VALUES
        ('pA1', 10, 100, '4', '49990101', '3', NULL::TEXT),
        ('pA2', 10, 101, '1', '19990101', NULL, NULL::TEXT),
        ('pS1', 20, 200, '4', '49990101', '3', NULL::TEXT)
      ) AS t (globalid, segmentid, ogc_fid, borough, b7sc, feature_type_code, saftype)
  expect:
    format: sql
    rows: |
      SELECT * FROM (VALUES
        ('nonstreetfeatures', 'A', 10, 1, '1', '9901', '00001', '00001'),
        ('nonstreetfeatures', 'B', 11, 2, '1', '9901', '00004', '00004'),
        ('altsegmentdata', 'pA1', 10, 100, '4', '9901', '00002', '00002'),
        ('nonstreetfeatures', 'C', 12, 3, '4', '9901', '00003', '00003'),
        ('altsegmentdata', 'pS1', 20, 200, '4', '9901', '00004', '00004')
      ) AS t (source_table, globalid, segmentid, ogc_fid, boroughcode, face_code, segment_seqnum, gdb_segment_seqnum)
- name: test__int__nonstreetfeature_seqnum__counter_two_sessions
  description: "Run 4 in a fresh session for both outputs: run 1's calls on borough 4 (pS1's) no longer count."
  model: int__nonstreetfeature_seqnum
  overrides:
    vars:
      lion_seqnum_extract_sessions: [['1'], ['4']]
      lion_gdb_seqnum_extract_sessions: [['1'], ['4']]
  given: *seqnum_given
  expect:
    format: sql
    rows: |
      SELECT * FROM (VALUES
        ('nonstreetfeatures', 'A', 10, 1, '1', '9901', '00001', '00001'),
        ('nonstreetfeatures', 'B', 11, 2, '1', '9901', '00004', '00004'),
        ('altsegmentdata', 'pA1', 10, 100, '4', '9901', '00001', '00001'),
        ('nonstreetfeatures', 'C', 12, 3, '4', '9901', '00002', '00002'),
        ('altsegmentdata', 'pS1', 20, 200, '4', '9901', '00003', '00003')
      ) AS t (source_table, globalid, segmentid, ogc_fid, boroughcode, face_code, segment_seqnum, gdb_segment_seqnum)
# CSCL-LION-05: prod's LION .dat files and LION gdb were numbered in different sessions.
- name: test__int__nonstreetfeature_seqnum__gdb_sessions_differ
  description: "The .dat files with a fresh session for run 4, the LION gdb with runs 1 and 4 in one session (26c's shape): borough 4's numbers differ, borough 1's don't."
  model: int__nonstreetfeature_seqnum
  overrides:
    vars:
      lion_seqnum_extract_sessions: [['1'], ['4']]
      lion_gdb_seqnum_extract_sessions: [['1', '4']]
  given: *seqnum_given
  expect:
    format: sql
    rows: |
      SELECT * FROM (VALUES
        ('nonstreetfeatures', 'A', 10, 1, '1', '9901', '00001', '00001'),
        ('nonstreetfeatures', 'B', 11, 2, '1', '9901', '00004', '00004'),
        ('altsegmentdata', 'pA1', 10, 100, '4', '9901', '00001', '00002'),
        ('nonstreetfeatures', 'C', 12, 3, '4', '9901', '00002', '00003'),
        ('altsegmentdata', 'pS1', 20, 200, '4', '9901', '00003', '00004')
      ) AS t (source_table, globalid, segmentid, ogc_fid, boroughcode, face_code, segment_seqnum, gdb_segment_seqnum)
# CSCL-LION-01. Centerline 10 has reversed protos P1 and P2 (and P0, reversed on the borough
# boundary, which prod doesn't flip) and P3, not reversed: P2 follows one flip, so prod
# writes it unreversed; P3 follows two. Centerline 11's Q2 isn't reversed but follows Q1's
# flip, so prod writes it reversed. Shoreline 20's protos are never flipped (only the
# centerline extract reverses its shape). Levels follow each proto's own flag.
# CSCL-LION-22. F1 is a centerline proto whose face code is only in FeatureName: prod drops
# it (no face code), the fix takes 0200. N1 (a non-street proto) is named in FeatureName as
# it should be; P0-P3 in StreetName. N1 takes its LION .dat and LION gdb sequence numbers
# from int__nonstreetfeature_seqnum (CSCL-LION-05).
# sql fixtures: CI runs unit tests without building the upstream models, so dbt can't read
# their column types
- name: test__int__protosegments__prod_rules
  description: "Defaults: prod's proto orientation (CSCL-LION-01) and FeatureName-only centerline protos dropped (CSCL-LION-22)."
  model: int__protosegments
  overrides:
    vars:
      fix_reversed_proto_pairs: false
      fix_featurename_face_code_protos: false
  given: &protos_given
  - input: ref('stg__altsegmentdata_proto')
    format: sql
    rows: |
      SELECT globalid, segmentid, ogc_fid, reversed, alt_segdata_type, feature_type_code, b7sc,
        LEFT(b7sc, 1) AS borough, SUBSTR(b7sc, 2, 5) AS five_digit_street_code, '00001' AS alt_segment_seqnum,
        RIGHT(b7sc, 2) AS lgc1, NULL AS lgc2, NULL AS lgc3, NULL AS lgc4, NULL AS lgc5, NULL AS lgc6,
        NULL AS lgc7, NULL AS lgc8, NULL AS lgc9, NULL AS boe_lgc_pointer, 'altsegmentdata' AS source_table
      FROM (VALUES
        ('P0', 10, 1, TRUE, 'B', NULL, '11000101'),
        ('P1', 10, 2, TRUE, 'R', NULL, '11000101'),
        ('P2', 10, 3, TRUE, 'C', NULL, '11000101'),
        ('P3', 10, 4, FALSE, 'C', NULL, '11000101'),
        ('Q1', 11, 5, TRUE, 'C', NULL, '11000101'),
        ('Q2', 11, 6, FALSE, 'C', NULL, '11000101'),
        ('S1', 20, 7, TRUE, 'C', '2', '11000301'),
        ('S2', 20, 8, TRUE, 'C', '2', '11000301'),
        ('F1', 12, 9, FALSE, 'C', NULL, '11000201'),
        ('N1', 12, 10, FALSE, 'C', '4', '11000301')
      ) AS t (globalid, segmentid, ogc_fid, reversed, alt_segdata_type, feature_type_code, b7sc)
  - input: ref('int__primary_segments')
    format: sql
    rows: |
      SELECT segmentid, segmentid AS legacy_segmentid, 1 AS from_level_code, 2 AS to_level_code,
        ST_GEOMFROMTEXT('LINESTRING (0 0, 10 0)') AS geom, ST_GEOMFROMTEXT('LINESTRING (0 0, 10 0)') AS raw_geom,
        ST_POINT(5, 0) AS midpoint, ST_POINT(0, 0) AS start_point, ST_POINT(10, 0) AS end_point,
        10.0 AS shape_length, feature_type, source_class_rank, segmentid AS source_objectid
      FROM (VALUES
        (10, 'centerline', 1), (11, 'centerline', 1), (12, 'centerline', 1), (20, 'shoreline', 4)
      ) AS t (segmentid, feature_type, source_class_rank)
  - input: ref('stg__facecode_and_featurename_principal')
    format: sql
    rows: |
      SELECT * FROM (VALUES
        ('11000101', '0100', 'street'),
        ('11000201', '0200', 'feature'),
        ('11000301', '0300', 'feature')
      ) AS t (b7sc, face_code, feature_type)
  - input: ref('int__nonstreetfeature_seqnum')
    format: sql
    rows: |
      SELECT * FROM (VALUES ('N1', '00009', '00011')) AS t (globalid, segment_seqnum, gdb_segment_seqnum)
  - input: ref('feature_type_codes')
    format: sql
    rows: |
      SELECT * FROM (VALUES
        ('centerline', NULL, 'Public street'),
        ('shoreline', '2', 'Shoreline'),
        ('nonstreetfeatures', '4', 'Other non-street feature')
      ) AS t (source_feature_class, code, description)
  expect:
    rows:
    - {globalid: P0, flips_before: 0, geometry_reversed_prod: true, geometry_reversed: true, from_level_code: 2, face_code: '0100', segment_seqnum: '00001', gdb_segment_seqnum: '00001'}
    - {globalid: P1, flips_before: 0, geometry_reversed_prod: true, geometry_reversed: true, from_level_code: 2, face_code: '0100', segment_seqnum: '00001', gdb_segment_seqnum: '00001'}
    - {globalid: P2, flips_before: 1, geometry_reversed_prod: false, geometry_reversed: false, from_level_code: 2, face_code: '0100', segment_seqnum: '00001', gdb_segment_seqnum: '00001'}
    - {globalid: P3, flips_before: 2, geometry_reversed_prod: false, geometry_reversed: false, from_level_code: 1, face_code: '0100', segment_seqnum: '00001', gdb_segment_seqnum: '00001'}
    - {globalid: Q1, flips_before: 0, geometry_reversed_prod: true, geometry_reversed: true, from_level_code: 2, face_code: '0100', segment_seqnum: '00001', gdb_segment_seqnum: '00001'}
    - {globalid: Q2, flips_before: 1, geometry_reversed_prod: true, geometry_reversed: true, from_level_code: 1, face_code: '0100', segment_seqnum: '00001', gdb_segment_seqnum: '00001'}
    - {globalid: S1, flips_before: 0, geometry_reversed_prod: true, geometry_reversed: true, from_level_code: 2, face_code: '0300', segment_seqnum: '00001', gdb_segment_seqnum: '00001'}
    - {globalid: S2, flips_before: 1, geometry_reversed_prod: true, geometry_reversed: true, from_level_code: 2, face_code: '0300', segment_seqnum: '00001', gdb_segment_seqnum: '00001'}
    - {globalid: F1, flips_before: 0, geometry_reversed_prod: false, geometry_reversed: false, from_level_code: 1, face_code: null, segment_seqnum: '00001', gdb_segment_seqnum: '00001'}
    - {globalid: N1, flips_before: 0, geometry_reversed_prod: false, geometry_reversed: false, from_level_code: 1, face_code: '0300', segment_seqnum: '00009', gdb_segment_seqnum: '00011'}
- name: test__int__protosegments__fixed
  description: "fix_reversed_proto_pairs and fix_featurename_face_code_protos true: each proto oriented by its own flag; F1 keeps its FeatureName face code."
  model: int__protosegments
  overrides:
    vars:
      fix_reversed_proto_pairs: true
      fix_featurename_face_code_protos: true
  given: *protos_given
  expect:
    rows:
    - {globalid: P0, geometry_reversed_fixed: true, geometry_reversed: true, from_level_code: 2, face_code: '0100', is_featurename_face_code: false, segment_seqnum: '00001', gdb_segment_seqnum: '00001'}
    - {globalid: P1, geometry_reversed_fixed: true, geometry_reversed: true, from_level_code: 2, face_code: '0100', is_featurename_face_code: false, segment_seqnum: '00001', gdb_segment_seqnum: '00001'}
    - {globalid: P2, geometry_reversed_fixed: true, geometry_reversed: true, from_level_code: 2, face_code: '0100', is_featurename_face_code: false, segment_seqnum: '00001', gdb_segment_seqnum: '00001'}
    - {globalid: P3, geometry_reversed_fixed: false, geometry_reversed: false, from_level_code: 1, face_code: '0100', is_featurename_face_code: false, segment_seqnum: '00001', gdb_segment_seqnum: '00001'}
    - {globalid: Q1, geometry_reversed_fixed: true, geometry_reversed: true, from_level_code: 2, face_code: '0100', is_featurename_face_code: false, segment_seqnum: '00001', gdb_segment_seqnum: '00001'}
    - {globalid: Q2, geometry_reversed_fixed: false, geometry_reversed: false, from_level_code: 1, face_code: '0100', is_featurename_face_code: false, segment_seqnum: '00001', gdb_segment_seqnum: '00001'}
    - {globalid: S1, geometry_reversed_fixed: true, geometry_reversed: true, from_level_code: 2, face_code: '0300', is_featurename_face_code: false, segment_seqnum: '00001', gdb_segment_seqnum: '00001'}
    - {globalid: S2, geometry_reversed_fixed: true, geometry_reversed: true, from_level_code: 2, face_code: '0300', is_featurename_face_code: false, segment_seqnum: '00001', gdb_segment_seqnum: '00001'}
    - {globalid: F1, geometry_reversed_fixed: false, geometry_reversed: false, from_level_code: 1, face_code: '0200', is_featurename_face_code: true, segment_seqnum: '00001', gdb_segment_seqnum: '00001'}
    - {globalid: N1, geometry_reversed_fixed: false, geometry_reversed: false, from_level_code: 1, face_code: '0300', is_featurename_face_code: false, segment_seqnum: '00009', gdb_segment_seqnum: '00011'}
# CSCL-LION-26, same protos. Prod's gdb census sides follow the shape prod held when it wrote
# the proto (flipped by the reversed protos before it, CSCL-LION-01), where its LION record's
# follow the proto's own orientation too: they differ on P1, P2 and Q1 by default (each reversed
# once more than the shape), on P1, Q1 and Q2 with fix_reversed_proto_pairs on. P0 is on the
# borough boundary (no swap in prod) and S1/S2 are a shoreline's protos (not flipped)
- name: test__int__protosegments__gdb_census_prod
  description: "Defaults: prod's gdb census sides on reversed protos (CSCL-LION-26), with prod's proto orientation (CSCL-LION-01)."
  model: int__protosegments
  overrides:
    vars:
      fix_reversed_proto_pairs: false
      fix_reversed_proto_census_fields: false
  given: *protos_given
  expect:
    rows:
    - {globalid: P0, gdb_census_sides_swapped_prod: false, gdb_census_sides_swapped_fixed: false, gdb_census_sides_swapped: false}
    - {globalid: P1, gdb_census_sides_swapped_prod: true, gdb_census_sides_swapped_fixed: false, gdb_census_sides_swapped: true}
    - {globalid: P2, gdb_census_sides_swapped_prod: true, gdb_census_sides_swapped_fixed: false, gdb_census_sides_swapped: true}
    - {globalid: P3, gdb_census_sides_swapped_prod: false, gdb_census_sides_swapped_fixed: false, gdb_census_sides_swapped: false}
    - {globalid: Q1, gdb_census_sides_swapped_prod: true, gdb_census_sides_swapped_fixed: false, gdb_census_sides_swapped: true}
    - {globalid: Q2, gdb_census_sides_swapped_prod: false, gdb_census_sides_swapped_fixed: false, gdb_census_sides_swapped: false}
    - {globalid: S1, gdb_census_sides_swapped_prod: false, gdb_census_sides_swapped_fixed: false, gdb_census_sides_swapped: false}
    - {globalid: S2, gdb_census_sides_swapped_prod: false, gdb_census_sides_swapped_fixed: false, gdb_census_sides_swapped: false}
    - {globalid: F1, gdb_census_sides_swapped_prod: false, gdb_census_sides_swapped_fixed: false, gdb_census_sides_swapped: false}
    - {globalid: N1, gdb_census_sides_swapped_prod: false, gdb_census_sides_swapped_fixed: false, gdb_census_sides_swapped: false}
- name: test__int__protosegments__gdb_census_prod_reversed_pairs_fixed
  description: "fix_reversed_proto_pairs on, census fix off: prod's gdb census sides still follow prod's shape, so P2 (now reversed) matches it and Q2 (now not) doesn't."
  model: int__protosegments
  overrides:
    vars:
      fix_reversed_proto_pairs: true
      fix_reversed_proto_census_fields: false
  given: *protos_given
  expect:
    rows:
    - {globalid: P0, gdb_census_sides_swapped: false}
    - {globalid: P1, gdb_census_sides_swapped: true}
    - {globalid: P2, gdb_census_sides_swapped: false}
    - {globalid: P3, gdb_census_sides_swapped: false}
    - {globalid: Q1, gdb_census_sides_swapped: true}
    - {globalid: Q2, gdb_census_sides_swapped: true}
    - {globalid: S1, gdb_census_sides_swapped: false}
    - {globalid: S2, gdb_census_sides_swapped: false}
    - {globalid: F1, gdb_census_sides_swapped: false}
    - {globalid: N1, gdb_census_sides_swapped: false}
- name: test__int__protosegments__gdb_census_fixed
  description: "fix_reversed_proto_census_fields true: the gdb's census sides follow each record's own sides."
  model: int__protosegments
  overrides:
    vars:
      fix_reversed_proto_pairs: false
      fix_reversed_proto_census_fields: true
  given: *protos_given
