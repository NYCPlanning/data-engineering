# Maps issue-title patterns to `db-*` product labels and to GitHub issue types.
#
# Keys under `products` are directories in `products/`; `label` is the GitHub
# label applied when any `patterns` entry matches an issue title
# (case-insensitive, regex).
#
# Patterns match titles only, not bodies. Bodies mention many products in
# passing — matching them produced enough false positives to bury the signal.
#
# Published products in `product-metadata/products/` are deliberately not the
# spine here: only 7 issues in three years named one that has no build
# pipeline. LION is the exception, and it maps to the cscl pipeline that
# builds it.

products:
  cbbr:
    label: db-cbbr
    patterns: ['\bcbbr\b', '\bcapital budget requests?\b']
  cdbg:
    label: db-cdbg
    patterns: ['\bcdbg\b']
  ceqr:
    label: db-ceqr
    patterns: ['\bceqr\b']
  checkbook:
    label: db-checkbook
    patterns: ['\bcheckbook\b']
  colp:
    label: db-colp
    patterns: ['\bcolp\b']
  cpdb:
    label: db-cpdb
    patterns: ['\bcpdb\b']
  cscl:
    # LION is the published product built by this pipeline, not a separate one.
    label: db-cscl
    patterns: ['\bcscl\b', '\blion\b']
  developments:
    # Published as "Housing Database", so HousingDB shows up in titles too.
    label: db-developments
    patterns: ['\bdev-?db\b', '\bdevelopments\b', '\bhousing-?db\b']
  edde:
    label: db-edde
    patterns: ['\bedde\b']
  facilities:
    label: db-facilities
    patterns: ['\bfac-?db\b', '\bfacilities\b']
  factfinder:
    label: db-factfinder
    patterns: ['\bfact-?finder\b']
  green_fast_track:
    label: db-gft
    patterns: ['\bgft\b', '\bgreen[- ]?fast[- ]?track\b']
  knownprojects:
    label: db-knownprojects
    patterns: ['\bkpdb\b', '\bknown[- ]?projects?\b']
  lift:
    # "lift" is an ordinary English word; watch for false positives as this
    # product generates more issues, and tighten to '\blift\b.*\b(data|db)\b'
    # if they show up.
    label: db-lift
    patterns: ['\blift\b']
  pluto:
    label: db-pluto
    patterns: ['\bpluto\b', '\bmappluto\b']
  template:
    label: db-template
    patterns: ['\bdb-template\b']
  zap-opendata:
    # Covers ZAP as both a product and a source feed, per team preference.
    label: db-zap
    patterns: ['\bzap\b']
  zoningtaxlots:
    label: db-zoningtaxlots
    patterns: ['\bztl\b', '\bzoning[- ]?tax[- ]?lots?\b']

# Non-product labels, keyed by the label name itself. `exclusive` means the
# label can't sit alongside a db-* one — `platform` is work that isn't a data
# product, so `PLUTO docker image` stays PLUTO's. Stage labels say where in the
# pipeline a product broke, so they stack with it.
#
# Patterns are deliberately narrow: proper nouns and tool names, not the
# generic words (build, test, ingest, library, app) that every product issue
# also uses.
labels:
  platform:
    exclusive: true
    patterns:
      - '\bdcpy\b'
      - '\bazure\b'
      - '\bdocker\b'
      - '\bdev ?container\b'
      - '\bcontainer instances?\b'
      - '\bblob storage\b'
      - '\bci/cd\b'
      - '\borchestration tool\b'
      - '\bsqlfluff\b'
      - '\bpre-commit\b'
      - '\bgdal\b'
      - '\bconnector\b'
      - '\bcredential management\b'
      - '\bbuild engine\b'
      - '\bqa ?/? ?qc app\b'
      - '\bcompile python requirements\b'
      - '\bstale build artifacts\b'
  ingest/library:
    patterns:
      - '^Scheduled Action Failure - (Ingest|Data Library) - '
      - '^Scheduled Action Failure - DevDB - Data Sync'
      - '^Scheduled Action Failure - PLUTO Inputs\b'
      - '^Scheduled Action Failure - ZAP - Weekly Export'
      - '^Scheduled Action Failure - .*\bDEP CATS permits\b'
  QA:
    patterns:
      - '^Scheduled Action Failure - .*\bNightly QA\b'

# Issue types are org-level and already the team's convention (Bug is the most
# used), so bug tracking lives here rather than in a `bug` label. Only applied
# to issues that have no type yet — a human's classification always wins.
# The QA label on these comes from product_qa.md's front matter; only the type
# needs a rule here, since create-an-issue predates GitHub issue types.
types:
  Bug:
    patterns: ['^Scheduled Action Failure\b']
  Task:
    patterns: ['\bQA Draft\b']
