# Valkey for dagster-broker: an in-memory, localhost-only sidecar. The queue is ephemeral
# by design: clients re-enqueue (producer) or abandon (worker) on 404 after a restart.
bind 127.0.0.1 -::1
port 6379
protected-mode yes

save ""
appendonly no

# Required. Without maxmemory the host OOM-kills Valkey; any evicting policy would drop
# queued items. With noeviction a full store refuses new writes (the API answers 503).
maxmemory 256mb
maxmemory-policy noeviction
