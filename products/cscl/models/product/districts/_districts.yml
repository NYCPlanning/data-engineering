version: 2

# Feature classes of the district boundary geodatabase (ETL spec ch. 10, table 39).
# Column names and row counts are matched against prod's v26B_Districts.gdb.zip.

models:
- name: gdb_nyad
  description: State assembly districts built from the AtomicPolygon topology.
  columns:
  - name: "'AssemDist'"
    data_tests: [ not_null ]
  - name: geom
    description: Polygon geometry (MultiPolygon, EPSG:2263)
    data_tests: [ not_null ]

- name: gdb_nyadwi
  description: State assembly districts built from the AtomicPolygon topology, water areas included.
  columns:
  - name: "'AssemDist'"
    data_tests: [ not_null ]
  - name: geom
    description: Polygon geometry (MultiPolygon, EPSG:2263)
    data_tests: [ not_null ]

- name: gdb_nyap
  description: Atomic polygons, the base geography of the ETL. Near-passthrough of the CSCL source layer.
  columns:
  - name: "'ATOMICID'"
    data_tests: [ not_null ]
  - name: geom
    description: Polygon geometry (MultiPolygon, EPSG:2263)
    data_tests: [ not_null ]

