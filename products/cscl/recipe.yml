  - name: gdb_nycc
    group: district_gdb
    filename: v26C_Districts.gdb.zip
    format: gdb
    custom: { layer: nycc, geometry_type: polygons }
  - name: gdb_nyccwi
    group: district_gdb
    filename: v26C_Districts.gdb.zip
