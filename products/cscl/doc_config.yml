  - kind: model_group
    title: Special Address File
    custom:
      known_differences: [SAF]
      short_title: SAF
      elements:
        - kind: text
          text: >-
            The Special Address File (SAF) holds addresses, place names and
            named intersections that Geosupport matches input against, one
            record per address range, place name, address point or intersection.
            Geosupport reads it, and GR and GSS review it. The build combines
            CSCL's alternate segment data, place name and address point tables
            into shared candidate rows and writes nine fixed-width files. See
            the [architecture overview](../../docs/architecture.md) for how the
            pipeline fits together.
        - kind: text
          text: >-
            13 [[saf|SAF]] record types (A, B, C, [[saf_type_d|D]], E, G, [[saf_type_i|I]],
            N, O, P, [[saf_type_s|S]], [[saf_type_v|V]], X - CSCL also has a source type
            'F', always relabeled to 'D' on output) collapse into 5 distinct record
            layouts, and so into 9 output files: one for Type I (intersections), and a
            generic + roadbed pair for each of the other four layout families -
            "abcegnpx" (A, B, C, E, G, N, P, X), "d" (D, F), "ov" (O, V), and "s" (S) -
            the nine sections below follow that same grouping. (The individual
            A/B/C/E/G/N/O/P/X distinctions are defined by Geosupport's own SAFTYPE
            domain, not by CSCL.)
        - kind: text
          text: >-
            Every SAF record traces back to one of three CSCL tables, by record type:
            AltSegmentData's own SAF entries (A, B, C, D, E, F, O, P), the CommonPlace
            feature class (G, N, X - non-addressable place names), or the AddressPoint
            feature class (S, V).
        - kind: text
          text: >-
            Every SAF layout's first 32 bytes are a name (street, place, or
            intersection name), pulled from StreetName/FeatureName's LOOKUP_KEY and
            normalized into Geosupport's Sort Format.
        - kind: heading
          text: How the SAF files are produced
          level: 3
        - kind: text
          text: >-
            AltSegmentData, CommonPlace, and AddressPoint are combined into one shared
            representation that resolves each record's LION key and segment type,
            including the generic/roadbed redirect described next.
        - kind: text
          text: >-
            Whether a record belongs in the generic file, the roadbed file, or both
            depends only on the appurtenant segment's SEGMENT_TYPE (and, in one case,
            INCEX_FLAG) - the same rule for every layout family. For G/N/S/V/X
            specifically, CommonPlace/AddressPoint only ever point at a
            [[roadbed_segment|roadbed segment]] - producing the generic-file row
            requires looking up the corresponding [[generic_segment|generic segment]]
            via the Roadbed Pointer List. Rather than deciding up front which applies,
            both interpretations (the record's own segment, and its RPL-redirected
            generic counterpart) are computed as separate candidate rows, and a final
            filter on each output file keeps only the one that actually belongs there.
    entries:
      - name: saf_abcegnpx_generic_by_field
        custom:
          display_name: GenericABCEGNPX.txt
          table: dat_fields
      - name: saf_abcegnpx_roadbed_by_field
        custom:
          display_name: RoadbedABCEGNPX.txt
          table: dat_fields
      - name: saf_d_generic_by_field
        custom:
          display_name: GenericD.txt
          table: dat_fields
      - name: saf_d_roadbed_by_field
        custom:
          display_name: RoadbedD.txt
          table: dat_fields
      - name: saf_i_by_field
        custom:
          display_name: Intersection.txt
          table: dat_fields
      - name: saf_ov_generic_by_field
        custom:
          display_name: GenericOV.txt
          table: dat_fields
      - name: saf_ov_roadbed_by_field
        custom:
          display_name: RoadbedOV.txt
          table: dat_fields
      - name: saf_s_generic_by_field
        custom:
          display_name: GenericS.txt
          table: dat_fields
      - name: saf_s_roadbed_by_field
        custom:
          display_name: RoadbedS.txt
          table: dat_fields

  - kind: model_group
    title: ThinLION
    custom:
      elements:
        - kind: text
          text: >-
            ThinLION is a district equivalency file: one record per atomic polygon, with
            every district, census and administrative code that applies to it. Geosupport
            reads it to answer district questions for a location once it knows the atomic
            polygon. It is written as one fixed-width file per borough, plus a citywide
            file. See the [architecture overview](../../docs/architecture.md) for how the pipeline fits together.
      known_differences: [ThinLION]
    entries:
      - name: thinlion_by_field
        custom:
          display_name: "{Borough}ThinLION.txt"
          table: dat_fields

  - kind: model_group
    title: ThinFire
    custom:
      elements:
        - kind: text
          text: >-
            ThinFire is a district equivalency file for fire companies: one record per
            fire company, with its division, battalion and borough. Geosupport reads it
            alongside the fire company codes in ThinLION. It is written as one
            fixed-width file per borough. See the [architecture overview](../../docs/architecture.md) for how the pipeline fits together.
      known_differences: [ThinFire]
    entries:
      - name: thinfire_by_field
        custom:
          display_name: "{Borough}ThinFire.txt"
          table: dat_fields

  - kind: model_group
    title: ThinED
    custom:
      elements:
        - kind: text
          text: >-
            ThinED is a district equivalency file for election districts: one record per
            election district, with the assembly, congressional, state senate, municipal
            court and city council districts it lies in. It is one citywide fixed-width
            file, preceded by a three-line header holding a file tag, a version and the
            line count. See the [architecture overview](../../docs/architecture.md) for how the pipeline fits together.
      known_differences: [ThinED]
    entries:
      - name: thined_by_field
        custom:
          display_name: thined.txt
          table: dat_fields

  - kind: model_group
    title: NTA and CDTA Files
    custom:
      elements:
        - kind: text
          text: >-
            Lookup files for the city's statistical geographies: 2020 neighborhood
            tabulation areas (NTAs), 2020 community district tabulation areas (CDTAs),
            and the 2010 census tract to NTA and PUMA equivalency. Each is copied from a
            CSCL table and written both as fixed-width text and as CSV. The polygons of
            these geographies are layers of the
            [district boundary geodatabase](#district-boundary-geodatabase). See the [architecture overview](../../docs/architecture.md) for how the pipeline fits together.
      short_title: NTA/CDTA
    entries:
      - name: nta2020_by_field
        custom:
          display_name: NTA2020.txt and NTA2020.csv
          table: dat_fields
      - name: cdta2020_by_field
        custom:
          display_name: CDTA2020.txt and CDTA2020.csv
          table: dat_fields
      - name: nta2010_by_field
        custom:
          display_name: NTA.txt and NTA.csv
          table: columns

  - kind: model_group
    title: LION Differences File
    custom:
      elements:
        - kind: text
          text: >-
            The LION Differences File (LDF) lists what changed between the previous LION
            release and this one: nodes added, deleted or moved, and segments, physical
            segments and generic segments added, deleted, split, merged or renumbered.
            Users whose own files are keyed to LION geography read it to bring them up to
            date. It is two citywide 100-byte fixed-width files: LDFHEADER.dat holds one
            header record, and LDFBASE.dat holds the change records, grouped by record
            type in the order N, S, G, P. See the [architecture overview](../../docs/architecture.md) for how the pipeline fits together.
        - kind: text
          text: >-
            Unlike the other outputs, the LDF takes two LION releases as input, and it
            carries state across releases: every record has a cumulative number, so a
            number identifies one record in one edition for good.
      known_differences: [LDF]
      short_title: LDF
    entries:
      - name: ldf_header_by_field
        custom:
          display_name: LDFHEADER.dat
          table: dat_fields
      - name: ldf_n_by_field
        custom:
          display_name: LDFBASE.dat node records
          table: dat_fields
      - name: ldf_segment_by_field
        custom:
          display_name: LDFBASE.dat segment records
          table: dat_fields
