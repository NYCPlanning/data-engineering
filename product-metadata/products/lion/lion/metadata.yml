  - value: B
    description: Both sides of segment are split among two or more election districts
  - value: L
    description: Left side of segment is split
  - value: R
    description: Right side of segment is split
  custom:
    fgdb_data_type: String
- id: lsubsect
  name: LSubSect
  data_type: text
  description: Sanitation District Subsection for the left side of the street. These are subareas of Sanitation Districts, which in general coincide with Community Districts, except possibly on a CD boundary (see SanDistInd).
  custom:
    fgdb_data_type: String
- id: rsubsect
  name: RSubSect
  data_type: text
  description: Sanitation District Subsection for the right side of the street. These are subareas of Sanitation Districts, which in general coincide with Community Districts, except possibly on a CD boundary (see SanDistInd).
  custom:
    fgdb_data_type: String
- id: sandistind
  name: SanDistInd
  data_type: text
  description: Sanitation District Boundary Indicator. Normally, sanitation routes are defined by the community district (CD) and sanitation district subsection. For some streets that divide a CD, the same route will service both sides. This indicator defines which CD will service the entire street. The Subsection (LSubSect and RSubSect) is NOT affected by the sanitation district boundary indicator.
  values:
  - value: L
    description: 'Left: For both sides of the street, the sanitation district is defined using the CD on the left side of the street.'
  - value: R
    description: 'Right: For both sides of the street, the sanitation district is defined using the CD on the right side of the street.'
  - value: blank
    description: The sanitation district route for each side of the street is correctly identified using the CD and subsection fields for the corresponding side of the street.
  custom:
    fgdb_data_type: String
- id: mapfrom
  name: MapFrom
  data_type: text
  description: DCP Sectional / Zoning Map at the beginning of the segment.
  custom:
    fgdb_data_type: String
- id: mapto
  name: MapTo
  data_type: text
  description: DCP Sectional / Zoning Map at the end of the segment.
  custom:
    fgdb_data_type: String
- id: borobndry
  name: BoroBndry
  data_type: text
  description: Borough Boundary Indicator. When a segment lies along a boundary of two boroughs, it is represented by two separate LION records, one for each borough. The flag indicates which side of the segment is out of the borough.
  custom:
    fgdb_data_type: String
- id: mh_ri_flag
  name: MH_RI_Flag
  data_type: text
  description: Marble Hill/Rikers Island Flag. These are two areas of the city that legally are part of one borough, but serviced by another. In each case, these records are flagged to be generated by the alternative borough for Geosupport purposes.
  custom:
    fgdb_data_type: String
