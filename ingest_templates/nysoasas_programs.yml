id: nysoasas_programs

attributes:
  name: Chemical Dependence Treatment Programs
  url: https://webapps.oasas.ny.gov/providerDirectory/index.cfm?search_type=2

ingestion:
  source:
    type: file_download
    # A statewide spreadsheet search. The site writes each search's results to one shared file per day
    # and redirects to it, so downloading that file directly returns whoever searched last.
    url: https://webapps.oasas.ny.gov/providerDirectory/index.cfm?search_type=2&region_type=0&rstformat=1&Submit=Submit
    filename: nysoasas_programs.csv
  file_format:
    type: csv
    dtype:
      PROGRAM_ZIP_CODE: str
      PROGRAM_ZIP_CODE_PLUS_4: str
      PROVIDER_ZIP_CODE: str
      PROVIDER_ZIP_CODE_PLUS_4: str
  processing_steps:
  - name: clean_column_names
    args: { "lower": True }

columns:
- id: provider_name
  data_type: text
- id: provider_number
  data_type: integer
- id: provider_street
  data_type: text
- id: provider_city
  data_type: text
- id: provider_county
  data_type: text
- id: provider_state
  data_type: text
- id: provider_zip_code
  data_type: text
- id: program_name
  data_type: text
- id: program_number
  data_type: integer
- id: program_county
  data_type: text
- id: program_street_address
  data_type: text
- id: program_city
  data_type: text
- id: program_state
  data_type: text
- id: program_zip_code
  data_type: text
- id: program_type
  data_type: text
- id: service_type
  data_type: text
