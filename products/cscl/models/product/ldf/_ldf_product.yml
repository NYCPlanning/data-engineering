version: 2

models:
- name: ldf_n_by_field
  description: Node change records, each field formatted to its fixed width.
  columns: &ldf_field_columns
  - name: cumulative_record_number
    tests:
    - not_null
    - unique
    - dbt_expectations.expect_column_value_lengths_to_equal:
        arguments: { value: 10 }

- name: ldf_segment_by_field
  description: >
    Segment change records (S, P and G) formatted to fixed width. All three share one
    byte-identical layout, so they share one formatting seed.
  columns: *ldf_field_columns

- name: ldf_header_by_field
  description: The header record, formatted to fixed width.

- name: ldf_base
  description: >
    LDFBASE.dat - every LDF data record as a 100-byte line, ordered N, S, G, P then by
    action code then by ID.
  columns:
  - name: dat_column
    tests:
    - dbt_expectations.expect_column_value_lengths_to_equal:
        arguments: { value: 100 }

- name: ldf_header
  description: LDFHEADER.dat - the single 100-byte header record.
  columns:
  - name: dat_column
    tests:
    - dbt_expectations.expect_column_value_lengths_to_equal:
        arguments: { value: 100 }
