  name: the_geom
  data_type: geometry
  description: Feature geometry.
- id: zonedist
  name: ZONEDIST
  data_type: text
  description: Zoning district designation.
- id: shape_leng
  name: Shape_Leng
  data_type: decimal
  description: Length of feature in internal units.
- id: shape_area
  name: Shape_Area
  data_type: decimal
  description: Area of feature in internal units squared.
