      layer_name: SEDAT
  - name: dcp_cscl_gdb
    import_as: dcp_cscl_segment_lgc
    custom:
      filename: ETL Working GDB.gdb.zip
      layer_name: SEGMENT_LGC
  - name: dcp_cscl_gdb
    import_as: dcp_cscl_specialsedat
