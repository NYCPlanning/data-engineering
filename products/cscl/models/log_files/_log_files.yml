version: 2

models:
- name: log
  description: >-
    The build log, exported as log.csv: one row per record a LION check flagged
    (error or warning), plus one summary row per exported flat file with its record
    count. Each row comes from one log__* model, named in _dbt_source_relation.
  columns:
  - name: _dbt_source_relation
    description: The log__* model the row came from.
  - name: log_level
    description: "`error`, `warning`, or `info` (file summary rows)."
  - name: error_category
    description: >-
      The check that produced the row, e.g. `borough mismatch`, or `output file
      summary` for a file summary row.
  - name: globalid
    description: GlobalID of the flagged source feature. Blank on file summary rows.
  - name: source_feature_layer
    description: >-
      Source layer of the flagged feature (centerline, altsegmentdata, ...). Blank on
      file summary rows.
  - name: record_id_type
    description: What record_id holds (currently always `segmentid`). Blank on file summary rows.
  - name: record_id
    description: The flagged record's id, per record_id_type. Blank on file summary rows.
  - name: message
    description: >-
      Human-readable message, worded after prod's ETL report where prod logs the same
      condition. Blank for checks with no prod equivalent message.
  - name: output_filename
    description: Exported file name. File summary rows only.
  - name: record_count
    description: Number of records written to output_filename. File summary rows only.

- name: log__export_file_summary
  description: >-
    One row per exported flat file (log.csv excluded) with its record count, like
    prod's "Total <file> output records: N" report lines.

- name: log__lion_centerline_boro_mismatch
  description: >-
    LION rows whose borough differs from their source feature's own borough (the
    centerline's boroughcode, or the proto segment's borough), matching prod's
    "does not match the borough currently being extracted" check. A blank source
    borough is derived downstream, as in prod, and isn't flagged.
