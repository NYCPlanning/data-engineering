id: nysed_activeinstitutions
acl: public-read

attributes:
  name: NYSED Active Institutions by County
  description: >-
    Active institutions registered with the New York State Education Department,
    listed by county. Manually refreshed into the inbox.
  url: https://www.nysed.gov/

ingestion:
  source:
    type: s3
    bucket: edm-recipes
    key: inbox/nysed_activeinstitutions/{{ version }}/All_Institutions_by_County.csv
  file_format:
    type: csv
    dtype: str
  processing_steps:
  - name: clean_column_names
    args: { "replace": { " ": "_" }, "lower": True }
  - name: rename_columns
    args:
      map: { "popular_name.1": "popular_name2" }
