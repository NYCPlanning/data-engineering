version: 2
models:
  - name: gdb_lion
    description: "LION segment line layer for the published ESRI geodatabase (nyclion_*.zip). Columns match the prod GDB field names. Fields not yet available from int__lion are NULL."
    columns:
      - name: "'SegmentID'"
        description: "7-character segment identifier"
        data_tests:
          - not_null
      - name: geom
        description: "Segment line geometry (MultiLineString, EPSG:2263)"
        data_tests:
          - not_null
  - name: gdb_node
    description: "LION node point layer for the published ESRI geodatabase (nyclion_*.zip). Mostly a passthrough of the source Node layer (dcp_cscl_nodes, via stg__nodes), except floating virtual-intersection nodes (see VIntersect) are dropped; columns match the prod GDB field names."
    columns:
      - name: "'NODEID'"
        description: "Node identifier"
        data_tests:
          - not_null
      - name: geom
        description: "Node point geometry (Point, EPSG:2263)"
        data_tests:
          - not_null
  - name: gdb_node_stname
    description: >
      Node-to-street-name crosswalk (non-spatial) for the published LION GDB: for each
      node, the principal names of the segments meeting at it (via STREETSHAVEINTERSECTIONS).
      Implements the real legacy algorithm (Report_NY_Nodestr(12B).py) - StreetName's
      structured pre/post fields concatenated directly (already abbreviated at the source,
      e.g. pre_directional "W"/post_type "ST"), overridden by FeatureName when both exist
      for a segment's preferred B7SC, with a segmentid-keyed fallback (Subway/Rail/
      Shoreline/NonStreetFeature/Centerline) when neither name table has an entry.
    columns:
      - name: "'NODEID'"
        description: "Node identifier"
        data_tests:
          - not_null
      - name: "'STNAME'"
        description: "Principal street/feature name at the node (leading-space padded)"
        data_tests:
          - not_null
  - name: gdb_altnames
    description: >
      Alternate street/feature names (non-spatial) for the published LION GDB, keyed by
      Join_ID: one set per LION record, segments and SAF replicants alike. A SAF
      replicant's names come from its host segment's B7SCs (with the AltSegmentData
      street code for types B-F/O/P), not from the B7SC encoded in its Join_ID - see
      CSCL-LION-09 in data_issues.md.
    columns:
      - name: "'Join_ID'"
        description: "15-char link to the lion layer's Join_ID (ETL spec §2.7.3)"
        data_tests:
          - not_null
      - name: "'SName'"
        description: "Basic street name (or whole name for feature names)"
        data_tests:
          - not_null
