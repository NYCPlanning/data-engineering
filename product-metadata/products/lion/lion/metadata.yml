- id: yfrom
  name: YFrom
  data_type: integer
  description: Y (Spatial) coordinate at the 'From' end of a segment.
  custom:
    fgdb_data_type: Integer
- id: xto
  name: XTo
  data_type: integer
  description: X (Spatial) coordinate at the 'To' end of a segment.
  custom:
    fgdb_data_type: Integer
- id: yto
  name: YTo
  data_type: integer
  description: Y (Spatial) coordinate at the 'To' end of a segment.
  custom:
    fgdb_data_type: Integer
- id: arccenterx
  name: ArcCenterX
  data_type: integer
  description: X (Spatial) coordinate at the center of the curve.
  custom:
    fgdb_data_type: Integer
- id: arccentery
  name: ArcCenterY
  data_type: integer
  description: Y (Spatial) coordinate at the center of the curve.
  custom:
    fgdb_data_type: Integer
- id: curveflag
  name: CurveFlag
  data_type: text
  description: Indicates whether a LION record represents a straight segment, irregular curve (not a circular arc) or a regular curve (circular arc) segment. If a regular curve segment, indicates which side of the segment the curve is on.
  values:
  - value: blank
    description: LION record represents a straight line segment
  - value: I
    description: LION record represent an irregularly curved segment (not a circular arc)
  - value: L
    description: LION record represents a curved segment consisting of a circular arc lying on the left side of the segment's directed chord.
  - value: R
    description: LION record represents a curved segment consisting of a circular arc lying on the right side of the segment's directed chord.
  custom:
    fgdb_data_type: String
- id: radius
  name: Radius
  data_type: integer
  description: This field contains a value only if the segment is a circular arc (i.e. regular curve), as indicated by an 'L' or an 'R' in the CurveFlag field. The value is the radius of the arc in feet, rounded to the nearest foot.
  custom:
    fgdb_data_type: Integer
- id: nodeidfrom
  name: NodeIDFrom
  data_type: text
  description: Node identifier at the low address end, or beginning of the segment.
  custom:
    fgdb_data_type: String
- id: nodeidto
  name: NodeIDTo
  data_type: text
  description: Node identifier at the high address end, or end of the segment.
  custom:
    fgdb_data_type: String
- id: nodelevelf
  name: NodeLevelF
  data_type: text
  description: Level code indicator vertical topology at the start of the street segment.
  values:
  - value: A-Z
    description: Relative level code on a scale where A is the lowest level of subterranean, M is ground level and Z is highest elevated level.
  - value: '*'
    description: Level-less feature associated with node. The asterisk is used to indicate the level-code on non-physical geometry, such as generic roadbed segments. Since these are non-physical, there is no 'real' level code that can be associated.
  - value: $
    description: Shoreline / water level.
  custom:
    fgdb_data_type: String
- id: nodelevelt
  name: NodeLevelT
  data_type: text
  description: Level code indicator vertical topology at the end of the street segment.
  values:
  - value: A-Z
    description: Relative level code on a scale where A is the lowest level of subterranean, M is ground level and Z is highest elevated level.
  - value: '*'
    description: Level-less feature associated with node. The asterisk is used to indicate the level-code on non-physical geometry, such as generic roadbed segments. Since these are non-physical, there is no 'real' level code that can be associated.
  - value: $
    description: Shoreline / water level.
  custom:
    fgdb_data_type: String
- id: conparity
  name: ConParity
  data_type: text
  description: Continuous Parity Indicator (Domain Values = L, R). A continuous parity segment has both odd and even addresses on the same side of the segment, and no addresses on the other side. In a LION record that represents a continous parity segment, the odd and even address ranges are stored separately and the 1-byte code indicates on which side of the street the addresses physically exist.
  data_source: ESRI
  values:
  - value: L
    description: Odd and Even house number are bothe on the left side of the segment.
  - value: R
    description: Odd and Even house number are bothe on the right side of the segment.
  custom:
    fgdb_data_type: String
- id: twisted
  name: Twisted
  data_type: text
  description: 'Twisted Parity: Occasionally, the address parities along a street switch. If a ''T'' value exists in this field, it indicates that the parities have changed since the immediately preceding segment of the same street (i.e., if odd addresses were on the left, now they are on the right).'
  data_source: ESRI
  values:
  - value: T
    description: Indicates that the address parities along a street have switched since the immediately preceding segment of the same street (i.e., if odd addresses were on the left, they are now on the right).
  custom:
    fgdb_data_type: String
- id: rw_type
  name: RW_TYPE
  data_type: text
  description: Roadway Type
  values:
  - value: '1'
    description: Street
  - value: '2'
    description: Highway
  - value: '3'
    description: Bridge
  - value: '4'
    description: Tunnel
  - value: '5'
    description: Boardwalk
  - value: '6'
    description: Path/Trail
  - value: '7'
    description: Step Street
  - value: '8'
    description: Driveway
  - value: '9'
    description: Ramp
  - value: '10'
    description: Alley
  - value: '11'
    description: Unknown
  - value: '12'
    description: Non-Physical Street Segment
  - value: '13'
    description: U-Turn
  - value: '14'
    description: Ferry Route
  custom:
    fgdb_data_type: String
- id: physicalid
  name: PhysicalID
  data_type: integer
  description: A unique ID assigned in order to aggregate granular geometry to represent a Physical View of the city's street network. In CSCL, segmentation is very granular in order to accommodate many types of physical and non-physical geometry. The Physical ID is a unique number used to identify a physically existing piece of geometry that may or may not be comprised of several Segment IDs. For example, E 28 Street between 2nd Ave and 3rd Ave in Manhattan would have 1 Physical ID although there are 3 segments defining that block face, with 3 separate Segment IDs.
  custom:
    fgdb_data_type: Integer
- id: genericid
  name: GenericID
  data_type: integer
  description: A unique ID assigned in order to aggregate granular geometry to represent a Generic View of the city's street network. Streets that contain multiple carriageways or roadbeds (such as Queens Boulevard in Queens and Park Ave in Manhattan) are represented by multiple centerlines corresponding to each roadbed as well as an imaginary 'single' generic centerline.
  custom:
    fgdb_data_type: Integer
- id: nypdid
  name: NYPDID
  data_type: text
  description: A unique ID assigned for NYPD's use in order to aggregate granular geometry for administrative purposes.
  custom:
    fgdb_data_type: String
- id: fdnyid
  name: FDNYID
  data_type: integer
  description: Not currently implemented. A unique ID assigned for FDNY's use in order to aggregate granular geometry for their administrative purposes.
  custom:
    fgdb_data_type: Integer
- id: lblockfaceid
  name: LBlockFaceID
  data_type: text
  description: A ten digit number (right justified, zero filled) identifying the block face on the left hand side of a segment. Block Face is defined as one continuous side of a physical block that is intersected on that side by two other physical through streets. Blockface IDs were established by DoITT’s consultants working on the planimetric feature classes for NYC and are not maintained by the Department of City Planning.
  custom:
    fgdb_data_type: String
- id: rblockfaceid
  name: RBlockFaceID
  data_type: text
  description: A ten digit number (right justified, zero filled) identifying the block face on the right hand side of a segment. Block Face is defined as one continuous side of a physical block that is intersected on that side by two other physical through streets. Blockface IDs were established by DoITT’s consultants working on the planimetric feature classes for NYC and are not maintained by the Department of City Planning.
  custom:
    fgdb_data_type: String
- id: legacyid
  name: LegacyID
  data_type: text
  description: LION 09C Segment IDs which were migrated for the initial population of the CSCL. This data is captured in order to help users migrate legacy data. New geometry in the CSCL/LION will not have this field populated, however existing CSCL/LION segments will retain the legacy ID when split.
  data_source: ESRI
  custom:
    fgdb_data_type: String
- id: status
  name: Status
  data_type: text
  description: Refers to the construction status of a street segment.
  values:
  - value: '1'
    description: Planned Private
  - value: '2'
    description: Constructed
  - value: '3'
    description: Paper
  - value: '4'
    description: Under Construction
  - value: '5'
    description: Demapped
  - value: '9'
    description: Paper Street Coincident with Boundary
  custom:
    fgdb_data_type: String
- id: streetwidth_min
  name: StreetWidth_Min
  data_type: decimal
  description: Formerly known as StreetWidth, this represents the narrowest width, in feet, of the paved area of the street. These values correspond to the StreetWidth field in Geosupport.
  custom:
    fgdb_data_type: Single
- id: streetwidth_max
  name: StreetWidth_Max
  data_type: decimal
  description: The maximum width, in feet, of the paved area of the street.
  custom:
    fgdb_data_type: Single
- id: streetwidth_irr
  name: StreetWidth_Irr
  data_type: text
  description: Not currently implemented. Flag indicating whether the street width is consistent along a street segment.
  custom:
    fgdb_data_type: String
- id: bikelane
  name: BikeLane
  data_type: text
  description: 'Bike Lane: Defines which segments are part of the bicycle network as defined by the Department of Transportation. These values correspond to Bike Lane 2 in Geosupport.'
  values:
  - value: '1'
    description: 'Class 1: Separated Greenway'
  - value: '2'
    description: 'Class II: Striped Bike Lane'
  - value: '3'
    description: 'Class III: Signed Bicycle Route'
  - value: '4'
    description: 'Links: Connecting segments.'
  - value: '5'
    description: 'Class I, II: Combination of Class I and II'
  - value: '6'
    description: 'Class II, III: Combination of Class II and III'
  - value: '7'
    description: 'Stairs: Includes step streets, bridge stairs, etc.'
  - value: '8'
    description: 'Class I, III: Combination of Class I and III'
  - value: '9'
    description: 'Class II, I: Combination of Class II and I'
  - value: '10'
    description: 'Class III, I: Combination of Class III and I'
  - value: '11'
    description: 'Class III, II: Combination of Class III and II'
  custom:
    fgdb_data_type: String
- id: bike_trafdir
  name: BIKE_TRAFDIR
  data_type: text
  description: BIKE_TRAFDIR (Bike Traffic Direction) defines bicycle traffic direction on segments that are part of the bicycle network as defined by the Department of Transportation.
  values:
  - value: blank
    description: This segment is not part of the bicycle network as defined by the Department of Transportation.
  - value: FT
    description: Bike traffic is one way. The bike traffic flow is with the direction of increasing addresses, if any. This direction is also known as ‘with’ the segment’s logical direction, i.e. from the FROM node to the TO node.
  - value: TF
    description: Bike traffic is one way. The bike traffic flow is against the direction of increasing addresses, if any. This direction is also known as ‘against’ the segment’s logical direction, i.e. from the TO node to the FROM node.
  - value: TW
    description: Bike traffic is two way. Bicycles travel in both directions.
  custom:
    fgdb_data_type: String
- id: active_flag
  name: ACTIVE_FLAG
  data_type: text
  description: ACTIVE_FLAG only applies to LION segments representing subway features. This field is being introduced with the digitization of the 2nd Avenue subway to indicate which portions are open versus under construction or proposed.
  values:
  - value: Y
    description: This portion of the subway is active and open.
  - value: N
    description: This portion of the subway is inactive, i.e. either under construction or proposed.
  - value: 'NULL'
    description: This segment does not represent a subway feature.
  custom:
    fgdb_data_type: String
- id: posted_speed
  name: POSTED_SPEED
  data_type: text
  description: POSTED_SPEED contains the speed limit, in miles per hour, of the paved area.
  custom:
    fgdb_data_type: String
- id: snow_priority
  name: Snow_Priority
  data_type: text
  description: DSNY snow removal priority designation.
  values:
  - value: blank
    description: unknown
  - value: C
    description: 'Critical: These routes are comprised of highways (main beds, entrances, exits, interchanges), arterial roadways, main travel thoroughfares (single land and multi-lane), bus routes, that contain emergency services and first responder facilities (Hospitals, EMS, FDNY, NYPD) and schools.'
  - value: S
    description: 'Sector: Designed to encompass all streets that are not classified as Critical Streets and are awide enough to accommodate a full size DSNY collection truck with a plow attached.'
  - value: H
    description: 'Haulster: Designed to service dead ends and streets that cannot be serviced with a collection truck or salt spreader with a plow attached due to narrow street width or tight turning radius (either entering or exiting the street).'
  - value: V
    description: Non-DSNY
  custom:
    fgdb_data_type: String
- id: number_travel_lanes
  name: Number_Travel_Lanes
  data_type: text
  description: The number of lanes in a carriageway (roadway) that are designated for the movement of vehicles traveling from one destination to another. The number of travel lanes were determined by DoITT’s consultants working on the planimetric feature classes for NYC.
  custom:
    fgdb_data_type: String
- id: number_park_lanes
  name: Number_Park_Lanes
  data_type: text
  description: The number of lanes in a carriageway (roadway) that are reserved for parallel parking of vehicles. The number of parking lanes were determined by DoITT’s consultants working on the planimetric feature classes for NYC.
  custom:
    fgdb_data_type: String
- id: number_total_lanes
  name: Number_Total_Lanes
  data_type: text
  description: The total number of lanes in a carriageway (roadway) including travel lanes and parking lanes. The total number of lanes were determined by DoITT’s consultants working on the planimetric feature classes for NYC.
  custom:
    fgdb_data_type: String
- id: carto_display_level
  name: Carto_Display_Level
  data_type: text
  description: 'Cartographic Display Level: Select LION segments are flagged as a way to designate major roads for cartographic purposes at various scales.'
  values:
  - value: '10'
    description: City
  - value: '20'
    description: Borough
  - value: '30'
    description: Neighborhood
  custom:
    fgdb_data_type: String
- id: fcc
  name: FCC
  data_type: text
  description: Not currently implemented. Federal Classification Code
  custom:
    fgdb_data_type: String
- id: row_type
  name: ROW_Type
  data_type: text
  description: 'Right-of-Way Type: These refer only to subway and rail segments.'
  values:
  - value: '1'
    description: Subterranean
  - value: '2'
    description: Elevated
  - value: '3'
    description: Surface
  - value: '4'
    description: Hidden
  - value: '5'
    description: Open Cut Depression
  - value: '6'
    description: Embankment
  - value: '7'
    description: Viaduct
  - value: '8'
    description: Subterranean Coincident with Boundary
  custom:
    fgdb_data_type: String
- id: llo_hyphen
  name: LLo_Hyphen
  data_type: text
  description: Low Value for the hyphenated address range beginning on the left side of the street segment. Left and right are defined relative to a street segment's direction. For streets that have addresses, the direction of a DCPLION streeet segment is determined by the direction of increasing address numbers. Note that this direction is unrelated to the street's traffic direction or its orientation relative to the points of the compass. The direction of streets with out address numbers, as well as non-street features, is assigned arbitrarily, but is consistent within the street feature. Direction can usually be determined by observing which way the SeqNum increases. Includes hyphenated addresses.
  data_source: ESRI
  custom:
    fgdb_data_type: String
- id: lhi_hyphen
  name: LHi_Hyphen
  data_type: text
  description: High Value for the hyphenated address range beginning on the left side of the street segment.
  data_source: ESRI
  custom:
    fgdb_data_type: String
- id: rlo_hyphen
  name: RLo_Hyphen
  data_type: text
  description: Low Value for the hyphenated address range beginning on the right side of the street segment.
  data_source: ESRI
  custom:
    fgdb_data_type: String
- id: rhi_hyphen
  name: RHi_Hyphen
  data_type: text
  description: High Value for the hyphenated address range beginning on the right side of the street segment.
  data_source: ESRI
  custom:
    fgdb_data_type: String
- id: fromleft
  name: FromLeft
  data_type: integer
  description: Low Value for the numeric address range beginning on the left side of the street segment. For all hyphanated addresses, the hyphen has been removed. To convert the before hyphen portion of the house number is multiplied by 1000 and then added to the after hyphen portion of the house number (e.g. 101-40 would be converted to 101040).
  data_source: ESRI
  custom:
    fgdb_data_type: Integer
- id: toleft
  name: ToLeft
  data_type: integer
  description: High Value for the numeric address range beginning on the left side of the street segment.
  data_source: ESRI
  custom:
    fgdb_data_type: Integer
- id: fromright
  name: FromRight
  data_type: integer
  description: Low Value for the numeric address range beginning on the right side of the street segment.
  data_source: ESRI
  custom:
    fgdb_data_type: Integer
- id: toright
  name: ToRight
  data_type: integer
  description: High Value for the numeric address range beginning on the right side of the street segment.
  data_source: ESRI
  custom:
    fgdb_data_type: Integer
- id: join_id
  name: Join_ID
  data_type: text
  description: Identification field used to link LION feature class with Alternative Names table during a geocoding operation.
  data_source: ESRI
  custom:
    fgdb_data_type: String
- id: l_pd_service_area
  name: L_PD_Service_Area
  data_type: text
  description: Left side Police Service Areas (PSAs), which provides the Housing Bureau Police services to a set of housing developments.
  custom:
    fgdb_data_type: String
- id: r_pd_service_area
  name: R_PD_Service_Area
  data_type: text
  description: Right side Police Service Areas (PSAs), which provides the Housing Bureau Police services to a set of housing developments.
  custom:
    fgdb_data_type: String
- id: truck_route_type
  name: TRUCK_ROUTE_TYPE
  data_type: text
  description: Segments that are part of the New York City truck route network designated by Department of Transportation for use by trucks and other commercial vehicles.
  values:
