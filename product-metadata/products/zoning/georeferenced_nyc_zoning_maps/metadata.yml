- id: socrata
  type: open_data
  files:
  - id: zoning_georeferenced_maps_data_dictionary
    custom:
      destination_use: attachment
  - id: fgdb
    custom:
      destination_use: dataset_file
  custom:
    four_four: mxbm-493w
    is_unparsed_dataset: true
- id: bytes
  type: bytes
  files:
