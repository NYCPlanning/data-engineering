  # We need to mock that for now to use GR's Legacy ETL Outputs
  - name: dcp_cscl_temp_mock_previous_release
    source: edm.private
    version: 26B
    file_type: csv
    load_engine: pandas
    import_as: previous_citywide_lion
    custom:
      filename: citywide_lion_dat.csv

  - name: dcp_cscl_temp_mock_previous_release
    source: edm.private
    version: 26B
    file_type: csv
    load_engine: pandas
    import_as: previous_ldf_header
    custom:
      filename: previous_ldf_header.csv
  missing_versions_strategy: find_latest # TODO - they should all match

exports:
  output_folder: output
  zip_name: output
  datasets:
  # GeoSupport LION
  - name: manhattan_lion_dat
    group: flat_files
    filename: ManhattanLION.dat
    format: dat
    custom:
      formatting: lion_dat
      # parquet-first packaging (exports.package_from_parquet): format the
      # unformatted rows outside the database
      layout: seeds/text_formatting/text_formatting__lion_dat.csv
      layout_source: lion_dat_fields
      where: "boroughcode = '1'"
  - name: bronx_lion_dat
    group: flat_files
    filename: BronxLION.dat
    format: dat
    custom:
      formatting: lion_dat
      # parquet-first packaging (exports.package_from_parquet): format the
      # unformatted rows outside the database
      layout: seeds/text_formatting/text_formatting__lion_dat.csv
      layout_source: lion_dat_fields
      where: "boroughcode = '2'"
  - name: brooklyn_lion_dat
    group: flat_files
    filename: BrooklynLION.dat
    format: dat
    custom:
      formatting: lion_dat
      # parquet-first packaging (exports.package_from_parquet): format the
      # unformatted rows outside the database
      layout: seeds/text_formatting/text_formatting__lion_dat.csv
      layout_source: lion_dat_fields
      where: "boroughcode = '3'"
  - name: queens_lion_dat
    group: flat_files
    filename: QueensLION.dat
    format: dat
    custom:
      formatting: lion_dat
      # parquet-first packaging (exports.package_from_parquet): format the
      # unformatted rows outside the database
      layout: seeds/text_formatting/text_formatting__lion_dat.csv
      layout_source: lion_dat_fields
      where: "boroughcode = '4'"
  - name: staten_island_lion_dat
    group: flat_files
    filename: StatenIslandLION.dat
    format: dat
    custom:
      formatting: lion_dat
      # parquet-first packaging (exports.package_from_parquet): format the
      # unformatted rows outside the database
      layout: seeds/text_formatting/text_formatting__lion_dat.csv
      layout_source: lion_dat_fields
      where: "boroughcode = '5'"

  # LDF - formatting is applied inside the models, since the record file mixes layouts.
  # compare_file is off because positions 91-100 carry a cumulative record number that
  # diverges from prod's (data_issues.md CSCL-LDF-03), so a whole-line file diff reports
  # every record after the first divergence. qa__ldf_summary compares positions 1-90.
  - name: ldf_base
    group: flat_files
    filename: LDFBASE.dat
    format: dat
    custom: { compare_file: false }
  - name: ldf_header
    group: flat_files
    filename: LDFHEADER.dat
    format: dat
    custom: { compare_file: false }

  # SAF
  - name: saf_abcegnpx_generic
    group: flat_files
    filename: GenericABCEGNPX.txt
    format: dat
    custom: { formatting: saf_a }
  - name: saf_abcegnpx_roadbed
    group: flat_files
    filename: RoadbedABCEGNPX.txt
    format: dat
    custom: { formatting: saf_a }
  - name: saf_d_generic
    group: flat_files
    filename: GenericD.txt
    format: dat
    custom: { formatting: saf_d }
  - name: saf_d_roadbed
    group: flat_files
    filename: RoadbedD.txt
    format: dat
    custom: { formatting: saf_d }
  - name: saf_i
    group: flat_files
    filename: Intersection.txt
    format: dat
    custom: { formatting: saf_i }
  - name: saf_ov_generic
    group: flat_files
    filename: GenericOV.txt
    format: dat
    custom: { formatting: saf_v }
  - name: saf_ov_roadbed
    group: flat_files
    filename: RoadbedOV.txt
    format: dat
    custom: { formatting: saf_v }
  - name: saf_s_generic
    group: flat_files
    filename: GenericS.txt
    format: dat
    custom: { formatting: saf_s }
  - name: saf_s_roadbed
    group: flat_files
    filename: RoadbedS.txt
    format: dat
    custom: { formatting: saf_s }

  # SEDAT
  - name: sedat
    group: flat_files
    filename: SEDAT.txt
    format: dat
    custom: { formatting: sedat }
  - name: special_sedat
    group: flat_files
    filename: SpecialSEDAT.txt
    format: dat
    custom: { formatting: sedat }

  # SND, Geosupport Normalizing Tables
  - name: snd
    group: flat_files
    filename: SND.txt
    format: dat
    custom: { formatting: snd }
  - name: exception
    group: flat_files
    filename: Exception.txt
    format: dat
  - name: universal_word
    group: flat_files
    filename: Universal.txt
    format: csv
    custom:
      header: False
      line_endings: crlf
  - name: last_word
    group: flat_files
    filename: LastWord.txt
    format: csv
    custom:
      header: False
      line_endings: crlf
  - name: enders
    group: flat_files
    filename: Enders.txt
    format: dat

  # Face Code
  - name: manhattan_face_code
    group: flat_files
    filename: ManhattanFace.txt
    format: dat
    custom: { formatting: face_code }
  - name: bronx_face_code
    group: flat_files
    filename: BronxFace.txt
    format: dat
    custom: { formatting: face_code }
  - name: brooklyn_face_code
    group: flat_files
    filename: BrooklynFace.txt
    format: dat
    custom: { formatting: face_code }
  - name: queens_face_code
    group: flat_files
    filename: QueensFace.txt
    format: dat
    custom: { formatting: face_code }
  - name: staten_island_face_code
    group: flat_files
    filename: StatenIslandFace.txt
    format: dat
    custom: { formatting: face_code }

  # Other
  - name: rpl
    group: flat_files
    filename: RPL.txt
    format: dat
    custom: { formatting: rpl }

  # Log file
  - name: log
    group: flat_files
    filename: log.csv
    format: csv

  # Thin LION
  - name: thinlion_all
    group: flat_files
    filename: nyc.thinlion
    format: dat
    custom: { formatting: thinlion_dat }
  - name: thinlion_bronx
    group: flat_files
    filename: BronxThinLION.txt
    format: dat
    custom: { formatting: thinlion_dat }
  - name: thinlion_brooklyn
    group: flat_files
    filename: BrooklynThinLION.txt
    format: dat
    custom: { formatting: thinlion_dat }
  - name: thinlion_manhattan
    group: flat_files
    filename: ManhattanThinLION.txt
    format: dat
    custom: { formatting: thinlion_dat }
  - name: thinlion_queens
    group: flat_files
    filename: QueensThinLION.txt
    format: dat
    custom: { formatting: thinlion_dat }
  - name: thinlion_statenisland
    group: flat_files
    filename: StatenIslandThinLION.txt
    format: dat
    custom: { formatting: thinlion_dat }

  # Thin Fire
  - name: thinfire_bronx
    group: flat_files
    filename: BronxThinFire.txt
    format: dat
    custom: { formatting: thinfire_dat }
  - name: thinfire_brooklyn
    group: flat_files
    filename: BrooklynThinFire.txt
    format: dat
    custom: { formatting: thinfire_dat }
  - name: thinfire_manhattan
    group: flat_files
    filename: ManhattanThinFire.txt
    format: dat
    custom: { formatting: thinfire_dat }
  - name: thinfire_queens
    group: flat_files
    filename: QueensThinFire.txt
    format: dat
    custom: { formatting: thinfire_dat }
  - name: thinfire_statenisland
    group: flat_files
    filename: StatenIslandThinFire.txt
    format: dat
    custom: { formatting: thinfire_dat }

  # Thin Election District
  - name: thined_dat
    group: flat_files
    filename: thined.txt
    format: dat
    custom: { formatting: thined_dat }

  # CDTA 2020
  - name: cdta2020_dat
    group: flat_files
    filename: CDTA2020.txt
    format: dat
    custom: { formatting: cdta2020_dat }
  - name: cdta2020_csv
    group: flat_files
    filename: CDTA2020.csv
    format: csv
    custom:
      line_endings: crlf

  # NTA 2020
  - name: nta2020_dat
    group: flat_files
    filename: NTA2020.txt
    format: dat
    custom: { formatting: nta2020_dat }
  - name: nta2020_csv
    group: flat_files
    filename: NTA2020.csv
    format: csv
    custom:
      line_endings: crlf

  # NTA 2010
  - name: nta2010_csv
    group: flat_files
    filename: NTA.csv
    format: csv
    custom:
      line_endings: crlf
  - name: nta2010_txt
    group: flat_files
    filename: NTA.txt
    format: dat

  # ESRI / published LION geodatabase — filename must match `version:` at top of this file
  - name: gdb_lion
    group: lion_gdb
    filename: nyclion_26c.zip
    format: gdb
    custom: { layer: lion, geometry_type: lines }
  - name: gdb_node
    group: lion_gdb
    filename: nyclion_26c.zip
    format: gdb
    custom: { layer: node, geometry_type: points }
  - name: gdb_node_stname
    group: lion_gdb
    filename: nyclion_26c.zip
    format: gdb
    custom: { layer: node_stname, spatial: false }
  - name: gdb_altnames
    group: lion_gdb
    filename: nyclion_26c.zip
    format: gdb
    custom: { layer: altnames, spatial: false }

  # District boundary geodatabase (ETL spec ch. 10, table 39)
  # filename must match prod's, which embeds the cycle from `version:` above
  - name: gdb_nyad
    group: district_gdb
    filename: v26C_Districts.gdb.zip
    format: gdb
    custom: { layer: nyad, geometry_type: polygons }
  - name: gdb_nyadwi
    group: district_gdb
    filename: v26C_Districts.gdb.zip
    format: gdb
    custom: { layer: nyadwi, geometry_type: polygons }
