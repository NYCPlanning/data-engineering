# Boilerplate doc content with no natural home on any one dbt model - loaded via
# dcpy.utils.doc.load_sections() and prepended to the generated per-model sections.
# Top level must be a list of Section objects (dcpy.utils.doc.Section).

- title: Field Formatting
  elements:
    - kind: text
      text: >-
        A field marked "filler" in a layout below is always blank. A field sourced
        from a CSCL attribute is blank whenever that attribute is null, unless the
        field's own description says otherwise.
    - kind: text
      text: >-
        Every [[dat_file|text-formatted]] field's justification and fill are given by
        a four-letter code in its layout's Format column (e.g. `RJZF`): the first two
        letters set the justification and the last two the fill.
    - kind: table
      headers: ["Code", "Meaning"]
      rows:
        - ["LJ", "Left-justified"]
        - ["RJ", "Right-justified - also any code that doesn't start with LJ, such as RF"]
        - ["SF", "Space-filled - also any code that doesn't end in ZF"]
        - ["ZF", "Zero-filled"]
