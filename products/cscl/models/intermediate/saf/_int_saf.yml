version: 2

models:
- name: int__address_points
  description: "Address points with house numbers converted to the SAF format (section letter encoded for Edgewater Park style E and F street names), keyed by addresspointid."
  columns:
  - name: addresspointid
    description: "Address point id."
- name: int__saf_segments
  description: "One row per SAF record that attaches to a segment, from altsegmentdata, address points (types S and V) and CommonPlace (G, N, X). Resolves each record to its host proto-segment and, for roadbed records, to the generic segment."
  columns:
  - name: saf_globalid
    description: "GlobalID of the SAF source record."
  - name: saftype
    description: "SAF type."
  - name: saf_source_table
    description: "Source: altsegmentdata, addresspoints or commonplace."
- name: int__saf_abcep
  description: "SAF records of types A, B, C, E and P, from altsegmentdata."
- name: int__saf_d
  description: "SAF type D records (DAPS), from altsegmentdata."
- name: int__saf_o
  description: "SAF type O records, from altsegmentdata."
- name: int__saf_gnx
  description: "SAF records of types G, N and X, from CommonPlace points."
- name: int__saf_orphan_segmentids
  description: "SAF records whose SEGMENTID matches no segment, which prod logs and leaves out of SAF: A/B/C/E/P, D/F and O altsegmentdata rows and S/V address points with no centerline, G/N/X CommonPlaces (with a valid B7SC) with no centerline, shoreline, rail or subway feature."
- name: int__saf_s_checks
  description: "SAF S address points on a centerline that fail one of prod's S checks (CSCL-LOG-SAF-06..11), with the id of the first one they fail. int__saf_s drops them; log__saf_s_checks logs them."
- name: int__saf_commonplace_proto
  description: "G/N/X CommonPlaces whose segment's first proto doesn't match them (CSCL-LOG-SAF-26, -27). int__saf_gnx drops them; log__saf_commonplace_proto logs them."
- name: int__saf_i
  description: "SAF type I records: named intersections."
- name: int__saf_s
  description: "SAF type S records, from address points."
- name: int__saf_v
  description: "SAF type V (vanity) records, from address points."
- name: int__saf_altnames_join_ids
  description: "SAF-replicant Join_IDs for CommonPlace (G, N, X) and address point (S, V) records, one per SAF record and host proto-segment."
- name: int__saf_replicant_fields
  description: "Every SAF source normalized to one shape for the LION SAF replicant rows: resolved lionkey, special address flag, house-number and ZIP overrides, SAF street name and code, and Join_ID. Address point S and V ZIP overrides are not implemented."
  columns:
  - name: ap_high_hn_prod
    description: "An address point's (S, V) high house number as prod's LION gdb writes it: for HYPHEN_TYPE R, the part after a dash in HOUSE_NUMBER, none without one (CSCL-LION-25). Null for other sources."
  - name: ap_high_hn_fixed
    description: "An address point's high house number from HOUSE_NUMBER_RANGE for HYPHEN_TYPE R and X, else its house number. l_high_hn/r_high_hn take this when the var fix_hyphen_r_high_house_number is true, else ap_high_hn_prod (the default)."

- name: int__saf_replicant_b7sc
  description: >-
    LION gdb SAF replicants (except type A) with the B7SC prod names each by: B5SC + LGC1
    for AltSegmentData, B7SC_ACTUAL or B7SC_VANITY for AddressPoint S/V, the CommonPlace
    B7SC for G/N/X. For the name checks in log__gdb_lion_name_missing and
    log_name_table_warnings.

# sql fixtures: CI runs unit tests without building the upstream models, so dbt can't read
# their column types. B7SC 41356009 has two principal FeatureName rows and 11000201 two
# principal StreetName rows (source defects).
unit_tests:
- name: test__int__saf_replicant_fields__duplicate_principal_lowest_objectid
  description: "A B7SC with two principal names takes the lowest OBJECTID's, as prod's first-row lookup does."
  model: int__saf_replicant_fields
  given:
  - input: ref('int__saf_segments')
    format: sql
    rows: |
      SELECT * FROM (VALUES
        ('10100001', 'cp1', 'commonplace', 'X', '1', FALSE, FALSE),
        ('10100001', 'asd1', 'altsegmentdata', 'B', '1', FALSE, FALSE)
      ) AS t (segment_lionkey, saf_globalid, saf_source_table, saftype, boroughcode, roadbed, generic)
  - input: ref('stg__altsegmentdata_saf')
    format: sql
    rows: |
      SELECT
        'asd1' AS globalid, 'B' AS saftype, '110002' AS b5sc, '01' AS lgc1, NULL::TEXT AS lgc2,
        NULL::TEXT AS lgc3, NULL::TEXT AS lgc4, NULL::TEXT AS sosindicator, NULL::TEXT AS l_low_hn,
        NULL::TEXT AS l_high_hn, NULL::TEXT AS r_low_hn, NULL::TEXT AS r_high_hn, NULL::TEXT AS zipcode
  - input: source('recipe_sources', 'dcp_cscl_streetname')
    format: sql
    rows: |
      SELECT * FROM (VALUES
        ('11000201', 'FIRST NAME', 'Y', 20),
        ('11000201', 'SECOND NAME', 'Y', 21),
        ('11000201', 'NOT PRINCIPAL', 'N', 19)
      ) AS t (b7sc, lookup_key, principal_flag, ogc_fid)
  - input: source('recipe_sources', 'dcp_cscl_featurename')
    format: sql
    rows: |
      SELECT * FROM (VALUES
        ('41356009', 'TRIBOROUGH BRIDGE PLAYGROUND E', 'Y', 67841),
        ('41356009', 'TRIBOROUGH BR PLAYGROUND E', 'Y', 67842)
      ) AS t (b7sc, lookup_key, principal_flag, ogc_fid)
  - input: ref('int__address_points')
    format: sql
    rows: |
      SELECT
        NULL::TEXT AS globalid, NULL::TEXT AS b7sc_actual, NULL::TEXT AS b7sc_vanity,
        NULL::TEXT AS sosindicator, NULL::TEXT AS hyphen_type, NULL::TEXT AS house_number,
        NULL::TEXT AS plain_house_number, NULL::TEXT AS house_number_range, NULL::TEXT AS snd_feature_type
      WHERE FALSE
  - input: ref('int__saf_altnames_join_ids')
    format: sql
    rows: |
      SELECT '10100001' AS lionkey, 'cp1' AS saf_globalid, '41356009000000X' AS join_id
  - input: ref('int__lion')
    format: sql
    rows: |
      SELECT '10100001' AS lionkey, '1' AS boroughcode, '01' AS lgc1, TRUE AS include_in_bytes_lion
  - input: source('recipe_sources', 'dcp_cscl_commonplace_gdb')
    format: sql
    rows: |
      SELECT 'cp1' AS globalid, '41356009' AS b7sc
  expect:
    rows:
    - {saf_globalid: asd1, saf_street_name: FIRST NAME}
    - {saf_globalid: cp1, saf_street_name: TRIBOROUGH BRIDGE PLAYGROUND E}
# CSCL-LION-25. Address points on lionkey 10100001: R1 (left) and R2 (right) are HYPHEN_TYPE R
# ranges with the high end in HOUSE_NUMBER_RANGE, as CSCL stores them; R3 is an R range written
# into HOUSE_NUMBER with a dash, the encoding prod's gdb writer reads; X1 is type X, N1 a single
# house number. sql fixtures: CI runs unit tests without building the upstream models
- name: test__int__saf_replicant_fields__hyphen_r_high_prod
  description: "Default (fix_hyphen_r_high_house_number false): an R address point's replicant has a high house number only from a dash in HOUSE_NUMBER, as prod's gdb."
  model: int__saf_replicant_fields
  overrides:
    vars:
      fix_hyphen_r_high_house_number: false
  given: &hyphen_r_given
  - input: ref('int__saf_segments')
    format: sql
    rows: |
      SELECT segment_lionkey, saf_globalid, 'addresspoints' AS saf_source_table, saftype, '1' AS boroughcode, FALSE AS roadbed, FALSE AS generic
      FROM (VALUES
        ('10100001', 'R1', 'V'), ('10100001', 'R2', 'S'), ('10100001', 'R3', 'S'),
        ('10100001', 'X1', 'S'), ('10100001', 'N1', 'V')
      ) AS t (segment_lionkey, saf_globalid, saftype)
  - input: ref('stg__altsegmentdata_saf')
    format: sql
    rows: |
      SELECT
        NULL::TEXT AS globalid, NULL::TEXT AS saftype, NULL::TEXT AS b5sc, NULL::TEXT AS lgc1, NULL::TEXT AS lgc2,
        NULL::TEXT AS lgc3, NULL::TEXT AS lgc4, NULL::TEXT AS sosindicator, NULL::TEXT AS l_low_hn,
        NULL::TEXT AS l_high_hn, NULL::TEXT AS r_low_hn, NULL::TEXT AS r_high_hn, NULL::TEXT AS zipcode
      WHERE FALSE
  - input: source('recipe_sources', 'dcp_cscl_streetname')
    format: sql
    rows: |
      SELECT '11000201' AS b7sc, 'FIRST AVENUE' AS lookup_key, 'Y' AS principal_flag, 1 AS ogc_fid
  - input: source('recipe_sources', 'dcp_cscl_featurename')
    format: sql
    rows: |
      SELECT NULL::TEXT AS b7sc, NULL::TEXT AS lookup_key, NULL::TEXT AS principal_flag, NULL::INT AS ogc_fid
      WHERE FALSE
  - input: ref('int__address_points')
    format: sql
    rows: |
      SELECT globalid, '11000201' AS b7sc_actual, '11000201' AS b7sc_vanity, sosindicator, hyphen_type,
        house_number, plain_house_number, house_number_range, NULL::TEXT AS snd_feature_type
      FROM (VALUES
        ('R1', '1', 'R', '430', '430', '432'),
        ('R2', '2', 'R', '177', '177', '185'),
        ('R3', '1', 'R', '12', '12-14', NULL),
        ('X1', '2', 'X', '20', '20', '24'),
        ('N1', '1', 'N', '7', '7', NULL)
      ) AS t (globalid, sosindicator, hyphen_type, house_number, plain_house_number, house_number_range)
  - input: ref('int__saf_altnames_join_ids')
    format: sql
    rows: |
      SELECT '10100001' AS lionkey, saf_globalid, '11000201000000' || saftype AS join_id
      FROM (VALUES ('R1', 'V'), ('R2', 'S'), ('R3', 'S'), ('X1', 'S'), ('N1', 'V')) AS t (saf_globalid, saftype)
  - input: ref('int__lion')
    format: sql
    rows: |
      SELECT '10100001' AS lionkey, '1' AS boroughcode, '01' AS lgc1, TRUE AS include_in_bytes_lion
  - input: source('recipe_sources', 'dcp_cscl_commonplace_gdb')
    format: sql
    rows: |
      SELECT NULL::TEXT AS globalid, NULL::TEXT AS b7sc
      WHERE FALSE
  expect:
    rows:
    - {saf_globalid: R1, l_low_hn: '430', l_high_hn: null, r_low_hn: null, r_high_hn: null, ap_high_hn_prod: null, ap_high_hn_fixed: '432'}
    - {saf_globalid: R2, l_low_hn: null, l_high_hn: null, r_low_hn: '177', r_high_hn: null, ap_high_hn_prod: null, ap_high_hn_fixed: '185'}
    - {saf_globalid: R3, l_low_hn: '12', l_high_hn: '14', r_low_hn: null, r_high_hn: null, ap_high_hn_prod: '14', ap_high_hn_fixed: null}
    - {saf_globalid: X1, l_low_hn: null, l_high_hn: null, r_low_hn: '20', r_high_hn: '24', ap_high_hn_prod: '24', ap_high_hn_fixed: '24'}
    - {saf_globalid: N1, l_low_hn: '7', l_high_hn: '7', r_low_hn: null, r_high_hn: null, ap_high_hn_prod: '7', ap_high_hn_fixed: '7'}
- name: test__int__saf_replicant_fields__hyphen_r_high_fixed
  description: "fix_hyphen_r_high_house_number true: an R address point's replicant takes its high house number from HOUSE_NUMBER_RANGE."
  model: int__saf_replicant_fields
  overrides:
    vars:
      fix_hyphen_r_high_house_number: true
  given: *hyphen_r_given
  expect:
    rows:
    - {saf_globalid: R1, l_low_hn: '430', l_high_hn: '432', r_low_hn: null, r_high_hn: null}
    - {saf_globalid: R2, l_low_hn: null, l_high_hn: null, r_low_hn: '177', r_high_hn: '185'}
    - {saf_globalid: R3, l_low_hn: '12', l_high_hn: null, r_low_hn: null, r_high_hn: null}
    - {saf_globalid: X1, l_low_hn: null, l_high_hn: null, r_low_hn: '20', r_high_hn: '24'}
    - {saf_globalid: N1, l_low_hn: '7', l_high_hn: '7', r_low_hn: null, r_high_hn: null}
# A SAF replicant's Join_ID takes the SAF record's borough, not its host segment's: legacy
# writes the replicant's LBoro/RBoro from the SAF row's BOROUGHCODE and builds the Join_ID
# from them (ETL spec 2.7.3; 26D: Brooklyn CommonPlaces on Queens segment 0052212, prod
# 30158204000000X). cp1 is that case, cp2 an ordinary same-borough one, ap1 an address point
# whose borough differs from its host's.
- name: test__int__saf_altnames_join_ids__saf_record_borough
  description: "The Join_ID's borough is the SAF record's own (CommonPlace or address point BOROUGHCODE), also on a host segment in another borough."
  model: int__saf_altnames_join_ids
  given:
  - input: ref('int__saf_segments')
    format: sql
    rows: |
      SELECT * FROM (VALUES
        ('0052212', '40052212', 'cp1', 'commonplace', 'X', '3'),
        ('0052213', '40052213', 'cp2', 'commonplace', 'G', '4'),
        ('0052214', '40052214', 'ap1', 'addresspoints', 'V', '3')
      ) AS t (segmentid, segment_lionkey, saf_globalid, saf_source_table, saftype, boroughcode)
  - input: ref('int__lion')
    format: sql
    rows: |
      SELECT lionkey, '4' AS boroughcode, TRUE AS include_in_bytes_lion
      FROM (VALUES ('40052212'), ('40052213'), ('40052214')) AS t (lionkey)
  - input: source('recipe_sources', 'dcp_cscl_commonplace_gdb')
    format: sql
    rows: |
      SELECT * FROM (VALUES ('cp1', '30158204'), ('cp2', '41920001')) AS t (globalid, b7sc)
  - input: source('recipe_sources', 'dcp_cscl_addresspoint_lgcs')
    format: sql
    rows: |
      SELECT NULL::TEXT AS addresspointid, NULL::TEXT AS lgc, NULL::TEXT AS boe_lgc, NULL::INT AS ogc_fid
      WHERE FALSE
  - input: source('recipe_sources', 'dcp_cscl_addresspoints')
    format: sql
    rows: |
      SELECT 'ap1' AS globalid, '9' AS addresspointid, 'V' AS special_condition,
        '30158201' AS b7sc_vanity, NULL::TEXT AS b7sc_actual
  expect:
    rows:
    - {saf_globalid: cp1, join_id: '30158204000000X'}
    - {saf_globalid: cp2, join_id: '41920001000000G'}
    - {saf_globalid: ap1, join_id: '30158201000000V'}
