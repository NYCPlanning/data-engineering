selectors:
  # The build: everything except the QA layers, which run in the QA stage against
  # production_outputs. dbt run --selector duckdb_build
  - name: duckdb_build
    definition:
      union:
        - method: fqn
          value: "*"
        - exclude:
            - method: path
              value: models/etl_dev_qa
            - method: path
              value: models/qa_int
