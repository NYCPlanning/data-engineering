[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

# The server only; the client, worker and Pipes adapters are dcpy.infra.dagster_runners.
[project]
name = "dcpy-app-dagster-broker"
version = "0.0.1"
description = "DCP Data Engineering - dagster-broker queue API (Valkey lease queue for workers)"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "pydantic",
    "redis>=5",  # redis-py; speaks RESP to Valkey
    "uvicorn",
]

[dependency-groups]
dev = [
    "httpx",  # fastapi.testclient
    "pytest",
]

[tool.setuptools.packages.find]
include = ["dagster_broker*"]
