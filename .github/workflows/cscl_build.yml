name: CSCL - 🏗️ Build
on:
  workflow_call:
    inputs:
      image_tag:
        type: string
        required: false
      build_name:
        type: string
        required: true
      recipe_file:
        type: string
        required: true
      plan_command:
        type: string
        default: recipe
      dev_bucket:
        type: string
        required: false

jobs:
  build:
    name: Build CSCL
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
        working-directory: products/cscl
    container:
      image: nycplanning/build-base:${{ inputs.image_tag || 'latest' }}
    env:
      BUILD_ENGINE_DB: db-cscl
      BUILD_NAME: ${{ inputs.build_name }}
      RECIPES_BUCKET: ${{ inputs.dev_bucket || 'edm-recipes' }}
      PUBLISHING_BUCKET: ${{ inputs.dev_bucket || 'edm-publishing' }}
      DEV_FLAG: ${{ inputs.dev_bucket && 'true' || 'false' }}
    steps:
    - uses: actions/checkout@v4

    - name: Load Secrets
      uses: 1password/load-secrets-action@v1
      with:
        export-env: true
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        AWS_S3_ENDPOINT: "op://Data Engineering/DO_keys/AWS_S3_ENDPOINT"
        AWS_SECRET_ACCESS_KEY: "op://Data Engineering/DO_keys/AWS_SECRET_ACCESS_KEY"
        AWS_ACCESS_KEY_ID: "op://Data Engineering/DO_keys/AWS_ACCESS_KEY_ID"
        BUILD_ENGINE_SERVER: "op://Data Engineering/EDM_DATA/server_url"
        BUILD_ENGINE_HOST: "op://Data Engineering/EDM_DATA/server"
        BUILD_ENGINE_USER: "op://Data Engineering/EDM_DATA/username"
        BUILD_ENGINE_PASSWORD: "op://Data Engineering/EDM_DATA/password"
        BUILD_ENGINE_PORT: "op://Data Engineering/EDM_DATA/port"

    - name: Setup build environment
      working-directory: ./
      run: |
        ./bash/docker_container_setup.sh
        ./bash/build_env_setup.sh

    - name: Plan build
      run: dcpy lifecycle builds plan ${{ inputs.plan_command }} --output-path ${{ inputs.recipe_file }}.lock.yml

    - name: Dataloading
      run: dcpy lifecycle builds load load --recipe-path ${{ inputs.recipe_file }}.lock.yml --cache-schema recipe_cache --cached-entity-type view

    - name: Load LDF inputs from the legacy pipeline
      # The LDF diffs this release against the one before it, and its QA models compare
      # the result against prod's own LDF. Neither is in edm-recipes, so both come from
      # the legacy pipeline's outputs. Remove alongside the rest of production_outputs
      # once the pipeline is operationalized.
      run: |
        python3 poc_validation/prod_data_loader.py load_previous_lion
        python3 poc_validation/prod_data_loader.py load_previous_ldf_header
        python3 poc_validation/prod_data_loader.py load_prod_ldf

    - name: Build
      run: |
        dbt deps
        dbt debug

        ldf_vars="$(python3 scripts/ldf_vars.py)"

        echo "Run full dbt build"
        dbt build --full-refresh --vars "$ldf_vars"

    - name: Export
      run: dcpy lifecycle builds export export --recipe-path ${{ inputs.recipe_file }}.lock.yml

    - name: Validate against production outputs
      # TODO - this currently relies on version hard-coded in recipe.yml
      # Once this is operationalized, this step should be removed
      run: |
        python3 poc_validation/prod_data_loader.py pull
        ./poc_validation/validate_outputs.sh
        python3 poc_validation/summarize_diffs.py
        python3 poc_validation/compare_gdb.py
        python3 poc_validation/compare_districts.py

    - name: Upload
      run: python3 -m dcpy.connectors.edm.publishing upload --product db-cscl --acl public-read --max_files 1000
