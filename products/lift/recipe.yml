name: LIFT
product: lift
version: 26v1

inputs:
  dataset_defaults:
    destination: duckdb
    file_type: parquet
  missing_versions_strategy: find_latest
  datasets:
    # Private CSV file from edm-private bucket
    - name: dcas_lift
      source: edm.private
      file_type: csv
      import_as: lift_csv
      custom:
        filename: dcas_lift.csv

    # Latest PLUTO
    - name: dcp_mappluto_wi

    # 2020 NTAs
    - name: dcp_ct2020
    - name: dcp_nta2020

    # Community district boundaries (shoreline-clipped), for the map's AHFT layer
    - name: dcp_cdboundaries

    # DRI subindices and indicators from edm-private
    - name: dcp_dri_subindices_indicators
      source: edm.private
      file_type: csv
      import_as: dri_subindices_indicators
      custom:
        filename: dcp_dri_subindices_indicators.csv

    # HPD Limited Affordability Areas from edm-private
    - name: hpd_limited_affordability_areas
      source: edm.private
      file_type: shapefile
      import_as: hpd_limited_affordability_areas
      custom:
        filename: hpd_limited_affordability_areas.shp

    # HPD Points of Agreement (POA) commitments tracker, by bbl, from edm-private
    - name: hpd_poa_commitments
      source: edm.private
      file_type: csv
      import_as: hpd_poa_commitments
      custom:
        filename: hpd_poa_commitments.csv

    # DCP's Affordable Housing Fair Share (AHFT) tracker - housing production stats
    # and rank by community district, from edm-private
    - name: dcp_housing_ahft
      source: edm.private
      file_type: csv
      import_as: dcp_housing_ahft
      custom:
        filename: dcp_housing_ahft.csv

    # City Hall's "Public Sites for Housing" tracker - redevelopment strategy/priority/
    # cost fields for LIFT sites, from edm-private
    - name: cityhall_public_sites_for_housing
      source: edm.private
      file_type: csv
      import_as: public_sites_for_housing
      custom:
        filename: cityhall_public_sites_for_housing.csv

    # Capital Projects Database - specify single file from directory
    - name: db-cpdb
      source: edm.publishing.published
      version: latest
      file_type: shapefile
      import_as: cpdb_projects_poly
      custom:
        filename: cpdb_projects_poly.shp.zip
    - name: db-cpdb
      source: edm.publishing.published
      version: latest
      file_type: shapefile
      import_as: cpdb_projects_points
      custom:
        filename: cpdb_projects_pts.shp.zip

exports:
  output_folder: output
  zip_name: output
  datasets:
  - name: lift_supplemented
    filename: lift_supplemented.csv
    format: csv
  - name: lift_supplemented_map
    filename: lift.gdb.zip
    format: gdb
    custom: { geometry_type: polygons, layer: lift_supplemented }
  - name: lift_supplemented_map
    format: geoparquet
  - name: community_districts_map
    filename: lift.gdb.zip
    format: gdb
    custom: { geometry_type: polygons, layer: community_districts }
  - name: community_districts_map
    format: geoparquet

stage_config:
  builds.build:
    commands:
    - name: dbt_deps
      command_type: shell
      run: dbt deps
    - name: dbt_build
      command_type: shell
      run: >-
        dbt debug &&
        dbt test --select "source:*" &&
        dbt seed &&
        dbt build --select staging &&
        dbt build --select intermediate &&
        dbt build --select product &&
        dbt test --select assert_ahft_cds_in_lift
