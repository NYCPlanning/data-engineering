    custom:
      destination_use: attachment
  - id: node_stname_metadata.pdf
    custom:
      destination_use: attachment
  - id: node_metadata.pdf
    custom:
      destination_use: attachment
  - id: lion_metadata.pdf
    custom:
      destination_use: attachment
  - id: lion_zip
    custom:
      destination_use: dataset_file
  - id: oti_data_dictionary
    custom:
      destination_use: attachment
  tags: [25c]
  custom:
    four_four: 2v4z-66xt
    is_unparsed_dataset: true
- id: bytes
  type: bytes
  files:
