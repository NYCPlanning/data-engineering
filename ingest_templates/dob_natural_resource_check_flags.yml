id: dob_natural_resource_check_flags

attributes:
  name: DOB NYC Natural Resource Check Flags
  description: >-
    Private file shared with DCP by DOB, with natural resource check flags per BBL. Unique by
    BBL, with three flag columns. No geometry. The original upload wasn't kept, so the inbox
    copy of version 20240419 is library's csv export of it.

ingestion:
  source:
    type: s3
    bucket: edm-recipes
    key: inbox/dob/dob_natural_resource_check_flags/{{ version }}/dob_natural_resource_check_flags.csv
  file_format:
    type: csv
    # keeps the zero-padded boro/block/lot/bbl codes as text
    dtype: str

columns:
- id: boro_code
  data_type: text
- id: block
  data_type: text
- id: lot
  data_type: text
- id: bbl
  data_type: text
- id: coastal_hazard_area_flag
  data_type: text
- id: fresh_water_wetlands_flag
  data_type: text
- id: tidal-coastal_wetlands_flag
  data_type: text
