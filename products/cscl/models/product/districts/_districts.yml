version: 2

# Feature classes of the district boundary geodatabase (ETL spec ch. 10, table 39).
# Column names and row counts are matched against prod's Districts.gdb.zip.
# Layers suffixed "wi" are the water-included (unclipped) variants of the shoreline-clipped layers.

models:
- name: gdb_nyad
  description: State assembly districts built from the AtomicPolygon topology.
  config:
    tags: [export_doc]
    meta:
      each_row_is_a: A state assembly district
      is_geospatial: true
  columns:
  - name: AssemDist
    description: State assembly district number.
    data_tests: [ not_null ]
  - name: geom
    description: Polygon geometry (MultiPolygon, EPSG:2263)
    data_tests: [ not_null ]
  - name: SHAPE_Length
    description: Boundary length in feet.
  - name: SHAPE_Area
    description: Area in square feet.

- name: gdb_nyadwi
  description: State assembly districts built from the AtomicPolygon topology, water areas included.
  config:
    tags: [export_doc]
    meta:
      each_row_is_a: A state assembly district
      is_geospatial: true
  columns:
  - name: AssemDist
    description: State assembly district number.
    data_tests: [ not_null ]
  - name: geom
    description: Polygon geometry (MultiPolygon, EPSG:2263)
    data_tests: [ not_null ]
  - name: SHAPE_Length
    description: Boundary length in feet.
  - name: SHAPE_Area
    description: Area in square feet.

- name: gdb_nyap
  description: >-
    Atomic polygons, the smallest areas every other district layer is built from, with the
    district codes CSCL stores on each. Published as stored in CSCL, not clipped.
  config:
    tags: [export_doc]
    meta:
      each_row_is_a: An atomic polygon
  columns:
  - name: ATOMICID
    description: Atomic polygon identifier.
    data_tests: [ not_null ]
  - name: ATOMIC_NUM
    description: Last three digits of the atomic polygon ID. Deprecated in CSCL and no longer maintained, so blank.
  - name: BOROUGH
    description: "Borough code: 1 Manhattan, 2 Bronx, 3 Brooklyn, 4 Queens, 5 Staten Island."
  - name: CENSUSTRACT_1990
    description: 1990 census tract.
  - name: CENSUSTRACT_2000
    description: 2000 census tract.
  - name: CENSUSBLOCK_2000
    description: 2000 census block.
  - name: CENSUSBLOCK_2000_SUFFIX
    description: Suffix of the 2000 census block.
  - name: CENSUSTRACT_2010
    description: 2010 census tract.
  - name: CENSUSBLOCK_2010
    description: 2010 census block.
  - name: CENSUSBLOCK_2010_SUFFIX
    description: Suffix of the 2010 census block.
  - name: CENSUSTRACT_2020
    description: 2020 census tract.
  - name: CENSUSBLOCK_2020
    description: 2020 census block.
  - name: CENSUSBLOCK_2020_SUFFIX
    description: Suffix of the 2020 census block.
  - name: WATER_FLAG
    description: Flags atomic polygons that are water.
  - name: ASSEMDIST
    description: State assembly district; a single blank when none.
  - name: ELECTDIST
    description: Election district; a single blank when none.
  - name: SCHOOLDIST
    description: School district; '0' when none.
  - name: COMMDIST
    description: Community district.
  - name: HURRICANE_EVACUATION_ZONE
    description: Hurricane evacuation zone.
  - name: COMMERCIAL_WASTE_ZONE
    description: Commercial waste zone.
  - name: geom
    description: Polygon geometry (MultiPolygon, EPSG:2263)
    data_tests: [ not_null ]
  - name: SHAPE_Length
    description: Boundary length in feet.
  - name: SHAPE_Area
    description: Area in square feet.
  - name: ADMIN_FIRE_COMPANY
    description: "Administrative fire company of the atomic polygon: the first character is the company type, the last three the company number."
  - name: SB1_VOLUME
    description: Volume of the first Sanborn map covering the atomic polygon.
  - name: SB1_PAGE
    description: Page of the first Sanborn map covering the atomic polygon.
  - name: SB2_VOLUME
    description: Volume of the second Sanborn map covering the atomic polygon, if any.
  - name: SB2_PAGE
    description: Page of the second Sanborn map covering the atomic polygon, if any.
  - name: SB3_VOLUME
    description: Volume of the third Sanborn map covering the atomic polygon, if any.
  - name: SB3_PAGE
    description: Page of the third Sanborn map covering the atomic polygon, if any.

