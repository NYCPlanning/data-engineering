columns:
- id: street
  name: Street
  data_type: text
  description: Street or non-street feature name used for labeling.
  data_source: DCP
  custom:
    fgdb_data_type: String
- id: safstreetname
  name: SAFStreetName
  data_type: text
  description: Special Address Place name
  custom:
    fgdb_data_type: String
- id: featuretyp
  name: FeatureTyp
  data_type: text
  description: Feature Type Code
  values:
  - value: '0'
    description: Street other than vehicle only street.
  - value: '1'
    description: Railroad
  - value: '2'
    description: Water Edge / Shoreline
  - value: '3'
    description: Census Block Boundary
  - value: '5'
    description: 'Paper Street: This is a legally mapped, but unbuilt street. Such streets are common in areas of Staten Island anticipating development. May exist in all boroughs.'
  - value: '6'
    description: 'Private Street: This is a physically existing street which is not owned by the City and is not officially mapped. For example, streets in the Fort Totten and Breezy Point sections of Queens.'
  - value: '7'
    description: 'District Boundary: Physically non-existent boundary for a community district, a police precinct, or a fire company.'
  - value: '8'
    description: 'Physical Non-Street Boundary: Physically existing un-addressable boundary (such as a rock wall cemetery edge).'
  - value: '9'
    description: 'Paper Street and Census/District Boundary: A legally mapped, but unbuilt street that also acts as a census block or district boundary.'
  - value: A
    description: 'Alley: a narrow street or passageway between and behind city buildings.'
  - value: W
    description: 'Path, Non-Vehicular, Addressable: This is a walking path that contains addresses. For example, some boardwalks and some walking paths in housing projects.'
  - value: C
    description: CCO (Corporation Counsel Opinion). A CCO is an opinion by the City's Law Department that a street area, not owned by the City, has been dedicated for public use, consistent with the requirements of General City Law, Section 36(2). That allows the City to use public funds for various improvements and services, including paving of the roadway and installing sewers. The request usually relates to planned work by the City's Department of Transportation, Department of Design and Construction, and Department of Environmental Protection.
  - value: F
    description: 'Ferry Route: A schematic representation of a ferry’s passage through a water body. Please note that only selected ferry routes required for the bicycle routing within NYC are included.'
  custom:
    fgdb_data_type: String
- id: segmenttyp
  name: SegmentTyp
  data_type: text
  description: 'Segment Type: This field is used to define the segment''s status in relation to the horizontal topology enhancements first introduced with LION 06A.'
  values:
  - value: B
    description: 'Both: Segment is both generic and roadbed; the center roadbed segment of a divided roadway containing an odd number of roadbeds.'
  - value: C
    description: 'Connector: Segments used to connect adjacent roadbeds of a divided street. Typically these exist to allow traffic flow from one roadbed to another.'
  - value: E
    description: 'Entrance/Exit Ramp: Connects a highway to a different street or highway.'
  - value: F
    description: 'Faux Segment: These are used when a street or ramp physically ends at a roadbed, but connectivity needs to be maintained with the generic segment.'
  - value: G
    description: 'Generic Segment: An imaginary single line representation of a physically divided street.'
  - value: R
    description: 'Roadbed Segment: Depicts physically separated carriageway segments of a particular street.'
  - value: T
    description: 'Terminator: Used to model situations where a divided section of a street terminates, but the street itself continues.'
  - value: U
    description: 'Undivided Street: All other LION segments that do not fall into any of the above categories.'
  - value: S
    description: 'Suppressed: Undivided segment to be suppressed in a generic view of LION'
  custom:
    fgdb_data_type: String
- id: incexflag
  name: IncExFlag
  data_type: text
  description: 'Inclusion/Exclusion Flag: Field formerly used by DCP to identify pre-horizontal topology roadbeds in LION. This field is now used to flag selected pedestrian walkways and greenways for exclusion in the NYPD''s ETL process from CSCL.'
  values:
  - value: E
    description: Segment should be excluded from the NYPD's ETL and from Geosupport cross street generation.
  custom:
    fgdb_data_type: String
- id: rb_layer
  name: RB_Layer
  data_type: text
  description: For cartographic purposes, indicates whether segment is present in the "Roadbed" layer and/or the "Generic" layer. This field is generated by a definition query of Segment Types.
  values:
  - value: R
    description: Segment is unique to the Roadbed layer. Comprised of Segment Types R, C, T and S.
  - value: G
    description: Segment unique to the Generic layer. Comprised of Segment Types G and F.
  - value: B
    description: Segment belongs in Both the generic and roadbed layers. Comprised of Segment types U, B and E.
  - value: N
    description: Segment is neither in the generic or roadbed layer. These are exception cases where divided roadbeds existed in the LION file prior to release 06A.
  custom:
    fgdb_data_type: String
- id: nonped
  name: NonPed
  data_type: text
  description: Non-Pedestrian Indicator.
  values:
  - value: D
    description: Pedestrian accessible, but are excluded by the Department of Education in determining walking routes from a pupil's home to their school.
  - value: V
    description: 'Vehicle-only: primarily roadways, inaccessible to pedestrian usage'
  custom:
    fgdb_data_type: String
- id: trafdir
  name: TrafDir
  data_type: text
  description: Traffic Direction. Code indicating the flow of traffic relative to the street segment's directionality.
  values:
  - value: W
    description: 'With: One-way street, traffic flows with the segment''s directionality, i.e., from the segment''s FROM node to the TO node..'
  - value: A
    description: 'Against: One-way street, traffic flows from against the segment''s directionality, i.e., from the segment''s TO node to the FROM node.'
  - value: T
    description: 'Two-Way: Traffic flows in both directions.'
  - value: P
    description: 'Pedestrian path: Non-vehicular.'
  - value: blank
    description: Non-street feature.
  custom:
    fgdb_data_type: String
- id: trafsrc
  name: TrafSrc
  data_type: text
  description: Indicates the source of information in the Traffic Direction (TrafDir) field.
  values:
  - value: DCP
    description: NYC Department of City Planning
  - value: DOT
    description: NYC Department of Transportation
  custom:
    fgdb_data_type: String
- id: specaddr
  name: SpecAddr
  data_type: text
  description: Special Address Type Code. These represent special addressing situations. Please note that alternative street names and street codes for Special Addresses other than TYPE = 'A' can be found in the fields "SAFStreetName" and "SAFStreetCode" respectively.
  values:
  - value: A
    description: 'Alternate Address Range: Alternative address ranges for the same street name. This can occur where buildings have been renumbered; old numbers will sometimes remain in use. For example, such usage is common in some Queens neighborhoods, including Far Rockaway, Douglaston, Forest Hills and Ridgewood, where non-hyphenated addresses have been replaced by hyphenated addresses.'
  - value: B
    description: 'Alternative Street Names: Alternative street names that cannot be handled in the usual way.'
  - value: C
    description: Handles a unique situation along the Brooklyn-Queens border, where Ruby Street on the Brooklyn side of the street is known as 75 Street in Queens. Some Brooklyn residents use 75 Street in their address; however there is another 75 Street in the Bay Ridge section of Brooklyn, far from the Queens border.
  - value: D
    description: 'Duplicate Addresses: Duplicate addresses for the same street name within the same borough. Currently, there are three New York City streets that have some duplicate addresses: Hillside Avenue and Center Drive in Queens, and Martin Luther King Junior Boulevard in Manhattan. The portion of Hillside Avenue in the Far Rockaway neighborhood has some addresses that are identicdal to addresses in the portion of Hillside Avenue in the Douglaston neighborhood. Hillside Avenue also has some addresses that are duplicated between the Douglaston and Bellerose neighborhoods. Center Drive has some addresses that are duplicated between the Douglaston and Malba neighborhoods. Martin Luther King Junior Boulevard is an alternative name for both East 125 Street and West 125 Street, and therefore has many duplicate addresses.'
  - value: E
    description: 'Refers to situations in which the name of a neighborhood can serve as an alternate name for all streets in that neighborhood. The two neighborhoods for which this applies are both in the Bronx: Edgewater Park and Harding Park.'
  - value: G
    description: This is used for names of complexes (e.g., Lincoln Center). Complexes are non-addressable, and are composed of a number of non-addressable place names. Complexes can include individual buildings or parks that are recognized as a grouped entity (e.g., Lincoln Center, Jefferson Houses, City College). "G" records refer to the complex names (Lincoln Center), while the entities within the complex (Alice Tully Hall, Metropolitan Opera, etc.) are flagged as type "x" records.
  - value: N
    description: 'Non-Addressable Place Name: This is used for non-addressable place names. These are place names that cannot be combined with a house number to form an address. Such place names can include individual buildings (e.g., City Hall, Alice Tully Hall), building complexes (e.g., Columbia University, New York Hospital) and large facilities (e.g., Penn Station, LaGuardia Airport).'
  - value: O
    description: This is used for out-of-sequence addresses. Such addresses do not follow the logical addressing sequence of the immediately adjacent buildings. For example, address number 62 of a street may exist between addresses 80 and 82, not between 60 and 64 on that blockface (it may also appear on a blockface other than that which contains 60 and 64). Also, the address may be an opposite-parity address, in that its parity (odd/even) is the opposite of the predominant parity on the blockface. For example, address number 62 may appear on the odd side of the street between 63 and 65.
  - value: S
    description: 'Suffix: This refers to situations in which the break in addresses from one block face to the next along a street involves house number suffixes. The "s" flag appears with such records to denote that a suffix exists at either the low or high end of the segment''s address range. For example, if the address range on one block is 1 - 13A, and the next block is 15 - 25, the address range on the first block will be shown in LION as 1 - 13, and 13A will be an SAF type "S" record.'
  - value: V
    description: This is used for "vanity addresses" (i.e. addresses in which the street name refers to a different street than the one on which the referenced building entrance is actually located). For example, 1049 5th Avenue in Manhattan, a vanity address, is actually located on East 86th Street, between 5th Avenue and Madison Avenue.
  - value: X
    description: This is used for names of non-addressable, consituent entities of complexes (not the entire complex name itself, which is flagged as type "G"). These are non-addressable place names grouped with other non-addressable place names to form a larger, non-addressable complex. Such non-addressable place name parts of complexes can include individual buildings or parks (e.g., Alice Tully Hall of Lincoln Center, Damrosch Park of Lincoln Center, Jefferson Houses Building 2 of Jefferson Houses, Shepard Hall of City College). To ensure that non-addressable place names are geocoded to the correct side of a street segment, the address range fields of the incorrect side of the street will contain a value of "-99999."
  - value: P
    description: 'Addressable Place Names: An addressable place name is usually the name of an individual building or building complex that can serve the role of a street name in an address, even though there is no actual street with that name. Each of these can combine with address numbers to form addresses, such as 5 Penn Plaza or 13 Confucius Plaza.'
  custom:
    fgdb_data_type: String
- id: facecode
  name: FaceCode
  data_type: text
  description: 'Face Code: A four digit number assigned to any linear geographic feature in LION. This can be either a street or non-street feature (e.g., shoreline, railroad tracks). Also a component field of a unique identifier in LION known as the LIONkey (comprised of Boro, FaceCode and SeqNum.'
  custom:
    fgdb_data_type: String
- id: seqnum
  name: SeqNum
  data_type: text
  description: 'Sequence Number: A five digit number assigned sequentially to the street segments within a given face code. The sequence number generally increases with the directionality of the street. Also a component field of a unique identifier in LION known as the LIONkey (comprised of Boro, FaceCode and SeqNum.'
  custom:
    fgdb_data_type: String
- id: streetcode
  name: StreetCode
  data_type: text
  description: Street Code is a numeric code that represents the names of New York city streets. The first digit is a borough code; the subsequent five digits are the 5-digit street code.
  custom:
    fgdb_data_type: String
- id: safstreetcode
  name: SAFStreetCode
  data_type: text
  custom:
    fgdb_data_type: String
- id: lgc1
  name: LGC1
  data_type: text
  description: 'Local Group Code 1: A Local Group Code (LGC) is a qualifier for DCP''s 5 digit street code. Each LGC value represents a group of names for the given street that are valid for that segment.'
  custom:
    fgdb_data_type: String
- id: lgc2
  name: LGC2
  data_type: text
  description: 'Local Group Code 2: A Local Group Code (LGC) is a qualifier for DCP''s 5 digit street code. Each LGC value represents a group of names for the given street that are valid for that segment.'
  custom:
    fgdb_data_type: String
- id: lgc3
  name: LGC3
  data_type: text
  description: 'Local Group Code 3: A Local Group Code (LGC) is a qualifier for DCP''s 5 digit street code. Each LGC value represents a group of names for the given street that are valid for that segment.'
  custom:
    fgdb_data_type: String
- id: lgc4
  name: LGC4
  data_type: text
  description: 'Local Group Code 4: A Local Group Code (LGC) is a qualifier for DCP''s 5 digit street code. Each LGC value represents a group of names for the given street that are valid for that segment.'
  custom:
    fgdb_data_type: String
- id: lgc5
  name: LGC5
  data_type: text
  description: 'Local Group Code 5: A Local Group Code (LGC) is a qualifier for DCP''s 5 digit street code. Each LGC value represents a group of names for the given street that are valid for that segment.'
  custom:
    fgdb_data_type: String
- id: lgc6
  name: LGC6
  data_type: text
  description: 'Local Group Code 6: A Local Group Code (LGC) is a qualifier for DCP''s 5 digit street code. Each LGC value represents a group of names for the given street that are valid for that segment.'
  custom:
    fgdb_data_type: String
- id: lgc7
  name: LGC7
  data_type: text
  description: 'Local Group Code 7: A Local Group Code (LGC) is a qualifier for DCP''s 5 digit street code. Each LGC value represents a group of names for the given street that are valid for that segment.'
  custom:
    fgdb_data_type: String
- id: lgc8
  name: LGC8
  data_type: text
  description: 'Local Group Code 8: A Local Group Code (LGC) is a qualifier for DCP''s 5 digit street code. Each LGC value represents a group of names for the given street that are valid for that segment.'
  custom:
    fgdb_data_type: String
- id: lgc9
  name: LGC9
  data_type: text
  description: 'Local Group Code 9: A Local Group Code (LGC) is a qualifier for DCP''s 5 digit street code. Each LGC value represents a group of names for the given street that are valid for that segment.'
  custom:
    fgdb_data_type: String
- id: boe_lgc
  name: BOE_LGC
  data_type: text
  description: Board of Elections LGC Pointer (Domain values = 1, 2, 3, 4) indicates which LGC field (LGC1, LGC2, LGC3 or LGC4 respectively) corresponds to the name for this segment that is used for Board of Elections applications.
  custom:
    fgdb_data_type: String
- id: segmentid
  name: SegmentID
  data_type: text
  description: 'Segment ID: A seven digit number (right justified, zero filled) that identifies each segment of a street or a non-street feature represented in the LION file. Segment ID differs from the LIONKey (see FaceCode and SeqNum definitions) in that the former identifies a geographic entity, whereas the latter identifies a record in the LION file. In the case of a segment lying along a borough boundary (for example, the Brooklyn-Queens border), there will be two distinct LIONKeys (one for each borough), but the Segment ID in each LION record will be identical since it refers to the same physical geometry.'
  custom:
    fgdb_data_type: String
- id: segcount
  name: SegCount
  data_type: text
  description: 'Coincident Segment Count: Indicates situations where there are double-decker roads and therefore more than one segment for the same geography in LION (as it is maintained in CSCL). An example would be the upper and lower roadways of the George Washington Bridge. In this case, the SegCount would be equal to 2. Most LION segments will have a SegCount of 1. However there will appear to be some anomalies because of the difference in the way LION is maintained, and the way it must be exported. For example, the Department of City Planning maintains an associated Special Address file that links various types of special address records (described further down in this document) to the LION file. In the BYTES version of LION, the only way to include these special address records is by replicating the segment with alternate address information. The result can be multiple records with the same Segment ID while the coincident segment count remains ''1''.'
  custom:
    fgdb_data_type: String
- id: locstatus
  name: LocStatus
  data_type: text
  description: Segment Locational Status.
  values:
  - value: H
    description: Land-hooked segment, i.e. a segment internal to a Dynamic Block but not a dead end.
  - value: I
    description: Dead end segment
  - value: X
    description: Tract Boundary segment other than a borough boundary
  - value: '1'
    description: Segment bordering Manhattan
  - value: '2'
    description: Segment bordering The Bronx
  - value: '3'
    description: Segment bordering Brooklyn
  - value: '4'
    description: Segment bordering Queens
  - value: '5'
    description: Segment bordering Staten Island
  - value: '9'
    description: Segment on the New York City Boundary
  custom:
    fgdb_data_type: String
- id: lzip
  name: LZip
  data_type: text
  description: Contains the five digit postal zip code for the left side of the street segment.
  custom:
    fgdb_data_type: String
- id: rzip
  name: RZip
  data_type: text
  description: Contains the five digit postal zip code for the right side of the street segment.
  custom:
    fgdb_data_type: String
- id: lboro
  name: LBoro
  data_type: integer
  description: This is a 1-digit code identifying the borough in which the left side of the street segment is located.
  values:
  - value: '1'
    description: Manhattan
  - value: '2'
    description: The Bronx
  - value: '3'
    description: Brooklyn
  - value: '4'
    description: Queens
  - value: '5'
    description: Staten Island
  custom:
    fgdb_data_type: Integer
- id: rboro
  name: RBoro
  data_type: integer
  description: This is a 1-digit code identifying the borough in which the right side of the street segment is located.
  values:
  - value: '1'
    description: Manhattan
  - value: '2'
    description: The Bronx
  - value: '3'
    description: Brooklyn
  - value: '4'
    description: Queens
  - value: '5'
    description: Staten Island
  custom:
    fgdb_data_type: Integer
- id: l_cd
  name: L_CD
  data_type: text
  description: Three-digit Community District code for the left side of the street. The first byte is the Borough Code and the second and third bytes are the Dommunity District Number (right justified, zero filled). For example, Community District 6 in Brooklyn would be represented as 306. There are 59 community districts in the City of New York, as well as 12 Joint Interest Areas (JIAs). The JIAs are major parks and airports that are not contained within any CD. For a full listing, please refer to the 'readme.txt' that is included as part of the LION file download.
  custom:
    fgdb_data_type: String
- id: r_cd
  name: R_CD
  data_type: text
  description: Three-digit Community District code for the left side of the street. The first byte is the Borough Code and the second and third bytes are the Dommunity District Number (right justified, zero filled). For example, Community District 6 in Brooklyn would be represented as 306. There are 59 community districts in the City of New York, as well as 12 Joint Interest Areas (JIAs). The JIAs are major parks and airports that are not contained within any CD. For a full listing, please refer to the 'readme.txt' that is included as part of the LION file download.
  custom:
    fgdb_data_type: String
- id: latomicpolygon
  name: LATOMICPOLYGON
  data_type: text
  description: 'Left Atomic Polygon: An atomic polygon is a minimal polgon formed by most LION segments (exceptions include paper streets and alleys). "Minimal" means the polygon is not subdivided by LION segments (other than the noted exceptions) into smaller polygons. An atomic polygon can contain segments of various types in its interior: paper street segments (Feature Type = 5), dead end segments (LocStatus = I), land-hooked segments (LocStatus = H) and alley segments (Feature Type = A). Atomic Polygons numbers are unique within 2010 Census Tracts and are used as building blocks for many higher geographies.'
  custom:
    fgdb_data_type: String
- id: ratomicpolygon
  name: RATOMICPOLYGON
  data_type: text
  description: 'Right Atomic Polygon: An atomic polygon is a minimal polgon formed by most LION segments (exceptions include paper streets and alleys). "Minimal" means the polygon is not subdivided by LION segments (other than the noted exceptions) into smaller polygons. An atomic polygon can contain segments of various types in its interior: paper street segments (Feature Type = 5), dead end segments (LocStatus = I), land-hooked segments (LocStatus = H) and alley segments (Feature Type = A). Atomic Polygons numbers are unique within 2010 Census Tracts and are used as building blocks for many higher geographies.'
  custom:
    fgdb_data_type: String
