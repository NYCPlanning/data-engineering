models:
  - name: facdb_export
    columns:
      - name: uid
        tests: [ not_null, unique ]
      - name: data_source_file
        tests: [ not_null ]
      - name: facility_name
        tests:
          - not_null:
              config:
                severity: error
                error_if: ">10"
      - name: facility_type
        tests:
          - not_null
          - many_to_one:
              parent_column: facility_subgroup
      - name: facility_subgroup
        tests: [ not_null ]
      - name: operating_entity_name
        tests:
          - not_null_if_other_not_null:
              other_column_name: operating_entity_abbreviation
