version: 2

models:
  - name: longform_nta_output
    description: "Project records with a row for each NTA it intersects with"
    columns:
      - name: record_id
        tests: [not_null]
      - name: nta
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          name: longform_nta_output_compound_key
          combination_of_columns:
            - record_id
            - nta

  - name: longform_cdta_output
    description: "Project records with a row for each CDTA it intersects with"
    columns:
      - name: record_id
        tests: [not_null]
      - name: cdta
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          name: longform_cdta_output_compound_key
          combination_of_columns:
            - record_id
            - cdta

  - name: longform_cd_output
    description: "Project records with a row for each community district it intersects with"
    columns:
      - name: record_id
        tests: [not_null]
      - name: cd
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          name: longform_cd_output_compound_key
          combination_of_columns:
            - record_id
            - cd

  - name: longform_ct_output
    description: "Project records with a row for each census tract it intersects with"
    columns:
      - name: record_id
        tests: [not_null]
      - name: ct
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          name: longform_ct_output_compound_key
          combination_of_columns:
            - record_id
            - ct

  - name: kpdb_match_geom
    description: >
      Project records with the geometry each boundary aggregation should match
      on, resolved once instead of inline in every aggregation's join.
    columns:
      - name: record_id
        tests: [not_null]
      - name: match_geom
        tests: [not_null]
      - name: polygon_mode
        description: "Project is allocated only to boundaries it covers >= 10% of"
        tests: [not_null]

  - name: longform_csd_output
    description: "Project records with a row for each community school district it intersects with"
    columns:
      - name: record_id
        tests: [not_null]
      # Not not_null: dcp_school_districts has no water-included variant, so a
      # project can fall outside every district (P2010K0258 does).
      - name: csd
    tests:
      - dbt_utils.unique_combination_of_columns:
          name: longform_csd_output_compound_key
          combination_of_columns:
            - record_id
            - csd

  - name: longform_es_zone_output
    description: "Project records with a row for each elementary school zone it intersects with"
    columns:
      - name: record_id
        tests: [not_null]
      - name: es_zone
    tests:
      - dbt_utils.unique_combination_of_columns:
          name: longform_es_zone_output_compound_key
          combination_of_columns:
            - record_id
            - es_zone

  - name: longform_subdist_output_cp_assumptions
    description: "Project records with a row for each school subdistrict it intersects with"
    columns:
      - name: record_id
        tests: [not_null]
      - name: subdistzone
    tests:
      - dbt_utils.unique_combination_of_columns:
          name: longform_subdist_output_compound_key
          combination_of_columns:
            - record_id
            - distzone
            - subdistzone
