[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

# Dispatch: the in-memory Valkey work queue that routes Dagster work to HTTP-only workers
# (tracker epic inv-k0d, this package is inv-k0d.3). A standalone ASGI app with Valkey as a
# localhost-only sidecar. Deliberately has no dcpy dependency and holds no credentials.
[project]
name = "dcpy-app-dispatch"
version = "0.0.1"
description = "DCP Data Engineering - dispatch queue API (Valkey lease queue for workers)"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "pydantic",
    "redis>=5",  # redis-py; speaks RESP to Valkey
    "uvicorn",
]

[dependency-groups]
dev = [
    "httpx",  # fastapi.testclient
    "pytest",
    "pytest-cov",
]

[tool.setuptools.packages.find]
include = ["dispatch*"]

[tool.setuptools.package-data]
dispatch = ["lua/*.lua"]
