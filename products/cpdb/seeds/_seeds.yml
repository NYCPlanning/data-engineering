seeds:
  - name: project_types
    description: |
      The agency associated with each project type.
    columns:
      - name: projecttype
        tests: [ unique, not_null ]
      - name: agencyacronym
        tests: [ not_null ]
      - name: agency
        tests: [ not_null ]

  - name: dcp_json
    description: |
      Project geometry by maprojid.
    columns:
      - name: maprojid
        tests: [ unique, not_null ]
      - name: geom
        tests: [ not_null ]

  - name: cpdb_badgeoms
    description: |
      List of maprojid values to remove.
    columns:
      - name: maprojid
        tests: [ not_null ]

  - name: dcp_id_bin_map
    description: |
      Mapping between maprojid and BIN.
    columns:
      - name: maprojid
        tests: [ unique, not_null ]
      - name: bin
        tests: [ not_null ]

  - name: dcp_cpdb_agencyverified
    description: |
      Agency-verified CPDB records with address and project details.
    columns:
      - name: address
      - name: agency
      - name: bbl
      - name: bin
      - name: borough
      - name: bridgeid
      - name: category
      - name: description
      - name: mappable
      - name: maprojid
      - name: origin
      - name: parkid
      - name: parkname
      - name: zipcode

  - name: type_category_patterns
    description: |
      Project type category patterns for mapping project descriptions to project types.
    columns:
      - name: typecategory
        tests: [ not_null ]
      - name: pattern
        tests: [ not_null ]

  - name: dcp_manual_geoms_2020
    description: |
      Manually-collected 2020 project geometries (formerly data/edcgeoms_2021-01-08.csv, loaded
      inline by bash/02_build.sh). Named with a dcp_ prefix, not the legacy table's bare
      `manual_geoms_2020`, to avoid colliding with the legacy table of that exact name --
      bash/02_build.sh drops and recreates it (with different, truncated column names) every
      build, in the same shared schema. `geometry` is raw WKT text, not a PostGIS geometry type
      -- casting to geometry(4326) and the legacy 'AD Sprint' -> 'EP 2020' geomsource relabeling
      both happen in the intermediate model that consumes this seed, not here.
    columns:
      - name: cartodb_id
        tests: [ unique, not_null ]
      - name: maprojid
        tests: [ not_null ]
      - name: geometry
        tests: [ not_null ]


  - name: tycs_category_lifecycles
    description: |
      Lifecycle category of each Ten-Year Capital Strategy (TYCS) category in the FY 2026-2035
      strategy (Open Data b37a-3faw, pub_date 20250501). OMB doesn't publish this mapping:
      each lifecycle line on the strategy's "Life Cycle Category" page was matched to the set
      of categories whose totals sum to it. `lifecycle_confidence` is `exact` when the
      categories were picked by name and their totals match the line, `plausible` when several
      sets of categories match the line's total and one was picked by judgment, and
      `unresolved` when no pick was made. Some `plausible` rows have no `lifecycle_line`:
      once the IT and public buildings lines were picked by what their categories fund (from
      the strategy's agency pages), their lifecycle was the same in every split of the
      remaining categories that matches the line totals, but the line wasn't. The
      `unresolved` rows split between the "Others" lines and the libraries and cultural line
      in many ways that match the totals, and the strategy doesn't break the "Others" lines
      down.
      Redo it when a new strategy is published.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [ tycs_project_type, tycs_category ]
    columns:
      - name: tycs_project_type
        tests: [ not_null ]
      - name: tycs_category
        tests: [ not_null ]
      - name: lifecycle
        tests:
          - accepted_values:
              values: [ State of Good Repair, Program Expansion, Programmatic Replacement ]
      - name: lifecycle_confidence
        tests:
          - accepted_values:
              values: [ exact, plausible, unresolved ]

  - name: tycs_category_matches
    description: |
      Ten-year plan category codes matched to a Ten-Year Capital Strategy category by hand,
      for the few whose TYCS name matches none of the names the code has had in FISA.
      Everything else is matched by name in `int__ten_year_plan_category_tycs_matches`.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [ project_type, typc ]
    columns:
      - name: tycs_project_type
        tests: [ not_null ]
      - name: tycs_category
        tests: [ not_null ]
      - name: confidence
        description: |
          `exact` when the names differ only in punctuation or case. `plausible` when the
          match was picked by judgment, usually by elimination within the project type.
        tests:
          - accepted_values:
              values: [ exact, plausible ]
      - name: evidence
        tests: [ not_null ]

  - name: fisa_typc_names
    description: |
      Ten-year plan category codes and names in each archived version of
      `fisa_capitalcommitments`, for matching TYCS category names to codes plan by plan.
      Generated by `python/fisa_typc_names.py`; rerun it when a new FISA version is archived.
    config:
      column_types:
        version: text
        cycle_fy: text
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [ version, budget_proj_type, typc ]
    columns:
      - name: version
        tests: [ not_null ]
      - name: typc
        tests: [ not_null ]
      - name: typc_name
        tests: [ not_null ]

  - name: ten_year_plan_category_successors
    description: |
      Ten-year plan category codes that were retired into another code in the same project
      type, so their history rolls up into the successor. Each row says what showed it.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [ project_type, typc ]
    columns:
      - name: successor_typc
        tests: [ not_null ]
      - name: confidence
        description: |
          `exact` when every project on the retired code moved to the successor. `plausible`
          when the successor was picked by judgment.
        tests:
          - accepted_values:
              values: [ exact, plausible ]
      - name: evidence
        tests: [ not_null ]

  - name: ten_year_plan_category_asset_types
    description: |
      Asset type of each ten-year plan category with planned dollars in FISA 20260929.
      Categories with none in that release aren't classified. Each row was checked against
      the category's largest projects and the datasets CPDB mapped them from, not just its
      name.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [ project_type, typc ]
    columns:
      - name: asset_type
        description: What the category's spending builds or keeps up, like bridge or school.
        tests:
          - relationships:
              to: ref('draft_asset_type_groups')
              field: asset_type
              config:
                severity: warn
      - name: place_link
        description: |
          How the asset reaches a place: `site` (a location), `network` (segments, like
          streets or sewers), `fleet` (vehicles and equipment), or `system` (like IT, with no
          location).
        tests:
          - accepted_values:
              values: [ site, network, fleet, system ]
      - name: confidence
        description: |
          `exact` when the largest projects (or the datasets their geometries came from) show
          the asset type. `plausible` when the name and agency suggest it but the largest
          projects are lump sums or programs that don't name an asset. `unresolved` when the
          projects don't share one asset type; `asset_type` is null.
        tests:
          - not_null
          - accepted_values:
              values: [ exact, plausible, unresolved ]
      - name: evidence
        tests: [ not_null ]

  - name: draft_asset_type_groups
    description: |
      Draft grouping of the asset types in `ten_year_plan_category_asset_types`. Every row is
      our reading of the asset type's name: no source defines these groups, and nothing
      checked them against data. `note` names another group a type could reasonably go in.
      Not used by any model.
    columns:
      - name: asset_type
        tests: [ unique, not_null ]
      - name: draft_group
        tests: [ not_null ]

  - name: agency_verified_mappability
    description: |
      Mappability and geographic scope for each `mappable` answer in
      `dcp_cpdb_agencyverified`. Answers that don't say whether a project has a place
      (`No`, `NO`, `Not Mappable`, `Pass-through`, `In queue`) aren't listed, so those
      projects fall through to the next source.
    columns:
      - name: mappable
        tests: [ unique, not_null ]
      - name: mappability
        tests:
          - not_null
          - accepted_values:
              values: [ place-specific but unmapped, not place-specific ]
      - name: geographic_scope
        tests:
          - accepted_values:
              values: [ site, multiple sites, network ]

  - name: dashboard_managing_agencies
    description: |
      The Capital Projects Dashboard's acronym for a managing agency code, where it differs
      from CPDB's (`magencyacro`). Both come from the three-digit managing agency code: CPDB
      calls 801 SBS (or BNY or TGI by description), and the dashboard calls it EDC.
    columns:
      - name: magency
        tests: [ unique, not_null ]
      - name: dashboard_managing_agency
        tests: [ not_null ]
