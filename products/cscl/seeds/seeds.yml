version: 2

seeds:
  - name: config
    description: >
      Generic key/value config for values no source data carries - GR's export tools take
      these as operator input, so we do too, rather than hardcoding them into SQL or
      passing them as dbt --vars. One row per value; add new keys here instead of a new
      column or a new seed. Read with a scalar subquery against this seed (see
      int__ldf_header.sql/thined_dat.sql for the pattern) rather than dbt vars, so a build
      needs no extra --vars flag and a missing/wrong value is a normal row-level fact to
      fix, not a build invocation to remember.
    columns:
      - name: key
        description: "Unique config key, e.g. ldf_previous_version."
        tests:
        - not_null
        - unique
      - name: value
        description: >
          The value, always stored as text - callers cast as needed (e.g. ::date). Where a
          value's real meaning/update rule is unconfirmed (see the per-row description),
          it's copied verbatim from a known-good release rather than derived, and may need
          confirming or updating for a future release.
        tests:
        - not_null
      - name: description
        description: "What this key means, where it's used, and any known caveats."
  - name: known_differences
    description: >
      Every known difference between this pipeline's outputs and the previous production
      release, one row per stable ID. This is the source of truth: data_issues.md is
      generated from it (scripts/generate_data_issues.py), the export doc's "Known
      differences from the previous release" sections list its non-fixed rows, and the
      qa__diffs_* models cite its IDs in their diff_group labels (tested by
      assert_known_difference_citations). An ID is never reused or renumbered; a resolved
      difference stays, with status fixed. The analysis and evidence behind each row live
      in the bead named in reference.
    config:
      column_types:
        id: varchar
        alias: varchar
        output: varchar
        scope: varchar
        description: varchar
        cause: varchar
        decision: varchar
        gr_status: varchar
        first_seen: varchar
        last_verified: varchar
        status: varchar
        reference: varchar
    columns:
      - name: id
        description: >
          Stable ID, CSCL-<OUTPUT>-NN (e.g. CSCL-LION-06, CSCL-SAF-01). Cited verbatim at
          the start of a qa__diffs_* diff_group label ('CSCL-LION-16: topology left/right
          AP').
        tests:
          - not_null
          - unique
      - name: alias
        description: >
          Older names for the same issue, semicolon-separated: the "Bug NNN" numbers from
          the bug write-ups that preceded the IDs ("Bug 007 #3" for one item of a
          multi-item write-up). Blank when there were none.
      - name: output
        description: >
          The output(s) that differ, semicolon-separated, from: LION, LION gdb, RPL, SAF,
          District gdb, LDF, Normalizing tables, ThinED, ThinLION, ThinFire. Matches a
          model group's custom.known_differences in doc_config.yml.
        tests:
          - not_null
      - name: scope
        description: "Which rows or fields differ, briefly."
        tests:
          - not_null
      - name: description
        description: >
          What differs and why, in one or two plain sentences. Rendered in the export doc,
          so no model names.
        tests:
          - not_null
      - name: cause
        description: >
          prod_bug (prod is wrong, ours is right), source_vintage (the two sides were built
          from different source extracts), source_defect (bad source data both sides
          see), ours_intentional (we deliberately differ from prod), ours_bug_fixed (was
          ours, now fixed), ours_bug (ours, not yet fixed), gr_pending (waiting on GR to
          say which side is right), unknown.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [prod_bug, source_vintage, source_defect, ours_intentional, ours_bug_fixed, ours_bug, gr_pending, unknown]
      - name: decision
        description: "What we do about it (keep ours, match prod, deferred, ...). Blank when undecided."
      - name: gr_status
        description: >
          Where GR stands: confirmed (GR agreed), pending (asked, no answer yet). Blank
          when GR hasn't been asked or it wasn't recorded.
        tests:
          - accepted_values:
              arguments:
                values: [confirmed, pending]
      - name: first_seen
        description: >
          Product version the difference was first recorded against. Blank where it
          predates this table and the version wasn't kept.
      - name: last_verified
        description: "Product version the row was last checked against."
        tests:
          - not_null
      - name: status
        description: >
          open (unexplained, or explained but undecided), accepted (understood and
          deliberately not changing), watch (resolved, can recur: check each release),
          fixed (no longer differs).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [open, accepted, watch, fixed]
      - name: reference
        description: "Data-engineering tracker bead(s) holding the analysis and evidence, comma-separated."
  - name: lion_outputs
    description: "LION output file mappings by group, subgroup, and type"
    columns:
      - name: output_group
        description: >
          Which of the three physical deliverables this row belongs to:
          flat_files, lion_gdb, or district_gdb - matching the top-level split
          in GitHub issue #1816's CSCL ETL epic (LION gdb and District gdb are
          separate zips; everything else ships as flat/text files - see that
          issue's sub-issue tree for the derivation, and treat it as a lead,
          not fact). Coarser than file_group/subgroup, which distinguish
          categories *within* a deliverable (e.g. SAF vs SND, both flat_files).
      - name: file_group
        description: "Primary grouping category"
      - name: subgroup
        description: "Secondary grouping category"
      - name: type
        description: "Type of output (e.g., file)"
      - name: filename
        description: "Name of the output file"
      - name: file_id
        description: "Unique identifier for the file"
      - name: has_db_qa
        description: >
          Whether a field-level dbt QA model exists for this file in
          models/etl_dev_qa (qa__diffs_<file_id>.sql or similar feeding
          qa__diffs_all_summary). False just means no model has been built yet
          for that file type - not a deliberate exclusion. Previously named
          skip_qa with the opposite polarity; renamed since the column was
          never actually read anywhere to skip/gate a build step - it's purely
          descriptive of QA coverage.
      - name: diffable
        description: >
          Whether this file has any prod counterpart worth comparing against at
          all. False for build logs and other artifacts (e.g. the previous LDF
          edition, kept only as an input) with nothing on the other side to diff
          against - see poc_validation/build_diffs_report.py.
      - name: key_columns
        description: >
          gdb layers only (type = 'layer'): the pipe-separated column name(s)
          that uniquely identify a row in that layer, used by
          poc_validation/compare_gdb.py for its row-level diff. Declared here
          deliberately rather than auto-detected at comparison time, so the
          comparison is agnostic to whatever happens to be unique in a given
          run's data - a column that's coincidentally unique today (e.g.
          SHAPE_Length) isn't a real identity and would silently produce a
          different key on a different run. Verified unique against a real
          build's data when declared; a few layers have a small, known,
          accepted number of exceptions (e.g. nysd's school district 10
          written once per borough it spans, nyzip's multi-part zip codes)
          rather than a column to add - see each gdb_<layer>.sql model for the
          specific reason. Exact duplicate rows are collapsed and counted
          separately by the comparison, so they don't need a key column to
          tell them apart. A NULL in some key columns is an ordinary value
          (it pairs with NULL); only an all-NULL key is unidentifiable. Empty
          for non-gdb rows.
      - name: description
        description: >
          District gdb layers only: what the layer represents and its CSCL
          source feature class, e.g. "Assembly Districts clipped to
          shoreline". Sourced from GitHub issue #1840's output table - a
          project-management issue, not verified project documentation, so
          treat as a lead rather than fact. Two gaps in that source were
          filled by inference rather than the issue itself: nycdta2020's
          description was blank there, and nypuma2020 wasn't listed at all
          (only nypuma2010) - both filled in by pattern from sibling rows.
          Empty for non-district-gdb rows.
      - name: status
        description: >
          Known investigation status of this output's dev/prod discrepancy.
          Free text, not an enum; add values as they come up. Known values as
          of this writing: blank (no known issue - most rows have never been
          individually investigated, this is not "verified clean"), "done"
          (verified matching prod, or as close as this pipeline is expected to
          get), "open" (investigated and understood, a real diff, no fix
          landed yet - see notes/status_summary for the mechanism), "blocked"
          (a real, understood diff with no path to fix on our side), "on hold"
          (a real, understood diff whose investigation was deliberately paused
          by explicit decision, not abandoned - distinct from "blocked",
          which has no known path forward at all), "GR Review" (flat files
          only - a diff has been raised with NYC Planning's GR team and is
          awaiting their input before we can proceed), "in progress" (actively
          being worked - see notes for what's queued/next), "Needs
          Investigation" (checked against a real build and either found
          nothing conclusive or found something genuinely confusing - a
          deliberate flag to come back to, not a placeholder for "never
          looked"), "n/a" (not comparable to prod at all - a build log or
          input-only artifact, see the diffable column), "skip" (a prod output
          we deliberately don't reproduce - recorded so it reads as a decision,
          not an oversight; see notes for why).
      - name: status_summary
        description: >
          One short, plain-English sentence on where this output stands right
          now, e.g. "Resolving water intersections" or "Inaccurate 26C ETL
          outputs" - written for someone skimming the build step summary who
          has no other context. This is what the step summary shows instead
          of `notes` (see build_diffs_report.py) - keep it to a sentence, not
          a paragraph, and put the actual explanation in `notes`/a linked doc
          instead of trying to fit it here. Blank when status is blank.
      - name: notes
        description: >
          Brief explanation backing up `status` - what's actually going on
          and why, so a reader doesn't have to re-derive it. Blank when
          status is blank. For anything substantial, cite its data_issues.md
          ID here rather than duplicating the write-up.
