      filename: ETL Working GDB.gdb.zip
      layer_name: NYPDPatrolBorough
  - name: dcp_cscl_gdb
    import_as: dcp_cscl_censustract2010
    custom:
      filename: ETL Working GDB.gdb.zip
      layer_name: CensusTract2010
  - name: dcp_cscl_gdb
