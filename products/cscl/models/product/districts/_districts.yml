- name: gdb_nyhd
  description: Landmarks Preservation Commission historic districts, as stored in CSCL, not clipped.
  config:
    tags: [export_doc]
    meta:
      each_row_is_a: A historic district
  columns:
  - name: NAME
    description: Historic district name.
  - name: LP_NUMBER
    description: Landmarks Preservation Commission designation number.
    data_tests: [ not_null ]
  - name: DESIGNATED
    description: Date the Landmarks Preservation Commission designated the district.
  - name: BOROUGH
    description: Borough of the district.
  - name: EXTENSION
    description: Whether the district extends an earlier historic district (Yes or No).
  - name: CREATED_BY
    description: Editor who created the source record.
  - name: CREATED_DATE
    description: When the source record was created.
  - name: MODIFIED_BY
    description: Editor who last modified the source record.
  - name: MODIFIED_DATE
    description: When the source record was last modified.
  - name: geom
    description: Polygon geometry (MultiPolygon, EPSG:2263)
    data_tests: [ not_null ]
  - name: SHAPE_Length
    description: Boundary length in feet.
  - name: SHAPE_Area
    description: Area in square feet.

- name: gdb_nyhez
  description: >-
