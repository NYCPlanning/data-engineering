    custom:
      url: "{{ bytes_zip_prefix_url }}/georeferenced-zoning-maps/nyc_zoning_georeferenced_maps_gdb.zip"
  - id: zoning_georeferenced_maps_data_dictionary
    custom:
      url: "{{ bytes_pdf_prefix_url }}/zoning_georeferenced_maps_data_dictionary.xlsx"

files:
