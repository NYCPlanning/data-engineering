name: EDDE
product: db-eddt
version: 26v1
inputs:
  dataset_defaults:
    file_type: parquet
    destination: file
  datasets:
# From the spreadsheet
  # Ingested
  - name: edde
    version: latest
    source: edm.publishing.published

  - name: doi_evictions_geocoded # 3.09 (geocoded version)
    version: latest
  - name: hpd_hny_units_by_building # 3.11, 4.02
    version: '20260519'
  - name: dcp_housing # 4.01
    version: '25Q4'
  - name: lpc_historic_district_areas # 4.03
    version: '20260202'
  - name: dhs_shelterd_indiv_by_comm_dist # 3.1
    version: 20260504

  - name: dcp_pumas2020
    version: '20260526'
  - name: dcp_population_cd_puma_crosswalk_2020
    version: '2025'
  - name: dcp_population_nta_puma_crosswalk_2020
    version: '2025'

  # A decade of traffic injury data # 5.15
  - name: dcp_dot_trafficinjuries
    version: 2010
    file_type: csv
  - name: dcp_dot_trafficinjuries
    version: 2011
    file_type: csv
  - name: dcp_dot_trafficinjuries
    version: 2012
    file_type: csv
  - name: dcp_dot_trafficinjuries
    version: 2013
    file_type: csv
  - name: dcp_dot_trafficinjuries
    version: 2014
    file_type: csv
  - name: dcp_dot_trafficinjuries
    version: 2015
    file_type: csv
  - name: dcp_dot_trafficinjuries
    version: 2016
    file_type: csv
  - name: dcp_dot_trafficinjuries
    version: 2017
    file_type: csv
  - name: dcp_dot_trafficinjuries
    version: 2018
    file_type: csv
  - name: dcp_dot_trafficinjuries
    version: 2019
    file_type: csv
  - name: dcp_dot_trafficinjuries
    version: 2020
    file_type: csv

  # Former products/edde/resources/ files, now pushed to edm-private as
  # individual versioned datasets (datasets/<name>/<version>/<name>.<ext>)
  - name: dcp_pop_acs_08_12 # 1.02-1.04, 2.01, 2.04-2.06, 3.01-3.04, 3.06, 3.08, 5.10, 5.11 (ACS 2008-2012)
    source: edm.private
    file_type: xlsx
    version: "20260601"
    custom:
      filepath: dcp_pop_acs_08_12.xlsx
  - name: dcp_pop_acs_20_24 # same indicators as above, ACS 2020-2024
    source: edm.private
    file_type: xlsx
    version: "20260601"
    custom:
      filepath: dcp_pop_acs_20_24.xlsx
  - name: dcp_pop_census_2000_pums # same indicators as above, Census 2000 PUMS
    source: edm.private
    file_type: xlsx
    version: "20260601"
    custom:
      filepath: dcp_pop_census_2000_pums.xlsx
  - name: dcp_pop_census_by_puma # 1.01
    source: edm.private
    file_type: xlsx
    version: "20260601"
    custom:
      filepath: dcp_pop_census_by_puma.xlsx
  - name: dcp_pop_census_housing_by_puma_2010 # 4.01
    source: edm.private
    file_type: csv
    version: "20260601"
    custom:
      filepath: dcp_pop_census_housing_by_puma_2010.csv
  - name: hpd_housing_lottery_by_puma # 3.13, 3.14
    source: edm.private
    file_type: xlsx
    version: "20260601"
    custom:
      filepath: hpd_housing_lottery_by_puma.xlsx
  - name: nycha_public_housing_by_puma # 3.05, 3.07 (NYCHVS)
    source: edm.private
    file_type: xlsx
    version: "20260601"
    custom:
      filepath: nycha_public_housing_by_puma.xlsx
  - name: nycha_occupants_by_puma # 3.11 (NYCHA portion), 3.12
    source: edm.private
    file_type: xlsx
    version: "20260601"
    custom:
      filepath: nycha_occupants_by_puma.xlsx
  - name: dohmh_deaths_by_race_and_puma # 5.06 (currently disabled)
    source: edm.private
    file_type: xlsx
    version: "20260601"
    custom:
      filepath: dohmh_deaths_by_race_and_puma.xlsx
  - name: dohmh_death_rate_and_overdose_by_puma # 5.03, 5.04, 5.05
    source: edm.private
    file_type: xlsx
    version: "20260601"
    custom:
      filepath: dohmh_death_rate_and_overdose_by_puma.xlsx
  - name: doe_education_math_ela_grad_by_puma # 5.12, 5.13
    source: edm.private
    file_type: xlsx
    version: "20260601"
    custom:
      filepath: doe_education_math_ela_grad_by_puma.xlsx
  - name: dohmh_non_fatal_assault_hospitalizations_by_puma # 5.18
    source: edm.private
    file_type: csv
    version: "20260601"
    custom:
      filepath: dohmh_non_fatal_assault_hospitalizations_by_puma.csv
  - name: dohmh_pedestrian_hospitalizations_by_puma # 5.17
    source: edm.private
    file_type: csv
    version: "20260601"
    custom:
      filepath: dohmh_pedestrian_hospitalizations_by_puma.csv
  - name: dcp_pop_census_aggregations_by_puma # 5.06 denominator (currently disabled)
    source: edm.private
    file_type: csv
    version: "20260601"
    custom:
      filepath: dcp_pop_census_aggregations_by_puma.csv
  - name: dcp_transpo_access_by_puma # 5.08, 5.09, 5.14
    source: edm.private
    file_type: xlsx
    version: "20260601"
    custom:
      filepath: dcp_transpo_access_by_puma.xlsx

custom:
  # Build configuration
  EDDE_VERSION_PREV: "2025-05-30"
  CENSUS_BASE_YEAR: "2000"
  ACS_PREV_YEAR_BAND: "0812"
  ACS_CURRENT_YEAR_BAND: "2024"
  HOUSING_DATABASE_QUARTER: "2025 Q4"

  ignored_indicators:
    - health_diabetes
    - health_self_reported
    - health_selfreportedhealth
    - traffic_fatalities_injuries

  health_mortality:
    latest_year: "1923"
    puma_baseline_years: ["0004", "1014"]
    baseline_years: ["2000", "2010"]
    year_band_mapping:
      "0004": "2000"
      "1014": "2010"
      "1923": "2023"
    # Mapped years for CSV column names (all geographies use same format now)
    mapped_years: ["2000", "2010", "2023"]

  traffic_fatalities:
    year_ranges:
      "1014": [2010, 2015]
      "1620": [2016, 2021]

  dhs_shelter:
    years: ["2020", "2025"]

  # Data vintage years for site configuration
  education:
    year: "2025"  # NYC DOE test proficiency and graduation data

  hpd_hny:
    start_year: "2014"
    end_year: "2026"  # HPD Housing New York units (completion years 2014-2026)

  nycha:
    year: "2024"  # NYCHA units and tenant data

  housing_lottery:
    start_year: "2022"
    end_year: "2024"  # Housing Connect applications and leases

  evictions:
    start_year: "2019"
    end_year: "2025"  # DOI residential evictions by city marshals

stage_config:
  builds.build:
    commands:
      - name: build
        run: build
        command_type: python
      - name: data_checks
        run: python -m pytest tests/ -v
        command_type: shell
      - name: qa
        run: qa.proto_qa
        command_type: python
      - name: package
        run: packager
        command_type: python
    destination: edm.publishing.builds
    destination_key: db-eddt
    connector_args:
      - name: acl
        value: public-read
