name: Deploy DE Tools to DO

on:
  # The droplet mounts the repo and editable-installs dcpy at container start, so the app only
  # picks up merged changes once it is redeployed. Deliberately excludes
  # admin/run_environment/** and pyproject.toml: those rebuild the qa-streamlit image via
  # docker_publish.yml, and deploy.sh pulls that image — triggering here would race the build
  # and could deploy the previous one. Dependency changes stay a manual dispatch.
  push:
    branches:
      - main
    paths:
      - apps/**
      - dcpy/**
      - product-metadata/**
      - '!**/test/**'
      - '!**/tests/**'
      - '!**/*.md'
  workflow_dispatch:
    inputs:
      data_engineering_branch:
        description: 'Data Engineering branch to deploy'
        required: true
        default: 'main'

# Deploys ssh into one droplet and mutate it in place, so they must not overlap. Queue rather
# than cancel: a cancelled run could leave the checkout reset but the containers not recreated.
concurrency:
  group: qa-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-22.04
    env:
      DATA_ENGINEERING_BRANCH: ${{ github.event.inputs.data_engineering_branch || 'main' }}
      QA_DROPLET_SSH_PRIVATE_KEY: ${{ secrets.QA_DROPLET_SSH_PRIVATE_KEY }}
      QA_DROPLET_SSH_HOST: ${{ secrets.QA_DROPLET_SSH_HOST }}

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "$QA_DROPLET_SSH_PRIVATE_KEY" > ~/.ssh/droplet.key
          chmod 400 ~/.ssh/droplet.key
          cat >> ~/.ssh/config <<EOF
          Host droplet
            HostName $QA_DROPLET_SSH_HOST
            User root
            IdentityFile ~/.ssh/droplet.key
            StrictHostKeyChecking no
            ConnectTimeout 600
          EOF

      - name: Pull latest data-engineering code on droplet
        run: |
          ssh droplet "\
            cd /root/data-engineering && \
            git fetch origin $DATA_ENGINEERING_BRANCH --depth 1 && \
            git reset --hard FETCH_HEAD"

      - name: Deploy services
        run: |
          ssh droplet "\
            cd /root/data-engineering/apps && \
            export OP_SERVICE_ACCOUNT_TOKEN='${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}' && \
            op run --env-file=env.1pw -- ./scripts/deploy.sh"

      - name: Restart nginx
        run: |
          ssh droplet "\
            cd /root/data-engineering/apps && \
            # sleep for one minute to allow services to start before nginx tries to connect to them
            sleep 60 && \
            docker compose restart nginx"

      - name: Verify deployment
        run: |
          ssh droplet "\
            cd /root/data-engineering/apps && \
            docker compose ps && \
            docker compose logs --tail=50"
